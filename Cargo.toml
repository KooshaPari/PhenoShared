[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/pheno"
description = "Phenotype Infrastructure Kit"

[workspace]
resolver = "2"

members = [
    "crates/agileplus-api",
    "crates/agileplus-benchmarks",
    "crates/agileplus-cache",
    "crates/agileplus-cli",
    "crates/agileplus-domain",
    "crates/agileplus-events",
    "crates/agileplus-git",
    "crates/agileplus-github",
    "crates/agileplus-graph",
    "crates/agileplus-grpc",
    "crates/agileplus-import",
    "crates/agileplus-integration-tests",
    "crates/agileplus-nats",
    "crates/agileplus-p2p",
    "crates/agileplus-plane",
    "crates/agileplus-sqlite",
    "crates/agileplus-subcmds",
    "crates/agileplus-sync",
    "crates/agileplus-telemetry",
    "crates/agileplus-triage",
    "crates/phenotype-async-traits",
    "crates/phenotype-cache-adapter",
    "crates/phenotype-casbin-wrapper",
    "crates/phenotype-contract",
    "crates/phenotype-contracts",
    "crates/phenotype-cost-core",
    "crates/phenotype-error-core",
    "crates/phenotype-error-macros",
    "crates/phenotype-errors",
    "crates/phenotype-event-sourcing",
    "crates/phenotype-flags",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-http-client-core",
    "crates/phenotype-iter",
    "crates/phenotype-logging",
    "crates/phenotype-macros",
    "crates/phenotype-observability",
    "crates/phenotype-policy-engine",
    "crates/phenotype-port-traits",
    "crates/phenotype-port-interfaces",
    "crates/phenotype-ports-canonical",
    "crates/phenotype-process",
    "crates/phenotype-rate-limit",
    "crates/phenotype-retry",
    "crates/phenotype-shared-config",
    "crates/phenotype-state-machine",
    "crates/phenotype-string",
    "crates/phenotype-telemetry",
    "crates/phenotype-test-infra",
    "crates/phenotype-time",
    "crates/phenotype-validation",
    "bifrost",
    "crates/phenotype-gfx",
    # eyetracker: absorbed 2026-08-13 from KooshaPari/eyetracker per docket O18.
    # Eye-tracking core (domain, math, calibration, inference, FFI, CLI).
    # CI status: pre-merge verification pending.
    "crates/eyetracker/eyetracker-domain",
    "crates/eyetracker/eyetracker-math",
    "crates/eyetracker/eyetracker-core",
    "crates/eyetracker/eyetracker-ffi",
    "crates/eyetracker/eyetracker-camera",
    "crates/eyetracker/eyetracker-inference",
    "crates/eyetracker/eyetracker-cli",
    "crates/pheno-runtime-config",
    "crates/pheno-context",
    "crates/pheno-forge-smoke",
    # clap-ext: flattened from KooshaPari/clap-ext per docket O17 (PR #288).
    # Lib promoted from nested sub-workspace; example registered as clap-ext-examples.
    "crates/clap-ext",
    "crates/clap-ext-examples",
    # Configra canonical crates — migrated 2026-08-21 from KooshaPari/Configra.
    # Source: Configra/crates/{pheno-config,config-schema,phenotype-config-loader,configra-ops,phenoctl,settly}
    "crates/pheno-config",
    "crates/config-schema",
    "crates/phenotype-config-loader",
    "crates/configra-ops",
    "crates/phenoctl",
    "crates/settly",
    # apisync: absorbed 2026-09-14 from KooshaPari/Apisync.
    # Universal API toolkit with REST, GraphQL, and WebSocket support.
    "crates/apisync",
]
# Exclude crates that have external-sibling path deps that don't resolve in CI runners.
# Tracked separately: docket O24.

# pheno-cdylib-bridge is a C ABI wrapper around the thegent chartruetype engine.
# Built only locally for the forge-smoke integration test; its Cargo.toml has a
# hard-coded path dependency (../../../thegent/crates/thegent-memory) that doesn't
# resolve on CI runners (thegent is a sibling monorepo, not a sub-path of pheno).
# Excluded from the workspace so `cargo metadata --workspace` doesn't error out
# and shadow-breaks cargo-deny, cargo-machete, cargo-semver-checks, etc.
# To regenerate: `cargo build -p pheno-cdylib-bridge` from the pheno-bridge worktree
# (resolves locally because thegent is checked out at repos/thegent).
exclude = [
    "crates/pheno-cdylib-bridge",
]

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
toml = "0.8"
regex = "1"
tempfile = "3"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
strum = { version = "0.26", features = ["derive"] }
derive_more = { version = "1.0", features = ["from", "display", "into"] }
once_cell = "1.19"
blake3 = "1"
hex = "0.4"
zstd = "0.13"
unicode-normalization = "0.1"
rand = "0.8"
derive_builder = "0.20"
# AgilePlus (nested sub-workspace deps that must also appear in root for top-level members)
agileplus-error-core = { path = "crates/agileplus-error-core" }

# Build / bench
criterion = "0.5"
rayon = "1"
proptest = "1.4"
ulid = "1"

# Phenotype internal crates
arc-swap = "1"
agileplus-graph = { path = "crates/agileplus-graph" }
phenotype-async-traits = { path = "crates/phenotype-async-traits" }
phenotype-bdd = { path = "crates/phenotype-bdd" }
phenotype-cache-adapter = { path = "crates/phenotype-cache-adapter" }
phenotype-casbin-wrapper = { path = "crates/phenotype-casbin-wrapper" }
phenotype-compliance-scanner = { path = "crates/phenotype-compliance-scanner" }
phenotype-contract = { path = "crates/phenotype-contract" }
phenotype-contracts = { path = "crates/phenotype-contracts" }
phenotype-core = { path = "crates/phenotype-core" }
phenotype-cost-core = { path = "crates/phenotype-cost-core" }
phenotype-error-core = { path = "crates/phenotype-error-core" }
phenotype-error-macros = { path = "crates/phenotype-error-macros" }
phenotype-errors = { path = "crates/phenotype-errors" }
phenotype-event-bus = { path = "crates/phenotype-event-bus" }
phenotype-flags = { path = "crates/phenotype-flags" }
phenotype-event-sourcing = { path = "crates/phenotype-event-sourcing" }
phenotype-git-core = { path = "crates/phenotype-git-core" }
phenotype-health = { path = "crates/phenotype-health" }
phenotype-http-client-core = { path = "crates/phenotype-http-client-core" }
phenotype-infrastructure = { path = "crates/phenotype-infrastructure" }
phenotype-iter = { path = "crates/phenotype-iter" }
phenotype-logging = { path = "crates/phenotype-logging" }
phenotype-macros = { path = "crates/phenotype-macros" }
phenotype-mock = { path = "crates/phenotype-mock" }
phenotype-policy-engine = { path = "crates/phenotype-policy-engine" }
phenotype-port-traits = { path = "crates/phenotype-port-traits" }
phenotype-port-interfaces = { path = "crates/phenotype-port-interfaces" }
phenotype-ports-canonical = { path = "crates/phenotype-ports-canonical" }
phenotype-process = { path = "crates/phenotype-process" }
phenotype-project-registry = { path = "crates/phenotype-project-registry" }
phenotype-rate-limit = { path = "crates/phenotype-rate-limit" }
phenotype-retry = { path = "crates/phenotype-retry" }
phenotype-security-aggregator = { path = "crates/phenotype-security-aggregator" }
phenotype-shared-config = { path = "crates/phenotype-shared-config" }
phenotype-state-machine = { path = "crates/phenotype-state-machine" }
phenotype-string = { path = "crates/phenotype-string" }
phenotype-telemetry = { path = "crates/phenotype-telemetry" }
phenotype-test-fixtures = { path = "crates/phenotype-test-fixtures", default-features = false }
phenotype-test-infra = { path = "crates/phenotype-test-infra" }
phenotype-testing = { path = "crates/phenotype-testing" }
phenotype-time = { path = "crates/phenotype-time" }
phenotype-validation = { path = "crates/phenotype-validation" }

secrecy = { version = "0.10", features = ["serde"] }
# External utilities
axum = "0.8"
axum-extra = "0.10"
clap = { version = "4", features = ["derive", "env", "wrap_help", "string"] }
figment = "0.10"
futures-util = "0.3"
http-body-util = "0.1"
hyper = "1"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-test = "0.4"
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing-actix-web = "4"
tracing-opentelemetry = "0.32"

[profile.dev]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
