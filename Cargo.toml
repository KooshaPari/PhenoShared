[workspace.package]
version = "0.3.10"
edition = "2021"
authors = ["<REDACTED> <<REDACTED>@phenotype.space>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoShared"
rust-version = "1.80"
publish = false

[workspace.dependencies]
substrate-core = { version = "0.3.8", path = "crates/substrate-core" }
substrate-serve-lock = { version = "0.3.8", path = "crates/substrate-serve-lock" }
substrate-trace = { version = "0.3.8", path = "crates/substrate-trace" }
substrate-app = { version = "0.3.8", path = "crates/substrate-app" }
engine-spec = { version = "0.3.8", path = "crates/engine-spec" }
a2a = { package = "substrate-a2a", version = "0.3.8", path = "crates/a2a" }
store-sqlite = { version = "0.3.8", path = "crates/store-sqlite" }
engine-forge = { version = "0.3.8", path = "crates/engine-forge" }
forge_daemon = { version = "0.2.0", path = "crates/forge_daemon" }
serde = { version = "1.0", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
walkdir = "2.5"
pheno-errors = { version = "0.3.10", path = "crates/pheno-errors" }
regex = "1.11"
anyhow = "1.0"
hex = "0.4"
sha2 = "0.11"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
toml = "1.1"

# --- Phenotype shared infrakit crates (from PhenoInfra) ---
phenotype-crypto = { path = "crates/phenotype-crypto", version = "0.2.0" }
phenotype-health = { path = "crates/phenotype-health", version = "0.2.0" }
phenotype-observability = { path = "crates/phenotype-observability", version = "0.3.10" }
phenotype-policy-engine = { path = "crates/phenotype-policy-engine", version = "0.3.10" }
phenotype-mcp = { path = "crates/phenotype-mcp", version = "0.3.10" }
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
croner = "3.0"
petgraph = "0.8"
strsim = "0.11"
command-group = { version = "5.0", features = ["with-tokio"] }
notify-debouncer-mini = "0.7"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
http-body-util = "0.1"
futures = "0.3"
futures-core = "0.3"
parking_lot = "0.12"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.25"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["tonic"] }
fs2 = "0.4"
libc = "0.2"
ring = "0.17"
url = "2.5"
uniffi = { version = "0.31", features = ["cli"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Use pheno-otel from PhenoObservability v0.1.0 (ADR-037 substrate).
# Git + tag + subdirectory form pins the crate to a known-good release
# so all consumers across the pheno-* fleet see the same OTLP wire-format
# export surface. See https://github.com/KooshaPari/PhenoObservability/releases/tag/v0.1.0
pheno-otel = { path = "crates/argis-extensions/pheno-otel", version = "0.1.0" }
pheno-tracing = { path = "crates/pheno-tracing", version = "0.4.0-pre.0" }

# --- PhenoFabric dependencies (absorbed 2026-09-16) ---
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = "0.6"
schemars = { version = "0.8", features = ["derive", "chrono"] }
jsonschema = "0.27"
fabric-capability = { path = "crates/fabric-capability" }
fabric-graph = { path = "crates/fabric-graph" }

# --- GFX SDK crates (absorbed from PhenoGfx) ---
phenotype-voxel = { version = "0.2.0", path = "crates/phenotype-voxel" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
metrics = { version = "0.24", default-features = false }
zstd = "0.13"
prometheus = { version = "0.14" }
bevy = { version = "0.18.1", default-features = false, features = ["bevy_asset", "bevy_mesh"] }
wgpu = { version = "22" }
pollster = { version = "0.3" }
secrecy = "0.10"
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Offline vendor-patch: lancedb 0.38.0 has a latent bug where src/job.rs uses
# Error::Http unconditionally, but src/error.rs only defines that variant
# under #[cfg(feature = "remote")]. Enabling `remote` requires tower-http 0.5.2
# which is not in the local cargo cache. The vendor copy at .vendor/lancedb
# gates the job.rs usage under the same cfg so the default build compiles
# without the remote feature. Drop this patch once lancedb 0.38.1+ is cached.
[patch.crates-io]
lancedb = { path = ".vendor/lancedb" }
