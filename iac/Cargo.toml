[workspace]
resolver = "2"
members = [
    "observability",
    "oci-lottery",
    "oci-post-acquire",
    "tailscale/tailscale-keygen",
    "observability",
]
# `landing-bootstrap` and `phenotype-logging-stub` declare their own
# `[workspace]` tables (intentionally detached — see their Cargo.toml files).
# The former is built and released independently; the latter is a local path
# dependency for the observability member. Neither belongs to this workspace.
exclude = [
    "landing-bootstrap",
    # Declares its own `[workspace]` table (same detached-stub rationale as
    # `landing-bootstrap`). It is consumed as a path dependency, not built as a
    # workspace member; listing it here keeps cargo from reporting "multiple
    # workspace roots" for the `observability` crate's `phenotype-logging` dep.
    "phenotype-logging-stub",
]

# Shared dependency versions for the iac/* Rust crates.
# Member Cargo.toml files may opt in via `dep = { workspace = true, features = [...] }`.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Phenotype Infra <infra@phenotype.dev>"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Local, self-contained stub so `iac/*` daemons resolve `phenotype-logging`
# without a sibling worktree (see iac/phenotype-logging-stub/src/lib.rs).
phenotype-logging = { path = "phenotype-logging-stub" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
glob = "0.3"
rand = "0.10"
