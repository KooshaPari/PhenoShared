[advisories]
db-path = "$CARGO_HOME/advisory-db"
# Ignore specific advisories (same policy of record as the root deny.toml).
ignore = [
  # chrono 0.4.45 (RUSTSEC-2026-0543, evaluated 2026-11-17)
  #   Path: DIRECT dependency of iac workspace members oci-lottery and
  #         oci-post-acquire (`chrono = { workspace = true }`,
  #         resolved 0.4.45 in iac/Cargo.lock).
  #   Why not fixed: 0.4.45 is the newest published chrono and the advisory
  #     covers every version ("No safe upgrade is available"). The crate was
  #     declared unmaintained upstream (chronotope/chrono#1768). Removing it
  #     means migrating both iac crates to jiff/time.
  #   Risk: shipped runtime dependency of the two OCI helper binaries. No known
  #     CVE; the advisory is "unmaintained", not "unsound" or "vulnerable".
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "CC0-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Aligned with the root deny.toml policy of record (2026-09-24 restore of
  # OSI/FSF-approved licenses). CDLA-Permissive-2.0 is REQUIRED here: the
  # iac graph's webpki-roots 1.0.8 (via reqwest -> rustls) is CDLA-
  # Permissive-2.0 and cargo-deny 0.20.2 rejected it on 2026-09-27 CI
  # because this list predated the root policy.
  "MIT-0",
  "NCSA",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
