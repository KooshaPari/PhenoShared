[advisories]
db-path = "$CARGO_HOME/advisory-db"
# This file, not the repository-root deny.toml, is the configuration the
# `cargo-deny` workflow actually reads: .github/workflows/cargo-deny.yml runs
# EmbarkStudios/cargo-deny-action with `manifest-path: iac/Cargo.toml`, so the
# advisory database is matched against iac/Cargo.lock and the config resolved
# here. An ignore added only to the root file has no effect on that job.
#
# Ignore specific advisories (same policy of record as the root deny.toml).
ignore = [
    # ── chrono family unmaintained upstream (evaluated 2026-11-17) ───────
    # Upstream announcement: https://github.com/chronotope/chrono/issues/1768
    #
    # chrono 0.4.45 (RUSTSEC-2026-0543)
    #   Path: DIRECT dependency of the iac crates oci-lottery and
    #         oci-post-acquire (`chrono = { workspace = true }`, resolved to
    #         0.4.45 in iac/Cargo.lock). chrono-tz and humantime are NOT in this
    #         workspace, so only RUSTSEC-2026-0543 applies here.
    #   Why no upgrade removes it: 0.4.45 is the newest published chrono and the
    #         advisory covers every version ("No safe upgrade is available").
    #         No parent upgrade drops it; the only removal is migrating both iac
    #         crates to jiff/time.
    #   Risk: shipped runtime dependency of the two OCI helper binaries. No known
    #         CVE; the advisory is "unmaintained", not "unsound" or
    #         "vulnerable".
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Aligned with the root deny.toml policy of record (2026-09-24 restore of
    # OSI/FSF-approved licenses). CDLA-Permissive-2.0 is REQUIRED here: the
    # iac graph's webpki-roots 1.0.8 (via reqwest -> rustls) is CDLA-
    # Permissive-2.0 and cargo-deny 0.20.2 rejected it on 2026-09-27 CI
    # because this list predated the root policy.
    "MIT-0",
    "NCSA",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
