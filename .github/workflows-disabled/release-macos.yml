# DISABLED 2026-11-09 — not loaded by GitHub Actions (this directory is not
# `.github/workflows/`, so nothing here runs).
#
# Why it is disabled rather than fixed:
#
#   The one job calls a reusable workflow in another repository:
#       uses: <REDACTED>/phenotype-fleet-ops/.github/workflows/macos-release.yml@main
#
#   The 2026-09-16 PII sweep replaced the org name with the literal `<REDACTED>`,
#   so the reference has not been resolvable since then. Restoring the original
#   name does not help either: it was `kooshapari/phenotype-fleet-ops`, and
#   KooshaPari/phenotype-fleet-ops does not exist. There is no surviving copy of
#   `macos-release.yml` anywhere the account can see, so there is nothing to
#   point at.
#
#   It only triggers on version tags, so it was a latent trap rather than a
#   constantly-red job: it would have failed the first time a tag was pushed.
#
# To re-enable: restore `phenotype-fleet-ops` (or vendor a macOS release
# workflow into this repo the way `.github/workflows/reusable-a11y.yml` was
# vendored), move this file back into `.github/workflows/`, and re-point the
# `uses:` line. The `secrets: INFISICAL_TOKEN` contract and the build command
# below are unchanged and still correct.
#
# Note the macOS runner policy: billed macOS minutes are out of budget, so any
# replacement must use self-hosted runners, which is what the original comment
# also said.

name: Release macOS (phenotype-omlx)

# Calls the reusable workflow at <REDACTED>/phenotype-fleet-ops.
# Self-hosted runners only (zero billed minutes).
# All Apple Developer secrets live in Infisical project 8efe392e-56a6-4c3c-89f9-8141183dd7e8.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: macos-release-phenotype-omlx-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: Build, sign, notarize phenotype-omlx
    uses: <REDACTED>/phenotype-fleet-ops/.github/workflows/macos-release.yml@main
    with:
      app-name: phenotype-omlx
      app-bundle-id: app.phenotype.omlx
      build-cmd: |
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p dist/macos
          cp target/aarch64-apple-darwin/release/phenotype-omlx dist/macos/
          # No .app bundle yet — distribute as raw binary + DMG for now
          # (Tauri/Electron wrapper is planned but not implemented)
      entitlements-file: Entitlements.plist
      artifact-dir: dist/macos
      create-dmg: true
      sign-identity: "Developer ID Application"
    secrets:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
