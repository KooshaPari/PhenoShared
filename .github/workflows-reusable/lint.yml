name: Reusable Lint

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory'
        required: false
        type: string
        default: '.'
      fail-on-warnings:
        description: 'Treat warnings as errors'
        required: false
        type: boolean
        default: true
      extra-args:
        description: 'Extra args passed to the linter'
        required: false
        type: string
        default: ''
    outputs:
      language:
        description: 'Detected primary language'
        value: ${{ jobs.detect.outputs.lang }}
    secrets:
      INFISICAL_TOKEN:
        required: false
        description: 'Optional token for secret materialization'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      lang: ${{ steps.detect.outputs.lang }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f Cargo.toml ]; then echo "lang=rust" >> "$GITHUB_OUTPUT"; \
          elif [ -f package.json ]; then echo "lang=node" >> "$GITHUB_OUTPUT"; \
          elif [ -f pyproject.toml ]; then echo "lang=python" >> "$GITHUB_OUTPUT"; \
          else echo "lang=unknown" >> "$GITHUB_OUTPUT"; fi

  lint:
    needs: detect
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        if: needs.detect.outputs.lang == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        if: needs.detect.outputs.lang == 'rust'
        uses: taiki-e/install-action@ec94b08fe6c0ecd17efe4f4bfaadd961b3a5b83d
        with:
          tool: cargo-nextest

      - name: Setup Node
        if: needs.detect.outputs.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        if: needs.detect.outputs.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust fmt + clippy
        if: needs.detect.outputs.lang == 'rust'
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          CLIPPY_FLAGS="--workspace --all-targets"
          if [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
            CLIPPY_FLAGS="$CLIPPY_FLAGS -- -D warnings"
          fi
          cargo clippy $CLIPPY_FLAGS ${{ inputs.extra-args }}

      - name: Node lint
        if: needs.detect.outputs.lang == 'node'
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "require('./package.json').scripts?.lint" 2>/dev/null; then
            npm run lint --if-present ${{ inputs.extra-args }}
          else
            echo "No lint script in package.json; skipping."
          fi

      - name: Python ruff
        if: needs.detect.outputs.lang == 'python'
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff
          ruff check . ${{ inputs.extra-args }}

      - name: Unknown language
        if: needs.detect.outputs.lang == 'unknown'
        run: |
          echo "::warning::No recognized language marker (Cargo.toml / package.json / pyproject.toml). Lint step skipped."