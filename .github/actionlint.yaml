---
# actionlint configuration
# https://github.com/rhysd/actionlint/blob/main/docs/usage.md#config
#
# The repo uses a self-hosted "blacksmith-2vcpu-ubuntu-2204" label on the
# infisical.yml workflow; actionlint doesn't know about this custom label
# so we declare it here. All other rules remain enforced.
self-hosted-runner:
  labels:
    - blacksmith-2vcpu-ubuntu-2204
    - blacksmith-4vcpu-ubuntu-2204
    - blacksmith-8vcpu-ubuntu-2204
    - blacksmith-2vcpu
    - blacksmith-4vcpu
    - blacksmith-8vcpu
    # Declared self-hosted runner labels in manual-only runner-probe.yml.
    # This acknowledges custom labels for static validation; it does not
    # establish a registered online runner.
    - podman
    - wsl2
    - fedora44
config-variables: null
