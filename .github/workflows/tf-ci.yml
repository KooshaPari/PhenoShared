name: terminal-fabric-ci

# Historically this workflow built `terminal-fabric-rs` and `tf-win-capture`.
# Neither crate exists in this repository any more: the tree was repointed and
# `rust/` now holds `agileplus-proto` only (no `rust/windows-capture`, no
# `self-update` feature). Every step therefore failed on a missing manifest or
# feature rather than on a real defect, so the jobs are retargeted at what is
# actually present. Restore the old steps only together with the crates.

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/tf-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/tf-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The crate's build script compiles protobufs and fails with
      # "Could not find `protoc`" when it is absent.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test

      - name: Release build
        working-directory: rust
        run: cargo build --release
