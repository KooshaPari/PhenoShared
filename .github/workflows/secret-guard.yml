name: Secret Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Run secret guard
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # `github.event.pull_request.base.sha` is frozen at PR creation. When
          # main advances, a PR's merge ref contains commits this branch never
          # wrote, and the guard scans them as if they were part of the change.
          # Diff from the merge-base with the current base branch instead, the
          # same fix the happy-path guard uses.
          base_ref="${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -n "$base_ref" ]]; then
            git fetch --no-tags --quiet origin \
              "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" || true
            if git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null 2>&1; then
              merge_base="$(git merge-base "origin/${base_ref}" "$head_sha" 2>/dev/null || true)"
              if [[ -n "$merge_base" ]]; then
                base_sha="$merge_base"
              fi
            fi
          fi
          if [[ -n "$base_sha" ]] && \
             ! git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null 2>&1; then
            # A force-push can orphan the previous head, so `github.event.before`
            # no longer resolves. Fall back to the merge-base with main.
            git fetch --no-tags --quiet origin \
              "+refs/heads/main:refs/remotes/origin/main" || true
            if git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
              base_sha="$(git merge-base origin/main "$head_sha" 2>/dev/null || true)"
            else
              base_sha=""
            fi
          fi
          if [[ -n "$base_sha" && "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            python scripts/secret-guard.py --since-ref "$base_sha"
          else
            python scripts/secret-guard.py
          fi
      - name: Run workflow action guard
        shell: bash
        run: python scripts/workflow-action-guard.py
