name: Pose Roulette mobile
on:
  workflow_dispatch:
  push:
    branches: [feat/pose-roulette-mobile]
    paths: ['apps/pose-roulette/**']
permissions:
  contents: read
concurrency:
  group: pose-roulette-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/pose-roulette
            pose-build-transport
      - name: Verify and unpack native sources
        run: python3 apps/pose-roulette/unpack.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable development APK
        working-directory: apps/pose-roulette/android
        run: gradle --no-daemon assembleDebug
      - name: Inspect APK signature and contents
        run: |
          APK=apps/pose-roulette/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > apps/pose-roulette/android/app/build/outputs/apk/debug/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pose-Roulette-Android-APK
          path: |
            apps/pose-roulette/android/app/build/outputs/apk/debug/*.apk
            apps/pose-roulette/android/app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pose-Roulette-Expanded-Native-Source
          path: |
            apps/pose-roulette/android/app/src
            apps/pose-roulette/android/*.gradle
            apps/pose-roulette/android/*.properties
            apps/pose-roulette/android/app/build.gradle
            apps/pose-roulette/ios/*.swift
            apps/pose-roulette/ios/*.sh
          retention-days: 14
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            apps/pose-roulette
            pose-build-transport
      - name: Verify and unpack native sources
        run: python3 apps/pose-roulette/unpack.py
      - name: Build iPhone arm64 application
        run: bash apps/pose-roulette/ios/build.sh
      - name: Sign with existing Apple credentials when configured
        env:
          APPLE_P12_BASE64: ${{ secrets.POSE_APPLE_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.POSE_APPLE_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.POSE_APPLE_PROFILE_BASE64 }}
        run: bash apps/pose-roulette/ios/sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pose-Roulette-iOS-build
          path: apps/pose-roulette/ios/output/*
          if-no-files-found: error
          retention-days: 14
