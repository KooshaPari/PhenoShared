name: Traceability Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "specs/**"
      - "docs/**"
      - "scripts/traceability-check.py"
      - ".github/workflows/traceability-gate.yml"

permissions:
  contents: read

jobs:
  validate-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          
      - name: Run Traceability Check (soft mode)
        # Soft-fail default pending FR-TRACE-BACKFILL-001. Re-enable strict with
        # `--strict-annotations` once the 46 missing IDs are backfilled.
        run: |
          python scripts/traceability-check.py
