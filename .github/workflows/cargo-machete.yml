name: cargo-machete
permissions: read-all

# Full-workspace machete reports ~226 findings, dominated by derive-macro false
# positives (serde 65, thiserror 74): machete does not see `#[derive(...)]`
# usage, so gating PRs on it blocks legitimate changes. Keep it as a weekly
# advisory scan until per-crate `cargo-machete` ignore metadata is added.
on:
  schedule:
    - cron: "47 6 * * 4" # weekly Thursday, advisory full scan
  workflow_dispatch:

jobs:
  machete:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.1
      - name: Advisory unused-dependency scan
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
        with:
          args: crates native
