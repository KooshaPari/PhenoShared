name: docs-check

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd
        with:
          globs: |
            README.md
            docs/**/*.md

  adr-frontmatter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate ADR headers
        run: |
          for f in docs/adr/*.md; do
            # docs/adr/ARCHITECTURE.md is an index of ADRs, not an ADR.
            [ "$(basename "$f")" = "ARCHITECTURE.md" ] && continue
            # Title: "# ADR 0001 - Title", "# ADR-001: Title" and
            # "# 0025 - Title" are all in use.
            grep -qE '^# (ADR[ -][0-9]|[0-9]{4})' "$f" || { echo "::error file=$f::missing '# ADR NNN - Title' header"; exit 1; }
            # Status: the corpus uses four spellings - a list item, a bold
            # paragraph with the colon inside, a bold paragraph with the colon
            # outside, and a "## Status" section. All of them state the status,
            # so the check accepts all four rather than rewriting 64 documents
            # to one spelling.
            grep -qiE '^(- )?\*\*Status:?\*\*|^## +status' "$f" || { echo "::error file=$f::missing Status line"; exit 1; }
          done
