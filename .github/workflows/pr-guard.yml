# Always-on PR guard checks, grouped into one workflow file.
#
# WHY THIS FILE EXISTS
#   Every file in .github/workflows that reacts to `pull_request` produces its
#   own workflow RUN on a PR push. Four always-on guard checks therefore cost
#   four runs (and four queued entries) per push. Grouping them into one file
#   with the same job ids keeps every check-run NAME identical while costing one
#   run instead.
#
# WHAT IS UNCHANGED
#   Each job's `steps:` block is carried over byte-for-byte from the file it
#   came from. Job ids and job `name:` values are unchanged, so the check names
#   GitHub reports are unchanged:
#     conventions-lint, secret-guard, trufflehog, policy-gate
#
# WHAT MOVED
#   The four separate `concurrency:` blocks collapse into one workflow-level
#   group here. `policy-gate`'s explicit `types:` list was GitHub's default set
#   already, so it is omitted rather than restated.
name: PR Guard Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventions-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Run conventions-lint
        env:
          STRICT_IN: "false"
        run: |
          chmod +x ./scripts/conventions-lint.sh
          if [ "$STRICT_IN" = "true" ]; then export STRICT=1; else export STRICT=0; fi
          ./scripts/conventions-lint.sh .

  secret-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Run secret guard
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # `github.event.pull_request.base.sha` is frozen at PR creation. When
          # main advances, a PR's merge ref contains commits this branch never
          # wrote, and the guard scans them as if they were part of the change.
          # Diff from the merge-base with the current base branch instead, the
          # same fix the happy-path guard uses.
          base_ref="${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -n "$base_ref" ]]; then
            git fetch --no-tags --quiet origin \
              "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" || true
            if git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null 2>&1; then
              merge_base="$(git merge-base "origin/${base_ref}" "$head_sha" 2>/dev/null || true)"
              if [[ -n "$merge_base" ]]; then
                base_sha="$merge_base"
              fi
            fi
          fi
          if [[ -n "$base_sha" ]] && \
             ! git rev-parse --verify --quiet "${base_sha}^{commit}" >/dev/null 2>&1; then
            # A force-push can orphan the previous head, so `github.event.before`
            # no longer resolves. Fall back to the merge-base with main.
            git fetch --no-tags --quiet origin \
              "+refs/heads/main:refs/remotes/origin/main" || true
            if git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
              base_sha="$(git merge-base origin/main "$head_sha" 2>/dev/null || true)"
            else
              base_sha=""
            fi
          fi
          if [[ -n "$base_sha" && "$base_sha" != "0000000000000000000000000000000000000000" ]]; then
            python scripts/secret-guard.py --since-ref "$base_sha"
          else
            python scripts/secret-guard.py
          fi
      - name: Run workflow action guard
        shell: bash
        run: python scripts/workflow-action-guard.py

  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      # Work out a scan range that actually contains commits.
      #
      # The previous configuration passed base = the default branch and head =
      # HEAD unconditionally. On a push to main that names the SAME commit twice,
      # and the action refuses to run:
      #
      #   ::error::BASE and HEAD commits are the same. TruffleHog won't scan
      #   anything.
      #
      # So the secrets gate errored out on every push to main without scanning a
      # single commit. A scanner that fails before scanning is worse than no
      # scanner, because it looks like coverage.
      #
      # Correct ranges per event:
      #   pull_request -> origin/<base_ref> .. HEAD   (the PR's commits)
      #   push         -> github.event.before .. HEAD (the pushed commits)
      # and when no usable base exists (first push, force-push, manually
      # dispatched), scan the whole history rather than erroring.
      - name: Resolve scan range
        id: range
        run: |
          set -euo pipefail
          base=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi

          # github.event.before is all zeros for a brand-new branch.
          case "$base" in
            0000000000000000000000000000000000000000|"") base="" ;;
          esac

          head_sha="$(git rev-parse HEAD)"

          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "No usable base commit; scanning full history."
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(git rev-parse "${base}^{commit}")" = "$head_sha" ]; then
            echo "Base resolves to HEAD (${head_sha}); scanning full history."
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scanning ${base}..HEAD"
          echo "mode=range" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Scan pushed/PR commits
        if: steps.range.outputs.mode == 'range'
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: HEAD
          extra_args: --only-verified

      - name: Scan full history
        if: steps.range.outputs.mode == 'full'
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          path: ./
          extra_args: --only-verified

  policy-gate:
    name: policy-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Enforce layered fix PR policy
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          echo "HEAD_REF=$HEAD_REF"
          echo "BASE_REF=$BASE_REF"
          echo "PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "PR_LABELS=$PR_LABELS"

          if ! command -v jq >/dev/null; then echo "ERROR: jq is required for exact label matching but was not found on the runner."; exit 1; fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<< "$PR_LABELS" >/dev/null; then
            echo "ERROR: PR_LABELS must be a JSON array of strings."
            exit 1
          fi

          if [[ "$HEAD_REF" == fix/* ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" == "master" ]]; then
              if ! jq -e 'index("layered-pr-exception")' <<< "$PR_LABELS" >/dev/null; then
                echo "ERROR: fix/* PRs must target a layered branch, not main/master."
                echo "Use stack/*, layer/*, release/*, or add label layered-pr-exception."
                exit 1
              fi
            fi
          fi

          if ! git fetch origin "$BASE_REF"; then
            echo "ERROR: base-ref fetch failed: $BASE_REF"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
            echo "ERROR: base-ref resolution failed: origin/$BASE_REF"
            exit 1
          fi
          if ! MERGE_BASE=$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA"); then
            echo "ERROR: merge-base discovery failed."
            exit 1
          fi
          if ! MERGES=$(git rev-list --merges "$MERGE_BASE..$PR_HEAD_SHA"); then
            echo "ERROR: rev-list failed."
            exit 1
          fi
          if [[ -n "$MERGES" ]]; then
            echo "ERROR: merge commits detected in PR diff range:"
            echo "$MERGES"
            exit 1
          fi

          echo "Policy gate passed."
