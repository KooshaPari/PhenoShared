name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "benches/**"
      - "bench/**"
      - "benchmarks/**"
      - "crates/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: if [ -d benches ]; then cargo bench --locked 2>&1 | tail -50 || true; else echo no-bench; fi
