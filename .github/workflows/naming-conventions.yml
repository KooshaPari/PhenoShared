# Drop-in replacement for the stale workflows/conventions.yml which calls a
# reusable workflow from the now-archived/deleted `phenotype-org-governance`
# at a pinned SHA. This version inlines the lint logic so it doesn't depend
# on the dead reusable.
name: naming-conventions
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "catalog/registry.yaml"
      - "registry/disposition-index.json"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: enforce pheno-* naming conventions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The script scoped its `gh repo list` to a literal org name that a 2026-09-16
          # PII sweep replaced with `<REDACTED>`. `gh` then answered "the owner handle
          # \"<REDACTED>\" was not recognized", the loop body never ran, and the job
          # reported `checked 0 ... 0 violations` and exited 0. Taking the owner from
          # the event removes both the hardcoded name and the silent-empty path.
          ORG: ${{ github.repository_owner }}
        run: bash .github/workflows/naming-conventions.sh
