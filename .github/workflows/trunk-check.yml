# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: 0 3 * * 1 # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pin the Rust toolchain to the workspace's rust-toolchain.toml (1.99.0).
      # Trunk runs clippy via cargo; without an explicit install its cargo can
      # resolve to an older toolchain that cannot parse `edition = "2024"`
      # manifests (7 crates), and the Lint & Format check fails on main.
      # Keep in sync with rust-toolchain.toml and the coverage workflow.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      # The Trunk action's own "Set up inputs" step parses the event payload
      # with jq and aborts with "::error::jq not installed on system!" when
      # jq is absent, which fails the whole "Lint & Format" job before any
      # linter runs. Install jq before the action step.
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          trunk-args: --upgrade
