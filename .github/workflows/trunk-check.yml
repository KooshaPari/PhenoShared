# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: 0 3 * * 1 # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the Rust toolchain to the workspace's rust-toolchain.toml (1.99.0).
      # Trunk runs clippy via cargo; without an explicit install its cargo can
      # resolve to an older toolchain that cannot parse `edition = "2024"`
      # manifests (7 crates), and the Lint & Format check fails on main.
      # Keep in sync with rust-toolchain.toml and the coverage workflow.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      # The Trunk action's own "Set up inputs" step parses the event payload
      # with jq and aborts with "::error::jq not installed on system!" when
      # jq is absent, which fails the whole "Lint & Format" job before any
      # linter runs. Install jq before the action step.
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # Trunk's clippy linter builds the whole root workspace, and
      # `crates/spawn-core-sys`' build script shells out to `zig build` to
      # produce `crates/spawn-core/zig-out/lib/libspawn_core.a`. Without zig
      # that build script aborts with "failed to run `zig build`: No such file
      # or directory", which trunk reports as a tool failure and which fails
      # this job before any lint result is trusted. Observed 2026-11-12 on PR
      # #937, run 43164794413: "Checked 6 modified files / 12 existing issues /
      # 1 failure". Same class of fix as the toolchain and jq steps above.
      - name: Install Zig
        uses: ./.github/actions/setup-zig

      # Trunk's clippy also builds the Linux-only GUI stack. `tao` pulls
      # `wayland-sys`, whose build script shells out to
      # `pkg-config --libs --cflags wayland-client`, and the ubuntu-latest
      # image does not ship that .pc file. Observed 2026-11-12 on PR #940, run
      # 43184486398: "The system library `wayland-client` required by crate
      # `wayland-sys` was not found", reported as a tool failure that fails the
      # job before any lint result is read. Same class as the jq and zig steps.
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev pkg-config

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          trunk-args: --upgrade
