name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: write

jobs:
  conventional:
    name: Validate conventional commit title
    runs-on: ubuntu-latest
    steps:
      # Dependabot writes its own body, and its mandatory compare/changelog links
      # cannot be wrapped without breaking the markdown link. The `ignores`
      # function in .commitlintrc.cjs does not survive this action's config
      # handling, so the exemption is applied here instead: for a Dependabot
      # commit the message is reduced to its subject line before linting.
      - name: Collect commit message and detect Dependabot
        id: message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message' > "$RUNNER_TEMP/full-message.txt"
          if grep -qE '^- dependency-name: ' "$RUNNER_TEMP/full-message.txt" &&
             grep -qxF 'Signed-off-by: dependabot[bot] <support@github.com>' "$RUNNER_TEMP/full-message.txt"; then
            head -n 1 "$RUNNER_TEMP/full-message.txt" > "$RUNNER_TEMP/lint-message.txt"
            echo "dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependabot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Dependabot subject only
        if: steps.message.outputs.dependabot == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/commitlint"
          mkdir -p "$workdir"
          cd "$workdir"
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@19 @commitlint/config-conventional@19 >/dev/null
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${GITHUB_REPOSITORY}/contents/.commitlintrc.cjs?ref=${BASE_SHA}" \
            > .commitlintrc.cjs
          npx commitlint --config ./.commitlintrc.cjs < "$RUNNER_TEMP/lint-message.txt"

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        if: steps.message.outputs.dependabot != 'true'
        with:
          configFile: .commitlintrc.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
