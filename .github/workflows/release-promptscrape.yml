name: release-promptscrape

# Publishes the promptscrape CLI as release binaries.
#
# The binary is pure Go (no cgo) so every target cross-compiles from one
# runner. Artifacts are named <binary>-<os>-<arch>, which is the convention the
# install script and `promptscrape update` both expect.

on:
  push:
    tags:
      - "promptscrape-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. promptscrape-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  MODULE_DIR: cmd/promptscrape

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.MODULE_DIR }}/go.sum

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$MODULE_DIR"
          VERSION="${TAG#promptscrape-v}"
          COMMIT="$(git rev-parse --short HEAD)"

          mkdir -p dist
          PKG="github.com/KooshaPari/PhenoShared/cmd/promptscrape/cmd"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="dist/promptscrape-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              out="${out}.exe"
            fi
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X ${PKG}.version=${VERSION} -X ${PKG}.commit=${COMMIT} -X ${PKG}.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "$out" .
          done

      - name: Check artifacts
        run: |
          set -euo pipefail
          ls -la "$MODULE_DIR/dist"
          test -x "$MODULE_DIR/dist/promptscrape-linux-amd64"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$MODULE_DIR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to it"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
