name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  merge_group:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_deny: ${{ steps.detect.outputs.has_deny }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      go_modules: ${{ steps.detect.outputs.go_modules }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_security: ${{ steps.detect.outputs.has_security }}
      has_trunk: ${{ steps.detect.outputs.has_trunk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: detect
        run: |
          set +e
          # Initialize all outputs to false (critical: every output must be set)
          {
            echo "has_rust=false"
            echo "has_deny=false"
            echo "has_python=false"
            echo "has_go=false"
            echo "has_typescript=false"
            echo "has_security=false"
            echo "has_trunk=false"
          } >> "$GITHUB_OUTPUT"

          # Rust: needs Cargo.toml AND deny.toml
          if [ -f "Cargo.toml" ] || [ -f "**/Cargo.toml" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            if [ -f "deny.toml" ]; then
              echo "has_deny=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Python: needs pyproject.toml, setup.py, requirements.txt, or *.py
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ] || find . -maxdepth 3 -name "*.py" -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          # Go: needs a go.mod at the root or in a nested module directory.
          # This repo has no root go.mod; every Go module lives in a
          # subdirectory (cmd/*, crates/*, libs/*, ...).
          #
          # The set of gated modules is declared in go.modules.txt, which the
          # `go-modules` job verifies covers every go.mod in the tree.
          if [ -f "go.mod" ] || find . -maxdepth 3 -name "go.mod" -not -path "./node_modules/*" 2>/dev/null | head -1 | grep -q .; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
            if [ -f "go.modules.txt" ]; then
              modules="$(grep -vE '^\s*(#|$)' go.modules.txt | sed 's|/*$||' | jq -R . | jq -sc .)"
              echo "go_modules=$modules" >> "$GITHUB_OUTPUT"
            else
              echo "go_modules=[]" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "go_modules=[]" >> "$GITHUB_OUTPUT"
          fi

          # TypeScript / JS: needs package.json (with type=module or tsconfig or js files)
          if [ -f "package.json" ]; then
            echo "has_typescript=true" >> "$GITHUB_OUTPUT"
          fi

          # Security: always run (bandit/gitleaks/dependency-review)
          echo "has_security=true" >> "$GITHUB_OUTPUT"

          # Trunk: only if trunk.yaml exists
          if [ -f "trunk.yaml" ]; then
            echo "has_trunk=true" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Detected ==="
          # Print the values this step just computed. Referencing
          # steps.detect.outputs here is invalid: the steps context only exposes
          # steps that already ran, so this step cannot read its own outputs.
          for k in has_rust has_deny has_python has_go has_typescript has_security has_trunk; do
            printf '%s=%s\n' "$k" "$(grep -c "^$k=" <<< "$(cat "$GITHUB_OUTPUT")")"
          done

  sdk-catalog:
    name: SDK Catalog Invariant
    runs-on: ubuntu-latest
    # HARD gate. The catalog invariant was on the pull-request path as a STEP
    # inside the `python` job, but that job's first step is `ruff check`,
    # which fails on the current tree. A failing step short-circuits the rest
    # of the job, so the catalog step was reported `skipped` on every pull
    # request (measured on run 43281874107) and a pull request could break
    # the catalog without anything noticing before merge. As its own job with
    # no `needs:` and no `if:`, it runs on every push and every pull_request.
    #
    # Measured green on 2026-11-12: `python3 tools/sdk-catalog/check.py` prints
    # "PASS: 0 violation(s) across the checked rules" (exit 0).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tools/sdk-catalog/check.py recomputes the layer edges with
      # `cargo metadata --no-deps --offline`. Without a cargo on PATH that call
      # fails and the R2/R3 rules would report PASS against an empty package
      # list, so the toolchain is a prerequisite of a meaningful verdict, not
      # an optimisation.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check sdk-catalog
        run: python3 tools/sdk-catalog/check.py

  cargo-deny:
    name: Cargo Deny (Advisories + Licenses)
    needs: detect
    if: needs.detect.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    # HARD gate. Measured green on 2026-11-12: `cargo deny --all-features check`
    # reported "advisories ok, bans ok, licenses ok, sources ok" (exit 0).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: cargo-deny check
        # v1 pins cargo-deny 0.14.21, which cannot parse the RustSec advisory
        # database any more: it fails with "unsupported CVSS version: 4.0" and
        # "failed to load advisory database", so the gate never evaluated a
        # single advisory. v2 pins 0.20.2, which parses the current DB.
        # The repo's own cargo-deny.yml already uses v2.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features
          # The action's container is rust:1.85.0-alpine, so rustup's host
          # triple is x86_64-unknown-linux-musl and the repo's
          # rust-toolchain.toml channel resolves to the toolchain name
          # `1.99.0-x86_64-unknown-linux-musl` (a host-triple suffix, not a
          # declared musl target). Pre-installing that exact version via the
          # action's rust-version input keeps the resolution deterministic.
          rust-version: "1.99.0"

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff (version-pinned)
        # Pinned: an unpinned `pip install ruff` let the gate's tool version float,
        # so the verdict could change with no change to the code.
        # requirements-ci-lint.txt is still NOT used by this job. It is now
        # installable under `--require-hashes`: hash_pip.py emits pip-compile
        # blocks (the requirement line and every continuation but the last carry
        # a trailing `\`) and pins the whole dependency closure, not only the
        # top-level tools. Proven 2026-11-13, a fresh venv per file, Python 3.12
        # on macOS arm64: all five requirements-ci-*.txt installed at exit 0.
        # That proof is local only. Switching this job to the pin file needs the
        # same check on the Linux runner, and requirements-ci-test.txt needs
        # Python >= 3.12 (numpy) while this job runs 3.11.
        run: pip install ruff==0.16.5
      # These steps FAIL on violations. They previously ended in
      # `|| echo "::warning::..."`, which made the step exit 0 and, combined with
      # a job-level `continue-on-error`, produced a lane that could not fail and
      # could not be seen failing. The aggregator classifies this job as
      # ADVISORY, so a red result is reported and does not block a merge; the
      # difference is that it is now visible.
      #
      # Measured 2026-11-13T09:26:58Z at ruff 0.16.5 (the pinned version):
      # `ruff check . --output-format=concise | wc -l` reports 18049 findings
      # on the Linux runner, 18051 on macOS arm64 (2 fewer on Linux), across the
      # tree, most inside absorbed corpora. Scoping ruff to first-party
      # Python is the prerequisite for promoting this lane to HARD.
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      # The catalog invariant is NOT checked here. As a step of this job it sat
      # behind `ruff check`, which fails on the current tree, so the job
      # short-circuited and the catalog step reported `skipped` on every pull
      # request (run 43281874107). It now runs as its own job, `sdk-catalog`,
      # which the `ci / lint` aggregator treats as a HARD gate.

  go-modules:
    name: Go Module Registry
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify every go.mod is declared or excluded
        run: python3 scripts/ci/check-go-modules.py

  go:
    name: Go (${{ matrix.module }})
    needs: [detect, go-modules]
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module list lives in go.modules.txt at the repo root, which is
        # the single source of truth. The `go-modules` job below verifies
        # that every go.mod in the tree is declared there or excluded, so
        # this matrix cannot silently drift out of date.
        #
        # Modules that are NOT gated are documented with their reason in
        # docs/go-modules-excluded.md.
        module: ${{ fromJSON(needs.detect.outputs.go_modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the version from the module's own go.mod so each module is
          # built with the toolchain it declares. setup-go resolves the `go`
          # or `toolchain` directive, so a module needing a newer Go than the
          # runner default still gets the right one.
          go-version-file: ${{ matrix.module }}/go.mod
          # Some modules have no external dependencies and therefore no
          # go.sum. Point the cache at whichever file exists so setup-go does
          # not fail on a missing path.
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            ${{ matrix.module }}/go.mod

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        # Building the package pattern (not a single main package) writes no
        # binary into the source tree, so the checkout stays clean.
        run: go build ./...

  typescript:
    name: TS/JS
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repo is bun-managed (packageManager: bun@1.3.10). npm cannot
      # resolve the root package.json's "workspace:*" dependency, so the old
      # npm ci / npm install pair aborted before lint or test ever ran.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: lint
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            bun run lint
          fi
      - name: test
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            bun run test
          fi

  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.has_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Same pin and same reasoning as `.github/workflows/security.yml`.
          # The action's default (8.24.3) ignores every `[[allowlists]]` block in
          # `.gitleaks.toml`, so the four documented placeholder fixtures read as
          # live leaks.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: low

  registry-invariant:
    name: Registry Invariant (absorption claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: self-test analyzer
        # RUNNER_TEMP is set on every runner; job-level `env` cannot use the
        # `runner` context (build-time "Unrecognized named-value" -> run
        # fails with zero jobs), so export it inside the step shell.
        run: JCODE_SCRATCH_DIR="$RUNNER_TEMP/jcode-scratch" bash scripts/audit/registry-invariant.sh --self-test
      - name: registry-invariant gate
        run: bash scripts/audit/registry-invariant.sh

  lint:
    name: ci / lint
    if: always()
    needs:
      [
        detect,
        cargo-deny,
        sdk-catalog,
        python,
        go-modules,
        go,
        typescript,
        security,
        dep-review,
        registry-invariant,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate lint gate
        run: |
          # HARD gates fail this aggregator. ADVISORY gates do not block a
          # merge, but they are NOT hidden: every advisory job runs without
          # `continue-on-error`, so a failure is visible here as
          # `✗ <job>: failure (advisory)`, and the job shows red in the run.
          #
          # This is deliberate. An earlier revision combined a job-level
          # `continue-on-error: true` with step-level `|| echo "::warning::"`
          # swallows, so an advisory lane's failure was rewritten to success by
          # GitHub and by the shell, and this aggregator had no way to see it.
          # A lane that can neither fail nor be observed failing is not a gate.
          #
          # HARD     : detect, cargo-deny, registry-invariant, sdk-catalog
          # ADVISORY : python, go-modules, go, typescript, security, dep-review
          #
          # Promotion requires a measured green run, recorded here with the
          # command and date. cargo-deny was promoted on 2026-11-12 after
          # `cargo deny --all-features check` reported advisories/bans/licenses/
          # sources all ok (exit 0). sdk-catalog was promoted on 2026-11-12
          # after `python3 tools/sdk-catalog/check.py` reported "PASS: 0
          # violation(s) across the checked rules" (exit 0).
          #
          # NOTE: the job id is `dep-review`. An earlier revision read
          # `needs.dependency-review.result`, which is not a job in this
          # workflow, so the value was empty and rendered as "?" instead of the
          # real result, making dep-review failures silently invisible.
          failed=0
          advisory_failed=0
          for pair in \
            "detect:${{ needs.detect.result }}:hard" \
            "cargo-deny:${{ needs.cargo-deny.result }}:hard" \
            "sdk-catalog:${{ needs.sdk-catalog.result }}:hard" \
            "registry-invariant:${{ needs.registry-invariant.result }}:hard" \
            "python:${{ needs.python.result }}:advisory" \
            "go-modules:${{ needs.go-modules.result }}:advisory" \
            "go:${{ needs.go.result }}:advisory" \
            "typescript:${{ needs.typescript.result }}:advisory" \
            "security:${{ needs.security.result }}:advisory" \
            "dep-review:${{ needs.dep-review.result }}:advisory" \
            ; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            result="${rest%%:*}"
            kind="${rest##*:}"
            if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result ($kind)"
            elif [ "$kind" = "hard" ]; then
              # fail-closed: a hard gate that failed, was cancelled, or whose
              # result could not be resolved fails the aggregator.
              echo "  ✗ $name: ${result:-<unresolved>} ($kind)"
              failed=$((failed + 1))
            else
              echo "  ✗ $name: ${result:-<unresolved>} ($kind, not blocking)"
              advisory_failed=$((advisory_failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed hard gate(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All hard gates passed (or were skipped)"
          if [ "$advisory_failed" -gt 0 ]; then
            echo "   ⚠ $advisory_failed advisory lane(s) failed; see ✗ lines above"
          fi

  test:
    name: ci / test
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Test gate
        run: |
          # The workspace test suite does NOT run in this workflow, so this
          # job cannot claim "all tests passed". The single Rust test
          # authority is .github/workflows/quality-gate.yml -> cargo-check:
          #   cargo build --workspace --locked
          #   make check                      (fmt + clippy -D warnings + unit)
          #   cargo nextest run --workspace    (ci profile, no continue-on-error)
          # Re-running that suite here would double-bill CI for the same
          # signal, so this job asserts the gate it genuinely depends on:
          # ci / lint and its HARD gates (detect, cargo-deny, registry-invariant).
          lint_result="${{ needs.lint.result }}"
          echo "ci / lint result: ${lint_result:-<unresolved>}"
          echo "workspace tests: Quality Gate -> cargo-check (separate workflow, authoritative)"
          echo "advisory lanes (python/go/typescript/security/dep-review): reported, not blocking"
          if [ "$lint_result" != "success" ]; then
            echo ""
            echo "❌ ci / test: upstream gate ci / lint is ${lint_result:-<unresolved>}, not success"
            exit 1
          fi
          echo ""
          echo "✅ ci / test: upstream hard gate ci / lint succeeded"
          echo "   test execution is asserted by Quality Gate -> cargo-check, not here"
