name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  merge_group:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_deny: ${{ steps.detect.outputs.has_deny }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_security: ${{ steps.detect.outputs.has_security }}
      has_trunk: ${{ steps.detect.outputs.has_trunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: detect
        run: |
          set +e
          # Initialize all outputs to false (critical: every output must be set)
          echo "has_rust=false" >> "$GITHUB_OUTPUT"
          echo "has_deny=false" >> "$GITHUB_OUTPUT"
          echo "has_python=false" >> "$GITHUB_OUTPUT"
          echo "has_go=false" >> "$GITHUB_OUTPUT"
          echo "has_typescript=false" >> "$GITHUB_OUTPUT"
          echo "has_security=false" >> "$GITHUB_OUTPUT"
          echo "has_trunk=false" >> "$GITHUB_OUTPUT"

          # Rust: needs Cargo.toml AND deny.toml
          if [ -f "Cargo.toml" ] || [ -f "**/Cargo.toml" ]; then
            echo "has_rust=true" >> "$GITHUB_OUTPUT"
            if [ -f "deny.toml" ]; then
              echo "has_deny=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Python: needs pyproject.toml, setup.py, requirements.txt, or *.py
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ] || find . -maxdepth 3 -name "*.py" -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          fi

          # Go: needs go.mod
          if [ -f "go.mod" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          fi

          # TypeScript / JS: needs package.json (with type=module or tsconfig or js files)
          if [ -f "package.json" ]; then
            echo "has_typescript=true" >> "$GITHUB_OUTPUT"
          fi

          # Security: always run (bandit/gitleaks/dependency-review)
          echo "has_security=true" >> "$GITHUB_OUTPUT"

          # Trunk: only if trunk.yaml exists
          if [ -f "trunk.yaml" ]; then
            echo "has_trunk=true" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== Detected ==="
          echo "rust=${{ steps.detect.outputs.has_rust }} deny=${{ steps.detect.outputs.has_deny }} python=${{ steps.detect.outputs.has_python }} go=${{ steps.detect.outputs.has_go }} typescript=${{ steps.detect.outputs.has_typescript }} security=${{ steps.detect.outputs.has_security }} trunk=${{ steps.detect.outputs.has_trunk }}"

  cargo-deny:
    name: Cargo Deny (Advisories + Licenses)
    needs: detect
    if: needs.detect.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --all-features

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check . 2>&1 || echo "::warning::ruff issues (advisory)"
      - name: ruff format --check
        run: ruff format --check . 2>&1 || echo "::warning::format issues (advisory)"

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - name: gofmt check
        run: gofmt -l . 2>&1 || echo "::warning::gofmt issues (advisory)"
      - name: go vet
        run: go vet ./... 2>&1 || echo "::warning::go vet issues (advisory)"
      - name: go test
        run: go test ./... 2>&1 || echo "::warning::test failures (advisory)"

  typescript:
    name: TS/JS
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: lint
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint 2>&1 || echo "::warning::lint issues (advisory)"
          fi
      - name: test
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test 2>&1 || echo "::warning::test failures (advisory)"
          fi

  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.has_security == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low

  registry-invariant:
    name: Registry Invariant (absorption claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-test analyzer
        # RUNNER_TEMP is set on every runner; job-level `env` cannot use the
        # `runner` context (build-time "Unrecognized named-value" -> run
        # fails with zero jobs), so export it inside the step shell.
        run: JCODE_SCRATCH_DIR="$RUNNER_TEMP/jcode-scratch" bash scripts/audit/registry-invariant.sh --self-test
      - name: registry-invariant gate
        run: bash scripts/audit/registry-invariant.sh

  lint:
    name: ci / lint
    if: always()
    needs:
      [
        detect,
        cargo-deny,
        python,
        go,
        typescript,
        security,
        dep-review,
        registry-invariant,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate lint gate
        run: |
          # HARD gates fail this aggregator. ADVISORY gates do not, and cannot
          # even be observed failing: every advisory job sets
          # `continue-on-error: true`, so GitHub reports `success` for it even
          # when its steps fail. Their result is printed for the reader only.
          #
          # HARD     : detect, registry-invariant
          # ADVISORY : cargo-deny, python, go, typescript, security, dep-review
          #
          # NOTE: the job id is `dep-review`. An earlier revision read
          # `needs.dependency-review.result`, which is not a job in this
          # workflow, so the value was empty and rendered as "?" instead of the
          # real result, making dep-review failures silently invisible.
          failed=0
          for pair in \
            "detect:${{ needs.detect.result }}:hard" \
            "registry-invariant:${{ needs.registry-invariant.result }}:hard" \
            "cargo-deny:${{ needs.cargo-deny.result }}:advisory" \
            "python:${{ needs.python.result }}:advisory" \
            "go:${{ needs.go.result }}:advisory" \
            "typescript:${{ needs.typescript.result }}:advisory" \
            "security:${{ needs.security.result }}:advisory" \
            "dep-review:${{ needs.dep-review.result }}:advisory" \
            ; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            result="${rest%%:*}"
            kind="${rest##*:}"
            if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result ($kind)"
            elif [ "$kind" = "hard" ]; then
              # fail-closed: a hard gate that failed, was cancelled, or whose
              # result could not be resolved fails the aggregator.
              echo "  ✗ $name: ${result:-<unresolved>} ($kind)"
              failed=$((failed + 1))
            else
              echo "  ! $name: ${result:-<unresolved>} ($kind, not enforced)"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed hard gate(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All hard gates passed (or were skipped)"
          echo "   advisory lanes above report success regardless of outcome"

  test:
    name: ci / test
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Test gate
        run: |
          # The workspace test suite does NOT run in this workflow, so this
          # job cannot claim "all tests passed". The single Rust test
          # authority is .github/workflows/quality-gate.yml -> cargo-check:
          #   cargo build --workspace --locked
          #   make check                      (fmt + clippy -D warnings + unit)
          #   cargo nextest run --workspace    (ci profile, no continue-on-error)
          # Re-running that suite here would double-bill CI for the same
          # signal, so this job asserts the gate it genuinely depends on:
          # ci / lint and its HARD gates (detect, registry-invariant).
          lint_result="${{ needs.lint.result }}"
          echo "ci / lint result: ${lint_result:-<unresolved>}"
          echo "workspace tests: Quality Gate -> cargo-check (separate workflow, authoritative)"
          echo "advisory lanes (cargo-deny/python/go/typescript/security/dep-review): not enforced"
          if [ "$lint_result" != "success" ]; then
            echo ""
            echo "❌ ci / test: upstream gate ci / lint is ${lint_result:-<unresolved>}, not success"
            exit 1
          fi
          echo ""
          echo "✅ ci / test: upstream hard gate ci / lint succeeded"
          echo "   test execution is asserted by Quality Gate -> cargo-check, not here"
