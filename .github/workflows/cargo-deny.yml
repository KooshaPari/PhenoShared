name: cargo-deny
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/deny.toml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: iac/Cargo.toml
          # The action runs inside rust:1.85.0-alpine, so rustup's HOST triple
          # is x86_64-unknown-linux-musl and the root rust-toolchain.toml
          # (channel = "1.99.0") resolves to the toolchain NAME
          # `1.99.0-x86_64-unknown-linux-musl`. That name is a rustup host
          # triple suffix, NOT a declared musl target - no musl override
          # exists anywhere in the repo. The container only ships
          # 1.85.0-x86_64-unknown-linux-musl, so the action's entrypoint
          # (`rustup show || rustup toolchain install`) used to print
          # "error: override toolchain ... is not installed" and then
          # auto-install it mid-step. Pre-installing the same pinned version
          # via the action's own rust-version input makes that resolution
          # deterministic and silences the misleading error. Keep this in
          # lockstep with the root rust-toolchain.toml channel.
          rust-version: "1.99.0"
