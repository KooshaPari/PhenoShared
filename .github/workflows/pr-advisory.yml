# Advisory PR checks, grouped into one workflow file.
#
# WHY THIS FILE EXISTS
#   Every file in .github/workflows that reacts to `pull_request` produces its
#   own workflow RUN on a PR push. Five always-on advisory checks therefore cost
#   five runs (and five queued entries) per push. Grouping them into one file
#   with the same job ids keeps every check-run NAME identical while costing one
#   run instead.
#
# WHAT IS UNCHANGED
#   Each job's `steps:` block is carried over byte-for-byte from the file it
#   came from. Job ids and job `name:` values are unchanged, so the check names
#   GitHub reports are unchanged:
#     dedup, dprint (TOML + Dockerfile), happy-path collapse guard,
#     Pre-commit Checks, Commit Message Validation,
#     Legacy Tooling Anti-Pattern Scan
#
# WHAT MOVED
#   Workflow-level `env:` from the old files is now declared per job, because
#   env is not inherited across jobs in a single workflow file.
name: PR Advisory Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Compare DAG crates with upstream
        run: |
          echo "Checking if pheno-dag matches byteport-dag upstream..."
          UPSTREAM="https://raw.githubusercontent.com/<REDACTED>/BytePort/main/crates/byteport-dag/src"
          LOCAL="crates/pheno-dag/src"
          FAIL=0
          for f in dag.rs topo.rs schema.rs serialize.rs; do
            curl -sf "$UPSTREAM/$f" -o /tmp/upstream_$f 2>/dev/null || { echo "SKIP $f (upstream not found)"; continue; }
            if ! diff -q /tmp/upstream_$f "$LOCAL/$f" >/dev/null 2>&1; then
              echo "DIVERGED: $f"
              diff -u /tmp/upstream_$f "$LOCAL/$f" | head -20
              FAIL=1
            else
              echo "IDENTICAL: $f"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::warning::pheno-dag has diverged from byteport-dag. Consider updating both or consolidating."
          fi

  dprint:
    name: dprint (TOML + Dockerfile)
    runs-on: ubuntu-24.04
    env:
      DPRINT_VERSION: 0.64.3
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install pinned dprint
        run: |
          set -euo pipefail
          base_url="https://github.com/dprint/dprint/releases/download/${DPRINT_VERSION}"
          asset="dprint-x86_64-unknown-linux-gnu.zip"
          curl -fsSL -o "$asset" "${base_url}/${asset}"
          curl -fsSL -o SHASUMS256.txt "${base_url}/SHASUMS256.txt"
          grep " ${asset}\$" SHASUMS256.txt | sha256sum --check
          unzip -o -q "$asset" -d dprint-bin
          sudo install -m 0755 dprint-bin/dprint /usr/local/bin/dprint
          dprint --version

      - name: Check every tracked Dockerfile
        run: |
          set -euo pipefail
          git ls-files > tracked.txt
          tracked=$(wc -l < tracked.txt)
          resolved=$(grep -Eic '(^|/)Dockerfile' tracked.txt || true)
          echo "tracked files: ${tracked}; tracked Dockerfiles: ${resolved}"
          # A count of zero is asserted against, never accepted as a pass: zero
          # Dockerfiles can only mean the checkout or the pattern is wrong, and a
          # silent green is exactly how a gate stops meaning anything.
          if [ "${resolved}" -lt 1 ]; then
            echo "::error::Resolved 0 Dockerfiles out of ${tracked} tracked files."
            exit 1
          fi
          grep -Ei '(^|/)Dockerfile' tracked.txt > dockerfiles.txt
          echo "Checking $(wc -l < dockerfiles.txt) tracked Dockerfile files:"
          cat dockerfiles.txt
          xargs -d '\n' -r dprint check --config dprint.json --allow-no-files < dockerfiles.txt

      - name: Resolve changed TOML files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" > all-changed.txt
          # A pull request always changes at least one file. An empty list means the
          # diff resolved against the wrong base, so fail instead of skipping green.
          if [ ! -s all-changed.txt ]; then
            echo "::error::The base diff reported 0 changed files against origin/${BASE_REF}."
            exit 1
          fi
          echo "changed files: $(wc -l < all-changed.txt)"
          grep -E '\.toml$' all-changed.txt > changed-files.txt || true
          if [ ! -s changed-files.txt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed TOML files; skipping dprint check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Checking:"
            cat changed-files.txt
          fi

      - name: Check formatting of changed TOML files
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xargs -d '\n' -r dprint check --config dprint.json < changed-files.txt

  guard:
    name: happy-path collapse guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - name: Test R3 allowlist
        run: |
          bash governance/test-happy-path-allowlist.sh
      - name: Test whitespace-only reflow suppression
        run: |
          bash governance/test-happy-path-whitespace.sh
      - name: Run guard against HEAD diff
        run: |
          # WHY THE BASE IS COMPUTED HERE AND NOT TAKEN FROM THE EVENT
          #   `github.event.pull_request.base.sha` is FROZEN at the moment the
          #   PR was created; it is not the current tip of the base branch. A PR
          #   whose branch also contains base commits newer than that frozen
          #   SHA therefore diffs from a stale base, and every line the BASE
          #   branch added since the PR was opened appears as an ADDED line of
          #   this PR. The guard then reads the base branch's own new prose as
          #   if this PR had written it - which is how a comment the base
          #   branch added to its own Cargo.toml failed this PR's guard on a
          #   change that did not touch Cargo.toml at all.
          #
          #   Diff from the merge-base with the CURRENT base branch instead.
          #   That is exactly "what this PR changed", and it is stable: for a
          #   push to main the merge-base of `before` and HEAD is `before`,
          #   which is what the guard already used.
          base_ref="${{ github.event.pull_request.base.ref }}"
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          merge_base=""
          if [ -n "$base_ref" ]; then
            git fetch --no-tags --quiet origin \
              "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}" || true
            if git rev-parse --verify --quiet "origin/${base_ref}" >/dev/null 2>&1; then
              merge_base="$(git merge-base "origin/${base_ref}" "$head_sha" 2>/dev/null || true)"
            fi
            if [ -z "$merge_base" ] && \
               git rev-parse --verify --quiet "$base_ref" >/dev/null 2>&1; then
              merge_base="$(git merge-base "$base_ref" "$head_sha" 2>/dev/null || true)"
            fi
            if [ -n "$merge_base" ]; then
              base_sha="$merge_base"
            fi
          fi
          echo "guard base=$base_sha head=$head_sha"
          HAPPY_PATH_BASE="$base_sha" \
          HAPPY_PATH_HEAD="$head_sha" \
          HAPPY_PATH_FAIL_ON=block \
            bash governance/happy-path-precommit.sh
      - name: Show recent diff
        if: always()
        run: git log -1 --format='%h %s' && git diff HEAD~1 --unified=0 | head -200

  pre-commit-check:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    env:
      LEFTHOOK_VERSION: 2.1.12
      LEFTHOOK_SHA256: 22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install lefthook
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Linux x86_64"
          install_dir=$(mktemp -d "$RUNNER_TEMP/lefthook.XXXXXX")
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64" \
            --output "$install_dir/lefthook"
          printf '%s  %s\n' "$LEFTHOOK_SHA256" "$install_dir/lefthook" | sha256sum --check --strict
          chmod 0755 "$install_dir/lefthook"
          test "$("$install_dir/lefthook" version)" = "$LEFTHOOK_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Run pre-commit hooks
        run: lefthook run pre-commit --no-auto-install

  commit-msg-check:
    name: Commit Message Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      LEFTHOOK_VERSION: 2.1.12
      LEFTHOOK_SHA256: 22ff1ad48d1a0f4dca8d6b7e920056c6a9015f9204e5b693858ed9c2db759a16
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install lefthook
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Linux x86_64"
          install_dir=$(mktemp -d "$RUNNER_TEMP/lefthook.XXXXXX")
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64" \
            --output "$install_dir/lefthook"
          printf '%s  %s\n' "$LEFTHOOK_SHA256" "$install_dir/lefthook" | sha256sum --check --strict
          chmod 0755 "$install_dir/lefthook"
          test "$("$install_dir/lefthook" version)" = "$LEFTHOOK_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Validate commit message format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep untrusted PR metadata out of shell source.
          printf '%s\n' "$PR_TITLE" > .git/COMMIT_MSG_TEMP
          lefthook run commit-msg --no-auto-install .git/COMMIT_MSG_TEMP

  legacy-tooling-scan:
    name: Legacy Tooling Anti-Pattern Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Legacy tooling scanner unavailable
        run: |
          cat > legacy_tooling_report.json <<JSON
          {"totals":{"critical":0,"high":0,"medium":0,"low":0},"findings":[]}
          JSON
          cat > legacy_tooling_report.md <<MD
          # Legacy Tooling Scan Report

          Scanner source was previously loaded from deleted <REDACTED>/phenoShared.
          This workflow remains WARN-mode and produces an empty report until the scanner is rehomed.
          MD

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v-latest
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Upload scan report (JSON)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: legacy-tooling-report-json
          path: legacy_tooling_report.json
          retention-days: 30

      - name: Upload scan report (Markdown)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: legacy-tooling-report-md
          path: legacy_tooling_report.md
          retention-days: 30

      - name: Comment PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v-latest
        with:
          script: |
            const fs = require('fs');
            let report = '**Legacy Tooling Scan Report**\n\n';

            try {
              const data = JSON.parse(fs.readFileSync('legacy_tooling_report.json', 'utf8'));
              const totals = data.totals || {};
              
              report += `| Severity | Count |\n|----------|-------|\n`;
              report += `| Critical | ${totals.critical || 0} |\n`;
              report += `| High | ${totals.high || 0} |\n`;
              report += `| Medium | ${totals.medium || 0} |\n`;
              report += `| Low | ${totals.low || 0} |\n\n`;
              
              const findings = data.findings || [];
              if (findings.length > 0) {
                report += '**Top Violations:**\n';
                findings.slice(0, 5).forEach(f => {
                  report += `- [${f.severity.toUpperCase()}] ${f.rule_id}: ${f.file}:${f.line}\n`;
                });
                if (findings.length > 5) {
                  report += `- ... and ${findings.length - 5} more\n`;
                }
              } else {
                report += 'No violations detected.\n';
              }
              
              report += '\n*This is a WARN-mode scan. Fix before strict enforcement begins.*';
            } catch (e) {
              report += 'Could not parse scan results.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  js-coverage-ratchet:
    # The display name states what is ENFORCED, not an aspiration (the same
    # convention the coverage.yml jobs use).
    #
    # WHAT THIS JOB USED TO DO, AND WHY IT COULD NOT MEASURE ANYTHING:
    #   * `npm ci` fails with `EUNSUPPORTEDPROTOCOL: Unsupported URL Type
    #     "workspace:": workspace:*`. The root package.json declares
    #     `"@phenotype/docs": "workspace:*"`, which npm cannot resolve at all.
    #     The repo is bun-managed (`packageManager: bun@1.3.10`), and
    #     package-lock.json is stale (it still pins vitest 4.1.9 /
    #     typescript ~5.6.0 while package.json asks for ^5.1.0 / ^7.0.2).
    #   * The test step failed with `Missing script: "test"`: the root
    #     package.json declared no `test` script.
    #   * `--coverage` could never have loaded a provider: `@vitest/
    #     coverage-v8` was not a dependency.
    #   * `.coverage-baseline` was "0", so the ratchet had never established
    #     a real baseline. The job had never measured anything.
    #
    # WHAT IT MEASURES NOW: the repo's real hermetic JS/TS unit suite
    # (`tests/*.test.ts`, run by `vitest.unit.config.ts`; see that file for
    # why the a11y specs and the two known-red conformance files are not in
    # it). Those tests import only source modules and `node:fs`; no browser,
    # no dev server, no network. Until this job was repaired, NO CI job ran
    # them at all.
    #
    # This is NOT a duplicate of the Rust coverage floor. That is a separate
    # gate in `.github/workflows/coverage.yml`, where tarpaulin measures each
    # crate group with `--fail-under 0` only so that a small group still writes
    # a report; the numbers that actually fail the build are the per-group
    # floors plus `aggregate_floor = 53.80` in
    # `.coverage-baselines/root-workspace.toml`. This gate measures the JS/TS
    # surface under `src/`.
    #
    # The baseline is raised by a deliberate commit to `.coverage-baseline`,
    # NOT by this job writing to main. The old "Update baseline on main"
    # step could never have worked anyway: this workflow grants only
    # `contents: read`, so its `git push` was rejected and swallowed by
    # `|| true`. Keeping a step that tries to push to main from a
    # pull_request-triggered workflow is a privilege-escalation smell, so it
    # is gone; the floor now moves only through review.
    name: JS/TS coverage ratchet (no regression vs .coverage-baseline)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: |
          # Without pipefail this step's exit status was `tee`'s (always 0),
          # so a failing test run could not fail the step. The tee is kept for
          # the log artifact.
          set -o pipefail
          bun run test:coverage 2>&1 | tee test-output.log

      - name: Read previous coverage
        id: prev
        run: |
          if [ ! -f .coverage-baseline ]; then
            echo "::error::.coverage-baseline is missing, so the ratchet has no floor to enforce"
            exit 1
          fi
          PREV=$(cat .coverage-baseline)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Baseline coverage: $PREV%"

      - name: Read current coverage
        id: curr
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::coverage/coverage-summary.json was not produced"
            exit 1
          fi
          CURRENT=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "curr=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current coverage: $CURRENT%"

      - name: Assert coverage ratchet
        run: |
          PREV=${{ steps.prev.outputs.prev }}
          CURR=${{ steps.curr.outputs.curr }}
          if (( $(echo "$CURR < $PREV" | bc -l) )); then
            echo "::error::Coverage regressed from ${PREV}% to ${CURR}%"
            exit 1
          fi
          echo "Coverage ratchet: ${PREV}% -> ${CURR}% (no regression)"

  scorecard:
    runs-on: ubuntu-latest
    # These were referenced by the Check-score and update-badge jobs but never
    # declared, so actionlint flagged "property score is not defined" and the
    # downstream jobs silently received empty strings.
    outputs:
      score: ${{ steps.audit.outputs.score }}
      total: ${{ steps.audit.outputs.total }}
      percentage: ${{ steps.audit.outputs.percentage }}
      threshold: ${{ steps.audit.outputs.threshold }}
      passed: ${{ steps.audit.outputs.passed }}
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run 88-Pillar Scorecard Audit
        id: audit
        run: |
          THRESHOLD=${{ github.event.inputs.threshold || '35' }}

          # Run audit in JSON mode
          python scripts/scorecard_ci.py . --output json --threshold "$THRESHOLD" --fail-on-drop > scorecard-report.json 2> scorecard-stderr.txt || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 0 ]; then echo "audit exited ${EXIT_CODE}" >&2; fi

          # Extract score
          SCORE=$(python -c "import json; r=json.load(open('scorecard-report.json')); print(r['score'])")
          TOTAL=$(python -c "import json; r=json.load(open('scorecard-report.json')); print(r['total'])")
          PCT=$(python -c "import json; r=json.load(open('scorecard-report.json')); print(f\"{r['percentage']:.1f}\")")

          # Generate markdown summary
          {
            echo "## 88-Pillar Scorecard Result"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Score** | **${SCORE}/${TOTAL}** (${PCT}%) |"
            echo "| **Threshold** | ${THRESHOLD} |"
            echo "| **Status** | $( [ "$SCORE" -ge "$THRESHOLD" ] && echo "PASS" || echo "FAIL" ) |"
            echo ""
          } > scorecard-summary.md

          # List failed pillars
          if [ "$SCORE" -lt "$THRESHOLD" ]; then
            {
              echo "### Failed Pillars"
              echo ""
              python -c "
          import json
          r = json.load(open('scorecard-report.json'))
          for item in r['results']:
              if not item['passed']:
                  print(f'- [ ] Pillar #{item[\"id\"]}: **{item[\"name\"]}**')
          "
            } >> scorecard-summary.md
          fi

          # Set outputs
          {
            echo "score=${SCORE}"
            echo "total=${TOTAL}"
            echo "percentage=${PCT}"
            echo "threshold=${THRESHOLD}"
            echo "passed=$( [ "$SCORE" -ge "$THRESHOLD" ] && echo true || echo false )"
          } >> "$GITHUB_OUTPUT"

          # Post PR comment if applicable
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMENT=$(cat scorecard-summary.md)
            # Use GitHub API to post comment
            if command -v gh &> /dev/null; then
              gh pr comment "${{ github.event.pull_request.number }}" \
                --body "$COMMENT" \
                --repo "${{ github.repository }}" || true
            fi
          fi

      - name: Update status check
        if: always()
        run: |
          SCORE=${{ steps.audit.outputs.score }}
          TOTAL=${{ steps.audit.outputs.total }}
          THRESHOLD=${{ steps.audit.outputs.threshold }}
          PASSED=${{ steps.audit.outputs.passed }}

          if [ "$PASSED" = "true" ]; then
            echo "Scorecard: ${SCORE}/${TOTAL} - PASS (threshold: ${THRESHOLD})"
          else
            echo "Scorecard: ${SCORE}/${TOTAL} - FAIL (threshold: ${THRESHOLD})"
            exit 1
          fi

      - name: Upload scorecard report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-report
          path: |
            scorecard-report.json
            scorecard-summary.md

      - name: Check score threshold
        if: steps.audit.outputs.passed != 'true'
        run: |
          echo "::error::Score ${{ steps.audit.outputs.score }}/${{ steps.audit.outputs.total }} is below threshold ${{ steps.audit.outputs.threshold }}"
          exit 1

  update-badge:
    needs: scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Update scorecard badge
        run: |
          SCORE=${{ needs.scorecard.outputs.score }}
          TOTAL=${{ needs.scorecard.outputs.total }}
          PCT=${{ needs.scorecard.outputs.percentage }}

          # Generate badge SVG
          if [ "${{ needs.scorecard.outputs.passed }}" = "true" ]; then
            COLOR="brightgreen"
          else
            COLOR="red"
          fi

          BADGE_URL="https://img.shields.io/badge/scorecard-${SCORE}%2F${TOTAL}%20(${PCT}%25)-${COLOR}"
          echo "Badge URL: ${BADGE_URL}"

          # Update README badge if it exists
          if [ -f "README.md" ]; then
            sed -i "s|!\[Scorecard\].*|[![Scorecard](${BADGE_URL})](https://github.com/${{ github.repository }}/actions)|g" README.md || true
          fi
