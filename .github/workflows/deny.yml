name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

      - name: Check bans
        run: cargo deny check bans

      - name: Check sources
        run: cargo deny check sources

  # ── Go module audit (if applicable) ────────────────────────────────
  go-audit:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 1.26 required to BUILD govulncheck: golang.org/x/vuln v1.8.0
          # declares `go >= 1.26.0`; the old 1.21 pin + GOTOOLCHAIN=local
          # made `go install` fail on cold runners (observed 2026-09-27).
          # cmd/* modules target go 1.21/1.22 and compile fine under 1.26.
          go-version: "1.26"
          cache: false

      - name: Install govulncheck
        # Pinned: @latest drifts independently of this toolchain pin and
        # silently breaks the install step when upstream bumps its go directive.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck (capprobe)
        working-directory: cmd/capprobe
        run: govulncheck ./... || true

      - name: Run govulncheck (checker)
        working-directory: cmd/checker
        run: govulncheck ./... || true

      - name: Run govulncheck (wire)
        working-directory: cmd/wire
        run: govulncheck ./... || true
