name: Quarterly Org Audit

on:
  schedule:
    # Run at 9am ET (14:00 UTC) on 1st of Jan, Apr, Jul, Oct
    - cron: '0 14 1 1,4,7,10 *'
  workflow_dispatch:
  # Federation entrypoint: the org-wide reusable-workflow federation can invoke
  # the quarterly audit on demand (e.g. an ad-hoc audit wave).
  #
  # This note used to read:
  #   uses: <REDACTED>/phenotype-org-audits/.github/workflows/quarterly-audit.yml@main
  # The 2026-09-16 PII sweep replaced the org name with the literal `<REDACTED>`.
  # The original target was KooshaPari/phenotype-org-audits, and that repository
  # no longer exists (only `phenotype-org-audits-wtrees` and
  # `zz-archive-phenotype-org-audits-wtrees` survive, which are worktree archives,
  # not the repository). So there is nothing to call from here today. `workflow_call`
  # is kept because callers inside this repository can still use it.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout phenotype-org-audits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout phenotype-tooling (aggregator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: <REDACTED>/phenotype-tooling
          path: ./phenotype-tooling

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Build aggregator
        run: |
          cd ./phenotype-tooling
          cargo build --release --bin aggregator

      - name: Generate audit snapshot
        run: |
          cd audits/org-audits
          # The aggregator scans the current directory for .md audit reports
          # and generates INDEX.md + SYSTEMIC_ISSUES.md
          "$GITHUB_WORKSPACE/phenotype-tooling/target/release/aggregator" \
            || echo "Aggregator run completed with warnings"

          # Validate outputs
          if [ ! -f "INDEX.md" ]; then
            echo "ERROR: INDEX.md not generated" >&2
            exit 1
          fi

      - name: Set audit date and branch name
        id: audit-meta
        run: |
          AUDIT_DATE="$(date +%Y-%m-%d)"
          echo "date=${AUDIT_DATE}" >> "$GITHUB_OUTPUT"
          echo "branch=audit/quarterly-${AUDIT_DATE}" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          commit-message: |
            audit(quarterly): snapshot as of ${{ steps.audit-meta.outputs.date }}

            Automated quarterly organization audit capturing:
            - LOC trends across all active repos
            - Systemic issues and governance gaps
            - Test traceability and FR scaffolding
            - Dependency alignment status
          branch: ${{ steps.audit-meta.outputs.branch }}
          title: 'audit(quarterly): snapshot as of ${{ steps.audit-meta.outputs.date }}'
          body: |
            # Quarterly Org Audit - ${{ steps.audit-meta.outputs.date }}

            Automated snapshot of organization-wide metrics.

            See `audits/org-audits/INDEX.md` for full details.

            - [ ] Review SYSTEMIC_ISSUES.md for blocking items
            - [ ] Update AgilePlus with governance gaps
            - [ ] Schedule dependency alignment wave if needed
          labels: audit, quarterly
          delete-branch: true
