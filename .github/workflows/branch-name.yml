name: Branch Name

on:
  push:
    branches-ignore:
      - "wip/**"
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming convention
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          branch="${HEAD_REF:-$REF_NAME}"
          echo "Event: $EVENT_NAME"
          echo "Branch: $branch"

          valid_pattern='^(main|master|specs/main|dependabot/.+|snyk-fix/[0-9]+|mergify/[a-z0-9][a-z0-9._-]*|((feat|fix|docs|refactor|chore|test|ci|perf|release|hotfix|stack|layer)/[a-z0-9][a-z0-9._-]*|specs/(agent|recovery)-[a-z0-9][a-z0-9._-]*))$'

          if [[ ! "$branch" =~ $valid_pattern ]]; then
            echo "ERROR: Branch name does not follow the repository convention."
            echo
            echo "Allowed examples:"
            echo "  feat/add-agent-retry-logic"
            echo "  fix/issue-description"
            echo "  docs/topic"
            echo "  refactor/component"
            echo "  chore/update-ci"
            echo "  specs/agent-phenosdk-decomposer-fr001"
            echo
            echo "Use lowercase letters, numbers, dots, underscores, and hyphens after the prefix."
            exit 1
          fi

          echo "Branch name is valid."
