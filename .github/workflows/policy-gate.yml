name: Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy-gate:
    name: policy-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Enforce layered fix PR policy
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          echo "HEAD_REF=$HEAD_REF"
          echo "BASE_REF=$BASE_REF"
          echo "PR_HEAD_SHA=$PR_HEAD_SHA"
          echo "PR_LABELS=$PR_LABELS"

          if ! command -v jq >/dev/null; then echo "ERROR: jq is required for exact label matching but was not found on the runner."; exit 1; fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' <<< "$PR_LABELS" >/dev/null; then
            echo "ERROR: PR_LABELS must be a JSON array of strings."
            exit 1
          fi

          if [[ "$HEAD_REF" == fix/* ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" == "master" ]]; then
              if ! jq -e 'index("layered-pr-exception")' <<< "$PR_LABELS" >/dev/null; then
                echo "ERROR: fix/* PRs must target a layered branch, not main/master."
                echo "Use stack/*, layer/*, release/*, or add label layered-pr-exception."
                exit 1
              fi
            fi
          fi

          if ! git fetch origin "$BASE_REF"; then
            echo "ERROR: base-ref fetch failed: $BASE_REF"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then
            echo "ERROR: base-ref resolution failed: origin/$BASE_REF"
            exit 1
          fi
          if ! MERGE_BASE=$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA"); then
            echo "ERROR: merge-base discovery failed."
            exit 1
          fi
          if ! MERGES=$(git rev-list --merges "$MERGE_BASE..$PR_HEAD_SHA"); then
            echo "ERROR: rev-list failed."
            exit 1
          fi
          if [[ -n "$MERGES" ]]; then
            echo "ERROR: merge commits detected in PR diff range:"
            echo "$MERGES"
            exit 1
          fi

          echo "Policy gate passed."
