# crates-index-regen.yml — drift gate for crates/README.md
#
# crates/README.md is generated by `scripts/gen-crates-readme.py` from the
# workspace manifests. It has already drifted once: the index was regenerated
# from a branch whose base predated a crate being promoted to a workspace
# member, so a publishable crate was silently absent after the merge.
#
# This job renders the index in memory (`--check`) and fails when the committed
# file disagrees with the manifests. Nothing is written, so a red job means
# "run the generator and commit the result", never "CI edited my tree".
#
# Triggers: any manifest change, the generator, the index itself, or a manual
# dispatch. Cheap: Ubuntu + setup-python, no Rust toolchain, no build.
name: crates-index-regen

on:
  pull_request:
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - crates/README.md
      - scripts/gen-crates-readme.py
      - .github/workflows/crates-index-regen.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - "**/Cargo.toml"
      - crates/README.md
      - scripts/gen-crates-readme.py
      - .github/workflows/crates-index-regen.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-check:
    name: gen-crates-readme --check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: gen-crates-readme --check
        # Exits 1 when crates/README.md is stale relative to the manifests.
        run: python3 scripts/gen-crates-readme.py --check

      - name: summary
        if: always()
        run: |
          {
            echo "### crates-index-regen summary"
            echo "- commit: ${{ github.sha }}"
            echo "- event:  ${{ github.event_name }}"
            echo "- result: ${{ job.status }}"
            echo ""
            echo "To regenerate locally:"
            echo '```'
            echo "python3 scripts/gen-crates-readme.py"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
