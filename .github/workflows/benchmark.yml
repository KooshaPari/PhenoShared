name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "benches/**"
      - "bench/**"
      - "benchmarks/**"
      - "crates/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Cargo Bench ──────────────────────────────────────────────────────
  benchmark:
    name: Cargo Bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for benches directory
        id: check-benches
        run: |
          if [ -d "rust/benches" ] || [ -d "benches" ]; then
            echo "has-benches=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-benches=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run benchmarks
        if: steps.check-benches.outputs.has-benches == 'true'
        run: cargo bench --all --no-run --locked
        continue-on-error: true
      - name: Store benchmark results
        if: steps.check-benches.outputs.has-benches == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1
        with:
          tool: 'cargo'
          output-file-path: target/criterion/output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
        continue-on-error: true
