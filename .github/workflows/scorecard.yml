# =============================================================================
# OpenSSF Scorecard — Automated security best practices check
# =============================================================================
# Runs weekly + on main to track supply chain security posture
# Free for public repos, adds security badge
# =============================================================================

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '25 4 * * 1'  # Weekly Monday 4:25 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results below signs the SARIF with sigstore using the runner's
    # OIDC identity. With only read-all there is no OIDC token to sign with, so
    # sigstore falls back to an interactive device flow, which in CI prints a
    # consent prompt nobody can answer and then fails:
    #
    #   By typing 'y', you attest that ...
    #   Non-interactive mode detected, using device flow.
    #
    # These are the permissions the action documents for publishing; upload of
    # the SARIF additionally needs security-events: write.
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v3
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
