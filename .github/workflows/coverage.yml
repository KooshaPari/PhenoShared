name: Coverage Gate (Tier-2)

on:
  push:
    # main only. PR branches are covered by the pull_request trigger below.
    #
    # This used to list `fix/**, feat/**, chore/**` as well, which made BOTH
    # triggers fire for every PR branch - so the whole-workspace coverage build
    # ran TWICE per PR. The two runs also did not cancel each other, because the
    # concurrency group is keyed on `github.ref` (refs/heads/<branch> for a push
    # vs refs/pull/<n>/merge for a pull_request).
    #
    # The doubled load saturated the hosted-runner queue: on 2026-11-08 three
    # coverage runs sat `queued` for over 40 minutes while the required
    # "Root workspace coverage" check stayed pending on every open PR.
    #
    # NOTE: this only takes effect for a branch once this change is on `main`.
    # A push event evaluates the workflow file at the BRANCH's own HEAD, so
    # until this lands, every other branch still carries the duplicated push
    # trigger and still runs the whole-workspace build twice.
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------------
  # Membership guard: every workspace member must be measured by exactly one
  # coverage group, or explicitly excused in .coverage-baselines/membership.toml.
  #
  # WHY THIS IS NEEDED
  #   `coverage_report.py filter` narrows each group's tarpaulin report to the
  #   package directories that group owns and DROPS every other file. A member
  #   that no group owns therefore contributes nothing to any report: its
  #   source is silently discarded and it is measured by nothing at all. The
  #   aggregate job cannot detect that - it only sums the reports it is given.
  #   `cmd_filter` only checks that a LISTED package exists; nothing checked
  #   that a MEMBER was listed.
  #
  #   This job compares `cargo metadata --no-deps` (the source of truth for
  #   what is a member) against the `packages:` lists of the matrix below and
  #   against the ledger, and fails with the name of every unaccounted member.
  #   It compiles nothing, so it reports in seconds instead of after the ten
  #   group jobs. The aggregate job refuses to pass when this job fails, so
  #   the guard cannot be bypassed.
  #
  #   Run it locally with:
  #     python3 .github/scripts/coverage_membership.py --root .
  coverage-membership:
    name: Coverage membership (every workspace member accounted for)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The check reads the workspace membership, so it needs a cargo that can
      # parse every manifest. The pin matches rust-toolchain.toml (E1.1/E1.2).
      #
      # The components are declared explicitly, as quality-gate.yml does. Rustup
      # otherwise installs rust-toolchain.toml's components lazily on the first
      # cargo invocation, and that lazy path dies on the hosted image with
      # "failed to install component: 'rustfmt-preview...', detected conflict:
      # 'bin/cargo-fmt'". The failure surfaced as "cargo metadata failed", so a
      # job that only needs to read manifests failed closed on a shim collision.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # The check parses .github/workflows/coverage.yml to read the group
      # package lists, so it needs a YAML reader.
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Verify every workspace member is measured or excused
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_membership.py --root "$GITHUB_WORKSPACE"
      - name: Unit tests for the membership check
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest pytest-cov
          python -m pytest tests/test_coverage_membership.py -v

  # ------------------------------------------------------------------------
  # Root workspace coverage, split by crate group.
  #
  # WHY THIS IS A MATRIX AND NOT ONE JOB
  #   The single whole-workspace `cargo tarpaulin --workspace` run took 35-84
  #   minutes (run 42458885211: the gate step alone was 84 minutes). A
  #   regression anywhere therefore surfaced only after the whole workspace had
  #   been instrumented, built and tested, and the required check sat pending on
  #   every open PR meanwhile. Splitting by crate family means each group
  #   compiles and tests only its own dependency subgraph, so the slowest group
  #   - not the sum of all of them - sets the wall clock, and a regression in
  #   one family reports on that family's job while the others are still
  #   running.
  #
  # GROUPING RULES
  #   Groups are crate FAMILIES, listed explicitly below, not computed by a
  #   script: a script that silently re-buckets crates is how a crate falls out
  #   of the gate without anyone noticing. The `packages:` list of each matrix
  #   entry is the complete, explicit membership. Two guards keep it honest:
  #     * `coverage_report.py filter` fails if a listed package does not exist.
  #     * the aggregate job fails if the set of groups measured does not match
  #       the set of groups in .coverage-baselines/root-workspace.toml.
  #   When you add a workspace member, add it to a group AND to the packages
  #   list in the same commit; `cargo metadata --no-deps` is the source of truth
  #   for what is a member.
  #
  # WHAT EACH JOB ENFORCES
  #   Each group is compared against ITS OWN committed floor in
  #   .coverage-baselines/root-workspace.toml inside its own job, so the
  #   regression is attributed to a family and fails fast. The aggregate job is
  #   a separate, cheap (~1 minute, no compilation) job that merges the group
  #   reports and enforces the aggregate floor.
  #
  # DENOMINATOR
  #   tarpaulin builds its denominator by walking the repository for `*.rs`
  #   rather than by asking what the build compiled, so a single-package run
  #   still reports every source file in the tree. `coverage_report.py filter`
  #   narrows each report to the group's own package directories, which is what
  #   makes the per-group numbers add up to the aggregate without double
  #   counting. This also removes the measurement artifacts the old gate had to
  #   exclude by hand: `docs/**` (archived source snapshots, no crate is built
  #   from them), and the non-member trees under `agileplus/`, `hexa-kit/`,
  #   `gateway/`, `infrakit/`, `absorption/`, `archives/` and `_archived/`,
  #   which `--workspace` never builds. `--exclude-files 'docs/**'` is kept so
  #   the intermediate reports stay small.
  coverage-root-group:
    name: Root coverage group — ${{ matrix.group }}
    runs-on: ubuntu-24.04
    # A bound, not a target: the largest group (runtime-hosts / pheno-core)
    # built cold in well under the whole-workspace job, and this leaves room for
    # a cold rust-cache restore. GitHub's default 360-minute ceiling let one
    # stalled run hold a runner for hours (2026-11-08).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- crate families, with the family's full package list ----------
          - group: substrate
            packages: 'nexus substrate substrate-a2a substrate-app substrate-browser substrate-browser-broker substrate-browser-cdp substrate-browser-mcp substrate-browser-provider substrate-core substrate-dag substrate-memory substrate-schedule substrate-serve-lock substrate-skills substrate-trace substrate-tui'
          - group: sharecli-core
            packages: 'sharecli sharecli-core sharecli-ffi sharecli-ipc sharecli-mesh sharecli-session sharecli-sync'
          - group: sharecli-surface
            packages: 'sharecli-fleet sharecli-fuse sharecli-thermal-tui sharecli-tray-linux sharecli-tray-windows'
          - group: fabric
            packages: 'fabric-capture fabric-capability fabric-capability-ffi fabric-checker fabric-cli fabric-daemon fabric-frame-transport fabric-full-demo fabric-graph fabric-graph-cli fabric-gui fabric-integration-tests fabric-orchestrator fabric-persist fabric-research-ledger fabric-surface-mojo fabric-terminal fabric-tray fabric-tui fabric-web fabric-workspace'
          - group: device-media
            packages: 'eyetracker-camera eyetracker-cli eyetracker-core eyetracker-domain eyetracker-ffi eyetracker-inference eyetracker-math nvms-ffi nvms-manifest phenotype-gfx phenotype-voxel pine-compat pine-core pine-loader pine-nvms pine-syscall'
          - group: runtime-hosts
            packages: 'bench-guard eidolon-core eidolon-desktop eidolon-mobile eidolon-sandbox file-watcher klipdot-capture perfharness phinbox runtime-process sidekick-messaging spawn-core-sys store-file store-sqlite supervisor temporal-grounding transport-file wave wave-3lane-tests worktree-manager'
          - group: agileplus
            packages: 'agileplus-cache agileplus-domain agileplus-error-core agileplus-events agileplus-git agileplus-github agileplus-graph agileplus-import agileplus-nats agileplus-triage'
          - group: focus
            packages: 'focus-always-on focus-asset-fetcher focus-audit focus-calendar focus-ci-watcher focus-coaching focus-crypto focus-domain focus-entitlements focus-events focus-icon-gen focus-mascot focus-observability focus-penalties focus-planning focus-policy focus-release-bot focus-rewards focus-rituals focus-rules focus-scheduler focus-sync-store focus-templates focus-time focus-ui'
          - group: pheno-core
            packages: 'acceptance-contract arch-test audit-privacy basic clap-ext commit-msg-check config-schema configra-ops datakit doc-link-check docs-health fr-coverage fr-trace fuzz-setup legacy-scan logkit mcp-server orchestrator pheno-cache-adapter pheno-compose-driver pheno-config pheno-context pheno-crypto pheno-errors pheno-flags pheno-forge-scaffold pheno-forge-smoke pheno-fs pheno-i18n pheno-net pheno-otel pheno-runtime-config pheno-schema-port pheno-shell pheno-testing pheno-tracing pheno-vcs-core phenocompose-agentctl phenocompose-apple-container-adapter phenocompose-cli phenocompose-plugin-api phenocompose-plugin-sample phenocompose-port-composer phenocompose-port-di phenocompose-port-publisher phenocompose-port-runtime phenocompose-port-secret phenocompose-port-types phenocompose-secret-file-adapter phenocompose-wslc-adapter phenotype-async-traits phenotype-cache-adapter phenotype-casbin-wrapper phenotype-config phenotype-config-core phenotype-contract phenotype-contracts phenotype-cost-core phenotype-crypto phenotype-diff phenotype-error-core phenotype-error-macros phenotype-errors phenotype-event-bus phenotype-flags phenotype-git-core phenotype-health phenotype-http-client-core phenotype-iter phenotype-journey-core phenotype-journeys-observability phenotype-logging phenotype-macros phenotype-mcp phenotype-nvms-adapter phenotype-observability phenotype-observably-macros phenotype-policy-engine phenotype-port-interfaces phenotype-port-traits phenotype-ports-canonical phenotype-process phenotype-project-registry phenotype-rate-limit phenotype-resilience phenotype-retry phenotype-router phenotype-router-monitor phenotype-service-registry phenotype-shared-config phenotype-state-machine phenotype-string phenotype-telemetry phenotype-test-infra phenotype-time phenotype-tooling-observability phenotype-validation phenovcs-observability qgate release-cut trace-gate traceability-core traceability-decorators'
          - group: integrations
            packages: 'agent-forecast airlock-v2 anthropic-usage-poll bifrost-routing cliproxy-adapter cloud-codex cloud-cursor cloud-dispatch-conformance cloud-kilo context-budget dag-scheduler dispatch-bridge driver-argv driver-cli driver-http driver-mcp engine-a2a engine-agentapi engine-claude engine-codex engine-conformance engine-forge engine-spec fake-codex-cloud fake-forge llm-router omniroute-adapter routing-phenotype-router teamcomm-cli teamcomm-client teamcomm-daemon teamcomm-mcp teamcomm-protocol teamcomm-smoke'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Restore only, never save: ten groups saving the same cache key would
      # evict each other and cost ten uploads of a multi-GB target directory.
      # `shared-key` lets all ten restore the same archive, so a warm cache is
      # paid for once per workflow, not once per group.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: coverage-root
          save-if: false

      # The workspace links against the gtk-rs stack, so glib-sys needs
      # glib-2.0.pc at build time. Without these the build fails with
      # "The system library `glib-2.0` required by crate `glib-sys` was not
      # found", which meant the gate never actually measured anything.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev

      # One shared, pinned, checksum-verified implementation. The old inline
      # `sudo snap install zig` hung with no output and no job timeout on
      # ubuntu-24.04 (run 42444352321), so do not reintroduce it.
      - uses: ./.github/actions/setup-zig

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # No `--fail-under 37` here on purpose. This step only MEASURES; the
      # floors that fail the build are the per-group values and
      # `aggregate_floor = 53.80` in `.coverage-baselines/root-workspace.toml`,
      # enforced by `coverage_report.py aggregate` in the `coverage-root` job.
      # The `>=37%` in that job's display name is a frozen branch-protection
      # label, not the enforced number (see the floor history in the baseline
      # file). Two places to change a threshold is one too many, and the
      # baseline file is the one a reviewer can diff.
      #
      # `--fail-under 0` is NOT a no-op: the repo-root tarpaulin.toml sets
      # `fail-under = 37`, which tarpaulin applies to every run unless the CLI
      # overrides it. Without the override a group holding 3% of the workspace
      # exits "4.30% < 37.00%" before it ever writes a report (observed on a
      # standalone run of the agileplus group on 2026-11-09). Passing 0 keeps
      # the config's `timeout = "180s"`, which exists because a 60s default
      # kills crates/sharecli/tests/fr007_proc_pid_watch.rs mid-run.
      - name: Measure ${{ matrix.group }} coverage
        run: |
          set -euo pipefail
          mkdir -p "target/cov/${{ matrix.group }}"
          packages=()
          for p in ${{ matrix.packages }}; do packages+=(-p "$p"); done
          cargo tarpaulin \
            --manifest-path Cargo.toml \
            "${packages[@]}" \
            --fail-under 0 \
            --exclude-files 'docs/**' \
            --out Json --out Xml \
            --engine llvm \
            --target-dir target \
            --skip-clean \
            --timeout 300 \
            --output-dir "target/cov/${{ matrix.group }}"

      - name: Narrow the report to this group's crates
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_report.py \
            --root "$GITHUB_WORKSPACE" \
            filter \
            --group "${{ matrix.group }}" \
            --packages "${{ matrix.packages }}" \
            --report "target/cov/${{ matrix.group }}/tarpaulin-report.json" \
            --out "coverage-group-${{ matrix.group }}.json"

      # The fast, attributable signal: this family regressed, and it is reported
      # against this family's own floor while the other groups are still
      # running.
      - name: Enforce the committed floor for ${{ matrix.group }}
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_report.py \
            verify \
            --report-file "coverage-group-${{ matrix.group }}.json" \
            --baseline .coverage-baselines/root-workspace.toml \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.group }} coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-group-${{ matrix.group }}
          path: |
            coverage-group-${{ matrix.group }}.json
            target/cov/${{ matrix.group }}/cobertura.xml
          if-no-files-found: warn

  # ------------------------------------------------------------------------
  # The required branch-protection check.
  #
  # NAME IS LOAD-BEARING: branch protection on `main` requires the literal
  # context string
  #
  #     Root workspace coverage (whole workspace — ≥37%)
  #
  # (em dash U+2014, and U+2265 GREATER-THAN OR EQUAL TO — not ">="). Verified
  # against the live API on 2026-11-09:
  #   gh api repos/KooshaPari/PhenoShared/branches/main/protection \
  #     --jq '.required_status_checks.contexts'
  #   -> ["Root workspace coverage (whole workspace — ≥37%)",
  #       "IAC workspace coverage (service — ≥10%)"]
  #
  # DO NOT RENAME THIS JOB. A renamed job leaves branch protection waiting for
  # a context no run produces, which blocks every PR. The "≥37%" inside the
  # name is therefore a frozen label kept for compatibility, NOT the enforced
  # number; the enforced number is `aggregate_floor` in
  # .coverage-baselines/root-workspace.toml and it is printed in this job's
  # summary on every run.
  #
  # FLOOR HISTORY, because a floor is only honest if its provenance is readable:
  #   * 37 was aspirational. It came from a 37.54% measurement of a smaller
  #     workspace; the workspace then grew past it and the gate went red on
  #     main, which blocked every PR.
  #   * The last whole-workspace measurement on the current instrument was
  #     37,802/98,759 = 38.28% (run 42605873709), but 98,759 included 29,766
  #     coverable lines from trees `--workspace` never builds (agileplus/,
  #     hexa-kit/, gateway/, infrakit/, absorption/, archives/, _archived/).
  #   * This job's denominator counts only files owned by a workspace member:
  #     37,802/68,993 = 54.79% on the same instrumented data.
  #   * The committed aggregate floor is set from the per-group measurement
  #     recorded in .coverage-baselines/root-workspace.toml, rounded DOWN to a
  #     whole number. It is a ratchet, not a target: raise it only in a commit
  #     that also records the measurement which justifies the new floor.
  #
  # This job compiles nothing. It merges the ten group reports (each of which
  # already failed fast on its own floor) and enforces the aggregate.
  #
  # It also refuses to pass when the membership guard failed, so a workspace
  # member that no coverage group owns cannot slip through this required
  # context. The guard runs in its own job so it reports in seconds instead
  # of after the ten group jobs.
  coverage-root:
    name: Root workspace coverage (whole workspace — ≥37%)
    needs: [coverage-root-group, coverage-membership]
    # `always()`-style: if a group job dies, this job must still run so the
    # required check reports FAIL with a readable reason instead of being
    # skipped, which branch protection also treats as not-passed but would show
    # with no explanation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse to pass when the membership guard did not pass
        if: ${{ needs.coverage-membership.result != 'success' }}
        run: |
          set -euo pipefail
          echo "::error::the coverage membership guard did not pass; see the 'Coverage membership' job for the unaccounted workspace members"
          exit 1

      - name: Download the per-group coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-group-*
          path: coverage-groups
          merge-multiple: true

      - name: Enforce the aggregate and per-group floors
        run: |
          set -euo pipefail
          python3 .github/scripts/coverage_report.py \
            aggregate \
            --dir coverage-groups \
            --baseline .coverage-baselines/root-workspace.toml \
            --summary "$GITHUB_STEP_SUMMARY"

  coverage-iac:
    # The display name states the ENFORCED floor, not an aspiration. This job
    # previously claimed ">=60%" while actually running --fail-under 10, so a
    # reader could not tell what was really being gated. The 60% figure is a
    # target, tracked in docs/sessions/2026-10-30-closure-dag/PLAN.md; raise
    # the number here only when the measured coverage actually supports it.
    name: IAC workspace coverage (service — ≥10%)
    runs-on: ubuntu-24.04
    # Bounds a hung step; GitHub's default 360-minute ceiling let one stalled
    # run hold a runner for hours. The iac workspace is far smaller than the
    # root one, so it needs much less headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: iac -> target

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage gate (iac workspace)
        run: |
          cargo tarpaulin \
            --manifest-path iac/Cargo.toml \
            --workspace \
            --fail-under 10 \
            --out Xml --out Json \
            --engine llvm \
            --target-dir iac/target

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-iac-report
          path: iac/target/tarpaulin-report/
