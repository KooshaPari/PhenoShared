name: Coverage Gate (Tier-2)

on:
  push:
    # main only. PR branches are covered by the pull_request trigger below.
    #
    # This used to list `fix/**, feat/**, chore/**` as well, which made BOTH
    # triggers fire for every PR branch - so the whole-workspace coverage build
    # ran TWICE per PR. The two runs also did not cancel each other, because the
    # concurrency group is keyed on `github.ref` (refs/heads/<branch> for a push
    # vs refs/pull/<n>/merge for a pull_request).
    #
    # The doubled load saturated the hosted-runner queue: on 2026-11-08 three
    # coverage runs sat `queued` for over 40 minutes while the required
    # "Root workspace coverage" check stayed pending on every open PR.
    #
    # NOTE: this only takes effect for a branch once this change is on `main`.
    # A push event evaluates the workflow file at the BRANCH's own HEAD, so
    # until this lands, every other branch still carries the duplicated push
    # trigger and still runs the whole-workspace build twice.
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage-root:
    # The display name states the ENFORCED floor, not an aspiration (same
    # convention as coverage-iac below). ADR-040 named per-tier floors of
    # 71%/70%, but the crates it named — nanovms-core, nvms-ffi,
    # pheno-compose-driver — no longer exist after the substrate repoint, so no
    # tier definition survives. What actually runs is a single whole-workspace
    # average over ~200 crates, including UI/gfx crates and fake-harness
    # binaries with no tests, which measured 37.54%. That number is the floor:
    # treat it as a ratchet and raise it deliberately, per tier, once the tiers
    # are redefined. Re-enabling 71% here without a package list does not
    # measure lib quality, it just keeps the gate permanently red.
    name: Root workspace coverage (whole workspace — ≥37%)
    runs-on: ubuntu-24.04
    # Bounds a hung step. GitHub's default is 360 minutes, so one stalled
    # coverage run held a runner for up to six hours while every other
    # coverage run queued behind it and the required check stayed pending on
    # every open PR (observed 2026-11-08).
    #
    # The bound must sit ABOVE the legitimate duration of the step, or it
    # fails the gate that exists to measure quality. Measured on run
    # 42458885211: the `Run coverage gate (root workspace)` step took 84
    # minutes (08:43:11 -> 10:07:38); the report upload after it took 3
    # seconds and the post-job cache save 49 seconds. A 60-minute bound was
    # therefore killing this job mid-measurement - run 42461336059 shows the
    # step `cancelled` at exactly 58.5 minutes - which made the required
    # check fail 100% of the time.
    #
    # 150 minutes keeps a genuine hang bounded well under GitHub's 360-minute
    # default while leaving ~78% headroom over the observed 84-minute step.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Cache RESTORE only, no SAVE for this job. The coverage gate is a
      # measurement gate, not a build-cache gate: the target dir is large and
      # re-uploading it costs runner time for a cache that a later build can
      # restore anyway. Restoring keeps repeat runs fast; skipping the save
      # keeps the runner free.
      #
      # Measured on run 42458885211 the saving is modest, not dramatic: the
      # report upload after the gate took 3 seconds and the post-job cache
      # save 49 seconds. The real saving in this workflow comes from the
      # trigger de-duplication above, which halves the number of coverage runs
      # and therefore the queue each one waits in (that run sat queued for
      # 74 minutes before starting). This cache change is worth ~50 seconds
      # of runner time; it is not what was holding the queue.
      # iac keeps its save — its target dir is small.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-save: false

      # The workspace links against the gtk-rs stack, so glib-sys needs
      # glib-2.0.pc at build time. Without these the coverage build fails with
      # "The system library `glib-2.0` required by crate `glib-sys` was not
      # found", which meant this gate never actually measured anything.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev

      # Was an inline `sudo snap install zig ... || { curl fallback }`. On
      # ubuntu-24.04 the snap install HUNG with no output and no job timeout,
      # which stalled run 42444352321 for over an hour on the required
      # "Root workspace coverage" check and so blocked every open PR
      # (2026-11-08). One shared, pinned, checksum-verified implementation now.
      - uses: ./.github/actions/setup-zig

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # `--exclude-files 'docs/**'` is required because cargo-tarpaulin builds
      # its denominator by WALKING THE REPO ROOT for `*.rs` and running its AST
      # source analysis over every file it finds (`collect_tracemap` ->
      # `get_source_walker` in tarpaulin's `lib.rs`/`path_utils.rs`), not by
      # asking what the build actually compiled. Files found there that never
      # get linked still contribute "coverable" lines, all of them uncovered.
      #
      # `docs/` holds archived source snapshots kept as documentation — commit
      # 6e5fa283a (#761) added 198,954 lines of it, of which 4,809 lines across
      # 186 files were counted as coverable and 0 covered. `cargo metadata`
      # reports 0 packages under `docs/`, and no Cargo.toml references those
      # paths, so nothing under `docs/` is compiled by `--workspace`. Counting
      # it as untested product code is a measurement artifact, not real
      # uncovered code: without the exclusion the gate measured 36.43%
      # (37,685/103,434) and failed; with it, 38.21% (37,685/98,625) on the
      # same instrumented data.
      #
      # This is a PATH exclusion, not a crate exclusion. It cannot hide
      # untested production code because no crate is built out of `docs/`.
      # Wider paths are deliberately NOT excluded: the `archives/**` snapshots
      # still contribute 267 coverable lines, and they stay in the denominator.
      - name: Run coverage gate (root workspace)
        run: |
          cargo tarpaulin \
            --manifest-path Cargo.toml \
            --workspace \
            --exclude-files 'docs/**' \
            --fail-under 37 \
            --out Xml --out Json \
            --engine llvm \
            --target-dir target

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-root-report
          path: target/tarpaulin-report/

  coverage-iac:
    # The display name states the ENFORCED floor, not an aspiration. This job
    # previously claimed ">=60%" while actually running --fail-under 10, so a
    # reader could not tell what was really being gated. The 60% figure is a
    # target, tracked in docs/sessions/2026-10-30-closure-dag/PLAN.md; raise
    # the number here only when the measured coverage actually supports it.
    name: IAC workspace coverage (service — ≥10%)
    runs-on: ubuntu-24.04
    # Bounds a hung step; GitHub's default 360-minute ceiling let one stalled
    # run hold a runner for hours. The iac workspace is far smaller than the
    # root one, so it needs much less headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: iac -> target

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage gate (iac workspace)
        run: |
          cargo tarpaulin \
            --manifest-path iac/Cargo.toml \
            --workspace \
            --fail-under 10 \
            --out Xml --out Json \
            --engine llvm \
            --target-dir iac/target

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-iac-report
          path: iac/target/tarpaulin-report/
