name: Coverage Gate (Tier-2)

on:
  push:
    branches: [main, fix/**, feat/**, chore/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage-root:
    name: Root workspace coverage (lib/framework — ≥71%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # The workspace links against the gtk-rs stack, so glib-sys needs
      # glib-2.0.pc at build time. Without these the coverage build fails with
      # "The system library `glib-2.0` required by crate `glib-sys` was not
      # found", which meant this gate never actually measured anything.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage gate (root workspace)
        run: |
          cargo tarpaulin \
            --manifest-path Cargo.toml \
            --workspace \
            --fail-under 71 \
            --out Xml --out Json \
            --engine llvm \
            --target-dir target

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-root-report
          path: target/tarpaulin-report/

  coverage-iac:
    # The display name states the ENFORCED floor, not an aspiration. This job
    # previously claimed ">=60%" while actually running --fail-under 10, so a
    # reader could not tell what was really being gated. The 60% figure is a
    # target, tracked in docs/sessions/2026-10-30-closure-dag/PLAN.md; raise
    # the number here only when the measured coverage actually supports it.
    name: IAC workspace coverage (service — ≥10%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: iac -> target

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage gate (iac workspace)
        run: |
          cargo tarpaulin \
            --manifest-path iac/Cargo.toml \
            --workspace \
            --fail-under 10 \
            --out Xml --out Json \
            --engine llvm \
            --target-dir iac/target

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-iac-report
          path: iac/target/tarpaulin-report/
