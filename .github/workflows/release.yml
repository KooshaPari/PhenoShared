name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write   # for keyless cosign
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Build
        run: cargo build --release --locked
      - name: SBOM (CycloneDX)
        uses: CycloneDX/gh-cycldx-rust-action@v1
        with:
          args: --format json --output sbom.json
      - name: cosign sign-blob (keyless OIDC)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: |
          cosign sign-blob --yes \
            --output-signature sbom.sig \
            --output-certificate sbom.pem \
            sbom.json
      - name: SLSA L3 provenance
        uses: slsa-framework/slsa-github-generator@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          base64-subjects: ${{ needs.build.outputs.hashes }}
      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            sbom.json
            sbom.sig
            sbom.pem
          generate_release_notes: true
