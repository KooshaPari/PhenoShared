name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24"
          cache: true

      - name: Build Go static lib (libnvms_core.a)
        working-directory: crates/nanovms-core/bindings/go-c-export
        run: |
          go build -buildmode=c-archive -o ${{ github.workspace }}/target/libnvms_core.a .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true

      - name: Build all Rust crates
        run: cargo build --release --workspace --locked

      - name: Run Go tests
        working-directory: crates/nanovms-core
        run: go test -v ./...

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phenotype-infra-binaries
          path: |
            target/release/libpheno_compose_driver.*
            target/release/libnvms_ffi.*
            target/release/libpheno_config.*
