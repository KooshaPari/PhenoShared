name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.24"
          cache: true

      - name: Build Go static lib (libnvms_core.a)
        working-directory: crates/nanovms-core/bindings/go-c-export
        run: |
          go build -buildmode=c-archive -o ${{ github.workspace }}/target/libnvms_core.a .

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Build all Rust crates
        run: cargo build --release --workspace --locked

      - name: Run Go tests
        working-directory: crates/nanovms-core
        run: go test -v ./...

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phenotype-infra-binaries
          path: |
            target/release/libpheno_compose_driver.*
            target/release/libnvms_ffi.*
            target/release/libpheno_config.*
