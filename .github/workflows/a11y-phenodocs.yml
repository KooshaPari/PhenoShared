name: a11y (phenodocs)

# AT1 — VitePress docsite WCAG 2.1 AA gate.
# Calls the reusable a11y workflow defined at
# `<REDACTED>/OmniRoute-3rd/.github/workflows/reusable-a11y.yml`.

on:
  push:
    branches: [main, chore/**]
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - 'package.json'
      - 'tests/a11y/**'
      - 'axe-config.ts'
      - '.github/workflows/a11y-phenodocs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - 'package.json'
      - 'tests/a11y/**'
      - 'axe-config.ts'
      - '.github/workflows/a11y-phenodocs.yml'
  workflow_dispatch:

concurrency:
  group: a11y-phenodocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wcag:
    # Disabled: cross-repo `uses:` reference to
    # `<REDACTED>/OmniRoute-3rd/.github/workflows/reusable-a11y.yml@main`
    # was broken by the 2026-09-16 PII sweep (commit 3b6d8798) and the
    # target repo is now unreachable (HTTP 404). The job is preserved
    # as a noop so the workflow file remains syntactically valid;
    # restore the `uses:` (or vendor the workflow) when the upstream
    # becomes available again. See docs/audits/PII-SWEEP-DAMAGE.md.
    runs-on: ubuntu-latest
    steps:
      - name: disabled (cross-repo workflow target unreachable)
        run: echo "wcag job disabled; see jobs-level comment in this file"
