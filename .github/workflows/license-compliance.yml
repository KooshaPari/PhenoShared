name: License Compliance
on:
  push:
    paths:
      - "Cargo.toml"
      - "go.mod"
      - "package.json"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.1
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
        continue-on-error: true

  fossa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.1
      - name: Install FOSSA
        run: |
          curl -sSfL https://raw.githubusercontent.com/fossa-foss/fossa-cli/master/install.sh | sh
      - name: Run FOSSA
        run: fossa scan repository
        # Still advisory, and deliberately so: this job passes no FOSSA_API_KEY
        # and the repo configures no FOSSA secret, so `fossa scan repository`
        # cannot succeed here. Enforcing it would turn this workflow red on
        # every push and every nightly schedule. Enforce it once the
        # credential exists.
        continue-on-error: true
