name: License Compliance
on:
  push:
    paths:
      - "Cargo.toml"
      - "go.mod"
      - "package.json"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.1
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-deny
        run: cargo deny check
        # Enforced. Measured green on 2026-11-12: `cargo deny check` reported
        # "advisories ok, bans ok, licenses ok, sources ok" (exit 0). The
        # job-level gate is `ci / lint` in ci.yml, which now also classifies
        # cargo-deny as HARD.

  # FOSSA hosted scanning is intentionally NOT wired here.
  #
  # `fossa scan repository` requires a FOSSA_API_KEY, and this repository holds
  # none: its repo secrets are CARGO_REGISTRY_TOKEN and SONAR_TOKEN only, and it
  # has no repository variables (read 2026-11-12). The job used to carry a
  # `continue-on-error` directive, i.e. it reported green whatever happened,
  # which makes it not a gate at all. Keeping that bypass was the defect, so the
  # job is removed until the credential exists rather than left in place
  # pretending.
  #
  # Restore it in this strict form ONLY together with the credential, and with
  # no `continue-on-error`:
  #
  #   fossa:
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@<sha> # v4.1.1
  #       - name: Install FOSSA
  #         run: curl -sSfL https://raw.githubusercontent.com/fossa-foss/fossa-cli/master/install.sh | sh
  #       - name: Run FOSSA
  #         env:
  #           FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
  #         run: fossa scan repository
  #
  # The licence gate that does run is `cargo deny check` in the job above, which
  # is enforced and reports advisories/bans/licenses/sources verdicts directly.
