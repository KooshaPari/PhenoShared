name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment per ref at a time and cancel in-flight runs
# of this workflow on the same ref.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. The deploy job explicitly escalates to the
# minimal permissions GitHub Pages needs (id-token for OIDC, pages:write
# for the deployment itself).
permissions:
  contents: read

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      # The VitePress theme lives at the repository root (.vitepress/theme) but
      # the build runs with cwd=docs. Vite resolves a bare import by walking up
      # from the IMPORTING file, so `import 'vue'` inside
      # .vitepress/theme/components/*.vue looks in <repo>/node_modules and never
      # sees docs/node_modules. Installing only docs/ is therefore not enough,
      # and the build dies with:
      #   Rollup failed to resolve import "vue" from .../.vitepress/theme/...
      # bun populates the root node_modules the theme expects. The
      # root manifest uses the workspace: protocol, which npm cannot parse, so
      # this has to be bun.
      - name: Install root dependencies (theme needs vue at the repo root)
        run: bun install --frozen-lockfile

      - name: Install dependencies
        working-directory: docs
        run: npm install --legacy-peer-deps

      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
