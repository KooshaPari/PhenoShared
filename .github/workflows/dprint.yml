# Formatting gate for the file types dprint owns at the repo root: TOML and
# Dockerfile. Markdown is markdownlint's, Python is ruff's, and the JS/TS tree
# is prettier's / oxlint's -- dprint deliberately stays out of those so a
# fourth formatter never competes with the three already in place.
#
# The two file types are gated differently, on purpose:
#   Dockerfile -- repo-wide. There are 66 tracked Dockerfiles and all of them
#     are formatted, so every one of them is checked on every pull request.
#   TOML -- changed files only. 798 tracked TOML files still carry legacy
#     formatting, so a whole-repo TOML check would report debt that no pull
#     request introduced. The changed-files gate keeps new contributions
#     honest without failing on the backlog.
#
# See docs/dprint-scope.md for the measured debt numbers behind that split.
name: dprint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DPRINT_VERSION: 0.64.3

jobs:
  dprint:
    name: dprint (TOML + Dockerfile)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install pinned dprint
        run: |
          set -euo pipefail
          base_url="https://github.com/dprint/dprint/releases/download/${DPRINT_VERSION}"
          asset="dprint-x86_64-unknown-linux-gnu.zip"
          curl -fsSL -o "$asset" "${base_url}/${asset}"
          curl -fsSL -o SHASUMS256.txt "${base_url}/SHASUMS256.txt"
          grep " ${asset}\$" SHASUMS256.txt | sha256sum --check
          unzip -o -q "$asset" -d dprint-bin
          sudo install -m 0755 dprint-bin/dprint /usr/local/bin/dprint
          dprint --version

      - name: Check every tracked Dockerfile
        run: |
          set -euo pipefail
          git ls-files | grep -Ei '(^|/)Dockerfile' > dockerfiles.txt || true
          if [ ! -s dockerfiles.txt ]; then
            echo "No tracked Dockerfile files; skipping the repo-wide Dockerfile check."
            exit 0
          fi
          echo "Checking $(wc -l < dockerfiles.txt) tracked Dockerfile files:"
          cat dockerfiles.txt
          xargs -d '\n' -r dprint check --config dprint.json --allow-no-files < dockerfiles.txt

      - name: Resolve changed TOML files
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" > all-changed.txt
          grep -E '\.toml$' all-changed.txt > changed-files.txt || true
          if [ ! -s changed-files.txt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed TOML files; skipping dprint check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Checking:"
            cat changed-files.txt
          fi

      - name: Check formatting of changed TOML files
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          xargs -d '\n' -r dprint check --config dprint.json --allow-no-files < changed-files.txt
