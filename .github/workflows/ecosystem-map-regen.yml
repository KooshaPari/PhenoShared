# ecosystem-map-regen.yml — drift-gate for ECOSYSTEM_MAP.md
#
# Wires `scripts/regen-ecosystem-map.py --check` into the CI gate. Fails
# the PR / push if the on-disk ECOSYSTEM_MAP.md is stale relative to the
# SSOT inputs (SPEC.md, docs/registries.md, _bindings.json).
#
# Triggers:
#   - pull_request: any change to the regen script, the SSOT inputs, or
#     ECOSYSTEM_MAP.md itself
#   - push: post-merge sanity on main
#   - workflow_dispatch: manual re-run
#
# Companion workflow: `ecosystem-map-weekly.yml` (cron) auto-opens a
# remediation PR via peter-evans/create-pull-request@v6 when the gate
# fails on the weekly schedule.
name: ecosystem-map-regen

on:
  pull_request:
    paths:
      - "ECOSYSTEM_MAP.md"
      - "SPEC.md"
      - "docs/registries.md"
      - "scripts/regen-ecosystem-map.py"
      - "Taskfile.yml"
      - ".github/workflows/ecosystem-map-regen.yml"
  push:
    branches: [main]
    paths:
      - "ECOSYSTEM_MAP.md"
      - "SPEC.md"
      - "docs/registries.md"
      - "scripts/regen-ecosystem-map.py"
      - "Taskfile.yml"
      - ".github/workflows/ecosystem-map-regen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regen-check:
    name: regen-ecosystem-map --check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: checkout sibling phenotype-registry-curation-data
        # The regen script reads the sibling repo's `_bindings.json` by
        # default. We check it out under a stable relative path so the
        # script's default-lookup heuristic works without flags.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: <REDACTED>/phenotype-registry-curation-data
          # Must live INSIDE GITHUB_WORKSPACE: actions/checkout refuses a
          # path outside it ("is not under /home/runner/work/...").
          path: .ci-sibling/phenotype-registry-curation-data
          fetch-depth: 1
          # Curation-data is an unfiltered mirror; only the bindings file
          # is read by the regen script, so plain credentials are fine.
          persist-credentials: false

      - name: regen-ecosystem-map --check
        # Exits 1 on drift. The job fails on non-zero, which is the
        # desired gate behaviour.
        run: >-
          python3 scripts/regen-ecosystem-map.py --check
          --bindings .ci-sibling/phenotype-registry-curation-data/_bindings.json

      - name: summary
        if: always()
        run: |
          {
            echo "### ecosystem-map-regen summary"
            echo "- commit: ${{ github.sha }}"
            echo "- event:  ${{ github.event_name }}"
            echo "- result: ${{ job.status }}"
            echo ""
            echo "To re-run locally:"
            echo '```'
            echo "task regen-ecosystem-map:check"
            echo "# or"
            echo "python3 scripts/regen-ecosystem-map.py --check"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
