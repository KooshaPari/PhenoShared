name: Dependency Vulnerability Scan
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1" # weekly Monday
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - "**/uv.lock"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run OSV Scanner (npm)
        id: osv
        # Advisory scan: findings and scanner failures must not block CI.
        #
        # Uses the CLI, not google/osv-scanner-action. That repository's root is
        # NOT an action: at v2.4.0, v2.5.1, v2.6.0 and v2.7.0 its action.yml has
        # no `runs:` section, so `uses: google/osv-scanner-action@<sha>` fails at
        # setup with "Top level 'runs:' section is required". v2 is consumed as a
        # reusable workflow, which cannot be used as a step. The previously
        # pinned SHA (v2.0.0) no longer resolves at all.
        continue-on-error: true
        run: |
          set -uo pipefail
          OSV_VERSION=v2.7.0
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
          osv-scanner --lockfile=bun.lock --format=sarif --output=osv-results.sarif

      - name: Report OSV warning
        if: ${{ !cancelled() && steps.osv.outcome == 'failure' }}
        run: echo "::warning::OSV reported vulnerabilities or failed to scan. Review the scanner logs and SARIF results."

      - name: Upload OSV SARIF
        if: ${{ !cancelled() && hashFiles('osv-results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
