name: Setup Zig (pinned, no snap)
description: >
  Installs the Zig release the workspace build actually requires, at a pinned
  version, without going through snap.

  WHY THIS EXISTS AS AN ACTION
  The `crates/spawn-core-sys` build script shells out to `zig build` to produce
  `crates/spawn-core/zig-out/lib/libspawn_core.a` and links it, so zig is a
  build-time requirement of the root workspace, not an optional tool.

  The previous approach inlined `sudo snap install zig --classic
  --channel=latest/stable || { ...curl fallback... }` in every job that needed
  it. That failed in two distinct ways:

    1. The snap succeeded somewhere else and silently bypassed the
       checksum-verified download, so the version was whatever snap had today.
    2. Worse, on ubuntu-24.04 the snap install HUNG with no output at all. The
       root coverage job sat on that step for over an hour with no job timeout,
       which blocked the required "Root workspace coverage" check and therefore
       blocked every open PR (observed 2026-11-08, run 42444352321).

  One action, one implementation, one place to get it right.

  The archive is pinned and SHA-256 checked, and the installed version is then
  asserted to equal the pin, so an unexpected version fails loudly instead of
  drifting into the build.

inputs:
  version:
    description: >
      Zig version to install. The checksum below is for 0.15.2 specifically;
      changing this input requires updating the checksum to match.
    required: false
    default: "0.15.2"

runs:
  using: composite
  steps:
    - name: Install Zig ${{ inputs.version }}
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.version }}
        ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"
      run: |
        set -euo pipefail

        curl --fail --location --retry 5 --retry-connrefused \
          --silent --show-error \
          "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
          -o /tmp/zig.tar.xz

        echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check --status
        sudo tar -xf /tmp/zig.tar.xz -C /usr/local/bin --strip-components=1
        rm -f /tmp/zig.tar.xz

        INSTALLED="$(zig version)"
        echo "zig version: ${INSTALLED} (pinned ${ZIG_VERSION})"
        if [ "${INSTALLED}" != "${ZIG_VERSION}" ]; then
          echo "::error::zig ${INSTALLED} does not match the pinned ${ZIG_VERSION}"
          exit 1
        fi
