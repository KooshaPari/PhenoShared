# Taplo formatting for this repository's TOML files.
#
# Why this file exists:
#   Two formatters own TOML here and their defaults disagree. dprint
#   (dprint.json: "toml" -> indentWidth 4, lineWidth 120, run by the
#   "dprint (TOML + Dockerfile)" check) and taplo (run by trunk as its TOML
#   formatter, whose upstream default is a 2-space indent and an 80-column
#   wrap). Taplo does not read .editorconfig, so without this file trunk would
#   re-indent every TOML file to 2 spaces and dprint would immediately re-indent
#   it back to 4, and no single byte sequence could satisfy both checks.
#
# What it pins:
#   The numbers below are not new preferences. They restate what this repo
#   already declares: .editorconfig says `[*.{rs,toml}] indent_size = 4`, and
#   dprint.json says indentWidth 4 / lineWidth 120. Making taplo match them is
#   the only way the TOML formatter and the TOML checker can both be green on
#   the same bytes.
[formatting]
indent_string = "    "
column_width = 120
