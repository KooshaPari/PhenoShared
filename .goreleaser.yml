version: 2
# goreleaser config (https://goreleaser.com/)
project_name: nanovms

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/nvms
    binary: nvms
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goarch: arm
        goos: windows
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - INSTALL.md

# ── Linux packages (deb + rpm) ──────────────────────────────
nfpms:
  - id: nanovms-nfpm
    package_name: nanovms
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: KooshaPari
    homepage: https://github.com/KooshaPari/zz-merge-unk-NanoVMs
    maintainer: KooshaPari <noreply@github.com>
    description: Multi-tier sandbox orchestration engine
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    section: utils
    priority: optional
    dependencies:
      - ca-certificates
    recommends:
      - docker.io
    contents:
      - src: LICENSE
        dst: /usr/share/doc/nanovms/LICENSE
      - src: README.md
        dst: /usr/share/doc/nanovms/README.md
      - src: INSTALL.md
        dst: /usr/share/doc/nanovms/INSTALL.md

# ── Homebrew tap ─────────────────────────────────────────────
brews:
  - name: nanovms
    repository:
      owner: KooshaPari
      name: homebrew-nanovms
    homepage: https://github.com/KooshaPari/zz-merge-unk-NanoVMs
    description: Multi-tier sandbox orchestration engine
    license: MIT
    install: |
      bin.install "nvms"
      bash_completion.install "completions/nvms.bash" => "nvms"
      zsh_completion.install "completions/_nvms"
      fish_completion.install "completions/nvms.fish"

# ── Snapcraft ────────────────────────────────────────────────
# snapcrafts:
#   - name: nanovms
#     publish: true
#     summary: Multi-tier sandbox orchestration engine
#     description: |
#       NanoVMS provides a unified API for creating, managing, and deploying
#       workloads across 30 isolation tiers — from lightweight process isolation
#       to full virtualization.
#     grade: stable
#     confinement: classic
#     base: core22
#     apps:
#       nvms:
#         command: nvms

# ── Winget (Windows Package Manager) ─────────────────────────
winget:
  - name: nanovms
    publisher: KooshaPari
    publisher_url: https://github.com/KooshaPari
    short_description: Multi-tier sandbox orchestration engine
    license: MIT
    homepage: https://github.com/KooshaPari/zz-merge-unk-NanoVMs

release:
  github:
    owner: KooshaPari
    name: zz-merge-unk-NanoVMs
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    # nanovms v{{.Version}}
    Released: {{.Date}}

    ## Install

    ### Binary (all platforms)
    ```sh
    curl -fsSL https://raw.githubusercontent.com/KooshaPari/nanovms/main/install.sh | sh
    ```

    ### macOS (Homebrew)
    ```sh
    brew install KooshaPari/nanovms/nanovms
    ```

    ### Debian/Ubuntu
    ```sh
    sudo dpkg -i nanovms_{{.Version}}_linux_amd64.deb
    ```

    ### Fedora/RHEL
    ```sh
    sudo rpm -i nanovms_{{.Version}}_linux_amd64.rpm
    ```

snapshot:
  name_template: "{{ incpatch .Version }}-next"
