#==========================================
# OmniRoute Model Providers
#==========================================

# Dense Models
declare -A DENSE_MODELS=(
    # Qwen3.5 Family
    ["qwen3.5-0.5b"]="unsloth/Qwen3.5-0.5B-GGUF:Q4_K_M:512MB"
    ["qwen3.5-1.5b"]="unsloth/Qwen3.5-1.5B-GGUF:Q4_K_M:1GB"
    ["qwen3.5-3b"]="unsloth/Qwen3.5-3B-GGUF:Q4_K_M:2GB"
    ["qwen3.5-9b"]="unsloth/Qwen3.5-9B-GGUF:Q4_K_M:5GB"

    # Qwen3.6 Dense
    ["qwen3.6-27b"]="unsloth/Qwen3.6-27B-GGUF:Q4_K_M:16GB"
    ["qwen3.6-27b-dflash"]="z-lab/Qwen3.6-27B-DFlash:FP16:54GB"  # DFlash optimization

    # Granite 4.1 Family
    ["granite-4.1-8b"]="unsloth/granite-4.1-8b-GGUF:Q4_K_M:5GB"
    ["granite-4.1-3b"]="unsloth/granite-4.1-3b-GGUF:Q4_K_M:2GB"
)

# MoE Models (with REAP support)
declare -A MOE_MODELS=(
    # Qwen3.6 MoE (35B total, ~3B active)
    ["qwen3.6-35b-a3b"]="unsloth/Qwen3.6-35B-A3B-GGUF:Q4_K_M:21GB"
    ["qwen3.6-35b-a3b-iq2"]="unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ2_M:12GB"
    ["qwen3.6-35b-a3b-iq3"]="unsloth/Qwen3.6-35B-A3B-GGUF:UD-IQ3_S:15GB"

    # Granite 4.1 MoE
    ["granite-4.1-30b"]="unsloth/granite-4.1-30b-GGUF:Q4_K_M:18GB"
)

# Role-to-Model mapping
declare -A ROLE_MAPPING=(
    ["format"]="qwen3.5-0.5b"      # Fast formatting
    ["retrieve"]="qwen3.5-1.5b"    # Light retrieval
    ["plan"]="qwen3.5-3b"         # Planning
    ["code"]="granite-4.1-8b"     # General coding (IBM Granite)
    ["reason"]="qwen3.6-35b-a3b"  # Complex reasoning (MoE)
    ["default"]="qwen3.5-9b"       # Default
)

# Quantization options per model
declare -A QUANT_OPTIONS=(
    # Format: repo:quant:size
    ["qwen3.5-0.5b"]="Q2_K:Q3_K_M:Q4_K_M:Q5_K_M:Q6_K"
    ["qwen3.5-1.5b"]="Q2_K:Q3_K_M:Q4_K_M:Q5_K_M:Q6_K"
    ["qwen3.5-3b"]="Q2_K:Q3_K_M:Q4_K_M:Q5_K_M:Q6_K"
    ["qwen3.5-9b"]="Q3_K_M:Q4_K_M:Q5_K_M:Q6_K:Q8_0"
    ["granite-4.1-8b"]="IQ4_NL:IQ4_XS:Q3_K_M:Q4_K_M:Q5_K_M:Q6_K"
    ["qwen3.6-35b-a3b"]="Q4_K_M:UD-IQ2_M:UD-IQ2_XXS:UD-IQ3_S:UD-IQ4_NL"
)

# Print provider info
print_providers() {
    echo "Dense Models:"
    for k in "${!DENSE_MODELS[@]}"; do
        echo "  $k: ${DENSE_MODELS[$k]}"
    done
    echo ""
    echo "MoE Models:"
    for k in "${!MOE_MODELS[@]}"; do
        echo "  $k: ${MOE_MODELS[$k]}"
    done
    echo ""
    echo "Role Mappings:"
    for k in "${!ROLE_MAPPING[@]}"; do
        echo "  $k -> ${ROLE_MAPPING[$k]}"
    done
}
