# Sub-1B Needle family training (Phase 6) — 3090 Ti lab
family: needle

models:
  router:
    params_m: 26
    arch: transformer_classifier
    vocab_size: 32000
    hidden_size: 256
    num_layers: 4
    num_heads: 4
    max_seq_len: 512
    runtime: cpu
    export: onnx

  ranker:
    params_m: 100
    arch: cross_encoder
    hidden_size: 384
    num_layers: 6
    max_seq_len: 2048
    runtime: cpu

  budget:
    params_m: 50
    arch: mlp_regressor
    hidden_size: 256
    max_seq_len: 256
    runtime: cpu

data:
  root: "${HOME}/.omniroute/training"
  router_glob: "call_logs_*.jsonl"
  ranker_glob: "compression_*.jsonl"
  budget_glob: "routing_decisions_*.jsonl"
  synthetic_augment: true

training:
  precision: bf16
  batch_size: 64
  lr: 3.0e-4
  epochs: 5
  warmup_ratio: 0.05
  eval_every: 500
  output_dir: "${PHENO_ROOT}/state/sub1b/needle"

rlvr:
  config: "${PHENO_ROOT}/training/rlvr_config.yaml"
  reward_pass_threshold: 0.75

hardware:
  gpu: "RTX 3090 Ti"
  vram_gb: 24
  note: "Sub-1B full FT fits easily; ranker may use GPU batching"

targets:
  router_accuracy: 0.85
  ranker_ndcg_at_5: 0.70
  budget_mae_tokens: 512
