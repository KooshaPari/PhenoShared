[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "N806",
    "N803",
    "N802",
    "N812",
    "N814",
    "N817",
    "N818",
    "N999",
    "E701",
    "E702",
    "E741",
    "E402",
    "B007",
    "B023",
    "B904",
    "B905",
    "B017",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM112",
    "SIM115",
    "SIM117",
    "UP031",
