[format]
quote-style = "double"
indent-style = "space"

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"kernels/qwen3.5-0.8b/**/*.py" = ["N806", "N803", "E741", "B007", "N999"]
"beads/*.py" = ["N999"]
