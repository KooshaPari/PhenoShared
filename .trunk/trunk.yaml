# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - java@13.0.11
    - node@22.16.0
    - python@3.14.4
    # Was 1.82.0, which cannot parse `edition = "2024"`. 19 crates in this
    # workspace use edition 2024, so every
    #   cargo clippy --manifest-path crates/<x>/Cargo.toml
    # that Trunk runs died with:
    #   error: failed to load manifest for workspace member .../crates/fabric-terminal
    # Rust >= 1.85 is required for edition 2024. Kept in lockstep with
    # rust-toolchain.toml, which pins 1.99.0 and says to bump it together
    # with the workflows that pin the same version.
    - rust@1.99.0
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  # Recovered audit corpora are verbatim point-in-time evidence, not house docs.
  # Markdownlint's MD013 (80 columns) cannot be satisfied without corrupting the
  # record, and rewrites of historical evidence are not useful work. Same
  # rationale as the docs/absorbed-* entries in .markdownlint-cli2.yaml.
  ignore:
    - linters: [markdownlint]
      paths:
        - docs/audits/**
  # Each file extension is owned by exactly ONE formatter.
  # oxfmt (the `format` command of the oxlint definition) owns TypeScript/JavaScript:
  #   ts, tsx, mts, js, jsx, cjs, mjs
  # prettier keeps only the extensions it is still needed for, so a ts/js file can no
  # longer be "formatted" by one formatter and left dirty by the other.
  # oxlint is untouched and remains the LINTER for ts/js.
  definitions:
    - name: prettier
      files:
        - yaml
        - css
        - postcss
        - sass
        - html
        - markdown
        - json
        - graphql
        - prettier_supported_configs
    # Every trunk command runs in a copy_targets sandbox, so gitleaks' cwd is a
    # temp directory and the repository's `.gitleaks.toml` at the root was never
    # discovered. Its allowlists were therefore dead in this lane, while
    # security.yml honoured the same file through GITLEAKS_CONFIG. Observed
    # 2026-11-12 on PR #937: `trunk check` flagged the AWS documentation example
    # key and two test fixtures that .gitleaks.toml already allowlists. Pass the
    # config explicitly so both lanes read one file.
    - name: gitleaks
      files: [ALL]
      commands:
        - name: lint
          run: gitleaks detect --no-git --source=${target} --config=${workspace}/.gitleaks.toml --exit-code=101 -f sarif -r "${tmpfile}"
          output: sarif
          read_output_from: tmp_file
          success_codes: [0, 101]
          sandbox_type: copy_targets
          cache_results: true
          allow_empty_files: false
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - buf-lint@1.75.0
    - checkov@3.4.3
    # clippy/rustfmt must ride the same toolchain as the `rust` runtime above:
    # their versions are rust toolchain versions (`download: rust`), so a 1.65.0
    # clippy is a 1.65.0 cargo, which cannot parse `edition = "2024"`. Observed
    # 2026-11-12 on PR #937: every `Lint & Format` run died with
    #   clippy  crates/sharecli-ffi  ... A tool failed to run
    #   error: failed to load manifest for workspace member .../crates/fabric-terminal
    #   failed to parse the `edition` key
    # which made the lane permanently red for every PR, masking the real result.
    - clippy@1.99.0
    - dotenv-linter@4.0.0
    - git-diff-check
    - gitleaks@8.30.1
    - gofmt@1.20.4
    - golangci-lint2@2.15.0
    - grype@0.121.2
    - hadolint@2.15.1
    - isort@9.0.2
    - ktlint@1.8.0
    - markdownlint@0.50.0
    - mypy@2.4.1
    - nixpkgs-fmt@1.3.0
    - osv-scanner@2.7.1
    - oxipng@10.2.1
    - oxlint@1.93.0
    - prettier@3.9.10
    - renovate@44.223.1
    - ruff@0.17.4
    - rustfmt@1.99.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - svgo@4.1.0
    - taplo@0.10.0
    - tflint@0.66.0
    - trufflehog@3.99.8
    - vale@3.26.0
    - yamllint@1.38.0
  disabled:
    # pinact 5 rejects Trunk's bundled single-dash -format flag; keep the tool
    # pinned but disable the linter until the Trunk adapter emits v5 flags.
    - pinact
tools:
  enabled:
    - oxfmt@0.78.0
actions:
  enabled:
    - trunk-upgrade-available
