# Trunk Check v0.1 configuration, migrated from an invalid legacy dialect.
# Repo CI retains the actual Trunk action and full lint behavior; this file
# names version-pinned upstream plugin linters rather than unsupported custom
# top-level "linters", "formatters", "cache", "env" and "actions" fields.
# https://docs.trunk.io/code-quality/overview/linters/manage-linters
---
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.5.0

# Translation of the existing explicitly enabled language families.
# Changes to linter versions or enabled families require a separate review.
lint:
  enabled:
    - actionlint@1.7.1
    - black@24.4.2
    - clippy@1.78.0
    - eslint@8.57.0
    - golangci-lint@1.61.0
    - mypy@1.10.0
    - ruff@0.4.5
    - shellcheck@0.10.0
    - taplo@0.9.3
    - yamllint@1.35.1
    - prettier@3.2.5
    - rustfmt@1.78.0

# Historical custom command lines had not been accepted by Trunk's config
# parser. No CI issue suppression, blanket ignore, or false green status is
# introduced here. Actual plugin execution remains a separate hosted gate.
