# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  profile: assertive
  # Advisory, not blocking (2026-11-08).
  #
  # With request_changes_workflow: true, CodeRabbit's review submitted a
  # CHANGES_REQUESTED that GitHub branch protection treats as a hard merge
  # block. At profile: assertive that is every PR, so all 12 open PRs were
  # BLOCKED on process rather than code, each needing its 15+ comments cleared
  # before merge even when every required status check was green.
  #
  # Keep the same review depth (profile stays assertive, auto-review stays on)
  # but stop the review from vetoing the merge. Findings are still posted and
  # still visible on the PR; a human or agent decides what to act on.
  request_changes_workflow: false
  auto_review:
    enabled: true
    auto_incremental_review: true
