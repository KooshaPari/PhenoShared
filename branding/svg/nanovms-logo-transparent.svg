<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1e3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#ff0080"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->

  <!-- Glow circle -->
  <circle cx="256" cy="230" r="140" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Hexagon shell (VM metaphor) -->
  <polygon points="256,100 370,165 370,295 256,360 142,295 142,165"
           fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner hexagon (sandbox) -->
  <polygon points="256,145 330,185 330,275 256,315 182,275 182,185"
           fill="none" stroke="#00d4ff" stroke-width="4" stroke-linejoin="round" opacity="0.5"/>

  <!-- Center dot (kernel/core) -->
  <circle cx="256" cy="230" r="16" fill="url(#accent)"/>

  <!-- Tier lines radiating from center -->
  <line x1="256" y1="230" x2="256" y2="100" stroke="#00d4ff" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="230" x2="370" y2="165" stroke="#7b2ff7" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="230" x2="370" y2="295" stroke="#ff0080" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="230" x2="256" y2="360" stroke="#00d4ff" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="230" x2="142" y2="295" stroke="#7b2ff7" stroke-width="3" opacity="0.4"/>
  <line x1="256" y1="230" x2="142" y2="165" stroke="#ff0080" stroke-width="3" opacity="0.4"/>

  <!-- Tier dots on vertices -->
  <circle cx="256" cy="100" r="8" fill="#00d4ff"/>
  <circle cx="370" cy="165" r="8" fill="#7b2ff7"/>
  <circle cx="370" cy="295" r="8" fill="#ff0080"/>
  <circle cx="256" cy="360" r="8" fill="#00d4ff"/>
  <circle cx="142" cy="295" r="8" fill="#7b2ff7"/>
  <circle cx="142" cy="165" r="8" fill="#ff0080"/>

  <!-- "nv" text -->
  <text x="256" y="440" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="url(#accent)" letter-spacing="8">nvms</text>

  <!-- Tagline -->
  <text x="256" y="478" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#6b7280" letter-spacing="4">SANDBOX ORCHESTRATION</text>
</svg>
