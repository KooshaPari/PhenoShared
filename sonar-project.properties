sonar.projectKey=<REDACTED>_phenodocs
sonar.organization=<REDACTED>
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,.history/**,docs/absorbed-from-**
# Archival absorption trees are verbatim copies of upstream repos, preserved
# for provenance and never built here. Excluding them from analysis stops
# their duplicated upstream code from being counted against this project's
# duplication metric. No rule is relaxed for the rest of the tree.
