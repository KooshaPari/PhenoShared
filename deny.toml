# cargo-deny configuration for Phenotype Fabric
# https://embarkstudios.github.io/cargo-deny/

# ── advisories ──────────────────────────────────────────────────────────
[advisories]
# cargo-deny >= 0.14 schema (PR #611): the `vulnerability`/`unmaintained`/
# `unsound`/`notice` level keys are removed — advisories are denied by
# default and only the `ignore` list below opts specific IDs out.
# Warn on yanked crates (deny blocks the build; warn is informational).
yanked = "warn"
# Ignore specific advisories (add RUSTSEC-XXXX-XXXX here if needed).
ignore = [
    # RUSTSEC-2026-0195 / RUSTSEC-2026-0196 — quick-xml < 0.41.0
    # Transitive dep via eframe 0.31.x -> accesskit -> zbus_xml -> quick-xml ^0.30.
    # Cannot be patched; upgrading eframe to 0.36.x resolves it.
    # Risk: LOW (requires malicious local D-Bus service).
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0196",
    # Unmaintained crates with NO safe upgrade (all evaluated 2026-09-24);
    # each is pinned by an upstream tree we do not control. Revisit when the
    # listed parent ships a replacement.
    # bincode 1.3.3 (RUSTSEC-2025-0141): eyetracker-cli model-format dep;
    #   upstream declared 1.3.3 final — migrate to postcard/rkyv when touched.
    "RUSTSEC-2025-0141",
    # instant 0.1.13 (RUSTSEC-2024-0384): transitive via tao (fabric-tray).
    "RUSTSEC-2024-0384",
    # paste 1.0.15 (RUSTSEC-2024-0436): transitive via leptos/nokhwa/either_of.
    "RUSTSEC-2024-0436",
    # proc-macro-error 1.0.4 (RUSTSEC-2024-0370): transitive via glib-macros/gtk.
    "RUSTSEC-2024-0370",
    # proc-macro-error2 2.0.1 (RUSTSEC-2026-0173): transitive via leptos_macro;
    #   the fork's own abandonment mirrors RUSTSEC-2024-0370.
    "RUSTSEC-2026-0173",
]

# ── licenses ────────────────────────────────────────────────────────────
[licenses]
# Allow these license identifiers (SPDX).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CC-BY-4.0",
    # The licenses below were auto-allowed by the removed pre-PR-611 default
    # (`allow-osi-fsf-free = both`); version-2 behavior allows ONLY the
    # explicit list, so they are named here to preserve the prior effective
    # policy (all four are OSI-approved; MPL-2.0 is weak/file-level copyleft).
    "MIT-0",
    "NCSA",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
# cargo-deny >= 0.19 schema (PR #611): the [licenses] `deny` list is removed.
# Under current behavior everything NOT in `allow` (or an exception) is
# rejected, which subsumes the old deny list (GPL/AGPL/SSPL/EUPL are simply
# not allowed above) with a single source of truth.
# Don't confidence-check the license field.
confidence-threshold = 0.8

# ── bans ────────────────────────────────────────────────────────────────
[bans]
# Warn on multiple versions of the same crate.
multiple-versions = "warn"
# Wildcard allow for dev-dependencies.
wildcards = "allow"
# Allow specific crates to have duplicates.
skip = []

# Deny specific crates.
deny = [
    # { name = "openssl", wrappers = ["openssl-sys"] },
]

# ── sources ─────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
