				const currentDistFromCenter = fromNode.distFromCenter || Infinity;
				const neighborDistFromCenter = toNode.distFromCenter || Infinity;
				const isMovingTowardCenter =
					neighborDistFromCenter < currentDistFromCenter;

				
				const canvasWidth = canvas.width;
				const canvasHeight = canvas.height;
				const centerX = canvasWidth / 2;
				const centerY = canvasHeight / 2;

				const destDistFromCenter = Math.sqrt(
					Math.pow(endNode.x - centerX, 2) + Math.pow(endNode.y - centerY, 2)
				);

				const centerThreshold = Math.min(canvasWidth, canvasHeight) * 0.2;
				const destCentrality = Math.max(
					0,
					1 - destDistFromCenter / centerThreshold
				);

				
				if (isDestInCenter) {
					
					if (!isCurrentInCenter && isNeighborInCenter) {
						roadPenalty *= 0.1;
					}
					
					else if (isMovingTowardCenter) {
						roadPenalty *= 0.3;
					}
					
					else {
						roadPenalty *= 2.0;
					}

					
					if (isDestInDeepCenter && isMovingTowardCenter) {
						roadPenalty *= 0.3;
					}

					
					if (destCentrality > 0.5 && isMovingTowardCenter) {
						roadPenalty *= 0.5;
					}

					
					const distToDestination = Math.sqrt(
						Math.pow(fromNode.x - endNode.x, 2) +
							Math.pow(fromNode.y - endNode.y, 2)
					);

					const neighborDistToDestination = Math.sqrt(
						Math.pow(toNode.x - endNode.x, 2) +
							Math.pow(toNode.y - endNode.y, 2)
					);

					
					if (neighborDistToDestination < distToDestination) {
						roadPenalty *= 0.7;
					}
				}

				
				if (!isDestInCenter && isCurrentInCenter && !isNeighborInCenter) {
					roadPenalty *= 0.6;
				}

				
				if (isDestInCenter && isMovingTowardCenter) {
					if (edge.type === "highway") roadPenalty *= 0.3;
					if (edge.type === "major") roadPenalty *= 0.6;
				}

				
				const roadTypeModifiers = {
					local: 1.2,
					minor: 1.1,
					major: 0.95,
					highway: 0.85,
				};

				roadPenalty *= roadTypeModifiers[edge.type] || 1.0;

				
				const isResidentialToCommercial =
					startPoiType === "residential" &&
					(endPoiType === "commercial" || endPoiType === "recreational");

				const isCommercialToResidential =
					(startPoiType === "commercial" || startPoiType === "recreational") &&
					endPoiType === "residential";

				if (
					(isResidentialToCommercial || isCommercialToResidential) &&
					(edge.type === "major" || edge.type === "highway")
				) {
					roadPenalty *= 0.6;
				}

				
				if (prevEdgeType && prevEdgeType !== edge.type) {
					const isMajorRoad = (type) => type === "major" || type === "highway";
					const isMinorRoad = (type) => type === "local" || type === "minor";

					if (isMinorRoad(prevEdgeType) && isMajorRoad(edge.type)) {
						roadPenalty *= 1.05; 
					} else if (isMajorRoad(prevEdgeType) && isMinorRoad(edge.type)) {
						roadPenalty *= 1.2; 
					} else {
						roadPenalty *= 1.1; 
					}
				}

				return roadPenalty;
			}

			function isNodeInCenter(node) {
				const canvasWidth = canvas.width;
				const canvasHeight = canvas.height;
				const centerX = canvasWidth / 2;
				const centerY = canvasHeight / 2;

				const distFromCenter = Math.sqrt(
					Math.pow(node.x - centerX, 2) + Math.pow(node.y - centerY, 2)
				);

				node.distFromCenter = distFromCenter;

				const centerThreshold = Math.min(canvasWidth, canvasHeight) * 0.3;
				const isInCenter = distFromCenter < centerThreshold;

				const deepCenterThreshold = Math.min(canvasWidth, canvasHeight) * 0.15;
				const isInDeepCenter = distFromCenter < deepCenterThreshold;

				node.isInCenter = isInCenter;
				node.isInDeepCenter = isInDeepCenter;

				node.centrality = Math.max(0, 1 - distFromCenter / centerThreshold);

				return isInCenter;
			}

			function checkConnectivity(startNodeId, endNodeId) {
				if (
					startNodeId < 0 ||
					startNodeId >= nodes.length ||
					endNodeId < 0 ||
					endNodeId >= nodes.length
				) {
					console.warn(
						"Invalid node IDs in connectivity check:",
						startNodeId,
						endNodeId
					);
					return false;
				}

				if (startNodeId === endNodeId) {
					return true;
				}

				const visited = new Set();
				const queue = [startNodeId];
				visited.add(startNodeId);

				while (queue.length > 0) {
					const current = queue.shift();
					if (current === endNodeId) return true;

					for (const edge of edges) {
						if (
							edge.from < 0 ||
							edge.from >= nodes.length ||
							edge.to < 0 ||
							edge.to >= nodes.length
						) {
							continue;
						}

						if (edge.from === current && !visited.has(edge.to)) {
							visited.add(edge.to);
							queue.push(edge.to);
						} else if (edge.to === current && !visited.has(edge.from)) {
							visited.add(edge.from);
							queue.push(edge.from);
						}
					}
				}

				return false;
			}

			function heuristicCost(nodeA, nodeB) {
				const dx = Math.abs(nodeA.x - nodeB.x);
				const dy = Math.abs(nodeA.y - nodeB.y);

				const euclidean = Math.sqrt(dx * dx + dy * dy);

				let cost = euclidean;

				if (nodeB.isInCenter) {
					const canvasWidth = canvas.width;
					const canvasHeight = canvas.height;
					const centerX = canvasWidth / 2;
					const centerY = canvasHeight / 2;

					const distFromCenter =
						nodeA.distFromCenter ||
						Math.sqrt(
							Math.pow(nodeA.x - centerX, 2) + Math.pow(nodeA.y - centerY, 2)
						);

					const isMovingTowardCenter =
						nodeA.distFromCenter > nodeB.distFromCenter;

					if (distFromCenter > Math.min(canvasWidth, canvasHeight) * 0.25) {
						cost *= 0.7;
					}

					if (nodeB.isInDeepCenter) {
						cost *= 0.7;
					}

					if (nodeB.centrality > 0.8) {
						cost *= 0.8;
					}

					if (isMovingTowardCenter) {
						cost *= 0.9;
					}
				}

				if (!nodeB.isInCenter && nodeA.isInCenter) {
					cost *= 0.8;
				}

				return cost;
			}

			function findShortestPath(startNodeId, endNodeId) {
				if (startNodeId === endNodeId) {
					return [startNodeId];
				}

				const dist = {};
				const prev = {};
				const unvisited = new Set();

				for (const node of nodes) {
					dist[node.id] = Infinity;
					prev[node.id] = null;
					unvisited.add(node.id);
				}

				dist[startNodeId] = 0;

				while (unvisited.size > 0) {
					let current = null;
					let smallestDist = Infinity;

					for (const nodeId of unvisited) {
						if (dist[nodeId] < smallestDist) {
							smallestDist = dist[nodeId];
							current = nodeId;
						}
					}

					if (current === null || current === endNodeId) {
						break;
					}

					unvisited.delete(current);

					for (let i = 0; i < edges.length; i++) {
						const edge = edges[i];
						if (edge.from === current && unvisited.has(edge.to)) {
							const fromNode = nodes[edge.from];
							const toNode = nodes[edge.to];
							const edgeLength = distance(
								fromNode.x,
								fromNode.y,
								toNode.x,
								toNode.y
							);

							let roadPenalty = 1.0;

							const endNode = nodes[endNodeId];

							const isDestInCenter = isNodeInCenter(endNode);
							const isDestInDeepCenter = endNode.isInDeepCenter;

							const isCurrentInCenter = isNodeInCenter(fromNode);

							const isNeighborInCenter = isNodeInCenter(toNode);

							const currentDistFromCenter = fromNode.distFromCenter || Infinity;
							const neighborDistFromCenter = toNode.distFromCenter || Infinity;
							const isMovingTowardCenter =
								neighborDistFromCenter < currentDistFromCenter;

							if (isDestInCenter) {
								if (!isCurrentInCenter && isNeighborInCenter) {
									roadPenalty *= 0.1;
								} else if (isMovingTowardCenter) {
									roadPenalty *= 0.3;
								} else {
									roadPenalty *= 2.0;
								}

								if (isDestInDeepCenter && isMovingTowardCenter) {
									roadPenalty *= 0.3;
								}

								const distToDestination = Math.sqrt(
									Math.pow(fromNode.x - endNode.x, 2) +
										Math.pow(fromNode.y - endNode.y, 2)
								);

								const neighborDistToDestination = Math.sqrt(
									Math.pow(toNode.x - endNode.x, 2) +
										Math.pow(toNode.y - endNode.y, 2)
								);

								if (neighborDistToDestination < distToDestination) {
									roadPenalty *= 0.7;
								}
							}

							if (!isDestInCenter && isCurrentInCenter && !isNeighborInCenter) {
								roadPenalty *= 0.6;
							}

							if (
								isDestInCenter &&
								edge.type === "highway" &&
								isMovingTowardCenter
							) {
								roadPenalty *= 0.3;
							}

							if (
								isDestInCenter &&
								edge.type === "major" &&
								isMovingTowardCenter
							) {
								roadPenalty *= 0.6;
							}

							if (edge.type === "local") roadPenalty *= 1.2;
							if (edge.type === "minor") roadPenalty *= 1.1;
							if (edge.type === "major") roadPenalty *= 0.95;
							if (edge.type === "highway") roadPenalty *= 0.85;

							const alt = dist[current] + edgeLength * roadPenalty;

							if (alt < dist[edge.to]) {
								dist[edge.to] = alt;
								prev[edge.to] = current;
							}
						}
					}
				}

				const path = [];
				let current = endNodeId;

				if (prev[endNodeId] === null && endNodeId !== startNodeId) {
					return [];
				}

				while (current !== null) {
					path.unshift(current);
					current = prev[current];
				}

				return path;
			}

			function calculateGreedyPath(vehicle, currentNodeId, destNodeId) {
				if (vehicle.highlighted) {
					console.log("Using greedy path calculation:");
					console.log("  From node:", currentNodeId);
					console.log("  To node:", destNodeId);
				}

				vehicle.futurePath = [vehicle.edgeIndex];

				let currentEdgeIndex = vehicle.edgeIndex;
				let pathLength = 1;
				const maxPathLength = 10;

				while (pathLength < maxPathLength) {
					if (currentNodeId === destNodeId) {
						if (vehicle.highlighted) {
							console.log("  Reached destination node in greedy path");
						}
						break;
					}

					const nextEdges = [];
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].from === currentNodeId && i !== currentEdgeIndex) {
							nextEdges.push(i);
						}
					}

					if (nextEdges.length === 0) {
						if (vehicle.highlighted) {
							console.warn("  Dead end reached in greedy path calculation");
						}
						break;
					}

					let foundDirectPath = false;
					for (const edgeIndex of nextEdges) {
						if (edges[edgeIndex].to === destNodeId) {
							vehicle.futurePath.push(edgeIndex);
							foundDirectPath = true;

							if (vehicle.highlighted) {
								console.log("  Found direct path to destination");
							}
							break;
						}
					}

					if (foundDirectPath) {
						break;
					}

					let bestEdgeIndex = -1;
					let bestDistance = Infinity;

					for (const edgeIndex of nextEdges) {
						const nextNodeId = edges[edgeIndex].to;

						if (vehicle.futurePath.some((ei) => edges[ei].to === nextNodeId)) {
							continue;
						}

						const nextNode = nodes[nextNodeId];
						const destNode = nodes[destNodeId];

						const dist = distance(
							nextNode.x,
							nextNode.y,
							destNode.x,
							destNode.y
						);

						const isDestInCenter = isNodeInCenter(destNode);
						const isDestInDeepCenter = destNode.isInDeepCenter;

						const canvasWidth = canvas.width;
						const canvasHeight = canvas.height;
						const centerX = canvasWidth / 2;
						const centerY = canvasHeight / 2;

						const currentDistFromCenter = Math.sqrt(
							Math.pow(nodes[currentNodeId].x - centerX, 2) +
								Math.pow(nodes[currentNodeId].y - centerY, 2)
						);
						const nextDistFromCenter = Math.sqrt(
							Math.pow(nextNode.x - centerX, 2) +
								Math.pow(nextNode.y - centerY, 2)
						);
						const isMovingTowardCenter =
							nextDistFromCenter < currentDistFromCenter;

						let centerFactor = 1.0;
						if (isDestInCenter) {
							if (isMovingTowardCenter) {
								centerFactor = 0.5;
							} else {
								centerFactor = 2.0;
							}

							if (isDestInDeepCenter && isMovingTowardCenter) {
								centerFactor *= 0.7;
							}

							const distToDestination = distance(
								nodes[currentNodeId].x,
								nodes[currentNodeId].y,
								destNode.x,
								destNode.y
							);

							const neighborDistToDestination = distance(
								nextNode.x,
								nextNode.y,
								destNode.x,
								destNode.y
							);

							if (neighborDistToDestination < distToDestination) {
								centerFactor *= 0.7;
							}
						}

						const randomFactor = 1 + (Math.random() * 0.1 - 0.05);
						const adjustedDist = dist * randomFactor * centerFactor;

						if (adjustedDist < bestDistance) {
							bestDistance = adjustedDist;
							bestEdgeIndex = edgeIndex;
						}
					}

					if (bestEdgeIndex !== -1) {
						vehicle.futurePath.push(bestEdgeIndex);
						currentEdgeIndex = bestEdgeIndex;
						currentNodeId = edges[currentEdgeIndex].to;
						pathLength++;

						if (vehicle.highlighted) {
							console.log(
								"  Added edge",
								bestEdgeIndex,
								"to path (best distance)"
							);
							console.log("  New current node:", currentNodeId);
						}
					} else {
						bestDistance = Infinity;
						bestEdgeIndex = -1;

						for (const edgeIndex of nextEdges) {
							const nextNodeId = edges[edgeIndex].to;
							const nextNode = nodes[nextNodeId];
							const destNode = nodes[destNodeId];

							const dist = distance(
								nextNode.x,
								nextNode.y,
								destNode.x,
								destNode.y
							);

							if (dist < bestDistance) {
								bestDistance = dist;
								bestEdgeIndex = edgeIndex;
							}
						}

						if (bestEdgeIndex !== -1) {
							vehicle.futurePath.push(bestEdgeIndex);
							currentEdgeIndex = bestEdgeIndex;
							currentNodeId = edges[currentEdgeIndex].to;
							pathLength++;

							if (vehicle.highlighted) {
								console.log(
									"  Added edge",
									bestEdgeIndex,
									"to path (allowing cycles)"
								);
								console.log("  New current node:", currentNodeId);
							}
						} else {
							const nextEdgeIndex =
								nextEdges[Math.floor(Math.random() * nextEdges.length)];
							vehicle.futurePath.push(nextEdgeIndex);
							currentEdgeIndex = nextEdgeIndex;
							currentNodeId = edges[currentEdgeIndex].to;
							pathLength++;

							if (vehicle.highlighted) {
								console.log("  Added random edge", nextEdgeIndex, "to path");
								console.log("  New current node:", currentNodeId);
							}
						}
					}
				}

				if (vehicle.highlighted) {
					console.log("  Final greedy path length:", vehicle.futurePath.length);
					console.log("  Path:", vehicle.futurePath);
				}

				vehicle.completePath = [...vehicle.futurePath];
			}

			function calculateRandomPath(vehicle) {
				vehicle.futurePath = [vehicle.edgeIndex];

				let currentEdgeIndex = vehicle.edgeIndex;
				let currentNodeId = edges[currentEdgeIndex].to;
				let pathLength = 1;
				const maxPathLength = 5;

				while (pathLength < maxPathLength) {
					const nextEdges = [];
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].from === currentNodeId && i !== currentEdgeIndex) {
							nextEdges.push(i);
						}
					}

					if (nextEdges.length === 0) {
						break;
					}

					const nextEdgeIndex =
						nextEdges[Math.floor(Math.random() * nextEdges.length)];
					vehicle.futurePath.push(nextEdgeIndex);

					currentEdgeIndex = nextEdgeIndex;
					currentNodeId = edges[currentEdgeIndex].to;
					pathLength++;
				}
			}

			function drawVehicles() {
				for (const vehicle of vehicles) {
					if (vehicle.edgeIndex < 0 || vehicle.edgeIndex >= edges.length) {
						console.warn("Invalid edge index:", vehicle.edgeIndex);
						continue;
					}

					const edge = edges[vehicle.edgeIndex];

					if (
						edge.from < 0 ||
						edge.from >= nodes.length ||
						edge.to < 0 ||
						edge.to >= nodes.length
					) {
						console.warn("Edge references invalid nodes:", edge);
						continue;
					}

					if (vehicle.highlighted) {
						const fromNode = nodes[edge.from];
						const toNode = nodes[edge.to];

						ctx.strokeStyle = "#FF9800";
						ctx.lineWidth = Math.max(2, roadTypes[edge.type].width / 3);
						ctx.lineCap = "round";

						ctx.beginPath();
						ctx.moveTo(fromNode.x, fromNode.y);
						ctx.lineTo(toNode.x, toNode.y);
						ctx.stroke();

						if (vehicle.completePath && vehicle.completePath.length > 0) {
							ctx.strokeStyle = "rgba(255, 152, 0, 0.4)";
							ctx.lineWidth = Math.max(1.5, roadTypes[edge.type].width / 5);
							ctx.setLineDash([5, 3]);

							for (let i = 0; i < vehicle.completePath.length; i++) {
								const pathEdgeIndex = vehicle.completePath[i];
								if (pathEdgeIndex >= 0 && pathEdgeIndex < edges.length) {
									const pathEdge = edges[pathEdgeIndex];
									const pathFromNode = nodes[pathEdge.from];
									const pathToNode = nodes[pathEdge.to];

									ctx.beginPath();
									ctx.moveTo(pathFromNode.x, pathFromNode.y);
									ctx.lineTo(pathToNode.x, pathToNode.y);
									ctx.stroke();
								}
							}

							for (let i = 0; i < vehicle.completePath.length; i++) {
								const pathEdgeIndex = vehicle.completePath[i];
								if (pathEdgeIndex >= 0 && pathEdgeIndex < edges.length) {
									const pathEdge = edges[pathEdgeIndex];
									const pathFromNode = nodes[pathEdge.from];

									if (i > 0 && i < vehicle.completePath.length - 1) {
										ctx.fillStyle = "rgba(255, 152, 0, 0.5)";
										ctx.beginPath();
										ctx.arc(pathFromNode.x, pathFromNode.y, 2, 0, Math.PI * 2);
										ctx.fill();
									}
								}
							}

							if (vehicle.destPoi !== undefined) {
								const destPoi = pois[vehicle.destPoi];
								if (destPoi) {
									ctx.fillStyle = "rgba(255, 152, 0, 0.8)";
									ctx.beginPath();
									ctx.arc(destPoi.x, destPoi.y, 6, 0, Math.PI * 2);
									ctx.fill();

									ctx.font = "12px Arial";
									ctx.fillStyle = "rgba(255, 152, 0, 1.0)";
									ctx.fillText("DEST", destPoi.x + 8, destPoi.y + 4);
								}
							}

							ctx.setLineDash([]);
						}

						if (vehicle.futurePath && vehicle.futurePath.length > 0) {
							ctx.strokeStyle = "rgba(255, 152, 0, 0.5)";
							ctx.lineWidth = Math.max(2, roadTypes[edge.type].width / 4);
							ctx.setLineDash([5, 3]);

							for (let i = 0; i < vehicle.futurePath.length; i++) {
								const pathEdgeIndex = vehicle.futurePath[i];
								if (pathEdgeIndex >= 0 && pathEdgeIndex < edges.length) {
									const pathEdge = edges[pathEdgeIndex];
									const pathFromNode = nodes[pathEdge.from];
									const pathToNode = nodes[pathEdge.to];

									ctx.beginPath();
									ctx.moveTo(pathFromNode.x, pathFromNode.y);
									ctx.lineTo(pathToNode.x, pathToNode.y);
									ctx.stroke();

									if (i > 0) {
										ctx.fillStyle = "rgba(255, 152, 0, 0.6)";
										ctx.beginPath();
										ctx.arc(pathFromNode.x, pathFromNode.y, 3, 0, Math.PI * 2);
										ctx.fill();
									}
								}
							}

							ctx.setLineDash([]);

							if (vehicle.futurePath.length > 0) {
								const nextEdgeIndex = vehicle.futurePath[0];
								if (nextEdgeIndex >= 0 && nextEdgeIndex < edges.length) {
									const nextEdge = edges[nextEdgeIndex];
									const nextFromNode = nodes[nextEdge.from];
									const nextToNode = nodes[nextEdge.to];

									ctx.strokeStyle = "rgba(255, 152, 0, 0.8)";
									ctx.lineWidth = Math.max(
										2,
										roadTypes[nextEdge.type].width / 3
									);

									ctx.beginPath();
									ctx.moveTo(nextFromNode.x, nextFromNode.y);
									ctx.lineTo(nextToNode.x, nextToNode.y);
									ctx.stroke();

									const dx = nextToNode.x - nextFromNode.x;
									const dy = nextToNode.y - nextFromNode.y;
									const midX = nextFromNode.x + dx * 0.5;
									const midY = nextFromNode.y + dy * 0.5;
									const arrowSize = 8;
									const angle = Math.atan2(dy, dx);

									ctx.fillStyle = "rgba(255, 152, 0, 0.9)";
									ctx.beginPath();
									ctx.moveTo(
										midX + Math.cos(angle) * arrowSize,
										midY + Math.sin(angle) * arrowSize
									);
									ctx.lineTo(
										midX + Math.cos(angle + Math.PI - Math.PI / 6) * arrowSize,
										midY + Math.sin(angle + Math.PI - Math.PI / 6) * arrowSize
									);
									ctx.lineTo(
										midX + Math.cos(angle + Math.PI + Math.PI / 6) * arrowSize,
										midY + Math.sin(angle + Math.PI + Math.PI / 6) * arrowSize
									);
									ctx.closePath();
									ctx.fill();
								}
							}
						}

						if (vehicle.startPoi !== undefined) {
							const startPoi = pois[vehicle.startPoi];
							if (startPoi) {
								ctx.fillStyle = "#4CAF50";
								ctx.beginPath();
								ctx.arc(startPoi.x, startPoi.y, 6, 0, Math.PI * 2);
								ctx.fill();

								ctx.fillStyle = "#000";
								ctx.font = "10px Arial";
								ctx.textAlign = "center";
								ctx.textBaseline = "bottom";
								ctx.fillText("Start", startPoi.x, startPoi.y - 8);
							}
						}

						if (vehicle.destPoi !== undefined) {
							const destPoi = pois[vehicle.destPoi];
							if (destPoi) {
								const time = (Date.now() % 1000) / 1000;
								const radius = 6 + Math.sin(time * Math.PI * 2) * 2;

								ctx.fillStyle = "#F44336";
								ctx.beginPath();
								ctx.arc(destPoi.x, destPoi.y, radius, 0, Math.PI * 2);
								ctx.fill();

								ctx.fillStyle = "#000";
								ctx.font = "10px Arial";
								ctx.textAlign = "center";
								ctx.textBaseline = "bottom";
								ctx.fillText("Destination", destPoi.x, destPoi.y - 8);
							}
						}

						const dx = toNode.x - fromNode.x;
						const dy = toNode.y - fromNode.y;
						const length = Math.sqrt(dx * dx + dy * dy);
						const midX = fromNode.x + dx * 0.5;
						const midY = fromNode.y + dy * 0.5;
						const arrowSize = 10;

						const angle = Math.atan2(dy, dx);
						const arrowAngle = Math.PI / 6;

						ctx.fillStyle = "#FF9800";
						ctx.beginPath();
						ctx.moveTo(
							midX + Math.cos(angle) * arrowSize,
							midY + Math.sin(angle) * arrowSize
						);
						ctx.lineTo(
							midX + Math.cos(angle + Math.PI - arrowAngle) * arrowSize,
							midY + Math.sin(angle + Math.PI - arrowAngle) * arrowSize
						);
						ctx.lineTo(
							midX + Math.cos(angle + Math.PI + arrowAngle) * arrowSize,
							midY + Math.sin(angle + Math.PI + arrowAngle) * arrowSize
						);
						ctx.closePath();
						ctx.fill();
					}
				}

				for (const vehicle of vehicles) {
					if (vehicle.edgeIndex < 0 || vehicle.edgeIndex >= edges.length) {
						continue;
					}

					const edge = edges[vehicle.edgeIndex];

					if (
						edge.from < 0 ||
						edge.from >= nodes.length ||
						edge.to < 0 ||
						edge.to >= nodes.length
					) {
						continue;
					}

					const fromNode = nodes[edge.from];
					const toNode = nodes[edge.to];
					const roadInfo = roadTypes[edge.type];

					const dx = toNode.x - fromNode.x;
					const dy = toNode.y - fromNode.y;
					const length = Math.sqrt(dx * dx + dy * dy);

					if (length === 0) {
						continue;
					}

					const perpX = -dy / length;
					const perpY = dx / length;

					const laneWidth = roadInfo.width / roadInfo.lanes;
					const laneOffset =
						(vehicle.lane - (roadInfo.lanes - 1) / 2) * laneWidth;

					const x = fromNode.x + dx * vehicle.position + perpX * laneOffset;
					const y = fromNode.y + dy * vehicle.position + perpY * laneOffset;

					vehicle.x = x;
					vehicle.y = y;

					const angle = Math.atan2(dy, dx);

					drawVehicle(
						x,
						y,
						angle,
						vehicle.highlighted ? "#FF9800" : vehicle.color,
						vehicle.speed,
						vehicle.type,
						vehicle.highlighted
					);
				}
			}

			function drawVehicle(
				x,
				y,
				angle,
				color,
				speed,
				type,
				highlighted = false
			) {
				ctx.save();

				ctx.translate(x, y);
				ctx.rotate(angle);

				let carLength, carWidth;

				switch (type) {
					case "car":
						carLength = 10 + speed * 500;
						carWidth = 6;
						break;
					case "truck":
						carLength = 16 + speed * 300;
						carWidth = 8;
						break;
					case "bus":
						carLength = 18 + speed * 200;
						carWidth = 8;
						break;
					case "motorcycle":
						carLength = 8 + speed * 700;
						carWidth = 4;
						break;
				}

				ctx.fillStyle = color;
				ctx.strokeStyle = highlighted ? "#FF9800" : "#000";
				ctx.lineWidth = highlighted ? 2 : 1;

				if (highlighted) {
					ctx.shadowColor = "#FF9800";
					ctx.shadowBlur = 10;
				}

				if (type === "car") {
					roundedRect(
						ctx,
						-carLength / 2,
						-carWidth / 2,
						carLength,
						carWidth,
						2
					);
					ctx.fill();
					ctx.stroke();

					ctx.fillStyle = "rgba(200, 200, 255, 0.8)";

					roundedRect(
						ctx,
						-carLength / 2 + carLength * 0.2,
						-carWidth / 2 + 1,
						carLength * 0.3,
						carWidth - 2,
						1
					);
					ctx.fill();

					roundedRect(
						ctx,
						carLength / 2 - carLength * 0.4,
						-carWidth / 2 + 1,
						carLength * 0.2,
						carWidth - 2,
						1
					);
					ctx.fill();
				} else if (type === "truck") {
					ctx.fillStyle = color;
					roundedRect(
						ctx,
						-carLength / 2,
						-carWidth / 2,
						carLength * 0.4,
						carWidth,
						2
					);
					ctx.fill();
					ctx.stroke();

					ctx.fillStyle = lightenColor(color, 30);
					roundedRect(
						ctx,
						-carLength / 2 + carLength * 0.4,
						-carWidth / 2,
						carLength * 0.6,
						carWidth,
						1
					);
					ctx.fill();
					ctx.stroke();

					ctx.fillStyle = "rgba(200, 200, 255, 0.8)";
					roundedRect(
						ctx,
						-carLength / 2 + carLength * 0.05,
						-carWidth / 2 + 1,
						carLength * 0.3,
						carWidth - 2,
						1
					);
					ctx.fill();
				} else if (type === "bus") {
					ctx.fillStyle = color;
					roundedRect(
						ctx,
						-carLength / 2,
						-carWidth / 2,
						carLength,
						carWidth,
						2
					);
					ctx.fill();
					ctx.stroke();

					ctx.fillStyle = "rgba(200, 200, 255, 0.8)";

					const windowCount = 5;
					const windowWidth = (carLength * 0.7) / windowCount;
					const windowStart = -carLength / 2 + carLength * 0.2;

					for (let i = 0; i < windowCount; i++) {
						roundedRect(
							ctx,
							windowStart + i * windowWidth,
							-carWidth / 2 + 1,
							windowWidth * 0.8,
							carWidth - 2,
							1
						);
						ctx.fill();
					}
				} else if (type === "motorcycle") {
					ctx.fillStyle = color;
					roundedRect(
						ctx,
						-carLength / 2,
						-carWidth / 2,
						carLength,
						carWidth,
						2
					);
					ctx.fill();
					ctx.stroke();

					ctx.fillStyle = "#333";
					ctx.beginPath();
					ctx.arc(
						-carLength / 2 + carLength * 0.3,
						0,
						carWidth / 2,
						0,
						Math.PI * 2
					);
					ctx.fill();
				}

				ctx.restore();
			}

			function roundedRect(ctx, x, y, width, height, radius) {
				ctx.beginPath();
				ctx.moveTo(x + radius, y);
				ctx.lineTo(x + width - radius, y);
				ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
				ctx.lineTo(x + width, y + height - radius);
				ctx.quadraticCurveTo(
					x + width,
					y + height,
					x + width - radius,
					y + height
				);
				ctx.lineTo(x + radius, y + height);
				ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
				ctx.lineTo(x, y + radius);
				ctx.quadraticCurveTo(x, y, x + radius, y);
				ctx.closePath();
			}

			function updateVehicles() {
				if (!simulationRunning) return;

				maintainVehicleCount();

				if (vehicles.length === 0) return;

				cleanupStuckVehicles();

				let totalSpeed = 0;

				for (let i = 0; i < vehicles.length; i++) {
					if (i >= vehicles.length) break;

					const vehicle = vehicles[i];
					const edge = edges[vehicle.edgeIndex];
					const roadInfo = roadTypes[edge.type];

					let minDistance = 1.0;

					for (let j = 0; j < vehicles.length; j++) {
						if (i === j) continue;

						const otherVehicle = vehicles[j];

						if (
							otherVehicle.edgeIndex === vehicle.edgeIndex &&
							otherVehicle.lane === vehicle.lane &&
							otherVehicle.position > vehicle.position
						) {
							const distance = otherVehicle.position - vehicle.position;
							minDistance = Math.min(minDistance, distance);
						}
					}

					if (minDistance < 0.1) {
						vehicle.speed = Math.max(
							vehicle.speed * 0.8,
							roadInfo.speedLimit * 0.2
						);
					} else if (minDistance < 0.2) {
						vehicle.speed = Math.max(
							vehicle.speed * 0.9,
							roadInfo.speedLimit * 0.5
						);
					} else {
						vehicle.speed = Math.min(
							vehicle.speed * 1.05,
							roadInfo.speedLimit * 1.1
						);
					}

					vehicle.speed *= 0.98 + Math.random() * 0.04;

					vehicle.position += vehicle.speed;
					totalSpeed += vehicle.speed;

					if (vehicle.position >= 1) {
						moveToNextEdge(i);

						if (i >= vehicles.length) continue;
					}

					if (roadInfo.lanes > 1 && Math.random() < 0.01) {
						const newLane =
							(vehicle.lane + (Math.random() > 0.5 ? 1 : -1)) % roadInfo.lanes;

						if (newLane >= 0 && newLane < roadInfo.lanes) {
							let laneClear = true;

							for (let j = 0; j < vehicles.length; j++) {
								if (i === j) continue;

								const otherVehicle = vehicles[j];

								if (
									otherVehicle.edgeIndex === vehicle.edgeIndex &&
									otherVehicle.lane === newLane &&
									Math.abs(otherVehicle.position - vehicle.position) < 0.1
								) {
									laneClear = false;
									break;
								}
							}

							if (laneClear) {
								vehicle.lane = newLane;
							}
						}
					}
				}

				vehicleCount.textContent = vehicles.length;

				if (vehicles.length > 0) {
					avgSpeed.textContent = (
						(totalSpeed / vehicles.length) *
						1000
					).toFixed(1);
					congestion.textContent =
						Math.min(100, Math.floor((vehicles.length / edges.length) * 100)) +
						"%";
				} else {
					avgSpeed.textContent = "0";
					congestion.textContent = "0%";
				}
			}

			function moveToNextEdge(vehicleIndex) {
				const vehicle = vehicles[vehicleIndex];
				const currentEdge = edges[vehicle.edgeIndex];
				const endNodeId = currentEdge.to;

				const poiAtNode = pois.find((poi) => poi.nodeId === endNodeId);

				if (!vehicle.route) {
					vehicle.route = [];
				}

				if (!vehicle.poiHistory) {
					vehicle.poiHistory = [];
				}

				if (vehicle.highlighted) {
					console.log("Vehicle reached node:", endNodeId);
					if (poiAtNode) {
						console.log("POI at node:", poiAtNode.type);
					}
				}

				if (poiAtNode) {
					if (
						vehicle.destPoi !== undefined &&
						poiAtNode.id === pois[vehicle.destPoi]?.id
					) {
						vehicle.poiHistory.push({
							poiId: poiAtNode.id,
							poiType: poiAtNode.type,
							nodeId: endNodeId,
							arrivalTime: Date.now(),
						});

						if (vehicle.highlighted) {
							console.log(
								"Vehicle arrived at destination POI:",
								poiAtNode.type
							);
						}

						if (vehicle.highlighted) {
							console.log(
								`Vehicle arrived at ${poiAtNode.type} POI, ID: ${poiAtNode.id}`
							);
						}

						if (vehicle.highlighted) {
							console.log("Vehicle reached destination, getting new route");
							console.log("  Setting start POI to:", vehicle.destPoi);
							console.log("  Previous start POI was:", vehicle.startPoi);
						}

						vehicle.startPoi = vehicle.destPoi;
						vehicle.destPoi = undefined;

						vehicle.futurePath = [];
						vehicle.completePath = [];

						calculateNextDestination(vehicle);

						if (vehicle.highlighted) {
							console.log("  New destination POI:", vehicle.destPoi);
							if (vehicle.destPoi !== undefined) {
								console.log("  Destination type:", pois[vehicle.destPoi].type);
								console.log(
									"  Destination node:",
									pois[vehicle.destPoi].nodeId
								);
							}
						}

						calculateVehiclePath(vehicle);

						if (vehicle.futurePath && vehicle.futurePath.length > 1) {
							const nextEdgeIndex = vehicle.futurePath[1];

							if (
								nextEdgeIndex >= 0 &&
								nextEdgeIndex < edges.length &&
								edges[nextEdgeIndex].from === endNodeId
							) {
								vehicle.edgeIndex = nextEdgeIndex;
								vehicle.position = 0;

								vehicle.futurePath.shift();

								const roadInfo = roadTypes[edges[nextEdgeIndex].type];
								vehicle.speed = Math.min(
									vehicle.speed,
									roadInfo.speedLimit * 1.1
								);
								vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

								if (vehicle.highlighted) {
									console.log("Following new route, next edge:", nextEdgeIndex);
								}
								return;
							}
						}

						const possibleEdges = [];
						for (let i = 0; i < edges.length; i++) {
							if (edges[i].from === endNodeId && i !== vehicle.edgeIndex) {
								possibleEdges.push(i);
							}
						}

						if (possibleEdges.length > 0) {
							const newEdgeIndex =
								possibleEdges[Math.floor(Math.random() * possibleEdges.length)];
							vehicle.edgeIndex = newEdgeIndex;
							vehicle.position = 0;

							const roadInfo = roadTypes[edges[newEdgeIndex].type];
							vehicle.speed = Math.min(
								vehicle.speed,
								roadInfo.speedLimit * 1.1
							);
							vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

							if (vehicle.highlighted) {
								console.log(
									"No valid path found, choosing random edge:",
									newEdgeIndex
								);
							}
						} else {
							for (let i = 0; i < edges.length; i++) {
								if (edges[i].to === endNodeId && i !== vehicle.edgeIndex) {
									vehicle.edgeIndex = i;
									vehicle.position = 1;

									const roadInfo = roadTypes[edges[i].type];
									vehicle.speed = Math.min(
										vehicle.speed,
										roadInfo.speedLimit * 1.1
									);
									vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

									if (vehicle.highlighted) {
										console.log("No outgoing edges, using incoming edge:", i);
									}
									break;
								}
							}
						}
					} else {
						vehicle.poiHistory.push({
							poiId: poiAtNode.id,
							poiType: poiAtNode.type,
							nodeId: endNodeId,
							arrivalTime: Date.now(),
						});

						chooseNextEdge(vehicle, endNodeId);
					}
				} else {
					chooseNextEdge(vehicle, endNodeId);
				}
			}

			function chooseNextEdge(vehicle, currentNodeId) {
				const destPoi =
					vehicle.destPoi !== undefined ? pois[vehicle.destPoi] : null;
				if (!destPoi) {
					chooseRandomNextEdge(vehicle, currentNodeId);
					return;
				}

				const startPoiType =
					vehicle.startPoi !== undefined
						? pois[vehicle.startPoi]?.type
						: "residential";

				const destPoiType = destPoi.type;
				const destNodeId = destPoi.nodeId;

				if (vehicle.highlighted) {
					console.log("Choosing next edge for vehicle at node:", currentNodeId);
					console.log("  Destination POI:", vehicle.destPoi);
					console.log("  Destination node:", destNodeId);
					console.log(
						"  Future path length:",
						vehicle.futurePath ? vehicle.futurePath.length : 0
					);
				}

				if (vehicle.futurePath && vehicle.futurePath.length > 1) {
					const nextEdgeIndex = vehicle.futurePath[1];

					if (
						nextEdgeIndex >= 0 &&
						nextEdgeIndex < edges.length &&
						edges[nextEdgeIndex].from === currentNodeId
					) {
						vehicle.edgeIndex = nextEdgeIndex;
						vehicle.position = 0;

						vehicle.futurePath.shift();

						const roadInfo = roadTypes[edges[nextEdgeIndex].type];
						vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
						vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

						if (vehicle.highlighted) {
							console.log(
								"  Vehicle following route, next edge:",
								nextEdgeIndex
							);
							console.log("  Next node:", edges[nextEdgeIndex].to);
							console.log(
								"  Remaining path length:",
								vehicle.futurePath.length
							);
						}
						return;
					} else {
						if (vehicle.highlighted) {
							console.warn(
								"  Invalid route - next edge doesn't connect to current node"
							);
							console.log("  Current node:", currentNodeId);
							console.log("  Next edge:", nextEdgeIndex);
							console.log("  Next edge from:", edges[nextEdgeIndex]?.from);
							console.log("  Next edge to:", edges[nextEdgeIndex]?.to);
						}

						vehicle.futurePath = [vehicle.edgeIndex];
						vehicle.completePath = [vehicle.edgeIndex];
					}
				}

				if (vehicle.highlighted) {
					console.log(
						"  Recalculating path from node",
						currentNodeId,
						"to",
						destNodeId
					);
				}

				calculateVehiclePath(vehicle);

				if (vehicle.futurePath && vehicle.futurePath.length > 1) {
					const nextEdgeIndex = vehicle.futurePath[1];

					if (
						nextEdgeIndex >= 0 &&
						nextEdgeIndex < edges.length &&
						edges[nextEdgeIndex].from === currentNodeId
					) {
						vehicle.edgeIndex = nextEdgeIndex;
						vehicle.position = 0;

						vehicle.futurePath.shift();

						const roadInfo = roadTypes[edges[nextEdgeIndex].type];
						vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
						vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

						if (vehicle.highlighted) {
							console.log(
								"  Vehicle following recalculated route, next edge:",
								nextEdgeIndex
							);
							console.log("  Next node:", edges[nextEdgeIndex].to);
							console.log(
								"  Remaining path length:",
								vehicle.futurePath.length
							);
						}
						return;
					} else {
						if (vehicle.highlighted) {
							console.warn("  Recalculated route is also invalid");
							console.log("  Current node:", currentNodeId);
							console.log("  Next edge:", nextEdgeIndex);
							console.log("  Next edge from:", edges[nextEdgeIndex]?.from);
							console.log("  Next edge to:", edges[nextEdgeIndex]?.to);
						}

						vehicle.futurePath = [vehicle.edgeIndex];
						vehicle.completePath = [vehicle.edgeIndex];
					}
				}

				const possibleEdges = [];
				for (let i = 0; i < edges.length; i++) {
					if (edges[i].from === currentNodeId && i !== vehicle.edgeIndex) {
						possibleEdges.push(i);
					}
				}

				if (possibleEdges.length === 0) {
					if (vehicle.highlighted) {
						console.log("  At dead-end, attempting U-turn");
					}

					const incomingEdges = [];
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].to === currentNodeId && i !== vehicle.edgeIndex) {
							incomingEdges.push(i);
						}
					}

					if (incomingEdges.length > 0) {
						let bestEdgeIndex = -1;
						let bestScore = -Infinity;

						for (const edgeIndex of incomingEdges) {
							const fromNodeId = edges[edgeIndex].from;
							const fromNode = nodes[fromNodeId];
							const destNode = nodes[destNodeId];

							const dist = distance(
								fromNode.x,
								fromNode.y,
								destNode.x,
								destNode.y
							);

							let connectionCount = 0;
							for (const edge of edges) {
								if (edge.from === fromNodeId) {
									connectionCount++;
								}
							}

							const score = 1000 / dist + connectionCount * 0.5;

							if (score > bestScore) {
								bestScore = score;
								bestEdgeIndex = edgeIndex;
							}
						}

						if (bestEdgeIndex !== -1) {
							vehicle.edgeIndex = bestEdgeIndex;
							vehicle.position = 1;

							const roadInfo = roadTypes[edges[bestEdgeIndex].type];
							vehicle.speed = Math.min(
								vehicle.speed,
								roadInfo.speedLimit * 1.1
							);
							vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

							if (vehicle.highlighted) {
								console.log("  Made U-turn using edge:", bestEdgeIndex);
								console.log("  New from node:", edges[bestEdgeIndex].from);
							}

							calculateVehiclePath(vehicle);
							return;
						} else if (incomingEdges.length > 0) {
							const randomEdgeIndex =
								incomingEdges[Math.floor(Math.random() * incomingEdges.length)];
							vehicle.edgeIndex = randomEdgeIndex;
							vehicle.position = 1;

							const roadInfo = roadTypes[edges[randomEdgeIndex].type];
							vehicle.speed = Math.min(
								vehicle.speed,
								roadInfo.speedLimit * 1.1
							);
							vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

							if (vehicle.highlighted) {
								console.log(
									"  Made random U-turn using edge:",
									randomEdgeIndex
								);
							}

							calculateVehiclePath(vehicle);
							return;
						}
					}

					if (vehicle.highlighted) {
						console.log(
							"  No U-turn options available, trying alternative routing"
						);
					}

					const dijkstraPath = findShortestPath(currentNodeId, destNodeId);

					if (dijkstraPath.length > 1) {
						const edgePath = [];
						let validPath = true;

						for (let i = 0; i < dijkstraPath.length - 1; i++) {
							let edgeFound = false;
							for (let j = 0; j < edges.length; j++) {
								if (
									edges[j].from === dijkstraPath[i] &&
									edges[j].to === dijkstraPath[i + 1]
								) {
									edgePath.push(j);
									edgeFound = true;
									break;
								}
							}

							if (!edgeFound) {
								validPath = false;
								break;
							}
						}

						if (edgePath.length > 0 && validPath) {
							vehicle.futurePath = edgePath;
							vehicle.completePath = vehicle.futurePath
								? [...vehicle.futurePath]
								: [];

							if (vehicle.highlighted) {
								console.log(
									"  Found alternative path with Dijkstra:",
									edgePath
								);
							}
							return;
						}
					}

					if (vehicle.highlighted) {
						console.log("  No alternative path found, respawning vehicle");
					}
					console.log("No alt found");
					replaceVehicle(vehicle);
					return;
				}

				for (const edgeIndex of possibleEdges) {
					if (edges[edgeIndex].to === destNodeId) {
						vehicle.edgeIndex = edgeIndex;
						vehicle.position = 0;

						const roadInfo = roadTypes[edges[edgeIndex].type];
						vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
						vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);
						return;
					}
				}

				const path = findPathAStar(
					currentNodeId,
					destNodeId,
					startPoiType,
					destPoiType
				);

				if (path.length > 1) {
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].from === path[0] && edges[i].to === path[1]) {
							vehicle.edgeIndex = i;
							vehicle.position = 0;

							const roadInfo = roadTypes[edges[i].type];
							vehicle.speed = Math.min(
								vehicle.speed,
								roadInfo.speedLimit * 1.1
							);
							vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

							calculateVehiclePath(vehicle);
							return;
						}
					}
				}

				let bestEdgeIndex = -1;
				let bestScore = -Infinity;

				for (const edgeIndex of possibleEdges) {
					const nextNodeId = edges[edgeIndex].to;
					const nextNode = nodes[nextNodeId];
					const destNode = nodes[destNodeId];

					const dist = distance(nextNode.x, nextNode.y, destNode.x, destNode.y);

					let connectionCount = 0;
					for (const edge of edges) {
						if (edge.from === nextNodeId) {
							connectionCount++;
						}
					}

					let roadTypeBonus = 0;
					if (edges[edgeIndex].type === "highway") roadTypeBonus = 0.3;
					if (edges[edgeIndex].type === "major") roadTypeBonus = 0.2;
					if (edges[edgeIndex].type === "minor") roadTypeBonus = 0.1;

					if (
						(startPoiType === "residential" &&
							(destPoiType === "commercial" ||
								destPoiType === "recreational")) ||
						((startPoiType === "commercial" ||
							startPoiType === "recreational") &&
							destPoiType === "residential")
					) {
						if (
							edges[edgeIndex].type === "major" ||
							edges[edgeIndex].type === "highway"
						) {
							roadTypeBonus *= 2;
						}
					}

					if (startPoiType === "residential" && destPoiType === "residential") {
						if (
							edges[edgeIndex].type === "local" ||
							edges[edgeIndex].type === "minor"
						) {
							roadTypeBonus += 0.2;
						}
					}

					const score = 1000 / dist + connectionCount * 0.5 + roadTypeBonus;

					if (score > bestScore) {
						bestScore = score;
						bestEdgeIndex = edgeIndex;
					}
				}

				if (bestEdgeIndex !== -1) {
					vehicle.edgeIndex = bestEdgeIndex;
					vehicle.position = 0;

					const roadInfo = roadTypes[edges[bestEdgeIndex].type];
					vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
					vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);

					calculateVehiclePath(vehicle);
					return;
				}

				const newEdgeIndex =
					possibleEdges[Math.floor(Math.random() * possibleEdges.length)];
				vehicle.edgeIndex = newEdgeIndex;
				vehicle.position = 0;

				const roadInfo = roadTypes[edges[newEdgeIndex].type];
				vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
				vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);
			}

			function chooseRandomNextEdge(vehicle, currentNodeId) {
				const possibleEdges = [];
				for (let i = 0; i < edges.length; i++) {
					if (edges[i].from === currentNodeId && i !== vehicle.edgeIndex) {
						possibleEdges.push(i);
					}
				}

				if (possibleEdges.length > 0) {
					const newEdgeIndex =
						possibleEdges[Math.floor(Math.random() * possibleEdges.length)];
					vehicle.edgeIndex = newEdgeIndex;
					vehicle.position = 0;

					const roadInfo = roadTypes[edges[newEdgeIndex].type];
					vehicle.speed = Math.min(vehicle.speed, roadInfo.speedLimit * 1.1);
					vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);
				} else {
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].to === currentNodeId && i !== vehicle.edgeIndex) {
							vehicle.edgeIndex = i;
							vehicle.position = 1;

							const roadInfo = roadTypes[edges[i].type];
							vehicle.speed = Math.min(
								vehicle.speed,
								roadInfo.speedLimit * 1.1
							);
							vehicle.lane = Math.floor(Math.random() * roadInfo.lanes);
							return;
						}
					}
					console.log("Choose Next");
					replaceVehicle(vehicle);
				}
			}

			function calculateNextDestination(vehicle) {
				if (pois.length === 0) return;

				if (vehicle.destPoi !== undefined) return;

				const residentialPois = pois.filter(
					(poi) => poi.type === "residential"
				);
				const commercialPois = pois.filter((poi) => poi.type === "commercial");

				const currentPoiType =
					vehicle.startPoi !== undefined
						? pois[vehicle.startPoi]?.type
						: "residential";

				let destPoiIndex;

				if (vehicle.highlighted) {
					console.log("=== DEEP DEBUG: POI SELECTION ===");
					console.log("Calculating next destination for vehicle:", vehicle.id);
					console.log("  Current POI type:", currentPoiType);
					console.log("  Current POI index:", vehicle.startPoi);
					console.log(
						"  Current POI details:",
						vehicle.startPoi !== undefined ? pois[vehicle.startPoi] : "None"
					);
					console.log("  Residential POIs:", residentialPois.length);
					console.log("  Commercial POIs:", commercialPois.length);

					console.log("  All POIs:");
					pois.forEach((poi, index) => {
						const node = nodes[poi.nodeId];
						const isCenter = node ? isNodeInCenter(node) : false;
						const isDeepCenter = node ? node.isInDeepCenter : false;
						console.log(
							`    POI ${index}: type=${poi.type}, nodeId=${poi.nodeId}, isCenter=${isCenter}, isDeepCenter=${isDeepCenter}, coords=(${node?.x},${node?.y})`
						);
					});

					console.log("  Checking graph connectivity from current POI:");
					if (vehicle.startPoi !== undefined) {
						const startNodeId = pois[vehicle.startPoi].nodeId;
						const potentialDests =
							currentPoiType === "residential"
								? commercialPois
								: residentialPois;

						let validPathCount = 0;
						let centerPathCount = 0;

						potentialDests.forEach((poi) => {
							const node = nodes[poi.nodeId];
							const isCenter = node ? isNodeInCenter(node) : false;
							const hasPath = checkConnectivity(startNodeId, poi.nodeId);
							console.log(
								`    Path to POI ${poi.id} at node ${poi.nodeId} exists: ${hasPath}, isCenter: ${isCenter}`
							);

							if (hasPath) {
								validPathCount++;
								if (isCenter) centerPathCount++;
							}
						});

						console.log(
							`    Total valid paths: ${validPathCount}, paths to center: ${centerPathCount}`
						);

						if (centerPathCount === 0 && validPathCount > 0) {
							console.log(
								"    WARNING: No valid paths to center POIs despite having valid paths elsewhere"
							);

							const centerPOIs = potentialDests.filter((poi) => {
								const node = nodes[poi.nodeId];
								return node && isNodeInCenter(node);
							});

							console.log(`    Center POIs count: ${centerPOIs.length}`);

							if (centerPOIs.length > 0) {
								console.log("    Detailed path analysis to center POIs:");
								centerPOIs.forEach((poi) => {
									console.log(
										`      Analyzing path to center POI at node ${poi.nodeId}:`
									);

									const path = findPathAStar(
										startNodeId,
										poi.nodeId,
										currentPoiType,
										poi.type
									);
									console.log(`      A* path length: ${path.length}`);

									if (path.length === 0) {
										const dijkstraPath = findShortestPath(
											startNodeId,
											poi.nodeId
										);
										console.log(
											`      Dijkstra path length: ${dijkstraPath.length}`
										);
									}
								});
							}
						}
					}
				}

				let validDestinations = [];

				if (vehicle.startPoi !== undefined) {
					const startNodeId = pois[vehicle.startPoi].nodeId;
					const potentialDests =
						currentPoiType === "residential" ? commercialPois : residentialPois;

					validDestinations = potentialDests.filter((poi) => {
						if (pois.indexOf(poi) === vehicle.startPoi) return false;

						return checkConnectivity(startNodeId, poi.nodeId);
					});

					if (vehicle.highlighted) {
						console.log(
							`  Found ${validDestinations.length} valid destinations with paths`
						);
					}
				}

				if (currentPoiType === "residential") {
					if (commercialPois.length > 0) {
						if (validDestinations.length > 0) {
							const destPoi =
								validDestinations[
									Math.floor(Math.random() * validDestinations.length)
								];
							destPoiIndex = pois.findIndex((p) => p.id === destPoi.id);

							if (vehicle.highlighted) {
								console.log(
									"  Going to commercial POI with valid path:",
									destPoi.id
								);
							}
						} else {
							const destPoi =
								commercialPois[
									Math.floor(Math.random() * commercialPois.length)
								];
							destPoiIndex = pois.findIndex((p) => p.id === destPoi.id);

							if (vehicle.highlighted) {
								console.log(
									"  Going to commercial POI (no validated path):",
									destPoi.id
								);
							}
						}
					} else {
						const nonResPois = pois.filter((poi) => poi.type !== "residential");
						if (nonResPois.length > 0) {
							const destPoi =
								nonResPois[Math.floor(Math.random() * nonResPois.length)];
							destPoiIndex = pois.findIndex((p) => p.id === destPoi.id);

							if (vehicle.highlighted) {
								console.log("  Going to non-residential POI:", destPoi.id);
							}
						} else {
							destPoiIndex = Math.floor(Math.random() * pois.length);
							while (destPoiIndex === vehicle.startPoi && pois.length > 1) {
								destPoiIndex = Math.floor(Math.random() * pois.length);
							}

							if (vehicle.highlighted) {
								console.log("  Going to random POI:", pois[destPoiIndex].id);
							}
						}
					}
				} else {
					if (residentialPois.length > 0) {
						if (validDestinations.length > 0) {
							const destPoi =
								validDestinations[
									Math.floor(Math.random() * validDestinations.length)
								];
							destPoiIndex = pois.findIndex((p) => p.id === destPoi.id);

							if (vehicle.highlighted) {
								console.log(
									"  Going to residential POI with valid path:",
									destPoi.id
								);
							}
						} else {
							const destPoi =
								residentialPois[
									Math.floor(Math.random() * residentialPois.length)
								];
							destPoiIndex = pois.findIndex((p) => p.id === destPoi.id);

							if (vehicle.highlighted) {
								console.log(
									"  Going to residential POI (no validated path):",
									destPoi.id
								);
							}
						}
					} else {
						destPoiIndex = Math.floor(Math.random() * pois.length);
						while (destPoiIndex === vehicle.startPoi && pois.length > 1) {
							destPoiIndex = Math.floor(Math.random() * pois.length);
						}

						if (vehicle.highlighted) {
							console.log("  No residential POIs available, using random POI");
						}
					}
				}

				if (destPoiIndex !== undefined) {
					vehicle.destPoi = destPoiIndex;

					if (vehicle.highlighted) {
						console.log("  New destination set:", pois[destPoiIndex].type);
						console.log("  Destination POI ID:", pois[destPoiIndex].id);
						console.log("  Destination node ID:", pois[destPoiIndex].nodeId);
					}

					calculateVehiclePath(vehicle);
				}
			}

			function replaceVehicle(vehicle) {
				const vehicleIndex = vehicles.indexOf(vehicle);
				if (vehicleIndex === -1) return;

				if (vehicle.highlighted) {
					console.log("Handling stuck vehicle:");
					console.log("  Vehicle ID:", vehicle.id);
					console.log("  Current edge:", vehicle.edgeIndex);
					console.log("  Start POI:", vehicle.startPoi);
					console.log("  Destination POI:", vehicle.destPoi);
				}

				if (pois.length === 0) {
					vehicles.splice(vehicleIndex, 1);
					vehicleCount.textContent = vehicles.length;
					console.log("No POIs available, vehicle removed");
					return;
				}

				if (vehicle.edgeIndex >= 0 && vehicle.edgeIndex < edges.length) {
					const currentEdge = edges[vehicle.edgeIndex];
					const currentNodeId = currentEdge.to;

					vehicle.destPoi = undefined;

					calculateNextDestination(vehicle);

					if (vehicle.destPoi !== undefined) {
						const destPoi = pois[vehicle.destPoi];

						const hasPath = checkConnectivity(currentNodeId, destPoi.nodeId);

						if (hasPath) {
							if (vehicle.highlighted) {
								console.log(
									"  Found new route from current position to",
									destPoi.type,
									"POI:",
									destPoi.id
								);
							}

							vehicle.futurePath = [];
							vehicle.completePath = [];
							vehicle.stuckCounter = 0;
							vehicle.visitedNodes = new Set();
							vehicle.loopCounter = 0;

							calculateVehiclePath(vehicle);
							return;
						}
					}
				}

				const residentialPois = pois.filter(
					(poi) => poi.type === "residential"
				);

				let startPoi;
				let startNodeId;

				if (residentialPois.length > 0) {
					const startPoiIndex = Math.floor(
						Math.random() * residentialPois.length
					);
					startPoi = residentialPois[startPoiIndex];
					startNodeId = startPoi.nodeId;

					if (vehicle.highlighted) {
						console.log("  Placing at residential POI:", startPoi.id);
					}
				} else {
					const startPoiIndex = Math.floor(Math.random() * pois.length);
					startPoi = pois[startPoiIndex];
					startNodeId = startPoi.nodeId;

					if (vehicle.highlighted) {
						console.log(
							"  Placing at POI:",
							startPoi.id,
							"type:",
							startPoi.type
						);
					}
				}

				const possibleEdges = [];
				for (let i = 0; i < edges.length; i++) {
					if (edges[i].from === startNodeId || edges[i].to === startNodeId) {
						possibleEdges.push(i);
					}
				}

				if (possibleEdges.length === 0) {
					vehicles.splice(vehicleIndex, 1);
					vehicleCount.textContent = vehicles.length;
					console.log("No edges connected to POI, vehicle removed");
					return;
				}

				const edgeIndex =
					possibleEdges[Math.floor(Math.random() * possibleEdges.length)];
				const edge = edges[edgeIndex];

				vehicle.edgeIndex = edgeIndex;
				vehicle.position = edge.from === startNodeId ? 0 : 1;
				vehicle.startPoi = pois.indexOf(startPoi);
				vehicle.destPoi = undefined;
				vehicle.futurePath = [];
				vehicle.completePath = [];
				vehicle.stuckCounter = 0;
				vehicle.visitedNodes = new Set();
				vehicle.loopCounter = 0;

				calculateNextDestination(vehicle);
				calculateVehiclePath(vehicle);

				if (vehicle.highlighted) {
					console.log("  Vehicle placed at edge:", edgeIndex);
					console.log("  New start POI:", vehicle.startPoi);
					console.log("  New destination POI:", vehicle.destPoi);
				}

				console.log("Vehicle placed at a new position after being stuck");
			}

			function animate() {
				if (simulationRunning) {
					const stepsPerFrame = Math.max(1, Math.floor(simulationSpeed / 10));

					for (let i = 0; i < stepsPerFrame; i++) {
						updateVehicles();
					}

					drawNetwork();

					animationFrameId = requestAnimationFrame(animate);
				}
			}

			let lastCleanupTime = Date.now();

			function maintainVehicleCount() {
				return;
			}

			function cleanupStuckVehicles() {
				const currentTime = Date.now();
				if (currentTime - lastCleanupTime < 50) return;

				lastCleanupTime = currentTime;

				for (let i = vehicles.length - 1; i >= 0; i--) {
					const vehicle = vehicles[i];

					if (!vehicle.lastPositionChange) {
						vehicle.lastPositionChange = currentTime;
						vehicle.lastPosition = vehicle.position;
						vehicle.stuckCounter = 0;
						vehicle.visitedNodes = new Set();
						vehicle.loopCounter = 0;
						vehicle.nodeArrivalTime = null;
						vehicle.lastNodeId = null;
						continue;
					}

					const hasMoved =
						Math.abs(vehicle.position - vehicle.lastPosition) > 0.01;

					if (!hasMoved) {
						vehicle.stuckCounter = (vehicle.stuckCounter || 0) + 1;

						if (vehicle.stuckCounter > 0.25) {
							if (vehicle.highlighted) {
								console.log("Vehicle physically stuck, replacing");
							}
							console.log("tmp");
							replaceVehicle(vehicle);
							continue;
						}
					} else {
						vehicle.stuckCounter = 0;
						vehicle.lastPosition = vehicle.position;
						vehicle.lastPositionChange = currentTime;

						if (vehicle.position > 0.9) {
							const currentEdge = edges[vehicle.edgeIndex];
							const currentNodeId = currentEdge.to;

							if (!vehicle.visitedNodes) {
								vehicle.visitedNodes = new Set();
							}

							if (currentNodeId !== vehicle.lastNodeId) {
								vehicle.lastNodeId = currentNodeId;
								vehicle.nodeArrivalTime = currentTime;
							} else if (vehicle.nodeArrivalTime) {
								const timeAtNode = currentTime - vehicle.nodeArrivalTime;

								if (timeAtNode > 250) {
									if (vehicle.highlighted) {
										console.log(
											`Vehicle stuck at node ${currentNodeId} for ${timeAtNode}ms, finding new route`
										);
									}
									replaceVehicle(vehicle);
									continue;
								}
							}

							if (vehicle.visitedNodes.has(currentNodeId)) {
								vehicle.loopCounter = (vehicle.loopCounter || 0) + 1;

								if (vehicle.highlighted) {
									console.log(
										"Vehicle detected in a loop at node:",
										currentNodeId
									);
									console.log("Loop counter:", vehicle.loopCounter);
								}

								if (vehicle.loopCounter > 2) {
									if (vehicle.highlighted) {
										console.log("Vehicle stuck in a loop, recalculating path");
									}

									let isDeadEnd = true;
									let connectingEdges = 0;

									for (const edge of edges) {
										if (
											edge.from === currentNodeId ||
											edge.to === currentNodeId
										) {
											connectingEdges++;
											if (connectingEdges > 1) {
												isDeadEnd = false;
												break;
											}
										}
									}

									if (isDeadEnd) {
										if (vehicle.highlighted) {
											console.log(
												`Node ${currentNodeId} is a dead-end, finding new route`
											);
										}
										replaceVehicle(vehicle);
										continue;
									}

									if (vehicle.destPoi !== undefined) {
										const destPoi = pois[vehicle.destPoi];
										if (destPoi) {
											const path = findShortestPath(
												currentNodeId,
												destPoi.nodeId
											);

											if (path.length > 1) {
												const edgePath = [];
												let validPath = true;

												for (let j = 0; j < path.length - 1; j++) {
													let edgeFound = false;
													for (let k = 0; k < edges.length; k++) {
														if (
															edges[k].from === path[j] &&
															edges[k].to === path[j + 1]
														) {
															edgePath.push(k);
															edgeFound = true;
															break;
														}
													}

													if (!edgeFound) {
														validPath = false;
														break;
													}
												}

												if (validPath && edgePath.length > 0) {
													vehicle.completePath = vehicle.futurePath
														? [...vehicle.futurePath]
														: [];
													vehicle.visitedNodes = new Set();
													vehicle.loopCounter = 0;
													vehicle.nodeArrivalTime = currentTime;

													if (vehicle.highlighted) {
														console.log("Recalculated path to break loop");
													}
													continue;
												}
											}
										}
									}

									if (vehicle.highlighted) {
										console.log(
											"Failed to recalculate path, finding new route"
										);
									}
									replaceVehicle(vehicle);
									continue;
								}
							} else {
								vehicle.visitedNodes.add(currentNodeId);

								if (vehicle.visitedNodes.size > 20) {
									const visitedNodesArray = Array.from(vehicle.visitedNodes);
									if (visitedNodesArray && visitedNodesArray.length > 0) {
										vehicle.visitedNodes = new Set(
											visitedNodesArray.slice(-10)
										);
									} else {
										vehicle.visitedNodes = new Set();
									}
								}
							}
						}
					}
				}
			}

			function startSimulation() {
				if (edges.length === 0) {
					showStatusMessage(
						"Cannot start simulation: No road network exists!",
						true
					);
					return;
				}

				for (const poi of pois) {
					if (poi.type !== "residential") {
						let counterElement = document.getElementById(
							`poi-counter-${poi.id}`
						);
						if (!counterElement) {
							counterElement = document.createElement("div");
							counterElement.id = `poi-counter-${poi.id}`;
							counterElement.style.display = "none";
							counterElement.textContent = "0";
							document.body.appendChild(counterElement);
						}
					}
				}

				if (vehicles.length === 0) {
					addVehicles(10);
				}

				simulationRunning = true;
				startBtn.disabled = true;
				stopBtn.disabled = false;

				animate();

				showStatusMessage("Simulation started");
			}

			function stopSimulation() {
				simulationRunning = false;
				startBtn.disabled = false;
				stopBtn.disabled = true;

				if (animationFrameId) {
					cancelAnimationFrame(animationFrameId);
				}

				for (const poi of pois) {
					if (poi.type !== "residential") {
						const counterElement = document.getElementById(
							`poi-counter-${poi.id}`
						);
						if (counterElement) {
							counterElement.textContent = "0";
						}
					}
				}

				showStatusMessage("Simulation stopped");
			}

			function resetSimulation() {
				if (simulationRunning) {
					stopSimulation();
				} else {
					for (const poi of pois) {
						if (poi.type !== "residential") {
							const counterElement = document.getElementById(
								`poi-counter-${poi.id}`
							);
							if (counterElement) {
								counterElement.textContent = "0";
							}
						}
					}
				}

				vehicles = [];

				vehicleCount.textContent = "0";
				avgSpeed.textContent = "0";
				congestion.textContent = "0%";

				drawNetwork();

				showStatusMessage("Simulation reset");
			}

			function processCanvas() {
				window.open("canvas.html", "_blank", "width=1200,height=800");

				showStatusMessage(
					"Canvas editor opened. Draw your network, save it, then import the JSON file using the 'Import Canvas' button."
				);
			}

			function importCanvasData(jsonData) {
				try {
					const canvasData = JSON.parse(jsonData);

					nodes = [];
					edges = [];
					pois = [];

					if (canvasData.nodes && Array.isArray(canvasData.nodes)) {
						nodes = canvasData.nodes.map((node, index) => {
							return {
								id: index,
								x: node.x,
								y: node.y,
								type: node.type || "intersection",
							};
						});
					}

					if (canvasData.edges && Array.isArray(canvasData.edges)) {
						const tempEdges = canvasData.edges.map((edge, index) => {
							return {
								id: index,
								from: edge.from,
								to: edge.to,
								type: edge.type || "local",
							};
						});

						edges = tempEdges.filter((edge) => {
							if (
								edge.from < 0 ||
								edge.from >= nodes.length ||
								edge.to < 0 ||
								edge.to >= nodes.length
							) {
								console.warn(
									"Skipping edge with invalid node references:",
									edge
								);
								return false;
							}

							if (edge.from === edge.to) {
								console.warn("Skipping self-loop edge:", edge);
								return false;
							}
							return true;
						});

						edges = edges.map((edge, index) => {
							return {
								...edge,
								id: index,
							};
						});
					}

					fixNetworkConnectivity();

					ensureFullConnectivity();

					if (canvasData.pois && Array.isArray(canvasData.pois)) {
						pois = canvasData.pois
							.filter((poi) => {
								if (poi.nodeId < 0 || poi.nodeId >= nodes.length) {
									console.warn(
										"Skipping POI with invalid node reference:",
										poi
									);
									return false;
								}
								return true;
							})
							.map((poi, index) => {
								const node = nodes[poi.nodeId];
								return {
									id: index,
									nodeId: poi.nodeId,
									x: node.x,
									y: node.y,
									type: poi.type || "residential",
								};
							});
					}

					vehicles = [];

					const intersectionCountElement =
						document.getElementById("intersectionCount");
					const roadCountElement = document.getElementById("roadCount");
					const vehicleCountElement = document.getElementById("vehicleCount");

					if (intersectionCountElement)
						intersectionCountElement.textContent = nodes.length;
					if (roadCountElement) roadCountElement.textContent = edges.length;
					if (vehicleCountElement) vehicleCountElement.textContent = "0";

					console.log("Canvas data imported and validated:");
					console.log("  Nodes:", nodes.length);
					console.log("  Edges:", edges.length);
					console.log("  POIs:", pois.length);

					drawNetwork();

					showStatusMessage("Canvas data imported successfully");
				} catch (error) {
					console.error("Error importing canvas data:", error);
					showStatusMessage(
						"Error importing canvas data: " + error.message,
						true
					);
				}
			}

			function setMode(mode) {
				currentMode = mode;

				if (mode === "canvas") {
					window.open("canvas.html", "_blank", "width=1200,height=800");
				} else {
					canvasMode.style.borderColor = "";
					basicMode.style.borderColor = "#2196F3";
				}
			}

			function showStatusMessage(message, isError = false) {
				statusMessage.textContent = message;
				statusMessage.style.display = "block";

				if (isError) {
					statusMessage.classList.add("error");
				} else {
					statusMessage.classList.remove("error");
				}

				setTimeout(() => {
					statusMessage.style.display = "none";
				}, 3000);
			}

			function distance(x1, y1, x2, y2) {
				const dx = x2 - x1;
				const dy = y2 - y1;
				return Math.sqrt(dx * dx + dy * dy);
			}

			function closestPointOnLine(x1, y1, x2, y2, px, py) {
				const dx = x2 - x1;
				const dy = y2 - y1;
				const len2 = dx * dx + dy * dy;

				if (len2 === 0) {
					return { x: x1, y: y1 };
				}

				const t = Math.max(
					0,
					Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2)
				);

				return {
					x: x1 + t * dx,
					y: y1 + t * dy,
				};
			}

			function addPOI(x, y, type) {
				let closestNode = null;
				let closestDistance = Infinity;

				for (let i = 0; i < nodes.length; i++) {
					const node = nodes[i];
					const dist = distance(x, y, node.x, node.y);

					if (dist < closestDistance) {
						closestDistance = dist;
						closestNode = node;
					}
				}

				if (closestNode && closestDistance < 30) {
					for (const poi of pois) {
						const dist = distance(closestNode.x, closestNode.y, poi.x, poi.y);
						if (dist < 50) {
							showStatusMessage("POIs must be at least 50 pixels apart", true);
							return;
						}
					}

					let connectingEdges = 0;
					for (const edge of edges) {
						if (edge.from === closestNode.id || edge.to === closestNode.id) {
							connectingEdges++;
						}
					}

					if (connectingEdges <= 1) {
						showStatusMessage("Warning: Placing POI on a dead-end node", true);
					}

					const poi = {
						id: Date.now().toString(),
						x: closestNode.x,
						y: closestNode.y,
						type: type,
						nodeId: closestNode.id,
						counter: 0,
						highlighted: false,
					};

					pois.push(poi);

					currentPoiType = null;

					const exitButton = document.getElementById("exitPoiModeButton");
					if (exitButton) {
						exitButton.style.display = "none";
					}

					const allButtons = document.querySelectorAll(
						"#poiButtonsContainer button"
					);
					allButtons.forEach((btn) => {
						btn.style.opacity = "0.7";
						btn.style.fontWeight = "normal";
					});

					drawNetwork();

					showStatusMessage(
						`Added ${type} POI at node ${closestNode.id}`,
						false
					);
				} else {
					let closestEdge = null;
					closestDistance = Infinity;
					let closestPoint = null;

					for (let i = 0; i < edges.length; i++) {
						const edge = edges[i];
						const fromNode = nodes[edge.from];
						const toNode = nodes[edge.to];

						const point = closestPointOnLine(
							fromNode.x,
							fromNode.y,
							toNode.x,
							toNode.y,
							x,
							y
						);

						const dist = distance(x, y, point.x, point.y);

						if (dist < closestDistance) {
							closestDistance = dist;
							closestEdge = edge;
							closestPoint = point;
						}
					}

					if (closestEdge && closestDistance < 20) {
						const fromNode = nodes[closestEdge.from];
						const toNode = nodes[closestEdge.to];

						let nodeId;
						let nodeX, nodeY;

						const distToFrom = distance(
							closestPoint.x,
							closestPoint.y,
							fromNode.x,
							fromNode.y
						);
						const distToTo = distance(
							closestPoint.x,
							closestPoint.y,
							toNode.x,
							toNode.y
						);

						if (distToFrom < distToTo) {
							nodeId = closestEdge.from;
							nodeX = fromNode.x;
							nodeY = fromNode.y;
						} else {
							nodeId = closestEdge.to;
							nodeX = toNode.x;
							nodeY = toNode.y;
						}

						for (const poi of pois) {
							const dist = distance(nodeX, nodeY, poi.x, poi.y);
							if (dist < 50) {
								showStatusMessage(
									"POIs must be at least 50 pixels apart",
									true
								);
								return;
							}
						}

						const poi = {
							id: Date.now().toString(),
							x: nodeX,
							y: nodeY,
							type: type,
							nodeId: nodeId,
							counter: 0,
							highlighted: false,
						};

						pois.push(poi);

						exitPOIPlacementMode();

						drawNetwork();

						showStatusMessage(`Added ${type} POI at node ${nodeId}`, false);
					} else {
						showStatusMessage(
							"Click closer to a road or node to add a POI",
							true
						);
					}
				}
			}

			function distanceToLineSegment(px, py, x1, y1, x2, y2) {
				const A = px - x1;
				const B = py - y1;
				const C = x2 - x1;
				const D = y2 - y1;

				const dot = A * C + B * D;
				const len_sq = C * C + D * D;
				let param = -1;

				if (len_sq !== 0) {
					param = dot / len_sq;
				}

				let xx, yy;

				if (param < 0) {
					xx = x1;
					yy = y1;
				} else if (param > 1) {
					xx = x2;
					yy = y2;
				} else {
					xx = x1 + param * C;
					yy = y1 + param * D;
				}

				const dx = px - xx;
				const dy = py - yy;

				return Math.sqrt(dx * dx + dy * dy);
			}

			function getRandomColor() {
				const colors = [
					"#7ebab5",
					"#f6f5f5",
					"#FF9800",
					"#9C27B0",
					"#00BCD4",
					"#FFEB3B",
					"#E91E63",
					"#4CAF50",
					"#2196F3",
					"#FFC107",
				];

				return colors[Math.floor(Math.random() * colors.length)];
			}

			function getRandomVehicleType() {
				const types = [
					"car",
					"car",
					"car",
					"car",
					"truck",
					"truck",
					"bus",
					"motorcycle",
				];
				return types[Math.floor(Math.random() * types.length)];
			}

			function getBuildingColor() {
				const colors = [
					"#353a40",
					"#454a50",
					"#555a60",
					"#656a70",
					"#7ebab5",
					"#6a9a95",
					"#5a8a85",
					"#4a7a75",
					"#3a6a65",
					"#2a5a55",
				];

				return colors[Math.floor(Math.random() * colors.length)];
			}

			function lightenColor(color, amount) {
				let r = parseInt(color.substring(1, 3), 16);
				let g = parseInt(color.substring(3, 5), 16);
				let b = parseInt(color.substring(5, 7), 16);

				r = Math.min(255, r + amount);
				g = Math.min(255, g + amount);
				b = Math.min(255, b + amount);

				return `#${r.toString(16).padStart(2, "0")}${g
					.toString(16)
					.padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
			}

			function exitPOIPlacementMode() {
				currentPoiType = null;

				const exitButton = document.getElementById("exitPoiModeButton");
				if (exitButton) {
					exitButton.style.display = "none";
				}

				const allButtons = document.querySelectorAll(
					"#poiButtonsContainer button"
				);
				allButtons.forEach((btn) => {
					btn.style.opacity = "0.7";
					btn.style.fontWeight = "normal";
				});

				for (const poi of pois) {
					poi.highlighted = false;
				}

				showStatusMessage("Exited POI placement mode");
				drawNetwork();
			}

			function setupEventListeners() {
				startBtn.addEventListener("click", startSimulation);
				stopBtn.addEventListener("click", stopSimulation);
				resetBtn.addEventListener("click", resetSimulation);

				speedSlider.addEventListener("input", function () {
					const sliderValue = parseInt(this.value);

					simulationSpeed = sliderValue;

					document.getElementById(
						"speedDisplay"
					).textContent = `${sliderValue} steps/second`;
				});

				addVehiclesBtn.addEventListener("click", function () {
					const count = parseInt(vehicleInput.value);
					if (count > 0) {
						addVehicles(count);
					}
				});

				generateBtn.addEventListener("click", generateRandomNetwork);

				processCanvasBtn.addEventListener("click", processCanvas);

				const importCanvasBtn = document.getElementById("importCanvasBtn");
				const canvasFileInput = document.getElementById("canvasFileInput");

				importCanvasBtn.addEventListener("click", function () {
					if (canvasFileInput.files.length > 0) {
						const file = canvasFileInput.files[0];
						const reader = new FileReader();

						reader.onload = function (e) {
							const jsonData = e.target.result;
							importCanvasData(jsonData);
						};

						reader.readAsText(file);
					} else {
						showStatusMessage("Please select a file to import", true);
					}
				});

				canvasMode.addEventListener("click", function () {
					setMode("canvas");
				});

				basicMode.addEventListener("click", function () {
					setMode("basic");
				});

				document.addEventListener("keydown", function (e) {
					if (e.key === "Escape" && currentPoiType !== null) {
						exitPOIPlacementMode();
					}
				});

				window.addEventListener("resize", function () {
					canvas.width = canvas.parentElement.clientWidth;
					canvas.height = canvas.parentElement.clientHeight;
					drawNetwork();
				});
			}

			function init() {
				initCanvas();

				setupEventListeners();

				stopBtn.disabled = true;

				window.addEventListener("message", function (event) {
					if (event.data.type === "canvas_saved") {
						const imageData = event.data.imageData;
						const networkData = event.data.networkData;
						const jsonData = event.data.jsonData;

						if (jsonData) {
							importCanvasData(jsonData);
						} else {
							importCanvasData(JSON.stringify(networkData));
						}

						showStatusMessage("Canvas network imported successfully!");
					}
				});

				showStatusMessage(
					'Application initialized. Click "Generate Network" to create a road network.'
				);
			}

			window.addEventListener("load", init);
		</script>
