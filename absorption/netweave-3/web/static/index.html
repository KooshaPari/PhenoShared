<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>NetWeave Traffic Simulation</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 0;
				background-color: #1f2022;
				color: #f6f5f5;
			}

			header {
				background-color: #353a40;
				color: #f6f5f5;
				padding: 15px;
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.container {
				display: flex;
				height: calc(100vh - 50px);
			}

			.sidebar {
				width: 270px;
				background-color: #353a40;
				padding: 15px;
				box-shadow: 2px 0 5px rgba(0, 0, 0, 0.3);
				overflow-y: auto;
			}

			.main-content {
				flex: 1;
				padding: 20px;
				overflow-y: auto;
			}

			.control-panel {
				margin-bottom: 20px;
				padding: 15px;
				background-color: #353a40;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
			}

			.button-group {
				display: flex;
				gap: 10px;
				margin-bottom: 15px;
			}

			button {
				padding: 8px 15px;
				border: none;
				border-radius: 4px;
				cursor: pointer;
				font-weight: bold;
				transition: background-color 0.3s;
			}

			.start-btn {
				background-color: #4caf50;
				color: #f6f5f5;
			}

			.stop-btn {
				background-color: #f44336;
				color: #f6f5f5;
			}

			.reset-btn {
				background-color: #ff9800;
				color: #f6f5f5;
			}

			.generate-btn {
				background-color: #7ebab5;
				color: #f6f5f5;
			}

			.process-btn {
				background-color: #7ebab5;
				color: #f6f5f5;
			}

			button:hover {
				opacity: 0.9;
			}

			.slider-container {
				margin-bottom: 15px;
				color: #f6f5f5;
			}

			.slider-container label {
				display: block;
				margin-bottom: 5px;
			}

			.slider {
				width: 100%;
				background-color: #1f2022;
				border-radius: 4px;
			}

			.input-group {
				display: flex;
				gap: 10px;
				margin-bottom: 15px;
				align-items: center;
				color: #f6f5f5;
			}

			.input-group input {
				flex: 1;
				padding: 8px;
				border: 1px solid #7ebab5;
				border-radius: 4px;
				background-color: #1f2022;
				color: #f6f5f5;
			}

			.input-group button {
				padding: 8px 15px;
				background-color: #7ebab5;
			}

			.stats-panel {
				margin-bottom: 15px;
				padding: 15px;
				background-color: #353a40;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
			}

			.stats-item {
				margin-bottom: 10px;
				padding-bottom: 10px;
				border-bottom: 1px solid #1f2022;
			}

			.stats-item:last-child {
				border-bottom: none;
			}

			.stats-label {
				font-weight: bold;
				margin-bottom: 5px;
				color: #f6f5f5;
			}

			.stats-value {
				font-size: 24px;
				color: #7ebab5;
			}

			.map-container {
				width: 100%;
				height: 100vh;
				background-color: #1f2022;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
				overflow: hidden;
				position: relative;
			}

			#simulationCanvas {
				width: 100%;
				height: 100%;
				background-color: #1f2022;
			}

			.mode-selector {
				display: flex;
				gap: 20px;
				margin-bottom: 20px;
			}

			.mode-card {
				flex: 1;
				padding: 20px;
				background-color: #353a40;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
				text-align: center;
				cursor: pointer;
				transition: transform 0.3s, box-shadow 0.3s;
			}

			.mode-card:hover {
				transform: translateY(-5px);
				box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
				border: 1px solid #7ebab5;
			}

			.mode-card h3 {
				margin-top: 0;
				color: #f6f5f5;
			}

			.mode-card p {
				color: #f6f5f5;
			}

			.status-message {
				padding: 10px;
				margin-bottom: 15px;
				border-radius: 5px;
				background-color: rgba(126, 186, 181, 0.2);
				color: #7ebab5;
				display: none;
			}

			.status-message.error {
				background-color: rgba(244, 67, 54, 0.2);
				color: #f44336;
			}

			.layout-selector {
				margin-bottom: 15px;
				color: #f6f5f5;
			}

			.layout-selector label {
				margin-right: 10px;
			}

			.layout-option {
				margin-right: 15px;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>NetWeave Traffic Simulation</h1>
			<div id="status">Debug Mode</div>
		</header>

		<div class="container">
			<div class="sidebar">
				<div class="control-panel">
					<div class="button-group">
						<button class="start-btn" id="startBtn">Start</button>
						<button class="stop-btn" id="stopBtn">Stop</button>
						<button class="reset-btn" id="resetBtn">Reset</button>
					</div>

					<div class="slider-container">
						<label for="speedSlider">Simulation Speed</label>
						<input
							type="range"
							id="speedSlider"
							class="slider"
							min="10"
							max="200"
							step="10"
							value="10" />
						<div id="speedDisplay">10 steps/second</div>
					</div>

					<div class="input-group">
						<label for="vehicleInput">Add Vehicles</label>
						<input
							type="number"
							id="vehicleInput"
							min="1"
							max="100"
							value="10" />
						<button id="addVehiclesBtn">Add</button>
					</div>
				</div>

				<div class="control-panel">
					<div class="layout-selector">
						<label>Layout Type:</label>
						<div>
							<input
								type="radio"
								id="gridLayout"
								name="layoutType"
								value="grid"
								checked />
							<label for="gridLayout" class="layout-option">Grid</label>

							<input
								type="radio"
								id="radialLayout"
								name="layoutType"
								value="radial" />
							<label for="radialLayout" class="layout-option">Radial</label>

							<input
								type="radio"
								id="organicLayout"
								name="layoutType"
								value="organic" />
							<label for="organicLayout" class="layout-option">Organic</label>

							<input
								type="radio"
								id="randomLayout"
								name="layoutType"
								value="random" />
							<label for="randomLayout" class="layout-option">Random</label>

							<input
								type="radio"
								id="kushLayout"
								name="layoutType"
								value="kush" />
							<label for="kushLayout" class="layout-option">Kush</label>
						</div>
					</div>

					<div class="button-group">
						<button class="generate-btn" id="generateBtn">
							Generate Network
						</button>
						<button class="process-btn" id="processCanvasBtn">
							Process Canvas
						</button>
					</div>
					<div class="input-group">
						<label for="canvasFileInput">Import Canvas:</label>
						<input type="file" id="canvasFileInput" accept=".json" />
						<button type="button" id="importCanvasBtn">Import</button>
					</div>
				</div>

				<div class="stats-panel">
					<div class="stats-item">
						<div class="stats-label">Intersections</div>
						<div class="stats-value" id="intersectionCount">0</div>
					</div>

					<div class="stats-item">
						<div class="stats-label">Roads</div>
						<div class="stats-value" id="roadCount">0</div>
					</div>
				</div>

				<div class="stats-panel">
					<div class="stats-item">
						<div class="stats-label">Vehicles</div>
						<div class="stats-value" id="vehicleCount">0</div>
					</div>

					<div class="stats-item">
						<div class="stats-label">Avg. Speed</div>
						<div class="stats-value" id="avgSpeed">0</div>
					</div>

					<div class="stats-item">
						<div class="stats-label">Congestion</div>
						<div class="stats-value" id="congestion">0%</div>
					</div>
				</div>
			</div>

			<div class="main-content">
				<div id="statusMessage" class="status-message">
					Simulation initialized
				</div>

				<div id="modeSelector" class="mode-selector">
					<div class="mode-card" id="canvasMode">
						<h3>Canvas Mode</h3>
						<p>Draw your own road network using the canvas interface</p>
					</div>

					<div class="mode-card" id="basicMode">
						<h3>Basic Mode</h3>
						<p>Generate a random road network and run the simulation</p>
					</div>
				</div>

				<div class="map-container">
					<canvas id="simulationCanvas"></canvas>
				</div>
			</div>
		</div>

		<script>
			const startBtn = document.getElementById("startBtn");
			const stopBtn = document.getElementById("stopBtn");
			const resetBtn = document.getElementById("resetBtn");
			const speedSlider = document.getElementById("speedSlider");
			const vehicleInput = document.getElementById("vehicleInput");
			const addVehiclesBtn = document.getElementById("addVehiclesBtn");
			const generateBtn = document.getElementById("generateBtn");
			const processCanvasBtn = document.getElementById("processCanvasBtn");
			const intersectionCount = document.getElementById("intersectionCount");
			const roadCount = document.getElementById("roadCount");
			const vehicleCount = document.getElementById("vehicleCount");
			const avgSpeed = document.getElementById("avgSpeed");
			const congestion = document.getElementById("congestion");
			const canvasMode = document.getElementById("canvasMode");
			const basicMode = document.getElementById("basicMode");
			const statusMessage = document.getElementById("statusMessage");
			const canvas = document.getElementById("simulationCanvas");
			const ctx = canvas.getContext("2d");
			const layoutOptions = document.getElementsByName("layoutType");

			let simulationRunning = false;
			let simulationSpeed = 100;
			let currentMode = "basic";
			let animationFrameId = null;
			let currentLayout = "grid";

			let nodes = [];
			let edges = [];
			let vehicles = [];
			let pois = [];

			const poiTypes = {
				residential: {
					name: "Residential",
					color: "#7ebab5",
					radius: 12,
					icon: "🏠",
				},
				commercial: {
					name: "Commercial",
					color: "#f6f5f5",
					radius: 12,
					icon: "🏢",
				},
			};

			const roadTypes = {
				highway: {
					width: 12,
					color: "#353a40",
					speedLimit: 0.015,
					lanes: 3,
				},
				major: {
					width: 8,
					color: "#454a50",
					speedLimit: 0.01,
					lanes: 2,
				},
				minor: {
					width: 6,
					color: "#555a60",
					speedLimit: 0.008,
					lanes: 1,
				},
				local: {
					width: 4,
					color: "#656a70",
					speedLimit: 0.005,
					lanes: 1,
				},
			};

			const intersectionTypes = {
				major_intersection: {
					radius: 10,
					color: "#7ebab5",
					highlightColor: "rgba(246, 245, 245, 0.3)",
				},
				traffic_light: {
					radius: 8,
					color: "#7ebab5",
					highlightColor: "rgba(246, 245, 245, 0.3)",
				},
				intersection: {
					radius: 6,
					color: "#7ebab5",
					highlightColor: "rgba(246, 245, 245, 0.3)",
				},
			};

			const backgroundElements = {
				parks: [],
				water: [],
				buildings: [],
			};

			function initCanvas() {
				canvas.width = canvas.parentElement.clientWidth;
				canvas.height = canvas.parentElement.clientHeight;

				drawEmptyState();

				const poiButtonsContainer = document.createElement("div");
				poiButtonsContainer.id = "poiButtonsContainer";
				poiButtonsContainer.style.position = "absolute";
				poiButtonsContainer.style.top = "10px";
				poiButtonsContainer.style.left = "10px";
				poiButtonsContainer.style.zIndex = "1000";
				document
					.querySelector(".map-container")
					.appendChild(poiButtonsContainer);

				for (const poiType in poiTypes) {
					const button = document.createElement("button");
					button.textContent = `Add ${poiTypes[poiType].name} POI`;
					button.style.backgroundColor = poiTypes[poiType].color;
					button.style.color = "#000";
					button.style.border = "none";
					button.style.borderRadius = "5px";
					button.style.padding = "5px 10px";
					button.style.margin = "0 5px 5px 0";
					button.style.cursor = "pointer";

					button.addEventListener("click", function () {
						currentPoiType = poiType;

						const allButtons = poiButtonsContainer.querySelectorAll("button");
						allButtons.forEach((btn) => {
							btn.style.opacity = "0.7";
							btn.style.fontWeight = "normal";
						});

						this.style.opacity = "1";
						this.style.fontWeight = "bold";

						exitButton.style.display = "block";

						showStatusMessage(
							`Click on the map to place a ${poiTypes[poiType].name} POI`
						);
					});

					poiButtonsContainer.appendChild(button);
				}

				const exitButton = document.createElement("button");
				exitButton.id = "exitPoiModeButton";
				exitButton.textContent = "Exit POI Placement";
				exitButton.style.backgroundColor = "#f44336";
				exitButton.style.color = "#fff";
				exitButton.style.border = "2px solid #fff";
				exitButton.style.borderRadius = "5px";
				exitButton.style.padding = "8px 15px";
				exitButton.style.margin = "0 5px 5px 0";
				exitButton.style.cursor = "pointer";
				exitButton.style.display = "none";
				exitButton.style.position = "absolute";
				exitButton.style.top = "10px";
				exitButton.style.right = "10px";
				exitButton.style.zIndex = "1000";
				exitButton.style.fontWeight = "bold";
				exitButton.style.fontSize = "14px";
				exitButton.style.boxShadow = "0 2px 5px rgba(0,0,0,0.3)";

				exitButton.addEventListener("click", function () {
					exitPOIPlacementMode();
				});

				document.querySelector(".map-container").appendChild(exitButton);

				let currentPoiType = null;
				let highlightedPoi = null;

				canvas.addEventListener("click", function (e) {
					const rect = canvas.getBoundingClientRect();
					const clickX = e.clientX - rect.left;
					const clickY = e.clientY - rect.top;

					if (currentPoiType) {
						addPOI(clickX, clickY, currentPoiType);
						return;
					}

					let wasAnythingHighlighted = false;

					for (const poi of pois) {
						if (poi.highlighted) {
							wasAnythingHighlighted = true;
							break;
						}
					}

					for (const vehicle of vehicles) {
						if (vehicle.highlighted) {
							wasAnythingHighlighted = true;
							break;
						}
					}

					for (const poi of pois) {
						poi.highlighted = false;
					}

					for (const vehicle of vehicles) {
						vehicle.highlighted = false;
					}

					const poiInfoPanel = document.getElementById("poiInfoPanel");
					if (poiInfoPanel) {
						poiInfoPanel.parentNode.removeChild(poiInfoPanel);
					}

					const vehicleInfoPanel = document.getElementById("vehicleInfoPanel");
					if (vehicleInfoPanel) {
						vehicleInfoPanel.parentNode.removeChild(vehicleInfoPanel);
					}

					if (wasAnythingHighlighted) {
						highlightedPoi = null;
						drawNetwork();
						return;
					}

					let clickedPoi = null;
					let minPoiDistance = 20;

					for (const poi of pois) {
						const dist = distance(clickX, clickY, poi.x, poi.y);
						if (dist < minPoiDistance) {
							minPoiDistance = dist;
							clickedPoi = poi;
						}
					}

					if (clickedPoi) {
						clickedPoi.highlighted = true;
						highlightedPoi = clickedPoi;
						showPOIInfo(clickedPoi);
						drawNetwork();
						return;
					}

					let closestVehicle = null;
					let minDistance = 20;

					for (const vehicle of vehicles) {
						const dist = distance(clickX, clickY, vehicle.x, vehicle.y);
						if (dist < minDistance) {
							minDistance = dist;
							closestVehicle = vehicle;
						}
					}

					if (closestVehicle) {
						closestVehicle.highlighted = true;

						calculateVehiclePath(closestVehicle);

						if (
							!closestVehicle.completePath ||
							closestVehicle.completePath.length === 0
						) {
							if (
								closestVehicle.futurePath &&
								closestVehicle.futurePath.length > 0
							) {
								closestVehicle.completePath = closestVehicle.futurePath
									? [...closestVehicle.futurePath]
									: [];
								console.log(
									"Complete path stored:",
									closestVehicle.completePath
								);
							} else if (closestVehicle.destPoi !== undefined) {
								console.log("No future path available, recalculating...");

								const destPoi = pois[closestVehicle.destPoi];
								if (destPoi) {
									const currentEdge = edges[closestVehicle.edgeIndex];
									const currentNodeId = currentEdge.to;
									const path = findPathAStar(
										currentNodeId,
										destPoi.nodeId,
										"residential",
										destPoi.type
									);

									if (path.length > 1) {
										const edgePath = [];
										for (let i = 0; i < path.length - 1; i++) {
											for (let j = 0; j < edges.length; j++) {
												if (
													edges[j].from === path[i] &&
													edges[j].to === path[i + 1]
												) {
													edgePath.push(j);
													break;
												}
											}
										}

										if (edgePath.length > 0) {
											closestVehicle.completePath = [
												closestVehicle.edgeIndex,
												...edgePath,
											];
											console.log(
												"Recalculated complete path:",
												closestVehicle.completePath
											);
										}
									}
								}
							}
						} else {
							console.log(
								"Using existing complete path:",
								closestVehicle.completePath
							);
						}

						showVehicleInfo(closestVehicle);

						console.log("Vehicle highlighted:", closestVehicle);
						console.log("Current edge:", edges[closestVehicle.edgeIndex]);
						console.log("Future path:", closestVehicle.futurePath);
						console.log("Complete path:", closestVehicle.completePath);
						if (closestVehicle.destPoi !== undefined) {
							console.log("Destination POI:", pois[closestVehicle.destPoi]);
						}
					}

					drawNetwork();
				});
			}

			function showVehicleInfo(vehicle) {
				let infoPanel = document.getElementById("vehicleInfoPanel");

				if (!infoPanel) {
					infoPanel = document.createElement("div");
					infoPanel.id = "vehicleInfoPanel";
					infoPanel.style.position = "absolute";
					infoPanel.style.top = "70px";
					infoPanel.style.right = "20px";
					infoPanel.style.backgroundColor = "rgba(0, 0, 0, 0.7)";
					infoPanel.style.color = "white";
					infoPanel.style.padding = "10px";
					infoPanel.style.borderRadius = "5px";
					infoPanel.style.zIndex = "1000";
					infoPanel.style.maxWidth = "300px";
					document.body.appendChild(infoPanel);
				}

				const currentEdge = edges[vehicle.edgeIndex];
				const fromNode = nodes[currentEdge.from];
				const toNode = nodes[currentEdge.to];
				const roadInfo = roadTypes[currentEdge.type];

				const startPoi =
					vehicle.startPoi !== undefined ? pois[vehicle.startPoi] : null;
				const destPoi =
					vehicle.destPoi !== undefined ? pois[vehicle.destPoi] : null;

				const startPoiType = startPoi ? startPoi.type : "unknown";
				const destPoiType = destPoi ? destPoi.type : "unknown";

				const startPoiColor = poiTypes[startPoiType]?.color || "#999";
				const destPoiColor = poiTypes[destPoiType]?.color || "#999";

				infoPanel.innerHTML = `
					<h3>Vehicle Information</h3>
					<p><strong>Type:</strong> ${vehicle.type}</p>
					<p><strong>Speed:</strong> ${vehicle.speed.toFixed(1)} units/step</p>
					<p><strong>Current Road:</strong> ${currentEdge.type} (${
					roadInfo.speedLimit
				} limit)</p>
					<p><strong>From:</strong> Node ${currentEdge.from} (${fromNode.type})</p>
					<p><strong>To:</strong> Node ${currentEdge.to} (${toNode.type})</p>
					<p><strong>Progress:</strong> ${(vehicle.position * 100).toFixed(1)}%</p>
					<p><strong>Origin:</strong> <span style="color:${startPoiColor}">${startPoiType}</span></p>
					<p><strong>Destination:</strong> <span style="color:${destPoiColor}">${destPoiType}</span></p>
				`;

				if (vehicle.poiHistory && vehicle.poiHistory.length > 0) {
					infoPanel.innerHTML += `
						<h4>POI History</h4>
						<div style="max-height: 100px; overflow-y: auto;">
					`;

					const recentPOIs = vehicle.poiHistory.slice(-5).reverse();
					for (const stop of recentPOIs) {
						const poiType = stop.poiType || "unknown";
						const poiColor = poiTypes[poiType]?.color || "#999";
						const stopTime = new Date(stop.arrivalTime).toLocaleTimeString();

						infoPanel.innerHTML += `
							<p><span style="color:${poiColor}">${poiType}</span> at ${stopTime}</p>
						`;
					}

					infoPanel.innerHTML += `</div>`;
				}

				const closeButton = document.createElement("button");
				closeButton.textContent = "Close";
				closeButton.style.marginTop = "10px";
				closeButton.style.padding = "5px 10px";
				closeButton.style.backgroundColor = "#f44336";
				closeButton.style.border = "none";
				closeButton.style.borderRadius = "3px";
				closeButton.style.color = "white";
				closeButton.style.cursor = "pointer";

				closeButton.addEventListener("click", function () {
					document.body.removeChild(infoPanel);
				});

				infoPanel.appendChild(closeButton);
			}

			function generateRandomLayout(nodeCount) {
				for (let i = 0; i < nodeCount; i++) {
					const padding = 50;
					const x = padding + Math.random() * (canvas.width - 2 * padding);
					const y = padding + Math.random() * (canvas.height - 2 * padding);

					let nodeType = "intersection";
					const rand = Math.random();

					if (rand < 0.1) {
						nodeType = "major_intersection";
					} else if (rand < 0.3) {
						nodeType = "intersection";
					}

					nodes.push({
						id: i,
						x: x,
						y: y,
						type: nodeType,
					});
				}

				const connectedNodes = new Set([0]);
				const unconnectedNodes = new Set(
					Array.from({ length: nodeCount }, (_, i) => i).slice(1)
				);

				while (unconnectedNodes.size > 0) {
					let minDist = Infinity;
					let closestConnected = -1;
					let closestUnconnected = -1;

					for (const connected of connectedNodes) {
						for (const unconnected of unconnectedNodes) {
							const dist = distance(
								nodes[connected].x,
								nodes[connected].y,
								nodes[unconnected].x,
								nodes[unconnected].y
							);

							if (dist < minDist) {
								minDist = dist;
								closestConnected = connected;
								closestUnconnected = unconnected;
							}
						}
					}

					if (closestConnected !== -1 && closestUnconnected !== -1) {
						const roadType = determineRoadType(
							nodes[closestConnected],
							nodes[closestUnconnected]
						);

						edges.push({
							from: closestConnected,
							to: closestUnconnected,
							type: roadType,
						});

						connectedNodes.add(closestUnconnected);
						unconnectedNodes.delete(closestUnconnected);
					}
				}

				const additionalConnections = Math.floor(nodeCount * 1.5);
				const maxDistance = Math.min(canvas.width, canvas.height) / 2.5;

				for (let i = 0; i < additionalConnections; i++) {
					const fromNode = Math.floor(Math.random() * nodes.length);
					const toNode = Math.floor(Math.random() * nodes.length);

					if (fromNode === toNode) continue;

					const connectionExists = edges.some(
						(edge) =>
							(edge.from === fromNode && edge.to === toNode) ||
							(edge.from === toNode && edge.to === fromNode)
					);

					if (!connectionExists) {
						const dist = distance(
							nodes[fromNode].x,
							nodes[fromNode].y,
							nodes[toNode].x,
							nodes[toNode].y
						);

						if (dist < maxDistance) {
							const roadType = determineRoadType(
								nodes[fromNode],
								nodes[toNode]
							);

							edges.push({
								from: fromNode,
								to: toNode,
								type: roadType,
							});
						}
					}
				}

				const numHighways = 4 + Math.floor(Math.random() * 4);

				const distantPairs = [];
				for (let i = 0; i < nodes.length; i++) {
					for (let j = i + 1; j < nodes.length; j++) {
						const dist = distance(
							nodes[i].x,
							nodes[i].y,
							nodes[j].x,
							nodes[j].y
						);

						if (dist > maxDistance) {
							distantPairs.push({ from: i, to: j, distance: dist });
						}
					}
				}

				distantPairs.sort((a, b) => b.distance - a.distance);

				for (let i = 0; i < Math.min(numHighways, distantPairs.length); i++) {
					const pair = distantPairs[i];

					const connectionExists = edges.some(
						(edge) =>
							(edge.from === pair.from && edge.to === pair.to) ||
							(edge.from === pair.to && edge.to === pair.from)
					);

					if (!connectionExists) {
						edges.push({
							from: pair.from,
							to: pair.to,
							type: "highway",
						});
					}
				}
			}

			function generateGridLayout(nodeCount) {
				const gridSize = Math.ceil(Math.sqrt(nodeCount));

				const cellWidth = canvas.width / gridSize;
				const cellHeight = canvas.height / gridSize;

				const blocks = [];
				const blockPadding = 0.2;

				for (let row = 0; row < gridSize; row++) {
					for (let col = 0; col < gridSize; col++) {
						const blockX = col * cellWidth - (cellWidth * blockPadding) / 2;
						const blockY = row * cellHeight - (cellHeight * blockPadding) / 2;
						const blockWidth = cellWidth * (1 - blockPadding);
						const blockHeight = cellHeight * (1 - blockPadding);

						blocks.push({
							x: blockX,
							y: blockY,
							width: blockWidth,
							height: blockHeight,
						});
					}
				}

				let nodeId = 0;

				for (let row = 0; row <= gridSize; row++) {
					for (let col = 0; col <= gridSize; col++) {
						const jitterX = (Math.random() - 0.5) * cellWidth * 0.05;
						const jitterY = (Math.random() - 0.5) * cellHeight * 0.05;

						const x = col * cellWidth + jitterX;
						const y = row * cellHeight + jitterY;

						let nodeType = "intersection";

						if (
							((row === 0 || row === gridSize) &&
								(col === 0 || col === gridSize)) ||
							(row === Math.floor(gridSize / 2) &&
								col === Math.floor(gridSize / 2))
						) {
							nodeType = "major_intersection";
						} else if (
							row > 0 &&
							row < gridSize &&
							col > 0 &&
							col < gridSize &&
							Math.random() < 0.3
						) {
							nodeType = "traffic_light";
						}

						nodes.push({
							id: nodeId++,
							x: x,
							y: y,
							type: nodeType,
						});
					}
				}

				const gridWidth = gridSize + 1;

				for (let row = 0; row <= gridSize; row++) {
					for (let col = 0; col <= gridSize; col++) {
						const nodeIndex = row * gridWidth + col;

						if (col < gridSize) {
							const rightNodeIndex = row * gridWidth + (col + 1);
							const roadType = determineRoadType(
								nodes[nodeIndex],
								nodes[rightNodeIndex]
							);
							edges.push({
								from: nodeIndex,
								to: rightNodeIndex,
								type: roadType,
							});
						}

						if (row < gridSize) {
							const belowNodeIndex = (row + 1) * gridWidth + col;
							const roadType = determineRoadType(
								nodes[nodeIndex],
								nodes[belowNodeIndex]
							);
							edges.push({
								from: nodeIndex,
								to: belowNodeIndex,
								type: roadType,
							});
						}

						if (row < gridSize && col < gridSize && Math.random() < 0.1) {
							const diagonalNodeIndex = (row + 1) * gridWidth + (col + 1);
							const roadType = "minor";
							edges.push({
								from: nodeIndex,
								to: diagonalNodeIndex,
								type: roadType,
							});
						}
					}
				}
			}

			function generateRadialLayout(nodeCount) {
				const centerX = canvas.width / 2;
				const centerY = canvas.height / 2;

				nodes.push({
					id: 0,
					x: centerX,
					y: centerY,
					type: "major_intersection",
				});

				const rings = 3;
				const nodesPerRing = Math.floor((nodeCount - 1) / rings);

				let nodeId = 1;

				const numSpokes = 8 + Math.floor(Math.random() * 4);
				const spokesAngles = [];

				for (let i = 0; i < numSpokes; i++) {
					const angle = (2 * Math.PI * i) / numSpokes;
					spokesAngles.push(angle);

					for (let ring = 1; ring <= rings; ring++) {
						const radius =
							((Math.min(canvas.width, canvas.height) / 2) * ring) /
							(rings + 0.5);

						const radiusJitter = (Math.random() - 0.5) * radius * 0.05;

						const x = centerX + (radius + radiusJitter) * Math.cos(angle);
						const y = centerY + (radius + radiusJitter) * Math.sin(angle);

						let nodeType = "intersection";
						if (ring === rings) {
							nodeType = "major_intersection";
						} else if (ring === 2 && i % 2 === 0) {
							nodeType = "traffic_light";
						}

						nodes.push({
							id: nodeId++,
							x: x,
							y: y,
							type: nodeType,
							ring: ring,
							spoke: i,
						});

						if (ring > 1) {
							const prevNodeIndex = nodeId - 2;
							const currentNodeIndex = nodeId - 1;

							let roadType = "major";
							if (i % 2 === 0) {
								roadType = "highway";
							}

							edges.push({
								from: prevNodeIndex,
								to: currentNodeIndex,
								type: roadType,
							});
						} else {
							edges.push({
								from: 0,
								to: nodeId - 1,
								type: "highway",
							});
						}
					}
				}

				for (let ring = 1; ring <= rings; ring++) {
					for (let i = 0; i < numSpokes; i++) {
						const currentNode = nodes.find(
							(n) => n.ring === ring && n.spoke === i
						);
						const nextNode = nodes.find(
							(n) => n.ring === ring && n.spoke === (i + 1) % numSpokes
						);

						if (currentNode && nextNode) {
							let roadType = "minor";
							if (ring === 1) {
								roadType = "major";
							} else if (ring === rings) {
								roadType = "highway";
							}

							edges.push({
								from: currentNode.id,
								to: nextNode.id,
								type: roadType,
							});
						}
					}
				}

				for (let i = 0; i < numSpokes; i++) {
					for (let ring = 1; ring < rings; ring++) {
						if (Math.random() < 0.3) {
							const currentNode = nodes.find(
								(n) => n.ring === ring && n.spoke === i
							);
							const nextRingNode = nodes.find(
								(n) => n.ring === ring + 1 && n.spoke === (i + 1) % numSpokes
							);

							if (currentNode && nextRingNode) {
								edges.push({
									from: currentNode.id,
									to: nextRingNode.id,
									type: "minor",
								});
							}
						}
					}
				}
			}

			function generateKushLayout(nodeCount) {
				const centerX = canvas.width / 2;
				const centerY = canvas.height / 2;
				const cityRadius = Math.min(canvas.width, canvas.height) * 0.45;

				const useRingRoad = Math.random() < 0.5;

				const zones = {
					downtown: { x: centerX, y: centerY, radius: cityRadius * 0.15 },
					commercial: { x: 0, y: 0, radius: cityRadius * 0.2 },
					industrial: { x: 0, y: 0, radius: cityRadius * 0.2 },
					residential1: { x: 0, y: 0, radius: cityRadius * 0.25 },
					residential2: { x: 0, y: 0, radius: cityRadius * 0.25 },
					residential3: { x: 0, y: 0, radius: cityRadius * 0.25 },
				};

				const zoneAngles = {
					commercial: Math.random() * Math.PI * 0.5,
					industrial: Math.random() * Math.PI * 0.5 + Math.PI,
					residential1: Math.random() * Math.PI * 0.3 + Math.PI * 0.5,
					residential2: Math.random() * Math.PI * 0.3 + Math.PI * 0.9,
					residential3: Math.random() * Math.PI * 0.3 + Math.PI * 1.5,
				};

				for (const zone in zoneAngles) {
					const angle = zoneAngles[zone];
					const distance = cityRadius * 0.6;
					zones[zone].x = centerX + Math.cos(angle) * distance;
					zones[zone].y = centerY + Math.sin(angle) * distance;
				}

				const downtownGrid = 3;
				const downtownSpacing = zones.downtown.radius / (downtownGrid - 0.5);

				nodes.push({
					id: 0,
					x: centerX,
					y: centerY,
					type: "major_intersection",
					zone: "downtown",
				});

				let nodeId = 1;
				for (let row = -1; row <= 1; row++) {
					for (let col = -1; col <= 1; col++) {
						if (row === 0 && col === 0) continue;

						const x = centerX + col * downtownSpacing;
						const y = centerY + row * downtownSpacing;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: "traffic_light",
							zone: "downtown",
						});

						if (Math.abs(row) + Math.abs(col) === 1) {
							edges.push({
								from: 0,
								to: nodeId,
								type: "major",
							});
						} else {
							const adjacentNodes = nodes.filter(
								(n) =>
									n.zone === "downtown" &&
									((Math.abs(n.x - x) < downtownSpacing * 1.1 &&
										Math.abs(n.y - y) < 0.1) ||
										(Math.abs(n.y - y) < downtownSpacing * 1.1 &&
											Math.abs(n.x - x) < 0.1))
							);

							for (const adjNode of adjacentNodes) {
								edges.push({
									from: nodeId,
									to: adjNode.id,
									type: "major",
								});
							}
						}

						nodeId++;
					}
				}

				if (useRingRoad) {
					const ringSegments = 8;
					const ringNodes = [];

					for (let i = 0; i < ringSegments; i++) {
						const angle = (2 * Math.PI * i) / ringSegments;
						const x = centerX + Math.cos(angle) * cityRadius * 0.8;
						const y = centerY + Math.sin(angle) * cityRadius * 0.8;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: "major_intersection",
							zone: "highway",
							ring: true,
							ringPosition: i,
						});

						ringNodes.push(nodeId);
						nodeId++;
					}

					for (let i = 0; i < ringNodes.length; i++) {
						const nextIndex = (i + 1) % ringNodes.length;
						edges.push({
							from: ringNodes[i],
							to: ringNodes[nextIndex],
							type: "highway",
						});
					}

					const connectionCount = 2 + Math.floor(Math.random() * 3);
					const downtownNodes = nodes.filter((n) => n.zone === "downtown");

					for (let i = 0; i < connectionCount; i++) {
						const downtownNode =
							downtownNodes[Math.floor(Math.random() * downtownNodes.length)];
						const ringNode =
							ringNodes[Math.floor(Math.random() * ringNodes.length)];

						edges.push({
							from: downtownNode.id,
							to: ringNode,
							type: "major",
						});
					}
				} else {
					const highwayAngle = Math.random() * Math.PI;
					const highwayLength = cityRadius * 2.2;
					const highwaySegments = 5;
					const highwayNodes = [];

					for (let i = 0; i < highwaySegments; i++) {
						const t = i / (highwaySegments - 1) - 0.5;
						const x = centerX + Math.cos(highwayAngle) * highwayLength * t;
						const y = centerY + Math.sin(highwayAngle) * highwayLength * t;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: "major_intersection",
							zone: "highway",
							highway: true,
							highwayPosition: i,
						});

						highwayNodes.push(nodeId);
						nodeId++;
					}

					for (let i = 0; i < highwayNodes.length - 1; i++) {
						edges.push({
							from: highwayNodes[i],
							to: highwayNodes[i + 1],
							type: "highway",
						});
					}

					const connectionCount = 1 + Math.floor(Math.random() * 2);
					const downtownNodes = nodes.filter((n) => n.zone === "downtown");
					const midHighwayNodes = highwayNodes.slice(
						1,
						highwayNodes.length - 1
					);

					for (let i = 0; i < connectionCount; i++) {
						const downtownNode =
							downtownNodes[Math.floor(Math.random() * downtownNodes.length)];
						const highwayNode =
							midHighwayNodes[
								Math.floor(Math.random() * midHighwayNodes.length)
							];

						edges.push({
							from: downtownNode.id,
							to: highwayNode,
							type: "major",
						});
					}
				}

				const commercialGrid = 4;
				const commercialSpacing =
					zones.commercial.radius / (commercialGrid - 0.5);
				const commercialNodes = [];

				for (let row = 0; row < commercialGrid; row++) {
					for (let col = 0; col < commercialGrid; col++) {
						const x =
							zones.commercial.x +
							(col - commercialGrid / 2 + 0.5) * commercialSpacing;
						const y =
							zones.commercial.y +
							(row - commercialGrid / 2 + 0.5) * commercialSpacing;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: row === 0 || col === 0 ? "traffic_light" : "intersection",
							zone: "commercial",
						});

						commercialNodes.push(nodeId);
						nodeId++;
					}
				}

				for (let i = 0; i < commercialNodes.length; i++) {
					const row = Math.floor(i / commercialGrid);
					const col = i % commercialGrid;
					const currentNode = commercialNodes[i];

					if (col < commercialGrid - 1) {
						const rightNeighbor = commercialNodes[i + 1];
						edges.push({
							from: currentNode,
							to: rightNeighbor,
							type: row === 0 ? "major" : "minor",
						});
					}

					if (row < commercialGrid - 1) {
						const bottomNeighbor = commercialNodes[i + commercialGrid];
						edges.push({
							from: currentNode,
							to: bottomNeighbor,
							type: col === 0 ? "major" : "minor",
						});
					}
				}

				const industrialGrid = 3;
				const industrialSpacing =
					zones.industrial.radius / (industrialGrid - 0.5);
				const industrialNodes = [];

				for (let row = 0; row < industrialGrid; row++) {
					for (let col = 0; col < industrialGrid; col++) {
						const x =
							zones.industrial.x +
							(col - industrialGrid / 2 + 0.5) * industrialSpacing;
						const y =
							zones.industrial.y +
							(row - industrialGrid / 2 + 0.5) * industrialSpacing;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: "intersection",
							zone: "industrial",
						});

						industrialNodes.push(nodeId);
						nodeId++;
					}
				}

				for (let i = 0; i < industrialNodes.length; i++) {
					const row = Math.floor(i / industrialGrid);
					const col = i % industrialGrid;
					const currentNode = industrialNodes[i];

					if (col < industrialGrid - 1) {
						const rightNeighbor = industrialNodes[i + 1];
						edges.push({
							from: currentNode,
							to: rightNeighbor,
							type: "minor",
						});
					}

					if (row < industrialGrid - 1) {
						const bottomNeighbor = industrialNodes[i + industrialGrid];
						edges.push({
							from: currentNode,
							to: bottomNeighbor,
							type: "minor",
						});
					}
				}

				const residentialZones = [
					"residential1",
					"residential2",
					"residential3",
				];

				for (const zoneKey of residentialZones) {
					const zone = zones[zoneKey];
					const arterialCount = 3 + Math.floor(Math.random() * 2);
					const arterialNodes = [];

					for (let i = 0; i < arterialCount; i++) {
						const angle = (Math.PI * 2 * i) / arterialCount;
						const x = zone.x + Math.cos(angle) * zone.radius * 0.8;
						const y = zone.y + Math.sin(angle) * zone.radius * 0.8;

						nodes.push({
							id: nodeId,
							x: x,
							y: y,
							type: "intersection",
							zone: zoneKey,
							arterial: true,
						});

						arterialNodes.push(nodeId);
						nodeId++;
					}

					nodes.push({
						id: nodeId,
						x: zone.x,
						y: zone.y,
						type: "traffic_light",
						zone: zoneKey,
						center: true,
					});

					const centerNodeId = nodeId;
					nodeId++;

					for (const arterialNode of arterialNodes) {
						edges.push({
							from: centerNodeId,
							to: arterialNode,
							type: "minor",
						});
					}

					for (const arterialNode of arterialNodes) {
						const arterialNodeObj = nodes.find((n) => n.id === arterialNode);
						const angle = Math.atan2(
							arterialNodeObj.y - zone.y,
							arterialNodeObj.x - zone.x
						);

						const localRoadCount = 2 + Math.floor(Math.random() * 2);

						for (let i = 0; i < localRoadCount; i++) {
							const sideAngle = angle + (Math.random() * 0.6 - 0.3);
							const distance = zone.radius * 0.3 * (0.7 + Math.random() * 0.6);
							const x = arterialNodeObj.x + Math.cos(sideAngle) * distance;
							const y = arterialNodeObj.y + Math.sin(sideAngle) * distance;

							let tooClose = false;
							for (const node of nodes) {
								const dist = Math.sqrt(
									Math.pow(node.x - x, 2) + Math.pow(node.y - y, 2)
								);
								if (dist < zone.radius * 0.15) {
									tooClose = true;
									break;
								}
							}

							if (tooClose) continue;

							nodes.push({
								id: nodeId,
								x: x,
								y: y,
								type: "intersection",
								zone: zoneKey,
								local: true,
							});

							edges.push({
								from: arterialNode,
								to: nodeId,
								type: "local",
							});

							if (Math.random() < 0.7) {
								const culdesacAngle = sideAngle + (Math.random() * 0.4 - 0.2);
								const culdesacDistance = zone.radius * 0.15;
								const culdesacX =
									x + Math.cos(culdesacAngle) * culdesacDistance;
								const culdesacY =
									y + Math.sin(culdesacAngle) * culdesacDistance;

								nodeId++;
								nodes.push({
									id: nodeId,
									x: culdesacX,
									y: culdesacY,
									type: "intersection",
									zone: zoneKey,
									culdesac: true,
								});

								edges.push({
									from: nodeId - 1,
									to: nodeId,
									type: "local",
								});
							}

							nodeId++;
						}
					}
				}

				const highwayNodes = nodes.filter((n) => n.zone === "highway");

				const commercialCenter = nodes.find(
					(n) =>
						n.zone === "commercial" &&
						n.x === zones.commercial.x &&
						n.y === zones.commercial.y
				);
				if (commercialCenter) {
					let closestHighway = null;
					let minDist = Infinity;

					for (const highway of highwayNodes) {
						const dist = Math.sqrt(
							Math.pow(highway.x - commercialCenter.x, 2) +
								Math.pow(highway.y - commercialCenter.y, 2)
						);

						if (dist < minDist) {
							minDist = dist;
							closestHighway = highway;
						}
					}

					if (closestHighway) {
						edges.push({
							from: commercialCenter.id,
							to: closestHighway.id,
							type: "major",
						});
					}
				}

				const industrialCenter = nodes.find(
					(n) =>
						n.zone === "industrial" &&
						n.x === zones.industrial.x &&
						n.y === zones.industrial.y
				);
				if (industrialCenter) {
					let closestHighway = null;
					let minDist = Infinity;

					for (const highway of highwayNodes) {
						const dist = Math.sqrt(
							Math.pow(highway.x - industrialCenter.x, 2) +
								Math.pow(highway.y - industrialCenter.y, 2)
						);

						if (dist < minDist) {
							minDist = dist;
							closestHighway = highway;
						}
					}

					if (closestHighway) {
						edges.push({
							from: industrialCenter.id,
							to: closestHighway.id,
							type: "major",
						});
					}
				}

				for (const zoneKey of residentialZones) {
					const centerNode = nodes.find((n) => n.zone === zoneKey && n.center);
					if (!centerNode) continue;

					if (highwayNodes.length > 0) {
						let closestHighway = null;
						let minDist = Infinity;

						for (const highway of highwayNodes) {
							const dist = Math.sqrt(
								Math.pow(highway.x - centerNode.x, 2) +
									Math.pow(highway.y - centerNode.y, 2)
							);

							if (dist < minDist) {
								minDist = dist;
								closestHighway = highway;
							}
						}

						if (closestHighway) {
							edges.push({
								from: centerNode.id,
								to: closestHighway.id,
								type: "major",
							});
						}
					}

					const downtownNode = nodes.find(
						(n) => n.zone === "downtown" && n.id !== 0
					);
					if (downtownNode) {
						edges.push({
							from: centerNode.id,
							to: downtownNode.id,
							type: "major",
						});
					}
				}

				const zoneCenters = nodes.filter(
					(n) => n.center || n.zone === "downtown"
				);

				for (let i = 0; i < zoneCenters.length; i++) {
					for (let j = i + 1; j < zoneCenters.length; j++) {
						if (Math.random() < 0.6) {
							edges.push({
								from: zoneCenters[i].id,
								to: zoneCenters[j].id,
								type: "major",
							});
						}
					}
				}

				ensureFullConnectivity();
			}

			function fixNetworkConnectivity() {
				edges = edges.filter((edge) => edge.from !== edge.to);

				const existingEdges = new Set();
				const edgesToAdd = [];

				for (const edge of edges) {
					existingEdges.add(`${edge.from}-${edge.to}`);
				}

				for (const edge of edges) {
					const reverseKey = `${edge.to}-${edge.from}`;
					if (!existingEdges.has(reverseKey)) {
						edgesToAdd.push({
							from: edge.to,
							to: edge.from,
							type: edge.type,
						});
					}
				}

				edges = edges.concat(edgesToAdd);

				console.log(
					`Fixed network connectivity: Removed self-loops and added ${edgesToAdd.length} bidirectional connections`
				);
			}

			function ensureFullConnectivity() {
				const visited = new Set();
				const components = [];

				function dfs(nodeId, component) {
					if (visited.has(nodeId)) return;
					visited.add(nodeId);
					component.push(nodeId);

					for (const edge of edges) {
						if (edge.from === nodeId && !visited.has(edge.to)) {
							dfs(edge.to, component);
						} else if (edge.to === nodeId && !visited.has(edge.from)) {
							dfs(edge.from, component);
						}
					}
				}

				for (const node of nodes) {
					if (!visited.has(node.id)) {
						const component = [];
						dfs(node.id, component);
						components.push(component);
					}
				}

				if (components.length > 1) {
					console.log(
						`Found ${components.length} disconnected components, connecting them...`
					);

					const mainComponent = components.reduce(
						(largest, current) =>
							current.length > largest.length ? current : largest,
						components[0]
					);

					for (const component of components) {
						if (component === mainComponent) continue;

						let minDist = Infinity;
						let closestMain = null;
						let closestCurrent = null;

						for (const mainNodeId of mainComponent) {
							const mainNode = nodes.find((n) => n.id === mainNodeId);

							for (const currentNodeId of component) {
								const currentNode = nodes.find((n) => n.id === currentNodeId);

								const dist = Math.sqrt(
									Math.pow(mainNode.x - currentNode.x, 2) +
										Math.pow(mainNode.y - currentNode.y, 2)
								);

								if (dist < minDist) {
									minDist = dist;
									closestMain = mainNodeId;
									closestCurrent = currentNodeId;
								}
							}
						}

						if (closestMain !== null && closestCurrent !== null) {
							edges.push({
								from: closestMain,
								to: closestCurrent,
								type: "major",
							});

							if (component.length > 1 && mainComponent.length > 1) {
								let secondMinDist = Infinity;
								let secondClosestMain = null;
								let secondClosestCurrent = null;

								for (const mainNodeId of mainComponent) {
									if (mainNodeId === closestMain) continue;
									const mainNode = nodes.find((n) => n.id === mainNodeId);

									for (const currentNodeId of component) {
										if (currentNodeId === closestCurrent) continue;
										const currentNode = nodes.find(
											(n) => n.id === currentNodeId
										);

										const dist = Math.sqrt(
											Math.pow(mainNode.x - currentNode.x, 2) +
												Math.pow(mainNode.y - currentNode.y, 2)
										);

										if (dist < secondMinDist) {
											secondMinDist = dist;
											secondClosestMain = mainNodeId;
											secondClosestCurrent = currentNodeId;
										}
									}
								}

								if (
									secondClosestMain !== null &&
									secondClosestCurrent !== null
								) {
									edges.push({
										from: secondClosestMain,
										to: secondClosestCurrent,
										type: "minor",
									});
								}
							}
						}
					}
				}
			}

			function generateOrganicLayout(nodeCount) {
				const centerX = canvas.width / 2;
				const centerY = canvas.height / 2;
				const radius = Math.min(canvas.width, canvas.height) * 0.4;

				nodes.push({
					id: 0,
					x: centerX,
					y: centerY,
					type: "major_intersection",
					zone: "cbd",
				});

				const cbdNodeCount = 5;
				const cbdRadius = radius * 0.2;

				for (let i = 0; i < cbdNodeCount; i++) {
					const angle = (2 * Math.PI * i) / cbdNodeCount;
					const distance = cbdRadius * (0.5 + Math.random() * 0.5);

					const x = centerX + distance * Math.cos(angle);
					const y = centerY + distance * Math.sin(angle);

					nodes.push({
						id: i + 1,
						x: x,
						y: y,
						type: "traffic_light",
						zone: "cbd",
					});

					edges.push({
						from: 0,
						to: i + 1,
						type: "major",
					});
				}

				const neighborhoods = 4 + Math.floor(Math.random() * 3);
				const neighborhoodCenters = [];

				for (let i = 0; i < neighborhoods; i++) {
					const angle = (2 * Math.PI * i) / neighborhoods;
					const distance = radius * (0.5 + Math.random() * 0.3);

					const x = centerX + distance * Math.cos(angle);
					const y = centerY + distance * Math.sin(angle);

					const nodeId = nodes.length;

					nodes.push({
						id: nodeId,
						x: x,
						y: y,
						type: "major_intersection",
						zone: "neighborhood",
					});

					neighborhoodCenters.push({
						id: nodeId,
						x: x,
						y: y,
						angle: angle,
					});

					const cbdNodeIndex = Math.floor(Math.random() * (cbdNodeCount + 1));

					edges.push({
						from: cbdNodeIndex,
						to: nodeId,
						type: "highway",
					});
				}

				const nodesPerNeighborhood = Math.floor(
					(nodeCount - nodes.length) / neighborhoods
				);

				for (const center of neighborhoodCenters) {
					const useGrid = Math.random() > 0.5;
					const neighborhoodRadius = radius * 0.25;

					if (useGrid) {
						const gridSize = 2 + Math.floor(Math.random() * 2);
						const cellSize = neighborhoodRadius / gridSize;

						for (let row = -gridSize; row <= gridSize; row++) {
							for (let col = -gridSize; col <= gridSize; col++) {
								if (row === 0 && col === 0) continue;

								const jitterX = (Math.random() - 0.5) * cellSize * 0.3;
								const jitterY = (Math.random() - 0.5) * cellSize * 0.3;

								const x = center.x + col * cellSize + jitterX;
								const y = center.y + row * cellSize + jitterY;

								if (x < 0 || x > canvas.width || y < 0 || y > canvas.height)
									continue;

								const nodeId = nodes.length;

								nodes.push({
									id: nodeId,
									x: x,
									y: y,
									type: "intersection",
									zone: "neighborhood",
								});

								const connectToCenter = Math.abs(row) + Math.abs(col) === 1;

								if (connectToCenter) {
									edges.push({
										from: center.id,
										to: nodeId,
										type: "minor",
									});
								} else {
									for (const node of nodes) {
										if (node.id === nodeId) continue;

										const dx = node.x - x;
										const dy = node.y - y;
										const dist = Math.sqrt(dx * dx + dy * dy);

										if (dist < cellSize * 1.5) {
											edges.push({
												from: node.id,
												to: nodeId,
												type: "local",
											});
										}
									}
								}
							}
						}
					} else {
						for (let i = 0; i < nodesPerNeighborhood; i++) {
							const angle = Math.random() * 2 * Math.PI;
							const distance = neighborhoodRadius * Math.random();

							const x = center.x + distance * Math.cos(angle);
							const y = center.y + distance * Math.sin(angle);

							if (x < 0 || x > canvas.width || y < 0 || y > canvas.height)
								continue;

							const nodeId = nodes.length;

							nodes.push({
								id: nodeId,
								x: x,
								y: y,
								type: "intersection",
								zone: "neighborhood",
							});

							if (Math.random() < 0.3) {
								edges.push({
									from: center.id,
									to: nodeId,
									type: "minor",
								});
							}

							for (const node of nodes) {
								if (node.id === nodeId) continue;

								const dx = node.x - x;
								const dy = node.y - y;
								const dist = Math.sqrt(dx * dx + dy * dy);

								if (dist < neighborhoodRadius * 0.3 && Math.random() < 0.5) {
									edges.push({
										from: node.id,
										to: nodeId,
										type: "local",
									});
								}
							}
						}
					}
				}

				for (let i = 0; i < neighborhoods; i++) {
					for (let j = i + 1; j < neighborhoods; j++) {
						if (Math.random() < 0.3) {
							const from = neighborhoodCenters[i].id;
							const to = neighborhoodCenters[j].id;

							edges.push({
								from: from,
								to: to,
								type: "major",
							});
						}
					}
				}
			}

			function generatePOIs() {
				pois = [];

				const currentLayout = document.querySelector(
					'input[name="layoutType"]:checked'
				).value;

				if (currentLayout === "kush") {
					generateKushPOIs();
				} else {
					generateRandomPOIs();
				}

				const counterElements = document.querySelectorAll(
					'[id^="poi-counter-"]'
				);
				for (const element of counterElements) {
					element.remove();
				}
			}

			function generateKushPOIs() {
				let poiId = 0;

				const downtownNodes = nodes.filter((node) => node.zone === "downtown");
				const commercialNodes = nodes.filter(
					(node) => node.zone === "commercial"
				);
				const industrialNodes = nodes.filter(
					(node) => node.zone === "industrial"
				);
				const residential1Nodes = nodes.filter(
					(node) => node.zone === "residential1"
				);
				const residential2Nodes = nodes.filter(
					(node) => node.zone === "residential2"
				);
				const residential3Nodes = nodes.filter(
					(node) => node.zone === "residential3"
				);

				const commercialCount = Math.floor(commercialNodes.length * 0.8);
				const shuffledCommercial = [...commercialNodes].sort(
					() => Math.random() - 0.5
				);

				for (let i = 0; i < commercialCount; i++) {
					if (i < shuffledCommercial.length) {
						pois.push({
							id: poiId++,
							nodeId: shuffledCommercial[i].id,
							type: "commercial",
							x: shuffledCommercial[i].x,
							y: shuffledCommercial[i].y,
						});
					}
				}

				const industrialCount = Math.floor(industrialNodes.length * 0.7);
				const shuffledIndustrial = [...industrialNodes].sort(
					() => Math.random() - 0.5
				);

				for (let i = 0; i < industrialCount; i++) {
					if (i < shuffledIndustrial.length) {
						pois.push({
							id: poiId++,
							nodeId: shuffledIndustrial[i].id,
							type: "industrial",
							x: shuffledIndustrial[i].x,
							y: shuffledIndustrial[i].y,
						});
					}
				}

				const assignResidentialPOIs = (residentialNodes) => {
					const residentialCount = Math.floor(residentialNodes.length * 0.6);
					const shuffledResidential = [...residentialNodes].sort(
						() => Math.random() - 0.5
					);

					for (let i = 0; i < residentialCount; i++) {
						if (i < shuffledResidential.length) {
							if (
								shuffledResidential[i].local ||
								shuffledResidential[i].culdesac ||
								Math.random() < 0.7
							) {
								pois.push({
									id: poiId++,
									nodeId: shuffledResidential[i].id,
									type: "residential",
									x: shuffledResidential[i].x,
									y: shuffledResidential[i].y,
								});
							}
						}
					}
				};

				assignResidentialPOIs(residential1Nodes);
				assignResidentialPOIs(residential2Nodes);
				assignResidentialPOIs(residential3Nodes);

				const downtownCommercialCount = Math.floor(downtownNodes.length * 0.4);
				const downtownRecreationalCount = Math.floor(
					downtownNodes.length * 0.3
				);
				const downtownResidentialCount = Math.floor(downtownNodes.length * 0.2);

				const shuffledDowntown = [...downtownNodes].sort(
					() => Math.random() - 0.5
				);
				let downtownIndex = 0;

				for (let i = 0; i < downtownCommercialCount; i++) {
					if (downtownIndex < shuffledDowntown.length) {
						pois.push({
							id: poiId++,
							nodeId: shuffledDowntown[downtownIndex].id,
							type: "commercial",
							x: shuffledDowntown[downtownIndex].x,
							y: shuffledDowntown[downtownIndex].y,
						});
						downtownIndex++;
					}
				}

				for (let i = 0; i < downtownRecreationalCount; i++) {
					if (downtownIndex < shuffledDowntown.length) {
						pois.push({
							id: poiId++,
							nodeId: shuffledDowntown[downtownIndex].id,
							type: "recreational",
							x: shuffledDowntown[downtownIndex].x,
							y: shuffledDowntown[downtownIndex].y,
						});
						downtownIndex++;
					}
				}

				for (let i = 0; i < downtownResidentialCount; i++) {
					if (downtownIndex < shuffledDowntown.length) {
						pois.push({
							id: poiId++,
							nodeId: shuffledDowntown[downtownIndex].id,
							type: "residential",
							x: shuffledDowntown[downtownIndex].x,
							y: shuffledDowntown[downtownIndex].y,
						});
						downtownIndex++;
					}
				}

				const allResidentialNodes = [
					...residential1Nodes,
					...residential2Nodes,
					...residential3Nodes,
				];
				const parkCount = Math.floor(allResidentialNodes.length * 0.05);

				const shuffledForParks = [...allResidentialNodes].sort(
					() => Math.random() - 0.5
				);

				for (let i = 0; i < parkCount; i++) {
					if (i < shuffledForParks.length) {
						const existingPOI = pois.find(
							(poi) => poi.nodeId === shuffledForParks[i].id
						);

						if (!existingPOI) {
							pois.push({
								id: poiId++,
								nodeId: shuffledForParks[i].id,
								type: "recreational",
								x: shuffledForParks[i].x,
								y: shuffledForParks[i].y,
							});
						}
					}
				}
			}

			function generateRandomPOIs() {
				const poiCount = Math.floor(nodes.length * 0.3);
				const poiTypeKeys = Object.keys(poiTypes);

				for (let i = 0; i < poiCount; i++) {
					let nodeIndex;
					let attempts = 0;
					let validNode = false;

					while (!validNode && attempts < 50) {
						nodeIndex = Math.floor(Math.random() * nodes.length);

						const existingPOI = pois.find((poi) => poi.nodeId === nodeIndex);

						if (!existingPOI) {
							validNode = true;
						}

						attempts++;
					}

					if (validNode) {
						const poiType =
							poiTypeKeys[Math.floor(Math.random() * poiTypeKeys.length)];

						pois.push({
							id: i,
							nodeId: nodeIndex,
							type: poiType,
							x: nodes[nodeIndex].x,
							y: nodes[nodeIndex].y,
						});
					}
				}
			}

			function generateBackgroundElements() {
				const parkCount = 3 + Math.floor(Math.random() * 5);

				for (let i = 0; i < parkCount; i++) {
					const x = Math.random() * canvas.width;
					const y = Math.random() * canvas.height;
					const size = 30 + Math.random() * 70;

					let overlaps = false;

					for (const edge of edges) {
						const from = nodes[edge.from];
						const to = nodes[edge.to];

						const dist = distanceToLineSegment(
							x,
							y,
							from.x,
							from.y,
							to.x,
							to.y
						);

						if (dist < size / 2 + roadTypes[edge.type].width) {
							overlaps = true;
							break;
						}
					}

					if (!overlaps) {
						backgroundElements.parks.push({
							x: x,
							y: y,
							size: size,
						});
					}
				}

				if (Math.random() < 0.5) {
					const x = Math.random() * canvas.width;
					const y = Math.random() * canvas.height;
					const width = 100 + Math.random() * 200;
					const height = 50 + Math.random() * 100;

					backgroundElements.water.push({
						x: x,
						y: y,
						width: width,
						height: height,
					});
				}

				const buildingCount = 50 + Math.floor(Math.random() * 50);

				for (let i = 0; i < buildingCount; i++) {
					const x = Math.random() * canvas.width;
					const y = Math.random() * canvas.height;
					const size = 5 + Math.random() * 15;

					let nearRoad = false;
					let onRoad = false;

					for (const edge of edges) {
						const from = nodes[edge.from];
						const to = nodes[edge.to];

						const dist = distanceToLineSegment(
							x,
							y,
							from.x,
							from.y,
							to.x,
							to.y
						);

						if (dist < size + roadTypes[edge.type].width) {
							onRoad = true;
							break;
						}

						if (dist < 50) {
							nearRoad = true;
						}
					}

					let inPark = false;

					for (const park of backgroundElements.parks) {
						const dist = distance(x, y, park.x, park.y);

						if (dist < park.size / 2) {
							inPark = true;
							break;
						}
					}

					let inWater = false;

					for (const water of backgroundElements.water) {
						if (
							x > water.x - water.width / 2 &&
							x < water.x + water.width / 2 &&
							y > water.y - water.height / 2 &&
							y < water.y + water.height / 2
						) {
							inWater = true;
							break;
						}
					}

					if (nearRoad && !onRoad && !inPark && !inWater) {
						backgroundElements.buildings.push({
							x: x,
							y: y,
							size: size,
							color: getBuildingColor(),
						});
					}
				}
			}

			function determineRoadType(from, to) {
				if (
					from.type === "major_intersection" &&
					to.type === "major_intersection"
				) {
					return "highway";
				}

				if (
					from.type === "traffic_light" ||
					to.type === "traffic_light" ||
					from.type === "major_intersection" ||
					to.type === "major_intersection"
				) {
					return "major";
				}

				if (Math.random() < 0.7) {
					return "minor";
				}

				return "local";
			}

			function drawNetwork() {
				ctx.fillStyle = "#1f2022";
				ctx.fillRect(0, 0, canvas.width, canvas.height);

				drawGrid();

				drawBackgroundElements();

				for (let i = 0; i < edges.length; i++) {
					const edge = edges[i];
					const from = nodes[edge.from];
					const to = nodes[edge.to];
					drawRoad(from.x, from.y, to.x, to.y, edge.type, i);
				}

				for (const node of nodes) {
					drawIntersection(node.x, node.y, node.type);
				}

				for (const poi of pois) {
					drawPOI(poi.x, poi.y, poi.type, poi);
				}

				if (simulationRunning && vehicles.length > 0) {
					drawVehicles();
				}
			}

			function drawBackgroundElements() {
				for (const water of backgroundElements.water) {
					ctx.fillStyle = "rgba(100, 150, 200, 0.3)";
					ctx.beginPath();
					ctx.ellipse(
						water.x,
						water.y,
						water.width / 2,
						water.height / 2,
						0,
						0,
						Math.PI * 2
					);
					ctx.fill();

					ctx.strokeStyle = "rgba(120, 170, 220, 0.3)";
					ctx.lineWidth = 1;

					for (let i = 0.8; i > 0.2; i -= 0.2) {
						ctx.beginPath();
						ctx.ellipse(
							water.x,
							water.y,
							(water.width / 2) * i,
							(water.height / 2) * i,
							0,
							0,
							Math.PI * 2
						);
						ctx.stroke();
					}
				}

				for (const park of backgroundElements.parks) {
					ctx.fillStyle = "rgba(100, 150, 100, 0.3)";
					ctx.beginPath();
					ctx.arc(park.x, park.y, park.size / 2, 0, Math.PI * 2);
					ctx.fill();

					const treeCount = Math.floor(park.size / 10);

					for (let i = 0; i < treeCount; i++) {
						const angle = Math.random() * Math.PI * 2;
						const distance = ((Math.random() * park.size) / 2) * 0.8;

						const treeX = park.x + distance * Math.cos(angle);
						const treeY = park.y + distance * Math.sin(angle);

						ctx.fillStyle = "#5a4a30";
						ctx.beginPath();
						ctx.rect(treeX - 1, treeY - 3, 2, 6);
						ctx.fill();

						ctx.fillStyle = "#4a7a55";
						ctx.beginPath();
						ctx.arc(treeX, treeY - 5, 4, 0, Math.PI * 2);
						ctx.fill();
					}
				}

				for (const building of backgroundElements.buildings) {
					ctx.fillStyle = building.color;
					ctx.beginPath();
					ctx.rect(
						building.x - building.size / 2,
						building.y - building.size / 2,
						building.size,
						building.size
					);
					ctx.fill();

					ctx.strokeStyle = "#353a40";
					ctx.lineWidth = 1;
					ctx.stroke();

					ctx.fillStyle = "rgba(126, 186, 181, 0.5)";

					const windowSize = building.size / 4;
					const windowPadding = windowSize / 2;

					for (let row = 0; row < 2; row++) {
						for (let col = 0; col < 2; col++) {
							const windowX =
								building.x -
								building.size / 2 +
								windowPadding +
								col * (windowSize + windowPadding);
							const windowY =
								building.y -
								building.size / 2 +
								windowPadding +
								row * (windowSize + windowPadding);

							ctx.beginPath();
							ctx.rect(windowX, windowY, windowSize, windowSize);
							ctx.fill();
						}
					}
				}
			}

			function drawGrid() {
				ctx.strokeStyle = "#353a40";
				ctx.lineWidth = 1;

				const gridSize = 50;

				for (let x = 0; x <= canvas.width; x += gridSize) {
					ctx.beginPath();
					ctx.moveTo(x, 0);
					ctx.lineTo(x, canvas.height);
					ctx.stroke();
				}

				for (let y = 0; y <= canvas.height; y += gridSize) {
					ctx.beginPath();
					ctx.moveTo(0, y);
					ctx.lineTo(canvas.width, y);
					ctx.stroke();
				}
			}

			function drawRoad(x1, y1, x2, y2, roadType, edgeIndex) {
				const roadInfo = roadTypes[roadType];

				const dx = x2 - x1;
				const dy = y2 - y1;
				const angle = Math.atan2(dy, dx);
				const length = Math.sqrt(dx * dx + dy * dy);

				let congestionLevel = 0;
				if (edgeIndex !== undefined && simulationRunning) {
					let vehiclesOnEdge = 0;
					for (const vehicle of vehicles) {
						if (vehicle.edgeIndex === edgeIndex) {
							vehiclesOnEdge++;
						}
					}

					congestionLevel = Math.min(1, vehiclesOnEdge / (roadInfo.lanes * 3));
				}

				let roadColor = roadInfo.color;
				if (congestionLevel > 0) {
					const normalColor = parseInt(roadInfo.color.slice(1), 16);
					const r = (normalColor >> 16) & 255;
					const g = (normalColor >> 8) & 255;
					const b = normalColor & 255;

					const congestionR = 255;
					const congestionG = 0;
					const congestionB = 0;

					const mixedR = Math.floor(r + (congestionR - r) * congestionLevel);
					const mixedG = Math.floor(g + (congestionG - g) * congestionLevel);
					const mixedB = Math.floor(b + (congestionB - b) * congestionLevel);

					roadColor = `rgb(${mixedR}, ${mixedG}, ${mixedB})`;
				}

				ctx.strokeStyle = roadColor;
				ctx.lineWidth = roadInfo.width;
				ctx.lineCap = "round";

				ctx.beginPath();
				ctx.moveTo(x1, y1);
				ctx.lineTo(x2, y2);
				ctx.stroke();

				if (roadInfo.lanes > 1) {
					ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
					ctx.lineWidth = 1;
					ctx.setLineDash([10, 10]);

					ctx.beginPath();
					ctx.moveTo(x1, y1);
					ctx.lineTo(x2, y2);
					ctx.stroke();

					ctx.setLineDash([]);
				}

				if (roadType === "highway") {
					const perpX = -dy / length;
					const perpY = dx / length;
					const edgeOffset = (roadInfo.width / 2) * 0.8;

					ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
					ctx.lineWidth = 1;

					ctx.beginPath();
					ctx.moveTo(x1 + perpX * edgeOffset, y1 + perpY * edgeOffset);
					ctx.lineTo(x2 + perpX * edgeOffset, y2 + perpY * edgeOffset);
					ctx.stroke();

					ctx.beginPath();
					ctx.moveTo(x1 - perpX * edgeOffset, y1 - perpY * edgeOffset);
					ctx.lineTo(x2 - perpX * edgeOffset, y2 - perpY * edgeOffset);
					ctx.stroke();
				}
			}

			function drawIntersection(x, y, nodeType) {
				if (!intersectionTypes[nodeType]) {
					nodeType = "intersection";
				}

				const intersectionInfo = intersectionTypes[nodeType];

				ctx.fillStyle = intersectionInfo.color;
				ctx.beginPath();
				ctx.arc(x, y, intersectionInfo.radius, 0, Math.PI * 2);
				ctx.fill();

				ctx.fillStyle = intersectionInfo.highlightColor;
				ctx.beginPath();
				ctx.arc(x - 1, y - 1, intersectionInfo.radius / 2, 0, Math.PI * 2);
				ctx.fill();
			}

			function drawPOI(x, y, poiType, poi) {
				if (!poiTypes[poiType]) {
					poiType = "residential";
				}

				const poiInfo = poiTypes[poiType];

				const isHighlighted = poi && poi.highlighted;

				if (isHighlighted) {
					for (let i = 0; i < edges.length; i++) {
						const edge = edges[i];
						const toNode = nodes[edge.to];

						if (edge.to === poi.nodeId) {
							const fromNode = nodes[edge.from];

							ctx.strokeStyle = "#2196F3";
							ctx.lineWidth = 4;
							ctx.beginPath();
							ctx.moveTo(fromNode.x, fromNode.y);
							ctx.lineTo(toNode.x, toNode.y);
							ctx.stroke();

							const angle = Math.atan2(
								toNode.y - fromNode.y,
								toNode.x - fromNode.x
							);
							const arrowSize = 10;

							ctx.beginPath();
							ctx.moveTo(toNode.x, toNode.y);
							ctx.lineTo(
								toNode.x - arrowSize * Math.cos(angle - Math.PI / 6),
								toNode.y - arrowSize * Math.sin(angle - Math.PI / 6)
							);
							ctx.lineTo(
								toNode.x - arrowSize * Math.cos(angle + Math.PI / 6),
								toNode.y - arrowSize * Math.sin(angle + Math.PI / 6)
							);
							ctx.closePath();
							ctx.fillStyle = "#2196F3";
							ctx.fill();
						}

						if (edge.from === poi.nodeId) {
							const toNode = nodes[edge.to];

							ctx.strokeStyle = "#FF9800";
							ctx.lineWidth = 4;
							ctx.beginPath();
							ctx.moveTo(x, y);
							ctx.lineTo(toNode.x, toNode.y);
							ctx.stroke();

							const angle = Math.atan2(toNode.y - y, toNode.x - x);
							const arrowSize = 10;

							ctx.beginPath();
							ctx.moveTo(toNode.x, toNode.y);
							ctx.lineTo(
								toNode.x - arrowSize * Math.cos(angle - Math.PI / 6),
								toNode.y - arrowSize * Math.sin(angle - Math.PI / 6)
							);
							ctx.lineTo(
								toNode.x - arrowSize * Math.cos(angle + Math.PI / 6),
								toNode.y - arrowSize * Math.sin(angle + Math.PI / 6)
							);
							ctx.closePath();
							ctx.fillStyle = "#FF9800";
							ctx.fill();
						}
					}
				}

				ctx.fillStyle = poiInfo.color;
				ctx.beginPath();
				ctx.arc(x, y, poiInfo.radius, 0, Math.PI * 2);
				ctx.fill();

				ctx.strokeStyle = isHighlighted ? "#FF9800" : "#fff";
				ctx.lineWidth = isHighlighted ? 3 : 2;
				ctx.beginPath();
				ctx.arc(x, y, poiInfo.radius, 0, Math.PI * 2);
				ctx.stroke();

				ctx.font = "10px Arial";
				ctx.textAlign = "center";
				ctx.textBaseline = "middle";
				ctx.fillStyle = "#fff";
				ctx.fillText(poiInfo.icon, x, y);

				ctx.font = "8px Arial";
				ctx.fillStyle = "#000";
				ctx.fillText(poiInfo.name, x, y + poiInfo.radius + 10);
			}

			function showPOIInfo(poi) {

			function addVehicles(count) {
				if (edges.length === 0) {
					showStatusMessage(
						"Cannot add vehicles: No road network exists!",
						true
					);
					return;
				}

				if (pois.length === 0) {
					showStatusMessage(
						"Cannot add vehicles: No POIs exist in the network!",
						true
					);
					return;
				}

				let addedVehicles = 0;
				let attempts = 0;
				const maxAttempts = count * 3;

				while (addedVehicles < count && attempts < maxAttempts) {
					attempts++;

					const startPoiIndex = Math.floor(Math.random() * pois.length);
					const startPoi = pois[startPoiIndex];
					const startNodeId = startPoi.nodeId;

					const possibleEdges = [];
					for (let j = 0; j < edges.length; j++) {
						const edge = edges[j];
						if (edge.from === startNodeId || edge.to === startNodeId) {
							possibleEdges.push(j);
						}
					}

					if (possibleEdges.length === 0) {
						continue;
					}

					const edgeIndex =
						possibleEdges[Math.floor(Math.random() * possibleEdges.length)];
					const edge = edges[edgeIndex];

					let position;
					if (edge.from === startNodeId) {
						position = 0.1;
					} else {
						position = 0.9;
					}

					const roadInfo = roadTypes[edge.type];

					let destPoiIndex;
					do {
						destPoiIndex = Math.floor(Math.random() * pois.length);
					} while (destPoiIndex === startPoiIndex && pois.length > 1);

					vehicles.push({
						id: vehicles.length,
						edgeIndex: edgeIndex,
						position: position,
						speed: roadInfo.speedLimit * (0.7 + Math.random() * 0.6),
						color: getRandomColor(),
						type: getRandomVehicleType(),
						lane: Math.floor(Math.random() * roadInfo.lanes),
						route: [],
						startPoi: startPoiIndex,
						destPoi: destPoiIndex,
						highlighted: false,

						poiHistory: [
							{
								poiId: startPoi.id,
								poiType: startPoi.type,
								nodeId: startNodeId,
								arrivalTime: Date.now(),
							},
						],
					});

					addedVehicles++;
				}

				vehicleCount.textContent = vehicles.length;

				showStatusMessage(`Added ${count} vehicles to the simulation`);

				drawNetwork();
			}

			function calculateVehiclePath(vehicle) {
				vehicle.futurePath = [vehicle.edgeIndex];

				const destPoi =
					vehicle.destPoi !== undefined ? pois[vehicle.destPoi] : null;
				if (!destPoi) {
					calculateNextDestination(vehicle);

					if (vehicle.destPoi === undefined) {
						calculateRandomPath(vehicle);
						vehicle.completePath = vehicle.futurePath
							? [...vehicle.futurePath]
							: [];
						return;
					}

					return calculateVehiclePath(vehicle);
				}

				const startPoiType =
					vehicle.startPoi !== undefined
						? pois[vehicle.startPoi]?.type
						: "residential";

				const destPoiType = destPoi.type;

				if (startPoiType === destPoiType) {
					if (vehicle.highlighted) {
						console.log(
							"Error: Start and destination POIs are the same type:",
							startPoiType
						);
						console.log("Recalculating destination...");
					}

					vehicle.destPoi = undefined;
					calculateNextDestination(vehicle);
					return calculateVehiclePath(vehicle);
				}

				const destNodeId = destPoi.nodeId;
				const currentEdgeIndex = vehicle.edgeIndex;

				if (currentEdgeIndex < 0 || currentEdgeIndex >= edges.length) {
					console.warn("Invalid edge index:", currentEdgeIndex);
					return;
				}

				const currentNodeId = edges[currentEdgeIndex].to;

				if (currentNodeId === destNodeId) {
					return;
				}

				if (vehicle.highlighted) {
					const destNode = nodes[destNodeId];
					const isDestInCenter = isNodeInCenter(destNode);
					const isDestInDeepCenter = destNode.isInDeepCenter;

					const hasPath = checkConnectivity(currentNodeId, destNodeId);

					const possibleEdges = [];
					for (let i = 0; i < edges.length; i++) {
						if (edges[i].from === currentNodeId) {
							possibleEdges.push(i);
						}
					}
				}

				const path = findPathAStar(
					currentNodeId,
					destNodeId,
					startPoiType,
					destPoiType
				);

				if (path.length > 1) {
					const edgePath = [];
					let validPath = true;

					if (vehicle.highlighted) {
						const centerNodes = path.filter((nodeId) => {
							const node = nodes[nodeId];
							return node && isNodeInCenter(node);
						});

						const destNode = nodes[destNodeId];
						const isDestInCenter = destNode && isNodeInCenter(destNode);
					}

					for (let i = 0; i < path.length - 1; i++) {
						let edgeFound = false;
						for (let j = 0; j < edges.length; j++) {
							if (edges[j].from === path[i] && edges[j].to === path[i + 1]) {
								edgePath.push(j);
								edgeFound = true;
								break;
							}
						}

						if (!edgeFound) {
							console.warn(
								"Could not find edge between nodes:",
								path[i],
								path[i + 1]
							);
							validPath = false;

							if (vehicle.highlighted) {
								const fromNode = nodes[path[i]];
								const toNode = nodes[path[i + 1]];

								const reverseEdges = [];
								for (let k = 0; k < edges.length; k++) {
									if (
										edges[k].from === path[i + 1] &&
										edges[k].to === path[i]
									) {
										reverseEdges.push(k);
									}
								}
							}

							break;
						}
					}

					if (
						edgePath.length > 0 &&
						validPath &&
						edgePath.length === path.length - 1
					) {
						vehicle.futurePath = vehicle.futurePath
							? vehicle.futurePath.concat(edgePath)
							: [...edgePath];
						vehicle.completePath = vehicle.futurePath
							? [...vehicle.futurePath]
							: [];

						if (vehicle.highlighted) {
							const finalEdge = edges[edgePath[edgePath.length - 1]];
							const finalNodeId = finalEdge.to;
						}
						return;
					} else if (vehicle.highlighted) {
						console.warn("  A* path validation failed");
					}
				} else if (vehicle.highlighted) {
					console.warn("A* algorithm returned no valid path");
					console.log("  Falling back to Dijkstra algorithm");
				}

				const dijkstraPath = findShortestPath(currentNodeId, destNodeId);

				if (dijkstraPath.length > 1) {
					const edgePath = [];
					let validPath = true;

					for (let i = 0; i < dijkstraPath.length - 1; i++) {
						let edgeFound = false;
						for (let j = 0; j < edges.length; j++) {
							if (
								edges[j].from === dijkstraPath[i] &&
								edges[j].to === dijkstraPath[i + 1]
							) {
								edgePath.push(j);
								edgeFound = true;
								break;
							}
						}

						if (!edgeFound) {
							console.warn(
								"Could not find edge between nodes:",
								dijkstraPath[i],
								dijkstraPath[i + 1]
							);
							validPath = false;
							break;
						}
					}

					if (
						edgePath.length > 0 &&
						validPath &&
						edgePath.length === dijkstraPath.length - 1
					) {
						vehicle.futurePath = vehicle.futurePath
							? vehicle.futurePath.concat(edgePath)
							: [...edgePath];
						vehicle.completePath = vehicle.futurePath
							? [...vehicle.futurePath]
							: [];

						if (vehicle.highlighted) {
							console.log("Dijkstra path found with", edgePath.length, "edges");
							console.log("Path:", dijkstraPath);
							console.log("Edge path:", edgePath);
						}
						return;
					} else if (vehicle.highlighted) {
						console.warn("Dijkstra path validation failed");
					}
				} else if (vehicle.highlighted) {
					console.warn("Dijkstra algorithm returned no valid path");
				}

				if (vehicle.highlighted) {
					console.log("Falling back to greedy path calculation");
				}
				calculateGreedyPath(vehicle, currentNodeId, destNodeId);

				vehicle.completePath = vehicle.futurePath
					? [...vehicle.futurePath]
					: [];
			}

			function findPathAStar(startNodeId, endNodeId, startPoiType, endPoiType) {
				if (startNodeId === endNodeId) {
					return [startNodeId];
				}

				const openSet = new Set([startNodeId]);
				const closedSet = new Set();

				const cameFrom = {};
				const prevEdgeType = {};

				const gScore = {};
				for (const node of nodes) {
					gScore[node.id] = Infinity;
				}
				gScore[startNodeId] = 0;

				const fScore = {};
				for (const node of nodes) {
					fScore[node.id] = Infinity;
				}

				const startNode = nodes[startNodeId];
				const endNode = nodes[endNodeId];
				fScore[startNodeId] = heuristicCost(startNode, endNode);

				const isHighlighted = vehicles.some(
					(v) =>
						v.highlighted &&
						v.destPoi !== undefined &&
						pois[v.destPoi]?.nodeId === endNodeId
				);

				

				let iterations = 0;
				const maxIterations = nodes.length * 2;

				while (openSet.size > 0 && iterations < maxIterations) {
					iterations++;

					let current = null;
					let lowestFScore = Infinity;

					for (const nodeId of openSet) {
						if (fScore[nodeId] < lowestFScore) {
							lowestFScore = fScore[nodeId];
							current = nodeId;
						}
					}

					if (current === endNodeId) {
						const path = [current];
						while (cameFrom[current] !== undefined) {
							current = cameFrom[current];
							path.unshift(current);
						}

						return path;
					}

					openSet.delete(current);
					closedSet.add(current);

					for (let i = 0; i < edges.length; i++) {
						const edge = edges[i];
						if (edge.from === current) {
							const neighbor = edge.to;

							if (closedSet.has(neighbor)) {
								continue;
							}

							const fromNode = nodes[edge.from];
							const toNode = nodes[edge.to];
							const edgeCost = distance(
								fromNode.x,
								fromNode.y,
								toNode.x,
								toNode.y
							);

							
							const roadPenalty = calculateRoadPenalty(
								edge,
								fromNode,
								toNode,
								endNode,
								startPoiType,
								endPoiType,
								prevEdgeType[current]
							);

							const tentativeGScore = gScore[current] + edgeCost * roadPenalty;

							if (!openSet.has(neighbor)) {
								openSet.add(neighbor);
							} else if (tentativeGScore >= gScore[neighbor]) {
								continue;
							}

							cameFrom[neighbor] = current;
							prevEdgeType[neighbor] = edge.type;
							gScore[neighbor] = tentativeGScore;
							fScore[neighbor] =
								gScore[neighbor] + heuristicCost(nodes[neighbor], endNode);
						}
					}
				}

				
				return [];
			}

			
			function calculateRoadPenalty(
				edge,
				fromNode,
				toNode,
				endNode,
				startPoiType,
				endPoiType,
				prevEdgeType
			) {
				let roadPenalty = 1.0;

				
				const isDestInCenter = isNodeInCenter(endNode);
				const isDestInDeepCenter = endNode.isInDeepCenter;

				
				const isCurrentInCenter = isNodeInCenter(fromNode);
				const isNeighborInCenter = isNodeInCenter(toNode);
