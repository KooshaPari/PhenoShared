[package]
name = "phenotype-cipher"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Simple, safe cryptography (AES-GCM, ChaCha20, Ed25519, Argon2) for Phenotype"
repository = "https://github.com/KooshaPari/Authvault"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
blake3 = "1"
hex = "0.4"
rand = "0.10"
zstd = "0.13"
hmac = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
blake2 = "0.11"
argon2 = "0.5"
hkdf = "0.13"
subtle = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
