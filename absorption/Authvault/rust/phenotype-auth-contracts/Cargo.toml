[package]
name = "phenotype-auth-contracts"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Auth and policy contract traits for the Phenotype ecosystem (Authvault terminal owner)"
repository = "https://github.com/KooshaPari/Authvault"
rust-version = "1.75"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
