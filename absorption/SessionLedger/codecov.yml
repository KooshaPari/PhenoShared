codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes

ignore:
  - "tests/**"
  - "benches/**"
  - "fuzz/**"
  - "vendor/**"
  - "target-w*/**"
  - "crates/sl-viewer/src/main.rs"
  - "docs/**"
  - "scripts/**"
  - "packaging/**"
