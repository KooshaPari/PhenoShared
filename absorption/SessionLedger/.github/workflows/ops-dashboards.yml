name: Ops Dashboards

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ops-dashboards.yml"
      - "docs/ops/dashboards/**"
      - "scripts/dashboard-provision-check.ps1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-dashboards.yml"
      - "docs/ops/dashboards/**"
      - "scripts/dashboard-provision-check.ps1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard-provision-check:
    name: dashboard provisioning evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: validate SessionLedger RED dashboard
        shell: pwsh
        run: ./scripts/dashboard-provision-check.ps1
