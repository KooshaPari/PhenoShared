name: Hermetic Builder Image

on:
  push:
    # The immutable SHA tag is needed before a PR can switch its consuming
    # hermetic gate to the new image.  Restrict by path, not by branch: every
    # canonical branch push can therefore bootstrap and verify its own pin.
    branches: ["**"]
    paths:
      - ci/hermetic-builder/Containerfile
      - .github/workflows/hermetic-builder.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hermetic-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish · digest-pinned builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: normalize image name (GHCR requires lowercase)
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/sessionledger-hermetic-builder" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push hermetic builder
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ci/hermetic-builder/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: report immutable builder digest
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}'
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest"
          {
            echo '### Hermetic builder image published'
            echo
            echo "Pin this exact reference in docs/ops/hermetic-builder.json and .github/workflows/hermetic.yml:"
            echo
            echo "\`${image}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
