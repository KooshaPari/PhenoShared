<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Twitter card 1500x500 cropped composition -->
  <defs>
    <linearGradient id="x-bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#x-bg)"/>

  <!-- Mascot center -->
  <g transform="translate(450, 100) scale(2.0)">
    <ellipse cx="80" cy="140" rx="58" ry="48" fill="#0ea5e9" opacity="0.95"/>
    <ellipse cx="80" cy="140" rx="58" ry="48" fill="none" stroke="#0f172a" stroke-width="3"/>
    <path d="M40 90 L80 70 L120 90 L120 175 L40 175 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <line x1="80" y1="70" x2="80" y2="175" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="80" cy="100" rx="32" ry="36" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
    <circle cx="68" cy="98" r="3" fill="#0f172a"/>
    <circle cx="92" cy="98" r="3" fill="#0f172a"/>
    <path d="M70 112 Q80 118 90 112" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Headline -->
  <text x="600" y="450" font-family="-apple-system, system-ui, sans-serif"
