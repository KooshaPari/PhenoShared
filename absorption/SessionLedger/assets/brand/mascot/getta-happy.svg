<?xml version="1.0" encoding="UTF-8"?>
<!--
  Getta pose: happy — gentle smile + sparkle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"
     width="240" height="240" role="img" aria-label="Getta happy">
  <defs>
    <linearGradient id="getta-body-happy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="getta-light-happy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="getta-amber-happy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="getta-shadow-happy" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1f2937" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="206" rx="58" ry="6" fill="url(#getta-shadow-happy)"/>

  <g>
    <path d="M 70 156
             C 70 130, 84 116, 100 116
             L 140 116
             C 156 116, 170 130, 170 156
             L 174 198
             C 174 206, 168 210, 160 210
             L 80 210
             C 72 210, 66 206, 66 198 Z"
          fill="url(#getta-body-happy)"/>
    <path d="M 110 116 L 120 138 L 130 116 Z" fill="#1d4ed8"/>
    <path d="M 118 116 L 120 134 L 122 116 Z" fill="#60a5fa" opacity="0.6"/>
  </g>

  <g>
    <circle cx="120" cy="92" r="34" fill="url(#getta-light-happy)"/>
    <!-- Blush warm -->
    <ellipse cx="103" cy="102" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
    <ellipse cx="137" cy="102" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
    <!-- Eyes: closed-curve (^-shape) smiling -->
    <path d="M 100 92 Q 106 86 112 92" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 128 92 Q 134 86 140 92" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Mouth: open smile -->
    <path d="M 110 108 Q 120 118 130 108 Q 125 112 115 112 Z" fill="#1f2937"/>
    <path d="M 113 109 Q 120 113 127 109" stroke="#fb7185" stroke-width="0.8" fill="none"/>
    <g transform="rotate(-12 154 88)">
      <path d="M 154 88 L 174 50 L 178 56 L 158 94 Z" fill="#f6f8fa" stroke="#1f2937" stroke-width="1.1"/>
      <path d="M 174 50 L 188 36 L 184 42 L 178 56 Z" fill="#f97316" stroke="#1f2937" stroke-width="1.1"/>
    </g>
    <path d="M 152 92 Q 158 96 152 102" stroke="#1f2937" stroke-width="1.2" fill="#f6f8fa"/>
  </g>

  <!-- Sparkles around head (joy) -->
  <g fill="#fbbf24">
    <path d="M 60 56 L 64 60 L 60 64 L 56 60 Z"/>
    <path d="M 184 60 L 188 64 L 184 68 L 180 64 Z"/>
    <path d="M 178 38 L 181 41 L 178 44 L 175 41 Z"/>
  </g>

  <!-- Live orange ring -->
  <circle cx="120" cy="92" r="36" fill="none" stroke="url(#getta-amber-happy)" stroke-width="2.4" opacity="0.95"/>
  <circle cx="120" cy="92" r="42" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.30"/>

  <g>
    <path d="M 100 162 L 100 200 L 140 200 L 140 162 Z" fill="#1f2937"/>
    <path d="M 102 164 L 138 164 L 138 198 L 102 198 Z" fill="#f6f8fa"/>
    <line x1="106" y1="170" x2="134" y2="170" stroke="#2563eb" stroke-width="0.9" opacity="0.7"/>
    <line x1="106" y1="176" x2="132" y2="176" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
    <line x1="106" y1="182" x2="134" y2="182" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
    <line x1="106" y1="188" x2="128" y2="188" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
    <!-- Gold star on journal -->
    <path d="M 130 178 L 132 182 L 136 182.5 L 133 185 L 134 189 L 130 187 L 126 189 L 127 185 L 124 182.5 L 128 182 Z" fill="#fbbf24"/>
  </g>
</svg>