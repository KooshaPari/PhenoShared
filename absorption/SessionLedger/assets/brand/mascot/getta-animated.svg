<?xml version="1.0" encoding="UTF-8"?>
<!--
  Getta mascot — animated unified SVG with rigged pose variants.
  Use the [data-getta-pose] attribute to select pose:
    base | listening | happy | thinking
  Default render: getta-base overlay.
  Designed to be displayed as an inline SVG in a Dioxus rsx! block — the
  `currentColor` integration means the surrounding CSS controls the color
  scheme via `color`. The live orange ring is driven by a separate
  implementation (colorClass prop) so the brand stays consistent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"
     width="100%" height="100%" role="img" aria-label="Getta, the SessionLedger scholar-mascot">
  <defs>
    <linearGradient id="getta-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="getta-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="getta-amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="getta-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1f2937" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0"/>
    </radialGradient>

    <!-- Pose variants as <symbol> + <use> -->
    <symbol id="pose-base" viewBox="0 0 240 240">
      <circle cx="120" cy="92" r="34" fill="url(#getta-light)"/>
      <circle cx="103" cy="100" r="4" fill="#fda4af" opacity="0.5"/>
      <circle cx="137" cy="100" r="4" fill="#fda4af" opacity="0.5"/>
      <circle cx="106" cy="92" r="3.6" fill="#1f2937"/>
      <circle cx="134" cy="92" r="3.6" fill="#1f2937"/>
      <circle cx="107.2" cy="91" r="1" fill="#ffffff"/>
      <circle cx="135.2" cy="91" r="1" fill="#ffffff"/>
      <line x1="112" y1="108" x2="128" y2="108" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
      <g transform="rotate(-12 154 88)">
        <path d="M 154 88 L 174 50 L 178 56 L 158 94 Z" fill="#f6f8fa" stroke="#1f2937" stroke-width="1.1"/>
        <path d="M 174 50 L 188 36 L 184 42 L 178 56 Z" fill="#f97316" stroke="#1f2937" stroke-width="1.1"/>
      </g>
      <path d="M 152 92 Q 158 96 152 102" stroke="#1f2937" stroke-width="1.2" fill="#f6f8fa"/>
    </symbol>

    <symbol id="pose-listening" viewBox="0 0 240 240">
      <g transform="rotate(-3 120 92)">
        <circle cx="120" cy="92" r="34" fill="url(#getta-light)"/>
        <circle cx="103" cy="100" r="5" fill="#fda4af" opacity="0.55"/>
        <circle cx="137" cy="100" r="5" fill="#fda4af" opacity="0.55"/>
        <circle cx="106" cy="92" r="4" fill="#1f2937"/>
        <circle cx="134" cy="92" r="4" fill="#1f2937"/>
        <circle cx="107.5" cy="91" r="1.2" fill="#ffffff"/>
        <circle cx="135.5" cy="91" r="1.2" fill="#ffffff"/>
        <ellipse cx="120" cy="111" rx="2.4" ry="3.2" fill="#1f2937"/>
      </g>
      <g opacity="0.85">
        <path d="M 60 90 Q 64 92 60 94" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 50 84 Q 56 92 50 100" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 180 90 Q 184 92 180 94" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 190 84 Q 196 92 190 100" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      </g>
    </symbol>

    <symbol id="pose-happy" viewBox="0 0 240 240">
      <circle cx="120" cy="92" r="34" fill="#fef3c7"/>
      <ellipse cx="103" cy="102" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
      <ellipse cx="137" cy="102" rx="6" ry="3.5" fill="#fca5a5" opacity="0.65"/>
      <path d="M 100 92 Q 106 86 112 92" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 92 Q 134 86 140 92" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 110 108 Q 120 118 130 108 Q 125 112 115 112 Z" fill="#1f2937"/>
      <g fill="#fbbf24">
        <path d="M 60 56 L 64 60 L 60 64 L 56 60 Z"/>
        <path d="M 184 60 L 188 64 L 184 68 L 180 64 Z"/>
        <path d="M 178 38 L 181 41 L 178 44 L 175 41 Z"/>
      </g>
    </symbol>

    <symbol id="pose-thinking" viewBox="0 0 240 240">
      <g transform="rotate(2 120 92)">
        <circle cx="120" cy="92" r="34" fill="url(#getta-light)"/>
        <circle cx="103" cy="100" r="4" fill="#fecaca" opacity="0.5"/>
        <circle cx="137" cy="100" r="4" fill="#fecaca" opacity="0.5"/>
        <ellipse cx="106" cy="91" rx="2.6" ry="2.6" fill="#1f2937"/>
        <ellipse cx="134" cy="91" rx="2.6" ry="2.6" fill="#1f2937"/>
        <path d="M 96 84 Q 102 79 110 84" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 130 87 Q 134 84 138 86" stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="114" y1="109" x2="126" y2="109" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <ellipse cx="118" cy="146" rx="8" ry="6" fill="#f6f8fa" stroke="#1f2937" stroke-width="1.2"/>
      <ellipse cx="116" cy="145" rx="3" ry="2" fill="#fecaca" opacity="0.5"/>
      <g fill="none" stroke="#f97316" stroke-width="1.6">
        <circle cx="48" cy="62" r="4"/>
        <circle cx="58" cy="50" r="6"/>
        <circle cx="74" cy="40" r="9"/>
      </g>
    </symbol>
  </defs>

  <ellipse cx="120" cy="206" rx="58" ry="6" fill="url(#getta-shadow)"/>

  <g>
    <path d="M 70 156
             C 70 130, 84 116, 100 116
             L 140 116
             C 156 116, 170 130, 170 156
             L 174 198
             C 174 206, 168 210, 160 210
             L 80 210
             C 72 210, 66 206, 66 198 Z"
          fill="url(#getta-body)"/>
    <path d="M 110 116 L 120 138 L 130 116 Z" fill="#1d4ed8"/>
    <path d="M 118 116 L 120 134 L 122 116 Z" fill="#3b82f6" opacity="0.6"/>
  </g>

  <use href="#pose-base"/>

  <g>
    <path d="M 100 162 L 100 200 L 140 200 L 140 162 Z" fill="#1f2937"/>
    <path d="M 102 164 L 138 164 L 138 198 L 102 198 Z" fill="#f6f8fa"/>
    <line x1="106" y1="170" x2="134" y2="170" stroke="#2563eb" stroke-width="0.9" opacity="0.7"/>
    <line x1="106" y1="176" x2="132" y2="176" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
    <line x1="106" y1="182" x2="134" y2="182" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
    <line x1="106" y1="188" x2="128" y2="188" stroke="#64748b" stroke-width="0.7" opacity="0.5"/>
  </g>

  <circle cx="120" cy="92" r="36" fill="none" stroke="url(#getta-amber)" stroke-width="2.4" opacity="0.85"/>
  <circle cx="120" cy="92" r="42" fill="none" stroke="#f97316" stroke-width="1" opacity="0.25"/>
</svg>