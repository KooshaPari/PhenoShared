<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <!-- OpenGraph card (Twitter/Facebook/LinkedIn 1200x630) -->
  <defs>
    <linearGradient id="og-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.2" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#og-bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#og-glow)"/>

  <!-- Grid -->
  <g stroke="#0ea5e9" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280 M0 400 H1280 M0 500 H1280"/>
    <path d="M100 0 V640 M200 0 V640 M300 0 V640 M400 0 V640 M500 0 V640 M600 0 V640 M700 0 V640 M800 0 V640 M900 0 V640 M1000 0 V640 M1100 0 V640 M1200 0 V640"/>
  </g>

  <!-- Mascot (larger) -->
  <g transform="translate(140, 110) scale(2.4)">
    <ellipse cx="80" cy="140" rx="58" ry="48" fill="#0ea5e9" opacity="0.9"/>
    <ellipse cx="80" cy="140" rx="58" ry="48" fill="none" stroke="#0f172a" stroke-width="3"/>
    <path d="M40 90 L80 70 L120 90 L120 175 L40 175 Z" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
    <line x1="80" y1="70" x2="80" y2="175" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="80" cy="100" rx="32" ry="36" fill="#fde68a" stroke="#0f172a" stroke-width="2"/>
    <circle cx="68" cy="98" r="3" fill="#0f172a"/>
    <circle cx="92" cy="98" r="3" fill="#0f172a"/>
    <path d="M70 112 Q80 118 90 112" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title -->
  <text x="500" y="250" font-family="-apple-system, system-ui, sans-serif"
        font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-2">
    SessionLedger
  </text>
  <text x="500" y="340" font-family="-apple-system, system-ui, sans-serif"
        font-size="40" font-weight="500" fill="#0ea5e9" letter-spacing="-0.5">
    The journal of your AI sessions.
  </text>

  <!-- Tagline -->
  <rect x="500" y="395" width="240" height="4" fill="#fbbf24"/>
  <text x="500" y="455" font-family="-apple-system, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    Local-first · daemon-backed · 18,567+ sessions
  </text>
  <text x="500" y="490" font-family="-apple-system, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
    Real data from Codex, Claude, Cursor
  </text>

  <!-- Bottom brand -->
  <text x="500" y="590" font-family="-apple-system, system-ui, sans-serif"
        font-size="20" font-weight="700" fill="#0ea5e9" letter-spacing="1">
    SESSIONLEDGER · KOOSHAPARI/PHENO
  </text>
</svg>