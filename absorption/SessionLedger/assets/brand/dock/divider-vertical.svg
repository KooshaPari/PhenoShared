<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 600" fill="none">
  <!-- Vertical divider — gradient + center ornament -->
  <defs>
    <linearGradient id="lc-divider-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="40" y1="0" x2="40" y2="280" stroke="url(#lc-divider-v)" stroke-width="2"/>
  <line x1="40" y1="320" x2="40" y2="600" stroke="url(#lc-divider-v)" stroke-width="2"/>
  <g transform="translate(40, 300)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#0ea5e9"/>
  </g>
</svg>