name: Lefthook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lefthook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # cargo clippy/build on the Tauri workspace needs glib/gtk/webkit headers.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config

      - name: Create frontend dist placeholder
        run: |
          mkdir -p frontend/web/build
          [ -f frontend/web/build/index.html ] || printf '<!doctype html><title>ci</title>\n' > frontend/web/build/index.html

      - name: Install lefthook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/lefthook.gz https://github.com/evilmartians/lefthook/releases/download/v2.1.14/lefthook_2.1.14_Linux_x86_64.gz
          gunzip -c /tmp/lefthook.gz > "$HOME/.local/bin/lefthook"
          chmod +x "$HOME/.local/bin/lefthook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run lefthook pre-commit
        run: lefthook run pre-commit

  pre-push:
    name: Pre-push hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # cargo build/test on the Tauri workspace need glib/gtk/webkit headers.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config

      - name: Create frontend dist placeholder
        run: |
          mkdir -p frontend/web/build
          [ -f frontend/web/build/index.html ] || printf '<!doctype html><title>ci</title>\n' > frontend/web/build/index.html

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install lefthook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/lefthook.gz https://github.com/evilmartians/lefthook/releases/download/v2.1.14/lefthook_2.1.14_Linux_x86_64.gz
          gunzip -c /tmp/lefthook.gz > "$HOME/.local/bin/lefthook"
          chmod +x "$HOME/.local/bin/lefthook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny
          cargo install cargo-audit

      - name: Run lefthook pre-push
        run: lefthook run pre-push

  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install lefthook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/lefthook.gz https://github.com/evilmartians/lefthook/releases/download/v2.1.14/lefthook_2.1.14_Linux_x86_64.gz
          gunzip -c /tmp/lefthook.gz > "$HOME/.local/bin/lefthook"
          chmod +x "$HOME/.local/bin/lefthook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint PR commits against conventional commits
        run: |
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          echo "Checking commits in range: $RANGE"
          FAILED=0
          for SHA in $(git rev-list --reverse "$RANGE"); do
            MSG=$(git log -1 --format=%B "$SHA")
            FIRST_LINE=$(echo "$MSG" | head -n1)
            if ! echo "$FIRST_LINE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .{1,72}$'; then
              echo "::error::Commit $SHA does not follow Conventional Commits: $FIRST_LINE"
              FAILED=1
            else
              echo "OK: $SHA — $FIRST_LINE"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must follow Conventional Commits format:"
            echo "  <type>(<scope>): <description>"
            echo ""
            echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "All commits follow Conventional Commits."
