<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="50%" style="stop-color:#f7c948"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#f7c948;stop-opacity:0.5"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="256" cy="220" r="130" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Port symbol: two arrows facing each other (data transport) -->
  <!-- Left arrow (upload) -->
  <path d="M160,280 L160,180 L120,180 L200,100 L280,180 L240,180 L240,280 Z"
        fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Right arrow (download) -->
  <path d="M272,340 L272,240 L232,240 L312,160 L392,240 L352,240 L352,340 Z"
        fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round" opacity="0.7"/>

  <!-- Connection dots -->
  <circle cx="200" cy="310" r="6" fill="#ff6b35" opacity="0.8"/>
  <circle cx="312" cy="310" r="6" fill="#f7c948" opacity="0.8"/>

  <!-- Dotted connection line -->
  <line x1="206" y1="310" x2="306" y2="310" stroke="#ff6b35" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- "BP" text -->
  <text x="256" y="430" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="60" font-weight="700" fill="url(#accent)" letter-spacing="6">BYTEPORT</text>

  <!-- Tagline -->
  <text x="256" y="470" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="16" fill="#6b7280" letter-spacing="4">SECURE DATA TRANSPORT</text>
</svg>
