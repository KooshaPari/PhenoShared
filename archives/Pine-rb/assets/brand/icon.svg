<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pine — minimal utility">
  <defs>
    <linearGradient id="pi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1116"/>
      <stop offset="1" stop-color="#090a0c"/>
    </linearGradient>
    <linearGradient id="pi-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#0a2a15"/>
    </linearGradient>
    <linearGradient id="pi-middle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="pi-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="pi-trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3a1e"/>
      <stop offset="1" stop-color="#352212"/>
    </linearGradient>
    <radialGradient id="pi-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <filter id="pi-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#pi-bg)"/>
  <circle cx="256" cy="240" r="200" fill="url(#pi-glow)"/>

  <!-- tree -->
  <g filter="url(#pi-shadow)">
    <!-- bottom triangle layer -->
    <polygon points="256,340 128,188 384,188"
             fill="url(#pi-bottom)" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- middle layer -->
    <polygon points="256,264 164,144 348,144"
             fill="url(#pi-middle)" stroke="#86efac" stroke-opacity="0.45" stroke-width="1.5"/>
    <!-- top layer -->
    <polygon points="256,200 192,112 320,112"
             fill="url(#pi-top)" stroke="#a7f3d0" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- trunk -->
  <rect x="240" y="340" width="32" height="80" rx="4" fill="url(#pi-trunk)"/>

  <!-- ground line (minimal) -->
  <line x1="120" y1="424" x2="392" y2="424" stroke="#166534" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- highlight on top -->
  <polygon points="256,200 218,152 256,168 294,152"
           fill="#a7f3d0" fill-opacity="0.25"/>
</svg>
