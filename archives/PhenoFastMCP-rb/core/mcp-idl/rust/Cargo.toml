[package]
name        = "mcp-idl"
version     = "0.1.0"
edition     = "2021"
description = "MCP IDL bindings for Rust (generated from core/mcp-idl/proto)"
license     = "Apache-2.0"
publish     = false

[lib]
path = "src/lib.rs"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost      = "0.12"
thiserror  = "1.0"

[build-dependencies]
prost-build = "0.12"
