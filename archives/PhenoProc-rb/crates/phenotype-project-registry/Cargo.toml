[package]
name = "phenotype-project-registry"
version = "0.1.0"
edition = "2021"
authors = ["Phenotype Contributors"]
description = "Project discovery and registry for phenotype health dashboard"
license = "MIT"

[dependencies]
phenotype-health = { path = "../phenotype-health" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt"] }
tracing = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
tempfile = "3.9"
tokio-test = "0.4"
