[package]
name = "pheno-proc-uds"
version = "0.1.0"
edition = "2021"
description = "Unix Domain Socket IPC for PhenoProc"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { version = "1", features = [
  "rt",
  "net",
  "macros",
  "io-util",
  "sync",
  "time",
] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2.0"

[lib]
name = "pheno_proc_uds"
path = "src/lib.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "uds_benchmark"
harness = false
