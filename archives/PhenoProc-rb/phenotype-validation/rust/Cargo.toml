[package]
name = "phenotype-validation"
version = "0.2.0"
edition = "2021"
description = "Phenotype.Validation - Schema validation for JSON"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.17"
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
