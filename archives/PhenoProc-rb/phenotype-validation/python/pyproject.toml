[project]
name = "phenotype-validation"
version = "0.1.0"
description = "Phenotype.Validation - Schema validation for JSON and YAML"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Phenotype Team"}]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
