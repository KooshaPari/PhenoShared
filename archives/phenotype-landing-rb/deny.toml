# cargo-deny config for phenotype-landing
#
# Baseline tier-0 configuration. This project is an Astro/JS monorepo
# with no Rust crate dependencies, so this file serves as a hygiene
# placeholder for org-wide deny check compatibility.
#
# If Rust crates are introduced in the future, populate [advisories],
# [licenses], and [bans] per org policy (see BytePort/deny.toml).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
