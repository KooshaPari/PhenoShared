name: FR Traceability

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check FR Coverage
        run: npm run traceability
