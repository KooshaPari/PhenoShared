[package]
name = "omniroute-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Workspace dependencies
omniroute-core = { path = "..", features = ["rt-multi-thread"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Async
tokio = { version = "1", features = ["full", "test-util"] }
futures = "0.3"

# HTTP testing
mockito = "1"

# Serialization
serde_json = "1"

# Random
rand = "0.8"

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "chat_completions"
harness = false

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "provider_dispatch"
harness = false
