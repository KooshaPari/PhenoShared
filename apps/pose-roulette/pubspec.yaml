name: pose_roulette
publish_to: none
description: Local pose wheel, native still camera, person guides, and optional recap.
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.11.2
  image_picker: 1.2.0
  file_picker: 10.3.3
  path_provider: 2.1.5
  share_plus: 11.1.0
  crypto: 3.0.6
  google_mlkit_pose_detection: 0.15.0
  google_mlkit_selfie_segmentation: 0.11.0
dev_dependencies:
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
