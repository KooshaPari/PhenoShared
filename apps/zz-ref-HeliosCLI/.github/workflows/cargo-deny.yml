name: cargo-deny
# AgilePlus traceability is external: cite AP-ITEM:<id> or AP-FEATURE:<slug>/WP<n>
# in the associated PR; do not link an in-repository tracker artifact.
# Helios hard-fork: run deny against the root harness workspace deny.toml
# (allow-git includes rich-cli-kit for kla/harness_recorder). Prefer the
# in-repo EmbarkStudios action over the phenotype reusable until that
# workflow is confirmed green for this fork.
on:
    pull_request:
        branches-ignore:
            - release-please--branches--main
        paths-ignore:
            - .release-please-manifest.json
            - CHANGELOG.md
    push:
        branches:
            - main
permissions:
  contents: read
jobs:
    cargo-deny:
        name: cargo deny
        if: github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
