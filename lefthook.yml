# phenoShared pre-commit / pre-push hooks
# Validates locally before pushing to CI
# Uses Python subprocess instead of shell (Windows compatible)
#
# The previous version of this file was headed "phenotype-infra pre-commit
# hooks" and every command ran `cargo ... -p phenotype-infra`. There is no such
# package in this repository: `cargo metadata` lists 90 packages and
# phenotype-infra is not among them, so cargo exits 101 with
#
#     package ID specification `phenotype-infra` did not match any packages
#
# Because the hook captures stdout/stderr itself and the failure is a
# resolution error, the push aborts with no visible output, which makes it look
# like a network or auth fault rather than a stale hook.
#
# The commands now use this repository's own Makefile targets, which are the
# same ones the CI hard gate runs, so local and CI validation agree.

pre-commit:
  parallel: true
  commands:
    cargo-check:
      glob: "*.rs"
      run: python -c "import subprocess; r=subprocess.run(['cargo','check','--workspace','--all-targets'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"
    cargo-fmt:
      glob: "*.rs"
      run: python -c "import subprocess; r=subprocess.run(['cargo','fmt','--all','--check'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"
    cargo-clippy:
      glob: "*.rs"
      run: python -c "import subprocess; r=subprocess.run(['cargo','clippy','--workspace','--all-targets','--','-D','warnings'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"

pre-push:
  commands:
    cargo-test:
      run: python -c "import subprocess; r=subprocess.run(['make','test'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"
    cargo-deny:
      run: python -c "import subprocess; r=subprocess.run(['make','deny'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"

commit-msg:
  commands:
    conventional:
      run: python .lefthook/conventional.py {1}
