# pheno pre-commit / pre-push hooks
# Validates locally before pushing to CI
# Uses Python subprocess instead of shell (Windows compatible)
#
# The previous version of this file was headed "phenotype-infra pre-commit
# hooks" and every command ran `cargo ... -p phenotype-infra`. There is no
# such package in this repository (it is not a member of [workspace].members
# and crates/phenotype-infra does not exist), so cargo exited 101 with
# "package ID specification `phenotype-infra` did not match any packages" and
# every commit and push to this repo failed the hook.
#
# The hooks now validate the packages a change actually touches, via
# .lefthook/changed_packages.py. A workspace-wide `cargo clippy -D warnings`
# fails on pre-existing lint debt in crates the change never touched
# (eidolon-sandbox, pheno-compose-port-types), which would block unrelated
# work. The full workspace gate is the CI hard gate's job:
# .github/workflows/quality-gate.yml runs `make check` and
# `cargo nextest run --workspace` on every pull request with no
# continue-on-error, so nothing is lost by keeping the local hook scoped.
#
# Formatting is still checked workspace-wide, because `cargo fmt --all --check`
# is cheap and its failures are always the author's own.

pre-commit:
  parallel: true
  commands:
    cargo-fmt:
      glob: "*.rs"
      run: python -c "import subprocess; r=subprocess.run(['cargo','fmt','--all','--check'], capture_output=True); print(r.stdout.decode()); print(r.stderr.decode()); exit(r.returncode)"
    cargo-check:
      glob: "*.rs"
      run: >
        PKGS="$(python3 .lefthook/changed_packages.py {staged_files})";
        if [ -n "$PKGS" ]; then
          cargo check --all-targets $PKGS;
        else
          echo "no changed workspace packages; skipping cargo check";
        fi
    cargo-clippy:
      glob: "*.rs"
      run: >
        PKGS="$(python3 .lefthook/changed_packages.py {staged_files})";
        if [ -n "$PKGS" ]; then
          cargo clippy --all-targets $PKGS -- -D warnings;
        else
          echo "no changed workspace packages; skipping cargo clippy";
        fi

pre-push:
  commands:
    cargo-test:
      run: >
        PKGS="$(python3 .lefthook/changed_packages.py {push_files})";
        if [ -n "$PKGS" ]; then
          cargo test --no-fail-fast $PKGS;
        else
          echo "no changed workspace packages; skipping cargo test";
        fi
    cargo-deny:
      run: make deny

commit-msg:
  commands:
    conventional:
      run: python .lefthook/conventional.py {1}
