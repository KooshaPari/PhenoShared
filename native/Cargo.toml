[package]
name = "playcua-native"
version = "0.1.0"
edition = "2021"
authors = ["playcua contributors"]
license = "MIT"
rust-version = "1.80"

# `native/` was a submodule of the old standalone PlayCua repo. It keeps its
# own workspace so it can build without inheriting from the PhenoShared root
# (which does not list it as a member).
[workspace]

[package.metadata.cargo-machete]
# `tower` is only used by the `playcua-mcp` bin, which is gated behind the
# `mcp-server` feature, so cargo-machete's default scan cannot see it.
ignored = ["tower"]

[[bin]]
name = "playcua-native"
path = "src/main.rs"

# Guest-side sandbox I/O tunnel: stdio NDJSON JSON-RPC 2.0
# (screenshot / input.* / windows.*). Spawned by SandboxDriver /
# BridgeClient when PLAYCUA_BRIDGE_BIN is unset.
# Build: cargo build --locked -p playcua-native --bin playcua-bridge
[[bin]]
name = "playcua-bridge"
path = "src/bin/playcua-bridge.rs"

[[bin]]
name = "playcua-mcp"
path = "src/bin/playcua-mcp.rs"
required-features = ["mcp-server"]

[[bin]]
name = "playcua-cli"
path = "src/bin/playcua-cli.rs"

# L7 #134 — hermetic spawn test binary. Runs as `cargo run --bin
# hermetic_spawn_test`. Spawns a fake-backend shell script that
# prints FAKE-ALIVE then exits, and verifies the spawn/shutdown
# pattern (tokio Command + libc killpg) the modality drivers use.
# Cold-compile time is ~3s on this workspace.
[[bin]]
name = "hermetic_spawn_test"
path = "src/bin/hermetic_spawn_test.rs"

[lib]
name = "playcua_native"
path = "src/lib.rs"

# FR-annotated integration tests once lived at the standalone PlayCua workspace
# root (`../tests/*.rs`). Those files were not carried into the PhenoShared
# absorption, so the explicit `[[test]]` entries were dropped; cargo now
# auto-discovers the tests under `native/tests/*.rs`.

[dependencies]
tokio = { version = "1.42", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "signal",
  "io-std",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
blake3 = "1.5"
enigo = "0.6"
xcap = "0.9"
libc = "0.2"
rmcp = { version = "3.9", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
  "macros",
] }
schemars = { version = "0.8", features = ["derive", "chrono"] }
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
tower = "0.5"

# pheno-* fleet crates (L5 #81 PlayCua full integration).
#   - pheno-errors:  canonical AppError type used by the top-level
#                    `Result`/`main` signature.
#   - pheno-tracing: JSON-to-stderr tracing init (replaces the
#                    hand-rolled `tracing_subscriber::fmt()` chain
#                    that lived in main.rs before this change).
#   - pheno-flags:   env-driven boolean feature flags (loaded from
#                    `PLAYCUA_*` env vars at startup).
pheno-errors = { path = "../crates/pheno-errors" }
pheno-tracing = { path = "../crates/pheno-tracing" }
pheno-flags = { path = "../crates/pheno-flags" }

[features]
# Default = stdio JSON-RPC 2.0 server (CLI / pipe-mode launchers).
default = []
# `mcp-server` = expose the 14 IPC methods as MCP tools (stdio or streamable-http).
# Build with: cargo build --bin playcua-mcp --features mcp-server
mcp-server = []

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Com",
  "Foundation",
  "Foundation_Collections",
] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7"
x11rb = { version = "0.14", features = ["all-extensions"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
wiremock = "0.6"
