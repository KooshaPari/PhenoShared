[package]
name = "substrate-browser-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lease-guarded browser broker: profiles, generations, live sessions, viewer."

[[bin]]
name = "brokerd"
path = "src/main.rs"

[dependencies]
substrate-browser = { path = "../substrate-browser" }
substrate-browser-cdp = { path = "../substrate-browser-cdp" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "fs", "signal", "macros", "rt-multi-thread"] }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "fs"] }
reqwest = { workspace = true, features = ["json"] }
