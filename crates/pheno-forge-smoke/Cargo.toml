[package]
name = "pheno-forge-smoke"
description = "End-to-end smoke test for the 4-PR forgecode improvement stack (ADR-096)"
keywords = ["forgecode", "memory", "smoke-test", "phenotype", "cdylib"]
categories = ["command-line-utilities", "development-tools::testing"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pheno_forge_smoke"
path = "src/lib.rs"

[[bin]]
name = "pheno-forge-smoke"
path = "src/main.rs"

[dependencies]
# The bridge is loaded at RUNTIME via libloading — no Rust dep on
# pheno-cdylib-bridge is needed for this binary to link. The .dylib
# must be present at runtime (see scripts/run-smoke.sh and
# default_bridge_path() in src/lib.rs).
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
libloading = "0.8"
atty = "0.2"

[dev-dependencies]
tokio = { version = "1.49", features = ["full", "test-util"] }
