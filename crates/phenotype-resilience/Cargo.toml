[package]
name = "phenotype-resilience"
description = "Shared resilience primitives (rate limiter, circuit breaker, bulkhead) for Phenotype-org services"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
