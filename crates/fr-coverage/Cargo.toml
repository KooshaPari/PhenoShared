[package]
name = "fr-coverage"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

readme = "README.md"
description = "FR coverage analysis for phenotype-tooling"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
regex = "1"
walkdir = "2"
anyhow = "1"

[[bin]]
name = "fr-coverage"
path = "src/main.rs"
