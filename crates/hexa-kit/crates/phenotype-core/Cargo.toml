license.workspace = true
description = "Umbrella crate re-exporting all common Phenotype crates"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
phenotype-error-core = { workspace = true }
phenotype-errors = { workspace = true }
phenotype-config-core = { workspace = true }
pheno-events = { workspace = true }
uuid = { workspace = true }
phenotype-validation = { workspace = true }
phenotype-health = { workspace = true }
phenotype-telemetry = { workspace = true }
phenotype-port-traits = { workspace = true }
phenotype-contract-adapters = { workspace = true }
phenotype-async-traits = { workspace = true }
phenotype-state-machine = { workspace = true }
phenotype-policy-engine = { workspace = true }
phenotype-cache-adapter = { workspace = true }
phenotype-string = { workspace = true }
phenotype-time = { workspace = true }
phenotype-http-client-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["phenotype-errors", "phenotype-http-client-core"]
