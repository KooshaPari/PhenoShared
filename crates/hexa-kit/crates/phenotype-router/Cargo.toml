[package]
name = "phenotype-router"
version = "0.1.0"
edition = "2021"
description = "HTTP router plane — OpenAI-compatible delegate to cliproxy (H11 absorption)"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
phenotype-port-traits = { workspace = true }
phenotype-rate-limit = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }

[[bin]]
name = "phenotype-router"
path = "src/bin/phenotype-router.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-machete]
ignored = ["clap", "phenotype-port-traits", "tokio-stream"]
