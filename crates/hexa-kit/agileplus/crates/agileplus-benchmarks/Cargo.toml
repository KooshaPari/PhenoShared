[package]
name = "agileplus-benchmarks"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<REDACTED>/HexaKit"
description = "agileplus benchmarks — Criterion performance benchmarks for AgilePlus subsystems (event append/replay, graph queries, sync round-trips, API latency) (HexaKit)"
documentation = "https://docs.rs/agileplus-benchmarks"
keywords = ["phenotype", "hexa", "benchmark", "criterion", "performance"]
categories = ["development-tools", "benchmarking"]
authors = ["<REDACTED>"]
publish = false
# Bench targets are disabled at the package level because the bench files
# (in `benches/*.rs`) depend on `agileplus-sqlite`, which is currently
# stubbed. Re-enable benches once that crate has its own Cargo.toml.
bench = false

[lib]
path = "src/lib.rs"

[dependencies]
# Internal AgilePlus crates
agileplus-domain = { path = "../agileplus-domain" }
agileplus-events = { path = "../agileplus-events" }
agileplus-graph = { path = "../agileplus-graph" }
# agileplus-sqlite is needed by the bench files (in `benches/*.rs`). The crate
# currently has no Cargo.toml, so it is gated behind the `sqlite-bench`
# feature. Enable that feature (after the sqlite crate is wired up) and set
# `bench = true` to run the actual Criterion benchmarks.
agileplus-sqlite = { path = "../agileplus-sqlite", optional = true }

# Async / runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Serialization
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Observability
tracing = "0.1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# Enables the bench targets that depend on `agileplus-sqlite`.
# Combined with `bench = true` at the package level (inherited via workspace
# overrides or via uncommenting the package-level setting), this builds and
# runs the Criterion bench binaries.
sqlite-bench = ["dep:agileplus-sqlite"]

[[bench]]
name = "event_append_throughput"
harness = false
required-features = ["sqlite-bench"]

[[bench]]
name = "event_replay"
harness = false
required-features = ["sqlite-bench"]

[[bench]]
name = "api_response_times"
harness = false
required-features = ["sqlite-bench"]

[[bench]]
name = "sync_roundtrip"
harness = false
required-features = ["sqlite-bench"]

[[bench]]
name = "graph_query_perf"
harness = false
required-features = ["sqlite-bench"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
