[package]
name = "agileplus-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HexaKit"
description = "agileplus-sqlite — SQLite-backed storage adapter (HexaKit; WIP placeholder)"
documentation = "https://docs.rs/agileplus-sqlite"
authors = ["<REDACTED>"]
publish = false

# This is a temporary manifest that unblocks the workspace graph. The full
# source code in `src/` (migrations, repository modules, ports) is not yet
# wired up: those files need rusqlite, async-trait, thiserror, etc. plus
# all of the agileplus-domain / agileplus-events public surface to be
# complete. Until that work is finished, the `lib` is pointed at a minimal
# stub (`src/stub.rs`) that compiles cleanly and exposes nothing.
#
# When the full sqlite crate is finished:
#   1. Remove the `[lib]` override below (or change `path = "src/stub.rs"`
#      to `path = "src/lib.rs"`).
#   2. Add the real dependencies (rusqlite, async-trait, thiserror,
#      agileplus-domain, agileplus-events, etc.).
#   3. Delete `src/stub.rs`.
#   4. Update the bench targets in `agileplus-benchmarks/Cargo.toml` to use
#      the full surface.

[lib]
path = "src/stub.rs"
