[package]
name = "agileplus-events"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HexaKit"
description = "agileplus events — append-only event sourcing with SHA-256 hash chain, snapshot management, and aggregate replay (HexaKit)"
documentation = "https://docs.rs/agileplus-events"
keywords = ["phenotype", "hexa", "event-sourcing", "cqrs"]
categories = ["data-structures"]
authors = ["<REDACTED>"]

[lib]
path = "src/lib.rs"

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
