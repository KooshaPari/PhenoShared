[package]
name = "agileplus-domain"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HexaKit"
description = "agileplus domain — Phenotype infrastructure crate (HexaKit)"
documentation = "https://docs.rs/agileplus-domain"
keywords = ["phenotype", "hexa", "domain"]
categories = ["data-structures"]
authors = ["<REDACTED>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
dashmap = "5"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
# SOTA: dependencies used by the config / credentials modules that were
# already imported in the source tree but missing from the manifest.
dirs-next = "2"
toml = "0.8"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
cucumber = "0.21"
# SOTA: dev-deps used by the BDD + proptest suites that were already in
# `tests/` and `src/credentials/memory.rs` but missing from the manifest.
proptest = "1.4"
tempfile = "3"
