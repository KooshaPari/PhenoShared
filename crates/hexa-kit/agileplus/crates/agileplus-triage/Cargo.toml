[package]
name = "agileplus-triage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/HexaKit"
description = "agileplus triage — rule-based intent classifier, backlog management, and CLAUDE.md/AGENTS.md router (HexaKit)"
documentation = "https://docs.rs/agileplus-triage"
keywords = ["phenotype", "hexa", "triage", "backlog"]
categories = ["development-tools"]
authors = ["<REDACTED>"]

[lib]
path = "src/lib.rs"

[dependencies]
agileplus-domain = { path = "../agileplus-domain" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
