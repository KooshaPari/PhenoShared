    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: self-merge-gate
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# Delegates to phenoShared reusable workflow.
# See: https://github.com/<REDACTED>/phenoShared/blob/main/.github/workflows/self-merge-gate.yml



permissions:
  contents: read

jobs:
  gate:
    uses: <REDACTED>/phenoShared/.github/workflows/self-merge-gate.yml@d95bb6755390f73c56ea496b246d098fbf97bbe9
