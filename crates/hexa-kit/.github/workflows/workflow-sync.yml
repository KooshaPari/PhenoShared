on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: Workflow Sync to Repos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true




permissions:
  contents: read

jobs:
  sync-workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout template repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get list of workflows
        id: workflows
        run: |
          WORKFLOWS=$(find .github/workflows -name "*.yml" -type f | sed 's|^\./||' | tr '\n' ',')
          echo "workflows=$WORKFLOWS" >> $GITHUB_OUTPUT

      - name: Sync to target repos
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          WORKFLOWS: ${{ steps.workflows.outputs.workflows }}
        run: |
          REPOS=("AgilePlus" "heliosCLI" "phenotype-infrakit")
          for repo in "${REPOS[@]}"; do
            echo "Syncing workflows to $repo..."
            for workflow in .github/workflows/*.yml; do
              filename=$(basename "$workflow")
              echo "  - $filename"
              gh workflow run "https://raw.githubusercontent.com/<REDACTED>/$repo/main/.github/workflows/$filename" || true
            done
          done
        continue-on-error: true