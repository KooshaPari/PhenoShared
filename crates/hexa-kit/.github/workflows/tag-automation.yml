on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: Tag Automation
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# Delegates to phenoShared reusable workflow.
# See: https://github.com/<REDACTED>/phenoShared/blob/main/.github/workflows/tag-automation.yml



permissions:
  contents: read

jobs:
  tag:
    uses: <REDACTED>/phenoShared/.github/workflows/tag-automation.yml@72b9c6cbdb24c49189b0e7c7395d874830d1ed87
    permissions:
      contents: write
