[package]
name = "agileplus-proto"
version = "0.1.0"
edition = "2024"
description = "Generated gRPC stubs for AgilePlus"
license = "MIT"

[workspace]

[dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]

[build-dependencies]
tonic-prost-build = "0.14"
