[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno-core"
version = "0.1.0"
description = "DEPRECATED stub — canonical package at https://github.com/KooshaPari/phenotype-python-sdk"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Phenotype Team", email = "info@<REDACTED>.com"}
]
license = {text = "MIT"}
keywords = [
    "core",
    "phenotype",
    "deprecated",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/KooshaPari/phenotype-python-sdk"
Repository = "https://github.com/KooshaPari/phenotype-python-sdk"
Documentation = "https://github.com/KooshaPari/phenotype-python-sdk#readme"
"Migrated from" = "https://github.com/KooshaPari/HexaKit/tree/main/python/pheno-core"

[tool.hatch.build.targets.wheel]
only-include = ["README.md", "MIGRATED.md"]
