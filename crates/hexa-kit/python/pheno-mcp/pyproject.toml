[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pheno-mcp"
version = "1.0.0"
description = "DEPRECATED stub — canonical Python package at https://github.com/<REDACTED>/PhenoMCP; Rust MCP runtime at substrate"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Phenotype Team", email = "team@<REDACTED>.com"}
]
license = {text = "MIT"}
keywords = [
    "mcp",
    "model-context-protocol",
    "deprecated",
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/<REDACTED>/PhenoMCP"
Repository = "https://github.com/<REDACTED>/PhenoMCP"
Documentation = "https://github.com/<REDACTED>/PhenoMCP#readme"
"Migrated from" = "https://github.com/<REDACTED>/HexaKit/tree/main/python/pheno-mcp"
"Rust runtime" = "https://github.com/<REDACTED>/substrate"

[tool.hatch.build.targets.wheel]
only-include = ["README.md", "MIGRATED.md"]
