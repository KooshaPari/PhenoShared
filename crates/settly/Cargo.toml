[package]
name = "settly"
version = "0.2.0"
edition = "2021"
description = "Settings management with validation, versioning, and migration support"
repository = "https://github.com/KooshaPari/pheno"
documentation = "https://docs.rs/settly"
keywords = ["settings", "config", "validation", "migration"]
categories = ["config", "validation"]
rust-version = "1.86"
license = "MIT"
authors = ["Phenotype Team"]

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"  # not in workspace; standalone
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
validator = { version = "0.20", features = ["derive"] }  # not in workspace; bumped for GHSA-h97m-ww89-6jmq (idna < 1.0.0)

# Encryption (AES-256-GCM + Argon2id KDF)
aes-gcm = "0.10"
argon2 = "0.5"
base64ct = { version = "1.6", features = ["alloc"] }
rand = "0.8"

# Lock-free arc swap (Reloadable<T> generic trait)
arc-swap = "1"

# File watching + hot-reload
notify = "6.1"
parking_lot = "0.12"

# Database — not in workspace; standalone
tokio-postgres = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Cache — not in workspace; standalone
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# Logging
tracing = { workspace = true }

# Observability + ops (additive audit remediation)
configra-ops = { path = "../configra-ops" }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "perf"
harness = false
