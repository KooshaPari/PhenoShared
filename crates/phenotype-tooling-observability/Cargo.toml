[package]
name = "phenotype-tooling-observability"
version.workspace = true
edition.workspace = true
description = "OTel/OTLP observability for the phenotype-tooling workspace — Prometheus metrics, /health endpoint, SLOs"

readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
pheno-tracing = { workspace = true, default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
once_cell = "1"
prometheus = { version = "0.14", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "signal"], optional = true }
rand = "0.10"
url = "2"

# --- argis-monitor dependencies (gated behind `argis-monitor` feature) ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
prometheus-client = { version = "0.25", optional = true }
arc-swap = { version = "1", optional = true }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }
serde_yaml = { version = "0.9", optional = true }
urlencoding = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }

[features]
default = []
# Prometheus exporter + axum HTTP server for /metrics and /health
server = ["dep:prometheus", "dep:axum", "dep:tokio"]
# Full argis-monitor integration (polling, alerts, webhooks, state store, push)
argis-monitor = [
    "dep:reqwest", "dep:hmac", "dep:sha2", "dep:tower", "dep:tower-http",
    "dep:prometheus-client", "dep:arc-swap", "dep:rusqlite", "dep:chrono",
    "dep:serde_yaml", "dep:urlencoding", "dep:anyhow", "dep:clap",
]

[[bin]]
name = "breach_sim"
path = "src/bin/breach_sim.rs"

[lib]
path = "src/lib.rs"
