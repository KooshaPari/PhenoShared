[workspace]
resolver = "2"
# Active members — only crates/libs with actual source files.
# Remaining scaffolding (44 crates, 19 libs) tracked but excluded from
# workspace until source is implemented. See: kitty-specs/003-agileplus-platform-completion.
members = [
  "rust", # agileplus-proto: tonic/prost gRPC stubs (buf-generated)
  "crates/agileplus-cli", # agileplus: spec-first CLI binary
  "crates/agileplus-subcmds", # platform/dashboard CLI subcommands (platform health)
  "crates/agileplus-api", # HTTP API binary (default port 3000)
  "crates/agileplus-application",
  "crates/agileplus-domain",
  "crates/agileplus-governance", # SpecKitty scorecard enforcement (rubric + scoring)
  "crates/traceability-core", # unified PM/traceability spine (un-park 2026-07-04)
  "crates/agileplus-git",
  "crates/agileplus-github",
  "crates/agileplus-graph",
  "crates/agileplus-plane",
  "crates/agileplus-sqlite",
  "crates/agileplus-triage",
  "crates/agileplus-telemetry",
  "crates/agileplus-dashboard",
  "crates/agileplus-events",
  # NOTE: clap-ext activation staged for follow-up PR (see docket O17).
  # Inner clap-ext carries its own sub-workspace; flattening requires Cargo.toml +
  # path-rewrites across the example, smoke test, and dependent crates.
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Koosha Pari <<REDACTED>@<REDACTED>.com>"]
repository = "https://github.com/KooshaPari/AgilePlus"
homepage = "https://phenotype.space/agileplus"
description = "AgilePlus — spec-first project management CLI (FR/NFR traceability)"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell", "msi"]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
install-path = "CARGO_HOME"
pr-run-mode = "plan"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Domain / traceability-core support (un-park 2026-07-04)
# (toml/dirs-next/zeroize/async-trait already declared below.)
indexmap = { version = "2", features = ["serde"] }
regex = "1"

# Web / HTTP
axum = { version = "0.8", features = ["json", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
hyper = "1"
hyper-util = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = [
  "metrics",
  "trace",
  "rt-tokio",
] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "gzip-tonic"] }
tracing-opentelemetry = "0.33"
sentry = { version = "0.34", features = ["tracing"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / hashing
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"

# gRPC / proto (used by agileplus-proto, agileplus-grpc, plugin-grpc, agent-service)
tonic = { version = "0.14", features = ["transport"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-build = "0.13"

# Async utilities
async-trait = "0.1"

# Templating
askama = "0.12"

# Plugin crates (external from separate repos) — disabled for standalone build
# agileplus-plugin-core = { git = "https://github.com/KooshaPari/agileplus-plugin-core" }
# agileplus-plugin-git = { git = "https://github.com/KooshaPari/agileplus-plugin-git" }
# agileplus-plugin-sqlite = { git = "https://github.com/KooshaPari/agileplus-plugin-sqlite" }

# Git
gix = "0.83"
git2 = "0.19"

# CLI
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"

# Data / storage
rusqlite = { version = "0.32", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Benchmarks
criterion = "0.5"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
toml = "0.8"
dirs-next = "2"
keyring = "3"
# Test-only deps used by legacy/obsolete test files (traceability integration tests).
tempfile = "3"
proptest = "1"
tokio-test = "0.4"

# OpenAPI
utoipa = "4"
async-nats = "0.38"
paste = "1"
agileplus-config = { path = "crates/agileplus-config" }
agileplus-proto = { path = "crates/agileplus-proto" }
agileplus-telemetry = { path = "crates/agileplus-telemetry" }

# cargo-machete false-positive ignores (dev-only / proc-macro / build-deps)
[workspace.metadata.cargo-machete]
ignored = [
  "cucumber",
  "axum-test",
  "paste",
  "dirs",
  "serde_yaml",
  "uuid",
  "async-trait",
  "tracing-subscriber",
  "tracing-appender",
  "tracing-opentelemetry",
  "futures",
  "futures-util",
  "tonic",
  "tonic-build",
  "prost",
  "prost-build",
  "utoipa",
  "opentelemetry",
  "opentelemetry_sdk",
  "opentelemetry-otlp",
  "gix",
  "tempfile",
]
