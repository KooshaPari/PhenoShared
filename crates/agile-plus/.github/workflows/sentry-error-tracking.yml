name: Sentry Error Tracking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily health check at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Force Sentry health report'
        required: false
        default: 'false'
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sentry-health-check:
    name: Sentry Health & Integration Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN_AGILEPLUS }}
      SENTRY_ENVIRONMENT: production
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG_SLUG: phenotype
      SENTRY_PROJECT_ID: agileplus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Verify Sentry DSN is configured
        run: |
          if [ -z "$SENTRY_DSN" ]; then
            echo "Warning: SENTRY_DSN_AGILEPLUS secret not configured"
            echo "Configure via: gh secret set SENTRY_DSN_AGILEPLUS --body '<your-dsn>'"
            exit 0
          fi
          echo "✓ Sentry DSN configured"

      - name: Run Sentry initialization tests
        run: |
          cargo test --lib sentry_config -- --nocapture
        continue-on-error: true

      - name: Generate Sentry dashboard link
        run: |
          ORG_SLUG="phenotype"
          PROJECT_ID="agileplus"
          {
            echo "## Sentry Error Dashboard"
            echo ""
            echo "🔗 **View errors**: https://sentry.io/organizations/${ORG_SLUG}/issues/?project=${PROJECT_ID}"
            echo ""
            echo "**Environment**: production"
            echo "**Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-with-github-issues:
    name: GitHub-Sentry Integration Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      SENTRY_ORG_SLUG: phenotype
      SENTRY_PROJECT_ID: agileplus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify GitHub integration setup
        run: |
          echo "Verifying GitHub-Sentry integration..."
          echo "✓ GitHub integration variables loaded"
          echo "  - Org: phenotype"
          echo "  - Project: agileplus"
          echo ""
          echo "Next steps:"
          echo "1. Go to: https://sentry.io/settings/phenotype/integrations/github/"
          echo "2. Authorize GitHub org if not already done"
          echo "3. Enable 'Create GitHub issues from alerts'"
          echo "4. Configure alert rules for high-severity errors"

      - name: Generate integration checklist
        run: |
          {
            echo "## Sentry-GitHub Integration Checklist"
            echo ""
            echo "- [ ] GitHub authorization granted in Sentry"
            echo "- [ ] Auto-issue creation enabled for high severity"
            echo "- [ ] Alert labels configured (sentry-critical, error-tracking)"
            echo "- [ ] Notification channel selected"
            echo "- [ ] Test issue created and verified"
            echo ""
            echo "**Last checked**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-on-failure:
    name: Notify on Sentry Tracking Issues
    runs-on: ubuntu-24.04
    if: failure() && github.ref == 'refs/heads/main'
    needs: [sentry-health-check]

    steps:
      - name: Create issue for tracking failures
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Sentry] Error tracking health check failed',
              body: 'Workflow: ' + context.server_url + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\nProject: AgilePlus\n\nAction required: Verify Sentry DSN configuration and SDK initialization.',
              labels: ['sentry-critical', 'error-tracking']
            })
        continue-on-error: true
