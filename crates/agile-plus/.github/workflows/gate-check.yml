name: Gate Check

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: 'Programming language'
      channel:
        required: true
        type: string
        description: 'Release channel (alpha, beta, stable)'
      risk_profile:
        required: true
        type: string
        description: 'Risk profile (low, medium, high)'
permissions:
  contents: read


jobs:
  gate-check:
    runs-on: ubuntu-24.04
    env:
      LANGUAGE: ${{ inputs.language }}
      CHANNEL: ${{ inputs.channel }}
      RISK_PROFILE: ${{ inputs.risk_profile }}
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install clippy
        run: rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"

      - name: Run lint
        run: mise run lint
        continue-on-error: false

      - name: Run test
        run: mise run test
        continue-on-error: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true
      - name: Run security audit
        if: ${{ inputs.channel == 'beta' || inputs.channel == 'stable' || inputs.risk_profile == 'high' }}
        run: mise run audit
        continue-on-error: false

      - name: Gate check result
        run: |
          echo "✓ Gate check passed for $LANGUAGE"
          echo "  Channel: $CHANNEL"
          echo "  Risk profile: $RISK_PROFILE"
