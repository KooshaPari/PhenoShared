name: MSI Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'agileplus-cli-v*'

env:
  RUST_BACKTRACE: 1

jobs:
  build-msi:
    name: Build and Package MSI
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download and install WiX 3.14 toolset
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe" -OutFile "wix314.exe"
          .\wix314.exe /install /quiet /norestart
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build agileplus-cli from crates.io
        run: |
          # Build the published CLI crate to bypass broken workspace
          cargo install agileplus-cli@0.3.0 --root ./agileplus-release

      - name: Create temporary Cargo project for WiX packaging
        shell: pwsh
        run: |
          # Create directory structure
          New-Item -ItemType Directory -Path temp-msi-pkg/src -Force | Out-Null
          New-Item -ItemType Directory -Path temp-msi-pkg/wix -Force | Out-Null

          # Create Cargo.toml
          $cargoToml = @"
          [package]
          name = "agileplus-cli"
          version = "0.3.0"
          edition = "2021"
          description = "AgilePlus - Spec-first project management CLI"
          authors = ["<REDACTED>"]
          "@
          Set-Content -Path temp-msi-pkg/Cargo.toml -Value $cargoToml

          # Create minimal src/main.rs (cargo-wix requires this)
          Set-Content -Path temp-msi-pkg/src/main.rs -Value 'fn main() {}'

          # Create License.rtf
          $license = @"
          {\rtf1\ansi\ansicpg1252\deff0\nouicompat\deflang1033{\fonttbl{\f0\fnil\fcharset0 Calibri;}}{\colortbl;\red0\green0\blue0;}{\*\expandedcolortbl;}\margl1440\margr1440\margtsxn1440\margbsxn1440\ltrpara\ltrch\frtlch \fbidis\fcs1 \af0\ltrch\loch {\*\fldinst HYPERLINK "https://github.com/<REDACTED>/AgilePlus"}{\fldrslt AgilePlus on GitHub}}\par AgilePlus CLI - Spec-first project management\par Dual licensed under MIT OR Apache-2.0\par
          "@
          Set-Content -Path temp-msi-pkg/wix/License.rtf -Value $license

      - name: Copy binary for packaging
        shell: pwsh
        run: |
          $releaseTarget = "temp-msi-pkg/target/release"
          New-Item -ItemType Directory -Path "$releaseTarget" -Force | Out-Null
          Copy-Item -Path "agileplus-release/bin/agileplus-cli.exe" -Destination "$releaseTarget/agileplus-cli.exe" -Force

      - name: Generate WiX source XML manually
        shell: pwsh
        run: |
          # Create wix directory if not exists
          New-Item -ItemType Directory -Path "temp-msi-pkg/wix" -Force | Out-Null

          # Generate main.wxs file manually to avoid cargo-wix workspace parsing issues
          $wxs = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="AgilePlus CLI" Language="1033" Version="0.3.0.0"
                     Manufacturer="<REDACTED>" UpgradeCode="12345678-1234-1234-1234-123456789ABC">
              <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
              <Media Id="1" Cabinet="AgilePlusCLI.cab" EmbedCab="yes" />

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="AgilePlus CLI" />
                </Directory>
              </Directory>

              <Feature Id="ProductFeature" Title="AgilePlus CLI" Level="1">
                <ComponentRef Id="BinaryComponent" />
              </Feature>

              <DirectoryRef Id="INSTALLFOLDER">
                <Component Id="BinaryComponent" Guid="12345678-1234-1234-1234-123456789DEF">
                  <File Id="AgilePlusBinary" Source="..\..\agileplus-release\bin\agileplus-cli.exe" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          "@
          Set-Content -Path "temp-msi-pkg/wix/main.wxs" -Value $wxs

      - name: Compile and link MSI with WiX tools directly
        shell: pwsh
        run: |
          # Use WiX command-line tools directly
          $binaryPath = "$(Get-Location)\agileplus-release\bin\agileplus-cli.exe"
          $sourceDir = "$(Get-Location)\temp-msi-pkg\wix"
          $outputDir = "$(Get-Location)\temp-msi-pkg\target\wix"

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Binary path: $binaryPath"
          Write-Host "Source dir: $sourceDir"
          Write-Host "Output dir: $outputDir"

          # Candle: compile .wxs to .wixobj
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe" `
            -o "$outputDir\main.wixobj" `
            "$sourceDir\main.wxs"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Candle failed"
            exit 1
          }

          # Light: link .wixobj to .msi
          & "C:\Program Files (x86)\WiX Toolset v3.14\bin\light.exe" `
            -o "$outputDir\AgilePlusCLI-0.3.0-x64.msi" `
            "$outputDir\main.wixobj"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Light failed"
            exit 1
          }

      - name: Locate generated MSI
        id: msi-path
        shell: pwsh
        run: |
          $msiFiles = Get-ChildItem -Path "temp-msi-pkg/target/wix" -Filter "*.msi" -Recurse
          if ($msiFiles) {
            $msi = $msiFiles[0]
            echo "msi_file=$($msi.FullName)" >> $env:GITHUB_OUTPUT
            echo "msi_name=$($msi.Name)" >> $env:GITHUB_OUTPUT
            Write-Host "Found MSI: $($msi.FullName)"
            Write-Host "Size: $(($msi.Length / 1MB).ToString('F2')) MB"
          } else {
            Write-Host "ERROR: No MSI found in temp-msi-pkg/target/wix"
            Get-ChildItem -Path "temp-msi-pkg/target" -Recurse -Filter "*.msi"
            exit 1
          }

      - name: Create Release and Upload MSI
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.msi-path.outputs.msi_file }}
          body: |
            # AgilePlus CLI ${{ github.ref_name }}

            Windows MSI installer for AgilePlus CLI (Spec-first project management).

            ## Installation
            Download the `.msi` file and run it to install AgilePlus CLI on Windows.

            ## Links
            - [Documentation](https://docs.rs/agileplus-cli)
            - [GitHub Repository](https://github.com/<REDACTED>/AgilePlus)
            - [Crates.io](https://crates.io/crates/agileplus-cli)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
