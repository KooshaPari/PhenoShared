name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub Release
      id-token: write  # attest-build-provenance (sigstore) needs OIDC
      attestations: write  # attest-build-provenance needs to persist attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked || true
          cargo cyclonedx -f json --override-filename sbom || echo "sbom generation skipped"

      - name: Create provenance file for Scorecard
        run: |
          if [ -f sbom.json ]; then
            cp sbom.json sbom.intoto.jsonl
          else
            echo '{"predicateType":"https://slsa.dev/provenance/v1","predicate":{}}' > sbom.intoto.jsonl
          fi
          ls -lh sbom.* || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            sbom.json
            sbom.intoto.jsonl
          generate_release_notes: true

      - name: Attest build provenance (sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.json

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret not configured in repo settings"
            exit 1
          fi
          # sbom.* are generated at release time and are .gitignore'd; allow dirty to avoid
          # "uncommitted changes" error if the file is not yet ignored in the tag's .gitignore
          cargo publish --locked --allow-dirty --token "$CARGO_REGISTRY_TOKEN"
