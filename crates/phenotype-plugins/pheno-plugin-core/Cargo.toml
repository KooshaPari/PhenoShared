[package]
name = "pheno-plugin-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/PhenoPlugins"
description = "pheno plugin core — Phenotype infrastructure crate (PhenoPlugins)"
documentation = "https://docs.rs/pheno-plugin-core"
keywords = ["phenotype", "pheno-plugins", "core"]
categories = ["data-structures", "development-tools"]
authors = ["kooshapari"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
# serde_json is already in [dependencies], but listing it here as a
# dev-dep makes it explicit that fixture-driven tests under `tests/`
# depend on it. This keeps the public runtime surface small while
# allowing integration tests to parse JSON fixtures.
