[package]
name = "anthropic-usage-poll"
description = "Daemon polling Anthropic Admin API for token usage data"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[[bin]]
name = "anthropic-usage-poll"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
