[package]
name = "substrate-browser-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "BRIDGE provider adapter: speaks the normalized browser protocol over stdio NDJSON."

[[bin]]
name = "browser-provider"
path = "src/main.rs"

[dependencies]
substrate-browser = { path = "../substrate-browser" }
substrate-browser-broker = { path = "../substrate-browser-broker" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "io-std",
  "io-util",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = [
  "process",
  "io-util",
  "macros",
  "rt-multi-thread",
  "net",
] }

[package.metadata.cargo-machete]
ignored = ["serde", "substrate-browser"]
