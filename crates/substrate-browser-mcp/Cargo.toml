[package]
name = "substrate-browser-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP bridge exposing the browser lease broker to coding agents."

[dependencies]
substrate-browser = { path = "../substrate-browser" }
substrate-browser-broker = { path = "../substrate-browser-broker" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "fs", "signal", "macros", "rt-multi-thread"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "fs"] }
