[package]
name = "sbom-gen"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "SBOM (Software Bill of Materials) generator for FocalPoint workspace"

readme = "README.md"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[[bin]]
name = "sbom-gen"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23"
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
