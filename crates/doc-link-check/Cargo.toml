[package]
name = "doc-link-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

readme = "README.md"
description = "Doc link checker for phenotype-tooling"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
walkdir = "2"
pulldown-cmark = "0.13"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "doc-link-check"
path = "src/main.rs"
