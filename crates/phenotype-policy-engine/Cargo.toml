[package]
name = "phenotype-policy-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic policy evaluation engine for Phenotype, supporting rule-based policy decision-making across all domains"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
dashmap.workspace = true
toml.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints.rust]
# Vestigial gate: the casbin backend (feature existed in the archived crate)
# was dropped from this crate, so the integration test stays compiled out
# until the feature is rebuilt. Declaring the expected value silences
# unexpected_cfgs without pretending the feature exists.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("casbin-backend"))'] }
