[package]
name = "fuzz-setup"
version.workspace = true
edition.workspace = true
publish = false

readme = "README.md"
license = "Apache-2.0 OR MIT"
description = "Crate fuzz-setup for phenotype-tooling"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
serde_json = "1.0"
sha2 = "0.11"
arbitrary = { version = "1.3", features = ["derive"] }
libfuzzer-sys = "0.4"

