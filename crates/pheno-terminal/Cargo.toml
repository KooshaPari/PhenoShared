[package]
name = "pheno-terminal"
version = "0.1.0"
edition = "2021"
description = "Terminal utilities: clipboard, interception, image processing, shell hooks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/phenoUtils"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
