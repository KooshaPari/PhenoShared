[package]
name = "pheno-cdylib-bridge"
description = "C-ABI shared library exposing the pheno-* Rust crates to Go (forgecode) and other FFI consumers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pheno_bridge"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Memory facade (v2) — bridge IS the C-ABI wrapper for thegent-memory.
# Both crates must evolve together; intentional cross-repo path-dep.
thegent-memory = { git = "https://github.com/KooshaPari/thegent", path = "crates/thegent-memory" }
tokio = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }