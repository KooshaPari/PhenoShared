# phinbox plugin manifest for Claude Code
# Installs: phinbox-mcp into Claude Code's MCP catalog + skill into ~/.claude/skills/

[plugin]
name = "phinbox"
version = "0.9.0"
description = "phinbox MCP server — pop up native forms via Claude Code"
homepage = "https://github.com/kooshapari/phenotype/tree/main/crates/phinbox"
author = "phenotype"

[mcp]
# claude mcp add <name> -- <command> [args...]
command = "phinbox-mcp"

[skill]
name = "phinbox"
description = "Decide when and how to elicit clarification from the user via a native OS popup. Use when a prompt is ambiguous, missing required inputs, or sensitive (secrets / destructive actions)."
source = "..\\.phinbox/skills/phinbox/SKILL.md"
