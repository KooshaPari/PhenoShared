[package]
name = "stashly"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Team"]
description = "Universal caching abstraction with TTL, multi-tier, and singleflight support — absorbs thegent-cache"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<REDACTED>/pheno"
documentation = "https://docs.rs/stashly"
keywords = ["cache", "caching", "memory", "redis", "ttl", "tiered", "singleflight"]
categories = ["caching", "data-structures"]
rust-version = "1.75"

[dependencies]
# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Caching
lru = "0.18"
dashmap = "6.1"
parking_lot = { workspace = true }

# HashMap for hashing
hashlink = "0.12"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

[[bench]]
name = "perf"
harness = false
