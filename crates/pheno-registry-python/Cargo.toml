[package]
name = "pheno-registry-python"
version = "1.1.0"
edition = "2021"
description = "Python SDK for phenotype-registry via PyO3"

[lib]
name = "pheno_registry_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
phenotype-registry = { path = "../.." }
