[package]
name = "bench-guard"
version.workspace = true
edition.workspace = true
readme = "README.md"
license = "Apache-2.0 OR MIT"
description = "Benchmark guard for phenotype-tooling"
repository = "https://github.com/<REDACTED>/phenotype-tooling"
homepage = "https://github.com/<REDACTED>/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
