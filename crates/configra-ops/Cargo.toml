[package]
name = "configra-ops"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["Phenotype Team"]
description = "Observability and operations primitives for Configra services"
repository = "https://github.com/KooshaPari/pheno"
keywords = ["observability", "health", "metrics", "tracing", "configra"]
categories = ["development-tools", "config"]

[lib]
name = "configra_ops"
path = "src/lib.rs"

[[bin]]
name = "configra-ops"
path = "src/bin/configra-ops.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "time", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
