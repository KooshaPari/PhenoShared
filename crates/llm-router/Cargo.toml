[package]
name = "llm-router"
version = "0.1.0"
edition = "2024"
description = "LLM routing with multi-provider support"
license.workspace = true

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.13", features = ["json", "rustls"] }
async-trait = "0.1"
tracing = "0.1"
dashmap = "7.0.0-rc2"
# substrate: routing is provided by the canonical adapter and core crates.
# The facade crate does not expose these as feature-gated modules.
# Resolved from the in-repo crates rather than the private git remote
# (KooshaPari/substrate is not readable by the CI token, which made
# `cargo metadata` fail there).
substrate-core = { path = "../substrate-core", package = "substrate-core" }
omniroute-adapter = { path = "../omniroute-adapter", package = "omniroute-adapter" }
# tokio/sync is included via workspace tokio (full features)

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["std", "fmt"] }
