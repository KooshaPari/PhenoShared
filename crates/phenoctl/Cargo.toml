[package]
name = "phenoctl"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
authors = ["Phenotype Team"]
description = "Configra CLI for configuration operations."

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
toml = { workspace = true }

config-schema = { path = "../config-schema" }
settly = { path = "../settly" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["serde_yaml", "toml"]
