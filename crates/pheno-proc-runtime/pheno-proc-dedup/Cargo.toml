[package]
name = "pheno-proc-dedup"
version = "0.1.0"
edition = "2021"
description = "Command deduplication and locking for PhenoProc"
license = "MIT"

[dependencies]
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "pheno_proc_dedup"
path = "src/lib.rs"

[[bench]]
name = "dedup_benchmark"
harness = false
