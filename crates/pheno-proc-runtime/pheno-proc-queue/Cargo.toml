[package]
name = "pheno-proc-queue"
version = "0.1.0"
edition = "2021"
description = "Priority task queue for PhenoProc"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "pheno_proc_queue"
path = "src/lib.rs"

[[bench]]
name = "queue_benchmark"
harness = false
