[package]
name = "commit-msg-check"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

readme = "README.md"
description = "Commit-message checker for phenotype-tooling"
repository = "https://github.com/KooshaPari/phenotype-tooling"
homepage = "https://github.com/KooshaPari/phenotype-tooling"
keywords = ["phenotype", "tooling", "cli"]
categories = ["command-line-utilities"]
[dependencies]
clap = { version = "4.5",features=["derive"] }
regex = "1.11"
anyhow = "1.0"

[[bin]]
name = "commit-msg-check"
path = "src/main.rs"
