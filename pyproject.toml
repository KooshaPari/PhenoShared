[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pheno-harness-bench"
version = "0.1.0"
description = "Benchmark harness + RLVR/Harbor operator wrappers for pheno-harness (eval stack consumer of Harbor/portage-TEMP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Harbor Terminal Bench + Repo2RLEnv (PyPI upstream). For the portage-TEMP
# product fork, install that repo separately — see docs/guides/PORTAGE_AND_HARBOR.md.
harbor = [
    "harbor>=0.6.0",
    "repo2rlenv>=0.8.0",
    "huggingface_hub>=0.20.0",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=7.0",
]
# Tiered-memory bootstrap — Phase 1.1 (plans/2026-07-17-tiered-memory-bootstrap).
# Pulls vLLM + SGLang source branches that carry the MoE expert-offload PRs
# we anchor on for the 3090 Ti software tiering path:
#   - vLLM PR #37190 (CachedWeightProvider / --moe-expert-cache-size) — head:
#     https://github.com/vllm-project/vllm/pull/37190 (branch
#     feature/moe-expert-lru-cache, base SHA c66868c8c12f).
#   - SGLang PR #20126 (UVM-based MoE expert offload, all-GPU compute) —
#     head: https://github.com/sgl-project/sglang/pull/20126 (branch
#     feat/expert_offload, base SHA 5963aa674158).
# Both PRs were OPEN at plan time; pin to the head branches so the bootstrap
# anchors always resolve even if upstream main moves. Once the PRs land,
# switch these to the released PyPI versions (vllm>=0.26, sglang>=0.5.11).
tiered-memory = [
    "vllm @ git+https://github.com/vllm-project/vllm.git@refs/pull/37190/head",
    "sglang @ git+https://github.com/sgl-project/sglang.git@refs/pull/20126/head",
]
all = [
    "pheno-harness-bench[harbor,dev]",
]

[project.scripts]
bench = "bench.cli:main"

[project.urls]
Documentation = "https://github.com/KooshaPari/pheno-harness/blob/main/docs/guides/INSTALL.md"
Harbor-upstream = "https://github.com/laude-institute/harbor"
Portage-TEMP = "https://github.com/KooshaPari/portage-TEMP"

[tool.setuptools.packages.find]
include = [
    "bench*",
    "pheno*",
    "verifier*",
    "needle*",
    "traces*",
    "playground*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_cache --cov=pheno --cov=bench --cov-report=term-missing --cov-fail-under=0 -m 'not slow'"
markers = [
    "slow: tests that download real datasets or make network calls (deselect with '-m not slow')",
]

[tool.coverage.run]
branch = true
source = ["pheno", "bench", "verifier", "eval", "traces"]

[tool.coverage.report]
# Coverage ratchet (DAG-91): v0.23 starts at 50% to enforce the post-92-tests
# Coverage ratchet (DAG-91): v0.25 ratchets to 65% after the bench/runner +
# bench/suites coverage push (69% actual). Each subsequent release ratchets
# by +5% until we hit the 80% target.
fail_under = 65
show_missing = true
skip_covered = false

[tool.mypy]
# Exclude codegen output dirs (auto-generated by
# kernels/qwen3.5-0.8b/python/codegen.py). mypy would otherwise
# complain about duplicate module names between the source and
# the generated copy.
#
# Also exclude kernels/qwen3.5-0.8b/python/{bench,codegen,reference,
# validate}.py — these are kernel-internal scripts (heavy MLX usage,
# no shipped stubs) that share names with top-level packages.
exclude = [
    "kernels/qwen3.5-0.8b/02_gen/.*",
    "kernels/qwen3.5-0.8b/01_host/.*",
    "kernels/qwen3.5-0.8b/03_tests/.*",
    "kernels/qwen3.5-0.8b/05_scripts/.*",
    "kernels/qwen3.5-0.8b/rust/.*",
    "kernels/qwen3.5-0.8b/zig/.*",
    "kernels/qwen3.5-0.8b/mojo/.*",
    "kernels/qwen3.5-0.8b/nim/.*",
    "kernels/qwen3.5-0.8b/python/.*",
    "kernels/qwen3.5-0.8b/weights/.*",
    "kernels/qwen3.5-0.8b/00_src/.*",
    "kernels/qwen3.5-0.8b/01_host/.*",
]
ignore_missing_imports = true
# PyYAML ships without inline type info; rather than forcing every
# `import yaml` to use `# type: ignore[import-untyped]`, suppress
# globally. (types-PyYAML exists in the dev venv but mypy still
# flags it as untyped for some import sites.)
disable_error_code = ["import-untyped", "attr-defined", "var-annotated"]
# No type errors expected; the rest of the project uses
# # type: ignore sparingly for 3rd-party libs without stubs.
strict = true
no_error_summary = true

# scripts/ contains operational tooling (CLI entry points, data ingest,
# model evaluation drivers). These scripts intentionally use loose typing:
# - They parse free-form JSON / YAML from external sources
# - They shell out to subprocesses and curl the network
# - They glue together many untyped 3rd-party APIs
# Maintaining mypy --strict here would slow development without catching
# real bugs. Library code (harness/, bench/, eval/, scripts/cron/, pheno/,
# needle/) remains strict; only scripts/ is relaxed.
[tool.bandit]
# B101 (assert usage) fires ~2250 times across tests/ and is not a security
# concern.  Skip it globally to keep the LOW noise floor manageable.
# HIGH / MEDIUM findings are always reported.
skips = ["B101"]

[[tool.mypy.overrides]]
module = "scripts.*"
strict = false
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "type-arg",
    "no-any-return",
    "union-attr",
    "arg-type",
    "index",
    "assignment",
    "method-assign",
    "operator",
    "return-value",
    "valid-type",
    "misc",
    "override",
    "comparison-overlap",
    "type-var",
    "dict-item",
    "call-arg",
    "unused-ignore",
]
