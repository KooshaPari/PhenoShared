api_version: phenocompose.dev/v0
kind: Composition
metadata:
  name: pheno-harness-dogfood
  labels:
    action_execution: host_via_nanovms
    action_output_root: jobs/harbor
    lane: delegated-evaluation-action
environment:
  platform: windows_wsl
  toolkit:
    name: cuda
    version: "13.0"
  variables:
    PHENO_PRIMARY_MODEL: local/qwen35-08b
runtime:
  provider: podman
  capability: runtime.podman.evaluation
  portage_compatibility:
    external_engine_token: docker
    effective_engine: podman
providers:
  evaluation:
    capability: evaluation.nanovms.host_action
    status: available
    implementation: NanoVMS/Podman
services:
  sglang-primary:
    image: localhost/pheno/sglang-cuda13:dogfood-v0
    depends_on: []
    command: []
    environment:
      CUDA_TOOLKIT: "13"
      ENGINE: sglang
      MODEL_ALIAS: local/qwen35-08b
      ROLE: primary
    resources:
      cpu_millis: 8000
      memory_bytes: 17179869184
      gpu:
        vendor: nvidia
        uuids:
          - GPU-8d337a84-43de-158d-7526-7175288a6064
actions:
  harbor-headless-terminal:
    service: sglang-primary
    output_root: jobs/harbor
    command:
      - portage
      - run
      - -c
      - config/harbor.yaml
      - -a
      - harness.harbor.terminus_safe:SafeTerminus2
      - -m
      - openai/local/qwen35-08b
      - --env
      - docker
      - --n-concurrent
      - "1"
      - --agent-kwarg
      - api_base=http://127.0.0.1:8080/v1
      - --agent-kwarg
      - max_turns=3
      - --agent-kwarg
      - max_thinking_tokens=1024
      - --agent-kwarg
      - reasoning_effort=none
      - --agent-kwarg
      - interleaved_thinking=false
      - --agent-kwarg
      - enable_summarize=false
      - --agent-kwarg
      - record_terminal_session=false
      - --agent-kwarg
      - max_output_retries=2
      - --agent-kwarg
      - terminal_command_timeout_sec=30
      - --agent-kwarg
      - model_info=base64json:eyJtYXhfaW5wdXRfdG9rZW5zIjozMjc2OCwibWF4X291dHB1dF90b2tlbnMiOjMwNzJ9
      - --agent-kwarg
      - llm_call_kwargs=base64json:eyJtYXhfdG9rZW5zIjozMDcyLCJ0ZW1wZXJhdHVyZSI6MH0=
      - --agent-env
      - OPENAI_API_KEY=local-dummy-key
      - -y
      - -p
      - D:\WSL\eval-cache\harbor-terminal-bench-2.0\terminal-bench
      - --n-tasks
      - "1"
      - --include-task-name
      - headless-terminal
teardown:
  order:
    - sglang-primary
  remove_volumes: false
provenance:
  required: true
  format: phenocompose_v0
  include:
    - manifest_sha256
    - effective_engine
    - resolved_provider
    - execution_plane
    - gpu_bindings
    - lifecycle
    - job_status
