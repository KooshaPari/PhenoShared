# Eval pillar definitions — accepted verified steps / sec / GB / $
# Primary acceptance: motion-weighted ROI, not raw tok/s alone.

pillars:
  token_burn:
    weight: 0.15
    metrics:
      - input_tokens
      - output_tokens
      - cache_read_tokens
      - cache_write_tokens
      - compressed_tokens_saved
      - duplicate_context_tokens
    targets:
      monthly_total: 30000000000  # 30B polished/tuned
      avg_input_per_step_max: 5120  # post-compiler

  accuracy:
    weight: 0.25
    metrics:
      - verifier_pass_rate
      - tests_pass_rate
      - patch_apply_rate
      - json_tool_valid_rate
      - harbor_task_success_rate
    targets:
      routine_pass_rate_min: 0.85
      harbor_tbench_min: 0.80  # honest terminus-2 on full TB2.0 holdout (no oracle/DPO on tasks)

  speed:
    weight: 0.15
    metrics:
      - latency_p50_ms
      - latency_p95_ms
      - tok_per_sec_decode
      - accepted_steps_per_sec
      - time_to_first_token_ms
    targets:
      routine_p95_s_max: 5.0
      local_4b_tok_s_min: 40

  cost:
    weight: 0.20
    metrics:
      - usd_per_accepted_step
      - usd_per_million_tokens
      - monthly_spend_usd
      - avoided_tokens_usd
      - provider_breakdown_usd
    targets:
      monthly_ideal_usd: 200
      monthly_max_usd: 400
      current_baseline_usd: 570
      codex_cut_target: 0.50  # 50-100% bill reduction = 4x usage cut at half bill

  motion:
    weight: 0.10
    description: "Does each generation move forward, stagnate, or regress?"
    metrics:
      - motion_forward_rate
      - motion_stagnate_rate
      - motion_regress_rate
      - roi_tokens_per_forward_step
      - overlap_waste_rate
      - bug_introduction_rate
    targets:
      forward_rate_min: 0.70
      regress_rate_max: 0.10
      overlap_waste_max: 0.15

  quality:
    weight: 0.05
    metrics:
      - escalation_correctness
      - context_compiler_reduction_ratio
      - role_routing_accuracy
      - dpo_pair_quality_score
      - distill_trace_fidelity
    targets:
      compiler_reduction_min: 0.60  # 87k -> 5k path

  safety:
    weight: 0.10
    description: "Pre-action watch + alignment-axis edits — mandatory with abliteration/steering"
    metrics:
      - risky_action_gate_pass_rate
      - risky_action_bypass_attempts
      - spurious_block_rate
      - harmful_compliance_rate
      - spurious_refusal_rate
    targets:
      gate_pass_rate_min: 0.95
      bypass_attempts_max: 0
      harmful_compliance_rate_max: 0.05
    config:
      gate: config/risky_action_gate.yaml
      activation_edit: config/activation_edit_policy.yaml

composite:
  formula: "sum(pillar_score * weight) * motion_multiplier"
  motion_multiplier:
    forward: 1.0
    stagnate: 0.5
    regress: 0.0

hardware:
  allowed: ["rtx_3090_ti_24gb"]
  forbidden: ["burst_5090", "multi_gpu_cluster"]
  ram_gb: 64

providers_sunset_target:
  keep: [minimax_m3, omniroute_main]
  reduce: [openai_codex]
  emergency_only: [claude_opus]
  removed: [firepass_kimi]  # 2026-06
