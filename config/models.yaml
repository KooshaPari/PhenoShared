# Local model stack — locked by ADR 0005.
# No weights are downloaded by this config. Set env vars to existing local files.

gpu:
  name: "RTX 3090 Ti"
  vram_gb: 24
  always_on_vram_gb: 4

llama_server:
  binary: "${PHENO_LLAMA_SERVER:-llama-server}"
  ik_llama_flags: "-fa -fmoe -rtr -c 32768 -ctk q8_0 -ctv q8_0"
  port_base: 8080

tiers:
  local:
    qwen35_08b:
      id: Qwen/Qwen3.5-0.8B
      path: "${PHENO_QWEN35_08B:-}"
      quant: planned_self_quantize_q4
      always_on: true
      kv_ctx: 8192
      runtime: gpu
      launch_template: qwen35_08b

    qwen35_4b:
      id: Qwen/Qwen3.5-4B-Coder
      path: "${PHENO_QWEN35_4B:-}"
      quant: planned_self_quantize_q4
      on_demand: true
      kv_ctx: 32768
      runtime: gpu
      launch_template: qwen4b

    lfm25_8b_a1b:
      id: LiquidAI/LFM2.5-8B-A1B
      path: "${PHENO_LFM25_8B_A1B:-}"
      quant: planned_self_quantize_q4
      on_demand: true
      kv_ctx: 32768
      runtime: gpu
      launch_template: lfm25_8b_a1b

    ornith_8b:
      id: deepreinforce-ai/Ornith-1.0-9B
      path: "${PHENO_ORNITH_8B:-}"
      quant: planned_self_quantize_q4
      on_demand: true
      kv_ctx: 32768
      runtime: gpu
      launch_template: ornith_8b

bench_models:
  - name: qwen35_08b
    tier: local.qwen35_08b
    ctx: [8192]
  - name: qwen35_4b
    tier: local.qwen35_4b
    ctx: [8192, 32768]
  - name: lfm25_8b_a1b
    tier: local.lfm25_8b_a1b
    ctx: [8192, 32768]
  - name: ornith_8b
    tier: local.ornith_8b
    ctx: [8192, 32768]

quant_policy:
  weight_quant_range: [q2, q3, q4, q5, q6, q8]
  default_weight_quant: q4
  max_weight_quant: q8
  allow_nvfp4_type: true
  allow_reap_variants: true
  allow_local_reap_experiments: true
  kv_cache_quant:
    allowed: [q4_0, q5_0, q8_0, tq_plus]
    default_k: q8_0
    default_v: q8_0
    tq_plus_status: experimental
