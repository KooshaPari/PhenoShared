    smoke_gpu: gtx_1080_ti
    smoke_generation_tok_s: 25.3
    evidence: state/ornith_mtp_1080_smoke.stdout.log

helper_evidence:
  toolchain: D:/WSL/tools/llama.cpp-b10012-cuda12.4
  manifest: D:/WSL/tools/llama.cpp-b10012-cuda12.4/acquisition.json
  engine_bench_evidence:
    artifact: state/qwen35_llamabench_dual_gpu_manifest.json
    model: local/qwen35-08b
    quantization: Q4_K_M
    workload: "llama-bench n_prompt=128 n_gen=64 repetitions=2 flash_attn=on"
    rtx_3090_ti_generation_tok_s: 188.639935
    gtx_1080_ti_generation_tok_s: 80.632758
    rtx_3090_ti_speedup: 2.339
    placement_conclusion: "3090 Ti is the primary generation tier; 1080 Ti is an independent helper tier."
    tensor_parallel_conclusion: "No tensor-parallel benefit is established; mixed-SM sharding remains blocked pending a dedicated link and quality probe."
  gpu: gtx_1080_ti
  verified_models:
    local/qwen35-08b:
      status: smoke_pass
      interactive_smoke_tok_s: 111.5
      evidence: state/qwen1080_cuda12_smoke.stdout.log
      perf_evidence: state/qwen1080_perf_real.json
      metric_scope: "single interactive smoke response; not engine-bench or agent throughput"
      aggregate_tok_s_by_concurrency: {"1": 23.24, "2": 26.62, "4": 30.34}
    local/lfm25-8b-a1b:
      status: smoke_pass
      interactive_smoke_tok_s: 98.3
      evidence: state/lfm1080_cuda12_smoke.stdout.log
      perf_evidence: state/lfm1080_perf_real.json
      metric_scope: "single interactive smoke response; not engine-bench or agent throughput"
      aggregate_tok_s_by_concurrency: {"1": 143.95, "2": 158.78, "4": 206.44}

  cpu_spill_probe:
    model: local/qwen35-08b
    quantization: Q4_K_M
    status: failed_timeout
    command_class: llama_cpp_cpu_n_gpu_layers_0
    timeout_seconds: 90
    observed: "No four-token completion before timeout; process was terminated after the bounded probe."
    evidence: state/cpu_qwen35_spill_probe.timeout

experiments:
  - id: helper_replica_vs_cpu_spill
    compare: [gtx_1080_ti, ddr4, nvme]
    workload: short_draft_256_tokens
    metrics: [ttft_ms, decode_tok_s, p95_ms, watts, completed_tasks_per_joule]
  - id: heterogeneous_independent_queue
    topology: [rtx_3090_ti_primary, gtx_1080_ti_helper, cpu_router]
    workload: mixed_role_trace
    metrics: [quality, throughput, queue_wait_ms, gpu_utilization, vram_peak]
  - id: split_layer_offload
    topology: [rtx_3090_ti, gtx_1080_ti, ddr4]
    status: research_only
    gate: measure_pcie_transfer_and_decode_regression
  - id: kv_spill_threshold
    topology: [rtx_3090_ti, ddr4, nvme]
    status: research_only
    gate: p95_latency_under_context_sweep
