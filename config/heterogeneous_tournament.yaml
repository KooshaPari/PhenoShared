schema_version: pheno.tournament.v1
cutoff_date: "2026-07-14"

policy:
  review_only: true
  allow_model_artifact_download: false
  allow_server_launch: false
  allow_phone_install: false
  allow_mac_mutation: false
  allow_1080ti_install: false
  mutate_adr_locked_shortlist: false
  max_total_parameters: 35000000000
  north_star:
    - avs_per_second
    - avs_per_second_per_peak_active_gb
    - avs_per_dollar

runtime_pins:
  # Phase 1.1 tiered-memory bootstrap — both anchors are still open PRs at
  # plan time, so we pin via `channel: pr_head_ref` instead of PyPI versions.
  # Once the PRs merge upstream, switch back to released versions
  # (sglang >= 0.5.11, vllm >= 0.26) and drop the ref_url field.
  #   sglang PR #20126 — UVM-based MoE expert offload (all-GPU compute)
  #   vllm   PR #37190 — CachedWeightProvider / --moe-expert-cache-size
  sglang: {version: 0.5.15.post1, channel: pr_head_ref, pr: 20126, ref_url: "https://github.com/sgl-project/sglang.git@refs/pull/20126/head"}
  vllm: {version: 0.25.1, channel: pr_head_ref, pr: 37190, ref_url: "https://github.com/vllm-project/vllm.git@refs/pull/37190/head"}
  tensorrt_llm: {version: 1.2.1, channel: stable}
  tensorrt_llm_dflash: {version: 1.3.0rc20, channel: prerelease}
  mlx: {version: 0.32.0, channel: released}
  mlx_lm: {version: 0.31.3, channel: released}
  omlx: {version: 0.5.1, channel: released}
  llama_cpp: {version: b10012, channel: tagged_commit, commit: c71854292f7c367cc3b35939f88121d81945472f}
  cactus: {version: 2.0.1, channel: released, commit: 7e7eada40c387736dec138db003ab38f028f3a15}
  mnn: {version: 3.6.0, channel: released, commit: cc20f672af9e177e2fa338c332dc097de2fc9264}
  executorch: {version: 1.3.1, channel: released, commit: e2f18eb23c45bd22ca332b0b8b49a81de304b472}
  mlx_swift: {version: 0.31.6, channel: released}
  mlx_swift_lm: {version: 3.31.4, channel: released}
  mlc_llm: {version: a2bcc5c86678b72a86b7aadc29b643a5ce63c747, channel: main_commit}
  litert_lm: {version: 0.14.0, channel: released, commit: 80f301ff9a3b02c2c1e7be2dd1a567752f7b51b6}

kernel_substrate_pins:
  wgpu: {version: 29.0.3, channel: released}

mobile_worker_policy:
  trust_class: untrusted_burst_worker
  coordinator_authoritative: true
  foreground_visible: true
  user_initiated: true
  outbound_only: true
  no_cloud_handoff: true
  no_tool_execution: true
  no_workload_secrets: true
  external_vendor_telemetry_disabled: true
  authenticated_transport: true
  device_scoped_short_lived_transport_credentials: true
  transport_credentials_excluded_from_lease_payload: true
  replay_protected_leases: true
  content_hashed_result_bundle: true
  allowed_tasks:
    - needle_function_routing
    - schema_and_tool_choice_validation
    - deterministic_classifier_or_verifier
    - embedding_or_rerank
    - short_0_5b_to_4b_replay
    - official_mobile_artifact_feasibility
  forbidden_inputs:
    - private_chatgpt_corpus
    - workload_credentials_or_tokens
    - arbitrary_model_downloads
    - shell_or_side_effecting_tools
  required_telemetry:
    - ttft_and_decode_rate
    - os_available_memory
    - thermal_state_or_headroom
    - battery_and_charge_state
    - lifecycle_cancel_and_recovery
  sustained_probe_seconds: [300, 900, 1800]
  initial_memory_headroom_fraction: 0.30
  lease:
    checkpoint_max_seconds: 30
    required_fields:
      - job_id
      - lease_id
      - model_hash
      - artifact_hash
      - runtime_hash
      - config_hash
      - deadline
      - max_context_tokens
      - max_output_tokens
      - nonce

devices:
  rtx_3090_ti:
    available: true
    install_authorized: true
    memory_gb: 24
    architecture: sm_86
    runtimes: [sglang, vllm, tensorrt_llm, tensorrt_llm_dflash, llama_cpp]
    default_runtime: sglang
    control_runtime: vllm
    constraints:
      - No native FP8 tensor compute.
      - TensorRT-LLM is a finalist optimization, not the discovery default.
      - Context length is measured; advertised 262K is not preallocated.
  m1_pro_16gb:
    available: true
    install_authorized: false
    remote_mutation_authorized: false
    memory_gb: 16
    architecture: apple_m1_pro
    runtimes: [omlx, mlx_lm, llama_cpp, cactus, litert_lm]
    default_runtime: omlx
    constraints:
      - Existing Qwen3.5-0.8B workstream has a separate owner.
      - Import results through the contract; do not mutate that workspace.
      - Ordinary 27-35B Q4 is outside the routine lane.
  galaxy_s21_ultra:
    available: true
    install_authorized: false
    memory_gb: null
    architecture: probe_required
    runtimes: [cactus, mnn, llama_cpp, mlc_llm, executorch, litert_lm]
    backends: [cpu, opencl, vulkan, qnn, xnnpack]
    default_runtime: null
    constraints:
      - Probe Snapdragon-versus-Exynos SKU, RAM, Android build, and thermals.
      - User-started foreground-visible or kiosk session only; generic inference has no standard Android foreground-service type.
      - Pull short outbound-only leases and checkpoint every unit; the OS may still kill the process.
      - Start with 30 percent OS-reported memory headroom and stop on thermal, low-power, or lifecycle signals.
      - Cactus runtime license review precedes installation.
  iphone_17_pro_max:
    available: true
    install_authorized: false
    memory_gb: null
    architecture: apple_mobile_probe_required
    runtimes: [cactus, mlx_swift_lm, mnn, llama_cpp, mlc_llm, executorch, litert_lm]
    backends: [cpu, metal, coreml]
    default_runtime: null
    constraints:
      - Foreground/docked checkpointable work only.
      - Stop on app lifecycle or serious/critical thermal state.
      - Background Metal is not a continuous worker mechanism.
      - Apple publishes no RAM figure; gate on OS available memory and Metal recommended working set.
      - Cactus 2.0.1 removed Core ML; compare its Metal path separately from Core ML controls.
  gtx_1080_ti:
    available: true
    install_authorized: false
    probe_authorized: true
    memory_gb: 11
    architecture: sm_61
    runtimes: [llama_cpp]
    backends: [cuda_12_legacy]
    default_runtime: null
    constraints:
      - Never join the 3090 Ti tensor-parallel group.
      - Current vLLM and modern TensorRT-LLM paths are unsupported.
      - CUDA 13 removed Pascal targeting; any experiment needs an isolated CUDA 12.x legacy stack.
      - Use the separate-helper simulation before any runtime/toolchain mutation.
      - PSU, slot, connector, case, and thermal gates remain unresolved.

