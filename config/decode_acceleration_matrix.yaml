# Decode acceleration matrix — F_d multiplier (prefill/decode speed)
# Covers: AR speculative, DFlash (block diffusion draft), SSD, ultra-low-bit drafts,
# diffusion-as-target research, KV/eviction, kernel backends.
# Pair with eval pillars speed + motion; quality unchanged if lossless verify passes.
# Updated: 2026-07-14

execution_policy:
  phase: review_only
  allow_network: false
  allow_downloads: false
  allow_server_launch: false
  activation_requires: [explicit_user_approval, exact_artifact_hashes, runtime_probe]

measured_local_controls:
  qwen35_ngram_simple_3090:
    artifact: state/qwen35_spec_ngram_probe_manifest.json
    status: negative_control
    output_payload_hashes_equal: true
    baseline_median_tok_s: 106.856896
    ngram_simple_median_tok_s: 103.753880
    default_enable: false
    reason: "Exact output in the probe, but no throughput gain; retain as a regression control."

principle: |
  Drafting methods edit F_d (decode throughput), not W or Q directly. Target model verifies
  all proposals — lossless when acceptance checks pass. DFlash uses diffusion only in the
  DRAFT stage; full diffusion-LLM targets remain research. Risky-action gate still applies
  to verified output before tool execution.

# Index model (spec-001): separate W, K, F_p, F_d, Q — do not collapse knobs
multiplier_axis: F_d

stack_order:
  - baseline_autoregressive
  - ar_speculative_draft      # 0.6B AR, EAGLE-3
  - diffusion_block_draft     # DFlash — primary upgrade path 2026
  - confidence_scheduled_draft # DSpark — released artifacts with method-specific runtime gates
  - ssd_branch_predrafting    # Speculative Speculative Decoding / Saguaro
  - moe_self_assisted_speculation # SpecMoE-class offload research; not a serving toggle
  - ultra_low_bit_draft       # BitNet / ternary draft tiers
  - kv_poly_eviction          # PolyKV-class — after quant stable
  - dllm_full_target          # research — non-AR generation end-to-end

categories:
  autoregressive_speculative:
    description: "Sequential draft model; mature llama-server + vLLM path"
    methods:
      speculative_06b:
        id: speculative_06b
        status: quarantined_unverified_pair
        draft_hf: null
        draft_local: sub1b.draft_06b
        launch_overlay: config/launch/draft_06b.yaml
        runner: [llama_server]
        pairs_with_targets: []
        rejected_unverified_pairs: [qwen3.5-0.8b, lfm2.5-8b-a1b, ornith-8b]
        eligible: false
        block_size: 1
        notes: "A generic 0.6B draft is not a valid cross-family pair. Restore a target only after tokenizer, vocabulary, architecture interface, and checkpoint compatibility are proven."

      eagle3:
        id: eagle3
        status: benchmark_baseline
        draft_hf: "RedHatAI/Qwen3-8B-speculator.eagle3"  # verify at pull
        runner: [vllm]
        pairs_with_targets: [qwen3-8b]
        rejected_incompatible_pairs: [granite-4.1-8b]
        speculation_length: 7
        notes: "Matched Qwen3 control only; the Qwen3 head is not a Granite speculator"

      medusa:
        id: medusa
        status: research
        runner: [vllm]
        notes: "Parallel decoding heads — compare vs DFlash on same target"

  diffusion_block_draft:
    description: "Block diffusion drafter — parallel mask-fill in O(1) forward per block"
    methods:
      dflash:
        id: dflash
        status: priority
        tool: z-lab/dflash
        runner: [vllm, sglang]
        vllm_min: "0.20.1"
        block_size_default: 16
        num_speculative_tokens: 7
        serve_template: >-
          vllm serve {target_hf} --port 8001 --dtype auto --speculative-config
          '{"method": "dflash", "model": "{dflash_hf}",
          "num_speculative_tokens": 7}'
        training: NVIDIA/Model-Optimizer modelopt dflash recipe
        quality: lossless  # target verifies every block
        published_speedup: "up to 6x vs AR baseline; ~2.5x vs EAGLE-3 (Qwen3-8B class)"
        references:
          paper: https://arxiv.org/abs/2602.06036
          repo: https://github.com/z-lab/dflash
          nvidia_doc: https://github.com/NVIDIA/Model-Optimizer/blob/main/examples/speculative_decoding/doc/dflash.md

      dflare:
        id: dflare
        status: released_custom_research
        tool: Tencent/AngelSlim
        runner: [angelslim_pytorch_custom]
        stock_vllm_path: false
        stock_sglang_path: false
        released_heads: [qwen3-4b, qwen3-8b, gpt-oss-20b]
        eligible: false
        activation_requires: [dflash_local_win, exact_head_target_match, explicit_user_approval]
        notes: "Public code/docs/checkpoints exist, but the released path is a custom AngelSlim PyTorch benchmark/training flow rather than stock vLLM or SGLang serving"
        references:
          paper: https://arxiv.org/abs/2606.02091
          repo: https://github.com/Tencent/AngelSlim
          docs: https://angelslim.readthedocs.io/zh-cn/latest/features/speculative_decoding/dflare.html

  confidence_scheduled_speculative:
    description: "DSpark — confidence-scheduled speculative drafting; released support is model-specific"
    methods:
      dspark:
        id: dspark
        status: released_artifacts_method_specific_runtime_support
        tool: deepseek-ai/DeepSpec
        runner: [deepspec_research, vllm_deepseek_v4_specialized, vllm_qwen3_control]
        released_targets: [deepseek-v4, qwen3-4b, qwen3-8b, qwen3-14b, gemma4-12b]
        frontier_tournament_targets: [gemma4-12b]
        legacy_method_controls: [qwen3-4b, qwen3-8b, qwen3-14b]
        gemma4_12b_runtime: deepspec_research_only_vllm_pr_47216_open
        qwen3_5_or_3_6_checkpoint_found: false
        stable_sglang_release_path: false
        eligible: false
        activation_requires: [exact_deepspec_checkpoint, target_match, explicit_user_approval]
        notes: "DeepSpec released Gemma4 and legacy-Qwen3 checkpoints. Generic Qwen3/DeepSeek-V4 vLLM support is merged, but Gemma4 DSpark remains blocked on open vLLM PR #47216; do not infer support from artifact availability."
        references:
          repo: https://github.com/deepseek-ai/DeepSpec
          checkpoints: https://huggingface.co/collections/deepseek-ai/deepspec
          vllm_deepseek_v4: https://docs.vllm.ai/en/v0.25.0/api/vllm/models/deepseek_v4/nvidia/dspark/

  speculative_speculative_decoding:
    description: "SSD/Saguaro — same-request branch pre-drafting that overlaps draft work with target verification"
    methods:
      ssd:
        id: double_speculative_ssd
        status: lab_only
        scope: same_request
        reuses_cross_request_cache: false
        depends_on: []
        composition_with_dflash: unvalidated_research
        execution_gate: timing_simulator_then_explicit_approval
        notes: |
          Speculative Speculative Decoding predicts likely verifier outcomes and prepares
          alternative draft branches while the target verifies the current proposal. It is
          not cross-request cache reuse, not solid-state-drive caching, and does not depend
          on DFlash. The published Saguaro-style reference layout assumes a separate helper
          path and newer multi-GPU hardware; start with a trace-driven timing simulator.
        runner: [saguaro_reference_research]
        reference_hardware: [cuda_12_8_or_newer, h100_class_multi_gpu, separate_draft_gpu]
        references:
          paper: https://arxiv.org/abs/2603.03251
          repo: https://github.com/tanishqkumar/ssd

      domino_tree:
        id: domino_tree
        status: paper_and_reference_code_review_only
        scope: same_request_tree_speculation
        distinct_from: [ddtree, caddtree, domino]
        eligible: false
        execution_gate: offline_trace_simulator_then_explicit_approval
        notes: "DominoTree is its own speculative tree method; do not alias it to diffusion DDTree/CaDDTree or the separate Domino repository."
        references:
          paper: https://arxiv.org/abs/2607.08642
          repo: https://github.com/slin-zhq/Domino-Tree

  moe_self_assisted_speculation:
    description: "MoE-specific self-assisted speculation/offload research; no retrofit is implied for tournament checkpoints"
    methods:
      specmoe:
        id: specmoe
        status: paper_only
        paper: https://arxiv.org/abs/2604.10152
        runner: []
        eligible: false
        activation_requires: [public_pinned_implementation, exact_supported_checkpoint, measured_offload_bottleneck, explicit_user_approval]
        notes: "Evaluate only if a finalist actually spills experts and a released implementation supports its exact architecture."

      speculating_experts:
        id: speculating_experts
        status: paper_only
        paper: https://arxiv.org/abs/2603.19289
        runner: []
        eligible: false
        activation_requires: [public_pinned_implementation, exact_supported_checkpoint, transfer_stall_trace, quality_non_regression, explicit_user_approval]
        notes: "Expert prediction/prefetch may alter work and quality; creator-reported TPOT gains require local reproduction."

  ultra_low_bit_draft:
    description: "Sub-1B drafts for needle/router — not primary TB2 target servers"
    methods:
      bitnet_draft:
        id: bitnet_draft
        status: wired_cpu
        hf: microsoft/bitnet-b1.58-2B-4T
        runner: [bitnet_cpp]
        role: [compatible_bitnet_draft_or_control]
        notes: "Native 1.58-bit — bitnet.cpp only; not a Cactus Needle artifact or runtime"

      ternary_draft:
        id: ternary_draft
        status: research
        runner: [custom_kernels]
        notes: "1.58–2bit draft research; compare accept rate vs bitnet on same target"

      codescout_17b_draft:
        id: codescout_17b_draft
        status: candidate
        hf: OpenHands/CodeScout-1.7B
        runner: [vllm, sglang]
        pairs_with_targets: [codescout-4b]
        rejected_incompatible_pairs: [granite-4.1-8b]

  diffusion_full_target:
    description: "dLLM generates without AR verify loop — quality risk; TB2 research only"
    methods:
      dllm_research:
        id: diffusion_llm_target
        status: backlog
        examples: [LLaDA-class, Dream-class, block_diffusion_LM]
        tb2_primary: false
        notes: "Underperforms AR on general benchmarks today; DFlash confines diffusion to draft"

  kv_and_context:
    methods:
      polykv:
        id: polykv
        status: research
        axis: K
        notes: "KV eviction/selection — pairs after RotorQuant winner (kv_bakeoff.yaml)"
      latentmas:
        id: latentmas
        status: research
        spec: agileplus-specs/spec-013-latentmas-research
        axis: [K, token_burn]
        notes: "Latent multi-agent — 70-80% token reduction claim; needs self-hosted backbone"

kernel_backends:
  # Agent server on 3090 Ti — prefer CUDA-native stacks
  recommended_3090:
    - cuda_vllm
    - cuda_sglang
    - triton_kernels  # inside vLLM/SGLang; not standalone WebGPU path
  needle_cpu_tiers:
    - cpu_bitnet_cpp
    - onnxruntime  # ranker/router only
  not_primary_agent_server:
    - webgpu
    - vulkan_compute
  notes: |
    WebGPU is for browser/edge demos — not optimal for 3090 terminus-2 serving.
    If custom sub-1B kernels needed, evaluate Triton vs hand CUDA before WebGPU.

