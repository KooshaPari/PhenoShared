# First decode sweep candidate on 3090 (planning only; execution policy above applies)
first_sweep:
  description: "Only an exact, primary-source-resolved target/drafter pair may enter the DFlash sweep"
  pairs:
    - target: qwen3.5-35b-a3b
      decode: [baseline, dflash]
      runner: sglang
      status: review_only
      metrics: [tok_s_decode, accept_rate, latency_p95_ms, harbor_1task_mean]
  command: |
    python scripts/decode_prepare.py check --target qwen3.5-35b-a3b --method dflash

eval_gates:
  before_promotion:
    - accept_rate_min_vs_eagle3: 1.0  # match or beat EAGLE-3 on YOUR traces
    - tok_s_decode_min_gain: 1.25      # 25% vs baseline on same target
    - harbor_mean_delta_max_loss: 0.0  # lossless — no TB2 regression
    - risky_action_gate_pass_rate_min: 0.95
  metrics:
    - tok_s_decode
    - accept_rate
    - draft_latency_ms
    - verify_overhead_ms
    - harbor_mean
    - motion_forward_rate

playground_matrix: config/playground_matrix.yaml
inference_runners: config/inference_runners.yaml
risky_action_gate: config/risky_action_gate.yaml
prepare_script: scripts/decode_prepare.py

references:
  dflash: https://github.com/z-lab/dflash
  dflare: https://github.com/Tencent/AngelSlim
  dspark: https://github.com/deepseek-ai/DeepSpec
  specforge: https://github.com/sgl-project/SpecForge
  google_ssd_tpu: https://developers.googleblog.com/supercharging-llm-inference-on-google-tpus-achieving-3x-speedups-with-diffusion-style-speculative-decoding/
  bitnet: https://github.com/microsoft/BitNet
