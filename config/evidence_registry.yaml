      Requires operator OAuth credentials plus deletion reconciliation. Raw
      post/comment text is never admitted to the durable registry.
    queries:
      - {query: "3090 Ti inference thermal", subreddit: LocalLLaMA, limit: 25}
      - {query: "M1 Pro MLX inference", subreddit: LocalLLaMA, limit: 25}

  local_corpus:
    enabled: true
    roots:
