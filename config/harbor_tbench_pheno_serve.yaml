# Harbor route overlay for the pheno-serve-dev local serving layer.
# Merge into harbor_tbench_routes.yaml once the current route schema is audited.

routes:
  - id: pheno_serve_qwen35_08b
    label: pheno-serve-dev local/qwen35-08b
    route_kind: pheno_serve
    harbor_model: openai/local/qwen35-08b
    model: local/qwen35-08b
    base_url: "http://127.0.0.1:21080/v1"
    api_key_env: PHENO_SERVE_API_KEY
    api_key_default: local-no-key
    engine: sglang
    decode_method: baseline
    hardware_profile: win_3090ti

