# July 2026 benchmark registry — canonical suite catalog for pheno-harness.
# Dry-run planners read this file; execution remains gated by eval_locks and local-only policy.

schema_version: pheno.benchmark.registry.v1
registry_id: benchmark_registry_2026-07
effective_date: "2026-07-17"

policy:
  local_only: true
  cloud_eval_enabled: false
  cloud_cost_gate_usd: 1.00
  require_verifier_artifact: true
  holdout_config: training/eval_holdout.yaml

tiers:
  agent_coding:
    description: Terminal and long-horizon software-engineering agent benchmarks.
    cadence: weekly
  computer_use:
    description: Browser, desktop, and OS automation agent benchmarks.
    cadence: monthly
  knowledge:
    description: Knowledge, reasoning, and multi-hop QA benchmarks.
    cadence: monthly
  kernel_gpu:
    description: CUDA/Triton kernel synthesis and GPU perf benchmarks (3090 Ti primary).
    cadence: weekly
  custom_pheno:
    description: Pheno-tailored trace replay, dual-GPU perf, role, and forge loops.
    cadence: weekly

suites:
  terminal_bench_2_0:
    tier: agent_coding
    domain: terminal_agent
    label: Terminal-Bench 2.0
    upstream:
      owner: laude-institute
      repository_url: https://github.com/laude-institute/terminal-bench-2.git
      dataset: terminal-bench@2.0
    pins:
      lock_file: config/eval_locks/terminal_bench_2_0.candidate.yaml
      revision_sha: 69671fbaac6d67a7ef0dfec016cc38a64ef7a77c
      task_count: 89
    pin_status: candidate
    scoreable: false
    local_runnable: true
    harness:
      runner: harbor
      agent: terminus-2
      version: "0.6.1"
    gates:
      - local_pheno_serve
      - podman_docker_api
      - suite_lock_verified
    pheno_priority: P0
    driver:
      script: scripts/run_tbench_v21.py
      route_config: config/harbor_tbench_routes.yaml
      default_subset: representative-6
    results_dir: bench/results/tbench/20

  terminal_bench_2_1:
    tier: agent_coding
    domain: terminal_agent
    label: Terminal-Bench 2.1
    upstream:
      owner: laude-institute
      repository_url: https://github.com/laude-institute/terminal-bench-2.git
