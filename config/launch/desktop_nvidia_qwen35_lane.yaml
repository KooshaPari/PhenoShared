# DAG-31: config/launch/desktop_nvidia_qwen35_lane.yaml
#
# Launchd entry for the Desktop NVIDIA dual-GPU lane weekly smoke.
# Pairs with config/desktop_nvidia_qwen35_lane.yaml (the actual lane
# spec) and scripts/run_desktop_lane_eval.py.
#
# Note: this file documents the launchd plist intent. The actual plist
# lives at $HOME/Library/LaunchAgents/com.phenotype.pheno-harness.
# desktop-nvidia-lane.plist and is generated by install_launchd.sh.

label: com.phenotype.pheno-harness.desktop-nvidia-lane
schedule:
  weekday: 6           # Sat
  hour: 5
  minute: 0
working_directory: ${REPO_ROOT}
wrapper: scripts/cron/desktop_nvidia_lane_cron.sh
evidence_output:
  - evidence/dual_gpu/heartbeat.json
  - evidence/dual_gpu/host_manifest.yaml
  - bench/results/desktop_nvidia/<YYYY-MM-DD>/<host>.log
failure_modes:
  - ssh_unreachable: evidence_label=blocked
  - vllm_start_failed: evidence_label=blocked
  - sglang_start_failed: evidence_label=blocked
  - bench_passed: evidence_label=live_verified
  - bench_partial: evidence_label=reported
gating:
  require_two_consecutive_green: true
  reject_on_risky_action_violation: true
