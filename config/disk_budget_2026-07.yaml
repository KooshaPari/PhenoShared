# N22 — disk budget policy (Forward DAG v2)
# Enforces budget on model caches + venv. See plans/2026-07-24-forward-dag-v2/INDEX.md §2 N22.
budget_gb: 80
warn_gb: 70
poll_interval_min: 30
roots:
  - id: pheno_cache
    path: C:\Users\koosh\pheno-harness\.cache
    purpose: pheno harness cache
  - id: hf_hub
    path: C:\Users\koosh\.cache\huggingface
    purpose: huggingface hub cache
  - id: torch_hub
    path: C:\Users\koosh\.cache\torch
    purpose: torch hub cache
  - id: pheno_serve_venv
    path: C:\Users\koosh\.pheno-serve-venv
    purpose: pheno serve venv
prune:
  hf_keep_recent: 2
  hf_protect_globs:
    - models--Qwen--Qwen3.5-0.8B
