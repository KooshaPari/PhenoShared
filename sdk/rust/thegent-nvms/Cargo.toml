[package]
name = "thegent-nvms"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "NVMS (NanoVM Service) FFI bindings with pyo3 support — migrated from PhenoCompose"
keywords = ["nvms", "nanovms", "ffi", "virtualization", "sandbox"]
categories = ["virtualization", "api-bindings"]

[lib]
name = "thegent_nvms"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["abi3-py312", "extension-module"] }
thiserror = "1.0"

[features]
default = []
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = false
